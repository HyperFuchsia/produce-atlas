<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QA-77 · Quantum Determination Apparatus</title>
<style>
  :root{ color-scheme:dark; }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#07080B;overflow:hidden}
  body{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;color:#B9BFC6}
  #scene{position:fixed;inset:0;display:block;touch-action:none;cursor:grab}
  #scene.dragging{cursor:grabbing}
  /* the only chrome on the page: a strip of read-outs over the scene */
  .hud{
    position:fixed;left:0;right:0;bottom:0;z-index:5;pointer-events:none;
    display:flex;align-items:flex-end;justify-content:space-between;gap:16px;
    padding:14px 18px;font-size:10px;letter-spacing:.16em;text-transform:uppercase;
    color:rgba(185,191,198,.62);
    background:linear-gradient(180deg,rgba(7,8,11,0),rgba(7,8,11,.82));
  }
  .hud b{font-weight:400;color:rgba(226,232,238,.9)}
  .hud .keys{display:flex;gap:14px;flex-wrap:wrap}
  #loading{
    position:fixed;inset:0;z-index:9;display:grid;place-items:center;
    background:#07080B;font-size:11px;letter-spacing:.28em;text-transform:uppercase;
    color:rgba(185,191,198,.5);transition:opacity .6s linear;
  }
  #loading.gone{opacity:0;pointer-events:none}
</style>

<canvas id="scene"></canvas>
<div id="loading">Building the apparatus</div>
<div class="hud">
  <span id="hudLeft">Drag to orbit · scroll to dolly</span>
  <span class="keys"><b id="hudRight">QA-77</b></span>
</div>
@@THREE@@
