<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QA-77 · Quantum Determination Apparatus</title>
<style>
  :root{ color-scheme:dark; }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#07080B;overflow:hidden}
  body{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;color:#B9BFC6}
  /* width/height are explicit and NOT left to inset:0. A canvas is a replaced
     element, so with width:auto the used size comes from its intrinsic size —
     the drawing buffer — and the right/bottom offsets are ignored. At device
     pixel ratio 1 the buffer happens to equal the viewport and it looks fine;
     at ratio 3 the element becomes three times the viewport, anchored top left,
     and a phone shows you the top-left third of the scene. */
  #scene{
    position:fixed;top:0;left:0;
    width:100%;height:100%;
    display:block;touch-action:none;cursor:grab;
  }
  #scene.dragging{cursor:grabbing}
  /* the only chrome on the page: a strip of read-outs over the scene */
  .hud{
    position:fixed;left:0;right:0;bottom:0;z-index:5;pointer-events:none;
    display:flex;align-items:flex-end;justify-content:space-between;gap:16px;
    padding:14px 18px;font-size:10px;letter-spacing:.16em;text-transform:uppercase;
    color:rgba(185,191,198,.62);
    background:linear-gradient(180deg,rgba(7,8,11,0),rgba(7,8,11,.82));
  }
  .hud b{font-weight:400;color:rgba(226,232,238,.9)}
  .hud .keys{display:flex;gap:14px;flex-wrap:wrap}
  /* on a narrow screen the step name is the useful half — give it the room */
  @media (max-width:560px){
    .hud{padding:10px 12px;gap:10px;font-size:9px;letter-spacing:.12em}
    #hudLeft{flex:0 1 auto;min-width:0}
    .hud .keys{flex:0 0 auto;text-align:right}
  }
  /* The person, as against the apparatus. Everything the machine says is
     tracked-out upper case in the corners; this is sentence case, centred, and
     in the middle of the frame — so you never have to be told which of the two
     is talking. */
  #say{
    position:fixed;left:50%;bottom:56px;transform:translateX(-50%);
    z-index:6;pointer-events:none;
    width:min(34em,calc(100vw - 48px));text-align:center;
    font-size:14px;line-height:1.55;letter-spacing:.01em;
    color:rgba(232,236,240,.92);
    text-shadow:0 1px 12px rgba(0,0,0,.9),0 0 3px rgba(0,0,0,.8);
    opacity:0;transition:opacity .38s ease;
  }
  #say.on{opacity:1}
  @media (max-width:560px){
    #say{font-size:13px;bottom:64px;width:calc(100vw - 32px)}
  }
  #loading{
    position:fixed;inset:0;z-index:9;display:grid;place-items:center;
    background:#07080B;font-size:11px;letter-spacing:.28em;text-transform:uppercase;
    color:rgba(185,191,198,.5);transition:opacity .6s linear;
  }
  #loading.gone{opacity:0;pointer-events:none}
</style>

<canvas id="scene"></canvas>
<div id="loading">Building the apparatus</div>
<div id="say"></div>
<div class="hud">
  <span id="hudLeft">Drag to look · tap to walk</span>
  <span class="keys"><b id="hudRight">QA-77</b></span>
</div>
@@THREE@@
