<title>WILDBOUND — Amber Edition</title>
<style>
  /* The game owns the visual identity; this shell is the device around it —
     a dark room, a warm bezel, an amber cartridge label. Deliberately one
     theme: a handheld screen doesn't have a light mode. */
  :root {
    --void: #0e0c14;
    --shell: #241a10;
    --bezel: #14100c;
    --amber: #d8a23c;
    --amber-hi: #ffd25e;
    --phosphor: #7fd06a;
    --label: #9a8f7e;
    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: var(--void);
    color: var(--label);
    font-family: var(--mono);
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none; user-select: none;
    overscroll-behavior: none;
    touch-action: none;
  }

  #stage {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 14px;
    background:
      radial-gradient(ellipse 70% 55% at 50% 42%, #1d1728 0%, var(--void) 78%);
  }

  /* bezel: a warm shell with an inset screen well */
  #bezel {
    padding: 10px;
    border-radius: 10px;
    background: linear-gradient(#2e2216, #1a1209 62%, #241a10);
    box-shadow:
      0 1px 0 rgba(255, 214, 140, .18) inset,
      0 -2px 0 rgba(0, 0, 0, .5) inset,
      0 24px 60px rgba(0, 0, 0, .7);
  }
  #screen {
    display: block;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    background: #000;
    border-radius: 2px;
    box-shadow:
      0 0 0 3px var(--bezel),
      0 0 0 4px rgba(255, 214, 140, .10),
      0 0 26px rgba(120, 90, 40, .18);
  }

  /* device label under the screen */
  #legend {
    display: flex; flex-wrap: wrap; gap: 4px 16px;
    justify-content: center; align-items: baseline;
    max-width: min(92vw, 640px);
    font-size: 11px; letter-spacing: .06em;
    color: var(--label);
  }
  #legend b {
    color: var(--amber);
    font-weight: 600;
  }
  #legend span { white-space: nowrap; }
  body.touch #legend { display: none; }
  @media (max-height: 520px) { #legend { display: none; } }

  /* boot gate — also the gesture that unlocks audio */
  #boot {
    position: fixed; inset: 0; z-index: 30;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 22px; padding: 24px; text-align: center;
    background: radial-gradient(ellipse 60% 50% at 50% 45%, #1a1526 0%, #0b0910 80%);
    cursor: pointer;
    border: 0;
    font: inherit;
    color: inherit;
    width: 100%;
  }
  #boot:focus-visible { outline: 2px solid var(--amber); outline-offset: -6px; }
  #boot h1 {
    margin: 0;
    font-size: clamp(24px, 6vw, 46px);
    letter-spacing: .30em; text-indent: .30em;
    font-weight: 700;
    color: var(--amber-hi);
    text-shadow: 0 3px 0 #7a4a12, 0 4px 12px rgba(216, 162, 60, .3);
  }
  #boot .edition {
    font-size: 11px; letter-spacing: .42em; text-indent: .42em;
    color: var(--label);
  }
  #boot hr {
    width: min(64vw, 300px); height: 1px; border: 0; margin: 0;
    background: linear-gradient(90deg, transparent, rgba(216, 162, 60, .55), transparent);
  }
  #boot .keys {
    display: grid; grid-template-columns: auto auto; gap: 6px 20px;
    font-size: 12px; line-height: 1.5;
  }
  #boot .keys b { color: var(--amber); font-weight: 600; }
  #boot .keys span:nth-child(odd) { text-align: right; }
  #boot .keys span:nth-child(even) { text-align: left; color: #cfc4b2; }
  #boot .press {
    color: var(--phosphor); font-size: 13px; letter-spacing: .16em;
    animation: blink 1.15s steps(2, start) infinite;
  }
  @keyframes blink { to { visibility: hidden; } }
  @media (prefers-reduced-motion: reduce) {
    #boot .press { animation: none; }
  }

  /* on-screen controls for touch */
  #touch { position: fixed; inset: 0; z-index: 20; display: none; pointer-events: none; }
  body.touch #touch { display: block; }
  #touch .pad, #touch .btn {
    position: absolute; pointer-events: auto;
    display: flex; align-items: center; justify-content: center;
    border-radius: 50%;
    background: rgba(232, 220, 200, .10);
    border: 2px solid rgba(232, 220, 200, .22);
    color: rgba(245, 236, 220, .62);
    font-family: var(--mono); font-size: 18px; font-weight: 700;
  }
  #touch .pad { width: 46px; height: 46px; border-radius: 10px; }
  #touch .btn { width: 58px; height: 58px; }
  #touch .btn.small { width: 46px; height: 46px; font-size: 10px; letter-spacing: .04em; }
  #touch .act { background: rgba(216, 162, 60, .22); border-color: rgba(216, 162, 60, .4); }
  #touch [data-down="1"] { background: rgba(255, 255, 255, .3); }

// Deterministic 32-bit RNG (mulberry32). Seeded per save so encounters and
// IV rolls are reproducible when replaying a save file.
class RNG {
  constructor(seed = 0x9e3779b9) {
    this.s = seed >>> 0;
  }
  next() {
    this.s = (this.s + 0x6d2b79f5) >>> 0;
    let t = this.s;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  /** integer in [0, n) */
  int(n) {
    return Math.floor(this.next() * n);
  }
  /** integer in [a, b] inclusive */
  range(a, b) {
    return a + this.int(b - a + 1);
  }
  chance(p) {
    return this.next() < p;
  }
  pick(arr) {
    return arr[this.int(arr.length)];
  }
}

const rng = new RNG((Date.now() ^ 0x5f3759df) >>> 0);

__exp(["rng","RNG"], () => ({ rng, RNG }));

    if (x >= 0 && y >= 0 && x < this.w && y < this.h) this.g[y][x] = ch;
  }
  rect(x, y, w, h, ch) {

  }
  hline(x, y, len, ch) { return this.rect(x, y, len, 1, ch); }
  vline(x, y, len, ch) { return this.rect(x, y, 1, len, ch); }
  border(ch) {
    this.rect(0, 0, this.w, 1, ch);
    this.rect(0, this.h - 1, this.w, 1, ch);
    this.rect(0, 0, 1, this.h, ch);
    this.rect(this.w - 1, 0, 1, this.h, ch);
    return this;
  }
  obj(x, y, ch) {
    if (x >= 0 && y >= 0 && x < this.w && y < this.h) this.o[y][x] = ch;
    return this;
  }
  objRow(x, y, len, ch, step = 1) {
    for (let i = 0; i < len; i += step) this.obj(x + i, y, ch);
    return this;
  }
  objCol(x, y, len, ch, step = 1) {
    for (let i = 0; i < len; i += step) this.obj(x, y + i, ch);
    return this;
  }
  /** Scatter a character deterministically inside a rect. */
  scatter(x, y, w, h, ch, n, seed = 1) {
    let s = seed * 2654435761;
    for (let i = 0; i < n; i++) {
      s = (s * 1103515245 + 12345) & 0x7fffffff;
      const px = x + (s >>> 7) % w;
      s = (s * 1103515245 + 12345) & 0x7fffffff;
      const py = y + (s >>> 7) % h;
      this.set(px, py, ch);
    }
    return this;
  }
  ground() { return this.g.map((r) => r.join('')); }
  objs() { return this.o.map((r) => r.join('')); }
}

function* runBattle(B) {
  const fx = B.fx;

    yield B.say(`${B.cfg.trainer.name} wants to battle!`);
  }
  // slide the foe in
  yield tween(fx, 'foeX', 0, 420, easeOutQuad);
  yield call(() => { B.showFoeBox = true; });
  yield B.msg(B.isTrainer
    ? `${B.cfg.trainer.name} sent out ${B.foe.creature.nick}!`
    : `A wild ${B.foe.creature.nick} appeared!`);

    const action = yield B.selectAction();

        continue;
      }
      const odds = (B.me.creature.stats.spe * 128) / Math.max(1, B.foe.creature.stats.spe) + 30 * (B.me.turns + 1);

        audio.sfx('flee');
        yield B.say('Got away safely!');
        B.result = 'fled';
        return;
      }
      yield B.msg("Couldn't get away!");
      yield* enemyPhase(B);
      if (yield* checkEnd(B)) return;

      const done = yield* useItem(B, action.item);
      if (done === 'caught') { B.result = 'caught'; return; }
      if (done !== 'nothing') {

        if (yield* checkEnd(B)) return;
      }
      continue;
    }

      yield B.msg(`${B.me.creature.nick}, come back!`);
      yield* swapIn(B, action.index);
      yield* enemyPhase(B);
      if (yield* checkEnd(B)) return;

    }

    // ---- both sides act, fastest first ----
