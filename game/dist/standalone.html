<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<title>Rachis — a 4.5-dimensional game</title>

<style>
/* RACHIS — visual identity
 *
 * Reference: Anna Atkins, Photographs of British Algae (1843) — the first book illustrated
 * photographically, botanical specimens printed as white silhouettes on Prussian blue. That
 * is the WILD world. Against it, CULTIVATED borrows from the agronomic survey plat: glaucous
 * ground, ink hairlines, everything measured.
 *
 * The two phases are a tonal inversion of each other, and the entire interface inverts with
 * them — not just the play area. This is why the page commits to a single visual world
 * instead of following the viewer's light/dark preference: the page's own light and dark ARE
 * the half-dimension, and letting the OS drive them would overwrite the mechanic with a
 * setting. `prefers-color-scheme` is deliberately not consulted.
 *
 * "Glaucous" is the botanical term for the waxy blue-green bloom on a cabbage leaf or a
 * grape. It is the neutral this page is built on, chosen rather than inherited.
 */

:root {
  --serif: 'Iowan Old Style', 'Hoefler Text', 'Palatino Linotype', 'Book Antiqua', Palatino, Georgia, serif;
  --mono: ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace;

  --seed: #e9b44c;
  --courier: #c4483c;
  --plot: #2fa08c;

  --step: 0.42s cubic-bezier(0.22, 0.68, 0.28, 1);
}

/* WILD — cyanotype. Pale specimens floating on Prussian blue. */
#app[data-phase='wild'] {
  --void: #08203a;
  --void-2: #0c2b4b;
  --ink: #dcecf4;
  --ink-dim: #7fa6bf;
  --rule: rgba(220, 236, 244, 0.22);
  --panel: rgba(6, 24, 45, 0.72);
  --phase-mat: #3e7c87;
  /* The block colour and the type colour are separated because a hue that reads correctly
     as a solid on the ground does not necessarily carry as 11px text on it. */
  --accent-text: #6fbccb;
}

/* CULTIVATED — survey plat. Ink on glaucous, the whole tonal order turned over. */
#app[data-phase='cult'] {
  --void: #8c9e8a;
  --void-2: #7c8e7b;
  --ink: #1b221b;
  --ink-dim: #47513f;
  --rule: rgba(27, 34, 27, 0.28);
  --panel: rgba(216, 224, 209, 0.72);
  --phase-mat: #b4762f;
  --accent-text: #6d3f10;
}

* { box-sizing: border-box; }

#app {
  position: fixed;
  inset: 0;
  overflow: hidden;
  background: var(--void);
  color: var(--ink);
  font-family: var(--mono);
  -webkit-font-smoothing: antialiased;
  transition: background var(--step), color var(--step);
  user-select: none;
  -webkit-user-select: none;
  -webkit-tap-highlight-color: transparent;
}

#stage {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  touch-action: none;
}

/* ── Chrome ─────────────────────────────────────────────────────────────────────────── */

.hud {
  position: absolute;
  inset: 0;
  pointer-events: none;
  padding: clamp(0.75rem, 2.2vmin, 1.6rem);
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  grid-template-rows: auto 1fr auto;
  gap: 0.75rem;
  align-items: start;
}

.hud > * { pointer-events: auto; }

.eyebrow {
  font-size: 0.62rem;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--ink-dim);
  transition: color var(--step);
}

/* Plate number + level name, set like the printed heading on a herbarium sheet. */
.plate {
  grid-column: 1;
  grid-row: 1;
  display: flex;
  align-items: baseline;
  gap: 0.7rem;
  min-width: 0;
}

.plate .n {
  font-family: var(--mono);
  font-size: 0.68rem;
  letter-spacing: 0.16em;
  color: var(--ink-dim);
  padding: 0.22rem 0.45rem;
  border: 1px solid var(--rule);
  transition: color var(--step), border-color var(--step);
}

.plate h1 {
  margin: 0;
  font-family: var(--serif);
  font-weight: 400;
  font-size: clamp(1.15rem, 3.4vmin, 1.9rem);
  letter-spacing: 0.01em;
  text-wrap: balance;
}

.plate .teaches {
  font-size: 0.72rem;
  color: var(--ink-dim);
  transition: color var(--step);
}

/* The dimension readout. The whole premise of the game is a claim about how many dimensions
 * it has, so the claim is on screen, live, with the half visibly half. */
.axes {
  grid-column: 2;
  grid-row: 1;
  display: grid;
  grid-template-columns: repeat(5, auto);
  gap: 0 0.55rem;
  font-size: 0.7rem;
  text-align: center;
  font-variant-numeric: tabular-nums;
}

.axes .k {
  font-size: 0.58rem;
  letter-spacing: 0.14em;
  color: var(--ink-dim);
  transition: color var(--step);
}

.axes .v { font-size: 0.86rem; }
.axes .half .k, .axes .half .v { color: var(--accent-text); transition: color var(--step); }

.axes .tally {
  grid-column: 1 / -1;
  margin-top: 0.3rem;
  padding-top: 0.3rem;
  border-top: 1px solid var(--rule);
  font-size: 0.58rem;
  letter-spacing: 0.1em;
  color: var(--ink-dim);
  text-align: right;
  transition: color var(--step), border-color var(--step);
}

/* Specimen label. Engraved binomial, typewritten collection data — the way a real sheet
 * separates the name of the thing from the record of where it was found. */
.label {
  grid-column: 1;
  grid-row: 3;
  align-self: end;
  max-width: min(38ch, 68vw);
  display: flex;
  flex-direction: column;
  gap: 0.28rem;
}

.label .binomial {
  font-family: var(--serif);
  font-style: italic;
  font-size: 1rem;
}

.label .common {
  font-family: var(--serif);
  font-size: 0.9rem;
}

.label dl {
  margin: 0.15rem 0 0;
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 0.1rem 0.6rem;
  font-size: 0.68rem;
  color: var(--ink-dim);
  transition: color var(--step);
}

.label dt { letter-spacing: 0.12em; text-transform: uppercase; font-size: 0.58rem; padding-top: 0.1em; }
.label dd { margin: 0; }

/* Dates for domestication are ranges under argument, not facts with decimal places. Where
   the literature is split, the interface says so rather than picking a round number. */
.contested { color: var(--accent-text); }

/* Controls + loop budget. */
.keys {
  grid-column: 2;
  grid-row: 3;
  align-self: end;
  justify-self: end;
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 0.45rem;
  font-size: 0.66rem;
  color: var(--ink-dim);
  transition: color var(--step);
}

.keys .row { display: flex; gap: 0.5rem; align-items: center; }

kbd {
  font-family: var(--mono);
  font-size: 0.62rem;
  border: 1px solid var(--rule);
  padding: 0.1rem 0.3rem;
  color: var(--ink);
  transition: border-color var(--step), color var(--step);
}

/* Loops as a row of rings — spent ones filled. Growth rings, and a budget you can count. */
.loops { display: flex; gap: 0.28rem; align-items: center; }

.loops i {
  width: 0.62rem;
  height: 0.62rem;
  border-radius: 50%;
  border: 1px solid var(--phase-mat);
  transition: background var(--step), border-color var(--step);
}

.loops i.spent { background: var(--phase-mat); }

button {
  font: inherit;
  font-size: 0.64rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--ink);
  background: transparent;
  border: 1px solid var(--rule);
  padding: 0.3rem 0.6rem;
  cursor: pointer;
  transition: background var(--step), border-color var(--step), color var(--step);
}

button:hover { background: var(--panel); }
button:focus-visible { outline: 2px solid var(--phase-mat); outline-offset: 2px; }

.tools {
  grid-column: 2;
  grid-row: 1;
  align-self: start;
  justify-self: end;
  display: flex;
  gap: 0.35rem;
  margin-top: 4.6rem;
}

/* ── Touch controls ─────────────────────────────────────────────────────────────────── */

.pad {
  grid-column: 1 / -1;
  grid-row: 2;
  align-self: end;
  justify-self: center;
  display: none;
  grid-template-columns: repeat(3, 3rem);
  grid-template-rows: repeat(2, 3rem);
  gap: 0.35rem;
  margin-bottom: 5.5rem;
}

.pad button { font-size: 0.9rem; padding: 0; background: var(--panel); }
.pad .up { grid-area: 1 / 2; }
.pad .left { grid-area: 2 / 1; }
.pad .down { grid-area: 2 / 2; }
.pad .right { grid-area: 2 / 3; }
.pad .flip { grid-area: 1 / 1; font-size: 0.55rem; }
.pad .loop { grid-area: 1 / 3; font-size: 0.55rem; }

@media (pointer: coarse) {
  .pad { display: grid; }
  .keys .row.desktop-only { display: none; }
}

/* ── Overlays ───────────────────────────────────────────────────────────────────────── */

.sheet {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  padding: 1.5rem;
  background: color-mix(in srgb, var(--void) 88%, transparent);
  backdrop-filter: blur(3px);
  z-index: 5;
  animation: fade 0.3s ease both;
}

.sheet[hidden] { display: none; }

@keyframes fade { from { opacity: 0; } to { opacity: 1; } }

.sheet .inner {
  max-width: 46rem;
  width: 100%;
  max-height: 100%;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 1rem;
}

.sheet h2 {
  font-family: var(--serif);
  font-weight: 400;
  font-size: clamp(1.6rem, 5vmin, 2.6rem);
  margin: 0;
  text-wrap: balance;
}

/* Body copy is the one place the serif carries running text; the mono elsewhere is for
   record-keeping, and a paragraph of it is a wall. */
.sheet p {
  margin: 0;
  font-family: var(--serif);
  font-size: 1rem;
  line-height: 1.6;
  max-width: 60ch;
  color: var(--ink-dim);
}

.sheet p strong { color: var(--ink); font-weight: 400; }
.sheet p.binomial { font-style: italic; color: var(--ink); }
.sheet p.stat { font-family: var(--mono); font-size: 0.72rem; letter-spacing: 0.04em; }

.sheet .actions { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-top: 0.4rem; }
.sheet .actions button { font-size: 0.72rem; padding: 0.5rem 0.9rem; }

/* The dimension ledger on the title card — the argument, laid out as an account. */
.ledger {
  display: grid;
  grid-template-columns: auto auto 1fr;
  gap: 0.35rem 1rem;
  font-size: 0.74rem;
  border-top: 1px solid var(--rule);
  border-bottom: 1px solid var(--rule);
  padding: 0.8rem 0;
  font-variant-numeric: tabular-nums;
}

.ledger b { font-weight: 400; font-family: var(--serif); font-size: 0.95rem; font-style: italic; }
.ledger .amt { text-align: right; color: var(--phase-mat); }
.ledger .why { color: var(--ink-dim); }
.ledger .sum { border-top: 1px solid var(--rule); padding-top: 0.45rem; margin-top: 0.15rem; }
.ledger .sum .amt { color: var(--ink); }

/* Level select, laid out as the plate index of an atlas. */
.plates {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(8.5rem, 1fr));
  gap: 0.5rem;
}

.plates button {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 0.2rem;
  padding: 0.6rem;
  text-transform: none;
  letter-spacing: 0;
  text-align: left;
  min-height: 4.4rem;
}

.plates button[disabled] { opacity: 0.35; cursor: not-allowed; }
.plates .pn { font-size: 0.56rem; letter-spacing: 0.16em; color: var(--ink-dim); white-space: nowrap; }
.plates .pname { font-family: var(--serif); font-size: 0.95rem; }
.plates .pcrop { font-size: 0.6rem; color: var(--ink-dim); font-style: italic; font-family: var(--serif); }
.plates button.done .pn::after { content: ' ·  SOLVED'; color: var(--plot); }

.toast {
  position: absolute;
  left: 50%;
  bottom: 12%;
  transform: translateX(-50%);
  font-size: 0.72rem;
  letter-spacing: 0.08em;
  padding: 0.4rem 0.8rem;
  border: 1px solid var(--rule);
  background: var(--panel);
  z-index: 4;
  animation: rise 0.3s ease both;
}

@keyframes rise {
  from { opacity: 0; transform: translate(-50%, 0.5rem); }
  to { opacity: 1; transform: translate(-50%, 0); }
}

.toast[hidden] { display: none; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
}

/* Narrow screens get a different arrangement rather than a squeezed one: the title takes a
   full row instead of sharing it with the readout, the controls sit under the board, and the
   specimen label keeps the bottom. */
@media (max-width: 40rem) {
  .hud {
    grid-template-columns: 1fr auto;
    grid-template-rows: auto auto 1fr auto;
    gap: 0.45rem;
    padding: 0.7rem;
  }

  .plate { grid-column: 1 / -1; grid-row: 1; padding-right: 9.75rem; }
  .plate h1 { font-size: 1.15rem; }
  .plate .teaches { font-size: 0.66rem; }

  .axes { grid-column: 1; grid-row: 2; justify-self: start; font-size: 0.6rem; gap: 0 0.5rem; }
  .axes .tally { text-align: left; }

  .keys { grid-column: 2; grid-row: 2; align-self: start; }

  .tools { position: absolute; top: 0.7rem; right: 0.7rem; margin: 0; }

  .pad { grid-column: 1 / -1; grid-row: 3; align-self: end; margin-bottom: 0.25rem; }

  .label { grid-column: 1 / -1; grid-row: 4; max-width: 100%; }
  .label dl { font-size: 0.62rem; grid-template-columns: 4.2rem 1fr; }
}
</style>


<div id="app" data-phase="wild">
  <canvas id="stage"></canvas>

  <div class="hud">
    <div class="plate">
      <span class="n" id="plate-n">PLATE I</span>
      <div>
        <h1 id="plate-name">Furrow</h1>
        <div class="teaches" id="plate-teaches"></div>
      </div>
    </div>

    <div class="axes" id="axes">
      <div><div class="k">X</div><div class="v" id="ax-x">0</div></div>
      <div><div class="k">Y</div><div class="v" id="ax-y">0</div></div>
      <div><div class="k">Z</div><div class="v" id="ax-z">0</div></div>
      <div><div class="k">T</div><div class="v" id="ax-t">0</div></div>
      <div class="half"><div class="k">&frac12; &Phi;</div><div class="v" id="ax-p">WILD</div></div>
      <div class="tally" id="ax-tally">3 free &middot; 1 rewound &middot; &frac12; two-valued</div>
    </div>

    <div class="tools">
      <button id="btn-plates" title="Plate index (Esc)">Plates</button>
      <button id="btn-sound" title="Sound" aria-pressed="true">Sound</button>
    </div>

    <div class="pad">
      <button class="flip" id="pad-flip">FLIP</button>
      <button class="up" id="pad-up" aria-label="Move away">&uarr;</button>
      <button class="loop" id="pad-loop">LOOP</button>
      <button class="left" id="pad-left" aria-label="Move left">&larr;</button>
      <button class="down" id="pad-down" aria-label="Move toward">&darr;</button>
      <button class="right" id="pad-right" aria-label="Move right">&rarr;</button>
    </div>

    <aside class="label">
      <div class="eyebrow">Origin plot</div>
      <div class="common" id="crop-common"></div>
      <div class="binomial" id="crop-binomial"></div>
      <dl>
        <dt>Wild</dt><dd id="crop-ancestor"></dd>
        <dt>Origin</dt><dd id="crop-origin"></dd>
        <dt>Since</dt><dd id="crop-years"></dd>
        <dt>Evidence</dt><dd id="crop-confidence"></dd>
      </dl>
    </aside>

    <nav class="keys">
      <div class="loops" id="loops" title="Rewinds available"></div>
      <div class="row desktop-only"><kbd>&larr;&uarr;&darr;&rarr;</kbd><span>move</span></div>
      <div class="row desktop-only"><kbd>Space</kbd><span>flip phase</span></div>
      <div class="row desktop-only"><kbd>R</kbd><span>rewind</span><kbd>Z</kbd><span>undo</span></div>
      <div class="row desktop-only"><kbd>Q</kbd><kbd>E</kbd><span>turn</span><kbd>Enter</kbd><span>restart</span></div>
    </nav>
  </div>

  <div class="toast" id="toast" hidden></div>

  <div class="sheet" id="sheet" hidden>
    <div class="inner" id="sheet-inner"></div>
  </div>
</div>

<script>

//
// ── The dimensions ───────────────────────────────────────────────────────────────────────
//   x, y, z   three fully traversable spatial axes                              = 3
//   t         time, navigable: you rewind and your past run keeps playing        = 1
//   phase     wild ⇄ cultivated — a real axis, but with exactly two positions.
//             You can move along it, but there is nowhere to move to except the
//             other end. A dimension with no interior: half a dimension.         = 0.5
//                                                                          total = 4.5
//
// ── Resolution order within a tick ───────────────────────────────────────────────────────
// Everything below is ordered deliberately; changing any of it changes which levels are
// solvable, so the order is part of the game, not an implementation detail.
//
//   1. Actors act, oldest ghost first, the live courier LAST. The courier moving last is
//      what lets you follow a ghost into the cell it just vacated — the alternative reads
//      as the past self body-blocking you, which is miserable.
//   2. Each action fully resolves before the next actor acts (a phase flip mid-tick is seen
//      by every actor after it).
//   3. Gravity runs once, globally, after all actions, iterated to a fixed point from the
//      lowest mover upward so stacks settle in one pass.
//   4. Loss is checked, then victory.
//
// ── Collision ────────────────────────────────────────────────────────────────────────────
// Actors pass through each other but stand on each other. This is asymmetric on purpose:
// mutual blocking would make the shared spawn cell an instant deadlock on every rewind, and
// "my own past self is in the doorway" is the single least forgiving failure a time-loop
// game can hand a player. Seeds, by contrast, block everything and get pushed.

const T_AIR = 0;   // empty
const T_ROCK = 1;  // solid in both phases — bedrock
const T_WILD = 2;  // solid only while wild — thicket, scrub, unimproved ground
const T_CULT = 3;  // solid only while cultivated — terrace, bund, raised bed

const PH_WILD = 0;
const PH_CULT = 1;

const DIRS = {
  N: { x: 0, z: -1 },
  S: { x: 0, z: 1 },
  E: { x: 1, z: 0 },
  W: { x: -1, z: 0 },
};

const WAIT = '.';
const FLIP = 'F';
const REWIND = 'R';

const isMove = (a) => Object.prototype.hasOwnProperty.call(DIRS, a);

/** Terrain solidity is the only thing the phase actually changes. */
function solidAt(kind, phase) {
  return kind === T_ROCK
    || (kind === T_WILD && phase === PH_WILD)
    || (kind === T_CULT && phase === PH_CULT);
}

const LEGEND = {
  '.': T_AIR, ' ': T_AIR,
  '#': T_ROCK,
  'w': T_WILD,
  'c': T_CULT,
  '@': T_AIR,  // courier spawn
  's': T_AIR,  // seed
  'o': T_AIR,  // origin plot
};

/**
 * Parse a level. `layers[y]` is a list of `z` rows of `x` characters, y ascending, so the
 * text reads bottom-slice first — the way a section drawing through soil reads.
 */
function parse(def) {
  const layers = def.layers;
  const h = layers.length;
  const d = layers[0].length;
  const w = layers[0][0].length;

  for (let y = 0; y < h; y++) {
    if (layers[y].length !== d) throw new Error(`${def.id}: layer ${y} has ${layers[y].length} rows, expected ${d}`);
    for (let z = 0; z < d; z++) {
      if (layers[y][z].length !== w) throw new Error(`${def.id}: layer ${y} row ${z} is ${layers[y][z].length} wide, expected ${w}`);

  }

  const terrain = new Uint8Array(w * h * d);
  const plots = [];
  const seeds = [];
  let spawn = null;

  for (let y = 0; y < h; y++) {
    for (let z = 0; z < d; z++) {
      for (let x = 0; x < w; x++) {
        const ch = layers[y][z][x];
        const kind = LEGEND[ch];
        if (kind === undefined) throw new Error(`${def.id}: unknown glyph "${ch}" at ${x},${y},${z}`);
        terrain[(y * d + z) * w + x] = kind;
        if (ch === '@') {
          if (spawn) throw new Error(`${def.id}: more than one spawn`);
          spawn = { x, y, z };
        }
        if (ch === 's') seeds.push({ x, y, z });
        if (ch === 'o') plots.push({ x, y, z });
      }
    }
  }

  if (!spawn) throw new Error(`${def.id}: no spawn`);
  if (!plots.length) throw new Error(`${def.id}: no origin plot`);
  if (seeds.length < plots.length) {
    throw new Error(`${def.id}: ${seeds.length} seeds cannot fill ${plots.length} plots`);
  }

  return {
    def, w, h, d, terrain, plots,
    spawn,
    seedStart: seeds,
    startPhase: def.startPhase ?? PH_WILD,
    maxLoops: def.maxLoops ?? 0,
  };
}

/** Fresh runtime state: tick zero, no ghosts. */
function start(level) {
  const state = {
    level,
    t: 0,
    phase: level.startPhase,
    player: { ...level.spawn },
    seeds: level.seedStart.map((s) => ({ ...s })),
    ghosts: [],
    lost: null,
    won: false,

  // Settle before the first tick so a level can be drawn with a seed hanging in the air
  // and have it land where it belongs, rather than lurching downward on move one.
  settle(state);
  return state;
}

/** Reset the world but keep the ghosts — this is what a rewind does. */
function reset(state) {
  const lv = state.level;
  const next = {
    level: lv,
    t: 0,
    phase: lv.startPhase,
    player: { ...lv.spawn },
    seeds: lv.seedStart.map((s) => ({ ...s })),
    ghosts: state.ghosts.map((g) => ({ actions: g.actions, x: lv.spawn.x, y: lv.spawn.y, z: lv.spawn.z })),
    lost: null,
    won: false,
  };
  settle(next);
  return next;
}
