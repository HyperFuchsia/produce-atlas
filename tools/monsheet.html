<!DOCTYPE html><html><head><meta charset="utf-8"><style>body{margin:0;background:#20202c}canvas{image-rendering:pixelated;display:block}#screen{display:none}</style></head>
<body><canvas id="screen" width="240" height="160"></canvas><canvas id="sheet"></canvas>
<script type="module">
import { drawText } from '/src/gfx/font.js';
import { renderMon } from '/src/gfx/monart.js';
import { MON_ART } from '/src/gfx/monrecipes.js';
const S=4, COLS=6, CELL=66;
const names=Object.keys(MON_ART);
const rows=Math.ceil(names.length/COLS);
const W=COLS*CELL, H=rows*(CELL+10)+80;
const off=document.createElement('canvas'); off.width=W; off.height=H;
const g=off.getContext('2d'); g.imageSmoothingEnabled=false;
g.fillStyle='#2c2c3a'; g.fillRect(0,0,W,H);
names.forEach((n,i)=>{
  const x=(i%COLS)*CELL+1, y=Math.floor(i/COLS)*(CELL+10)+2;
  g.fillStyle=(i%2)?'#33334a':'#2a2a3c'; g.fillRect(x,y,64,64);
  g.drawImage(renderMon(MON_ART[n]), x, y);
  drawText(g,n,x+2,y+64,{color:'#ffffff',shadow:'#000000'});
});
let y2=rows*(CELL+10)+6;
drawText(g,'BACK VIEWS',2,y2,{color:'#ffd25e',shadow:'#000'});
['sproutle','emberet','rilldrop','voltpip','wispwing','aurelith'].forEach((n,i)=>{
  g.drawImage(renderMon(MON_ART[n],true), i*CELL+1, y2+12);
});
const sheet=document.getElementById('sheet');
sheet.width=W*S; sheet.height=H*S;
const sg=sheet.getContext('2d'); sg.imageSmoothingEnabled=false;
sg.drawImage(off,0,0,W*S,H*S);
</script></body></html>
