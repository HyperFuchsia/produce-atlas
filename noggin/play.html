<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Produce Atlas</title>

<style>
  /* The scene is the page. Everything here is a thin overlay on top of it and
     is expected to get out of the way — nothing owns a permanent block of the
     screen except one input. Committed dark theme: the stage is a rendered 3-D
     scene and a light mode would fight it. */
  :root {
    --ink:      #0C0F0D;
    --line:     rgba(233, 229, 218, 0.16);
    --paper:    #F2EFE7;
    --muted:    #9AA097;
    --accent:   #D6A93C;
    --accent-2: #F4CC69;

    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Times New Roman", serif;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;

    /* Text sits directly on the render, so it carries its own legibility. */
    --lift: 0 1px 2px rgba(0,0,0,0.9), 0 2px 18px rgba(0,0,0,0.75);
    --rail: min(660px, calc(100vw - 40px));
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    background: var(--ink);
    color: var(--paper);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
  }

  #gl {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    touch-action: none;
    cursor: grab;
  }
  #gl:active { cursor: grabbing; }

  /* ---- wordmark -------------------------------------------------------- */

  #mark {
    position: fixed;
    top: 20px;
    left: 24px;
    z-index: 10;
    font-family: var(--serif);
    font-size: 15px;
    letter-spacing: 0.02em;
    color: var(--muted);
    text-shadow: var(--lift);
    pointer-events: none;
    user-select: none;
  }
  #mark em { font-style: italic; color: var(--accent); }

  /* ---- conversation ----------------------------------------------------- */

  /* Bottom-anchored and transient. Lines stack upward, dissolve at the top
     edge, and remove themselves once read — so the conversation never becomes
     a wall standing in front of the scene. */
  #hud {
    position: fixed;
    inset: 0;
    z-index: 10;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    align-items: center;
    padding: 0 20px max(20px, env(safe-area-inset-bottom));
    pointer-events: none;
  }

  #dialogue {
    width: var(--rail);
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    gap: 9px;
    max-height: 32vh;
    overflow: hidden;
    -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 15%);
    mask-image: linear-gradient(to bottom, transparent 0, #000 15%);
  }

  .msg {
    font-size: 14.5px;
    line-height: 1.55;
    text-shadow: var(--lift);
    text-wrap: pretty;
    opacity: 1;
    transition: opacity 1.1s ease, transform 1.1s ease;
  }
  .msg.gone { opacity: 0; transform: translateY(-8px); }

  .msg.him { color: var(--paper); }
  .msg.him.typing::after {
    content: "";
    display: inline-block;
    width: 7px;
    height: 15px;
    margin-left: 3px;
    vertical-align: -2px;
    background: var(--accent);
    animation: blink 1s steps(2) infinite;
  }
  @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }

  .msg.you {
    align-self: flex-end;
    max-width: 85%;
    text-align: right;
    color: var(--accent-2);
    font-size: 13px;
  }

  /* ---- starter prompts --------------------------------------------------- */

  /* Only while the field is focused and empty. Discoverability when you want
     it, nothing on screen when you don't. */
  #chips {
    width: var(--rail);
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 12px;
    opacity: 0;
    transform: translateY(4px);
    transition: opacity 0.2s ease, transform 0.2s ease;
    pointer-events: none;
  }
  body.hint #chips { opacity: 1; transform: none; pointer-events: auto; }
  .chip {
    font-family: var(--sans);
    font-size: 12px;
    color: var(--paper);
    background: rgba(12, 16, 14, 0.72);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid var(--line);
    border-radius: 100px;
    padding: 6px 13px;
    cursor: pointer;
    transition: color 0.15s ease, border-color 0.15s ease;
  }
  .chip:hover, .chip:focus-visible {
    color: var(--accent-2);
    border-color: var(--accent);
    outline: none;
  }

  /* ---- composer ---------------------------------------------------------- */

  #composer {
    width: var(--rail);
    display: flex;
    gap: 8px;
    margin-top: 14px;
    pointer-events: auto;
  }
  #prompt {
    flex: 1;
    min-width: 0;
    background: rgba(12, 16, 14, 0.72);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 1px solid var(--line);
    border-radius: 100px;
    color: var(--paper);
    font-family: var(--sans);
    /* 16px minimum: anything smaller makes iOS zoom the page on focus. */
    font-size: 16px;
    padding: 12px 20px;
    outline: none;
    transition: border-color 0.15s ease;
  }
  #prompt:focus { border-color: rgba(214, 169, 60, 0.7); }
  #prompt::placeholder { color: rgba(154, 160, 151, 0.8); }
  #send {
    flex: none;
    border: 1px solid var(--line);
    background: rgba(12, 16, 14, 0.72);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    color: var(--accent);
    border-radius: 100px;
    padding: 0 20px;
    font-family: var(--sans);
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
  }
  #send:hover, #send:focus-visible {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--ink);
    outline: none;
  }

  /* ---- specimen caption --------------------------------------------------- */

  #tags {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 8;
  }
  .caption {
    position: absolute;
    transform: translate(-50%, -50%);
    text-align: center;
    white-space: nowrap;
    transition: opacity 0.3s ease;
  }
  .caption .name {
    font-family: var(--serif);
    font-style: italic;
    font-size: 15px;
    color: var(--paper);
    text-shadow: var(--lift);
  }
  .caption .size {
    display: block;
    margin-top: 2px;
    font-family: var(--mono);
    font-size: 10.5px;
    letter-spacing: 0.1em;
    color: var(--accent);
    font-variant-numeric: tabular-nums;
    text-shadow: var(--lift);
  }
  .caption::after {
    content: "";
    position: absolute;
    left: 50%;
    top: calc(100% + 5px);
    width: 1px;
    height: 16px;
    background: linear-gradient(to bottom, var(--accent), transparent);
  }

  /* ---- sound --------------------------------------------------------------- */

  #sound {
    position: fixed;
    right: 24px;
    top: 20px;
    z-index: 10;
    border: none;
    background: transparent;
    color: var(--muted);
    font-family: var(--sans);
    font-size: 10.5px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    cursor: pointer;
    padding: 4px 2px;
    text-shadow: var(--lift);
    transition: color 0.15s ease;
  }
  #sound:hover, #sound:focus-visible { color: var(--paper); outline: none; }

  /* ---- boot ---------------------------------------------------------------- */

  #boot {
    position: fixed;
    inset: 0;
    z-index: 30;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--ink);
    font-family: var(--serif);
    font-style: italic;
    font-size: 16px;
    color: var(--muted);
    transition: opacity 0.5s ease;
  }
  #boot.gone { opacity: 0; pointer-events: none; }

  #fail {
    max-width: 420px;
    padding: 0 24px;
    text-align: center;
    line-height: 1.6;
    font-family: var(--sans);
    font-style: normal;
    font-size: 13px;
  }

  @media (prefers-reduced-motion: reduce) {
    .msg { transition: opacity 0.2s ease; }
    .msg.him.typing::after { animation: none; }
    #boot, #chips { transition: none; }
  }

  @media (max-width: 640px) {
    #mark { font-size: 13px; top: 16px; left: 16px; }
    #sound { top: 16px; right: 16px; }
    .msg { font-size: 13.5px; }
    #dialogue { max-height: 24vh; }
  }
</style>
</head>
<body>
<canvas id="gl"></canvas>

<div id="tags"></div>

<div id="mark">Produce <em>Atlas</em></div>
<button id="sound" type="button">Sound on</button>

<div id="hud">
  <div id="dialogue"></div>
  <div id="chips"></div>
  <form id="composer" autocomplete="off">
    <input id="prompt" type="text" placeholder="name a food plant…" maxlength="200" aria-label="Ask about a food plant">
    <button id="send" type="submit">Send</button>
  </form>
</div>

<div id="boot"><span>waking the atlas…</span></div>

    const out = new Float32Array(src.length);
    const v = [0, 0, 0];
    for (let i = 0; i < src.length; i += 3) {
      v[0] = src[i]; v[1] = src[i + 1]; v[2] = src[i + 2];
      fn(v);
      out[i] = v[0]; out[i + 1] = v[1]; out[i + 2] = v[2];
    }
    return out;
  }

  function translate(src, x, y, z) {
    return transform(src, function (v) { v[0] += x; v[1] += y; v[2] += z; });
  }

  function rotateZ(src, ang) {
    const c = Math.cos(ang), s = Math.sin(ang);
    return transform(src, function (v) {
      const x = v[0] * c - v[1] * s, y = v[0] * s + v[1] * c;
      v[0] = x; v[1] = y;
    });
  }

  function rotateX(src, ang) {
    const c = Math.cos(ang), s = Math.sin(ang);
    return transform(src, function (v) {
      const y = v[1] * c - v[2] * s, z = v[1] * s + v[2] * c;
      v[1] = y; v[2] = z;
    });
  }

  function rotateY(src, ang) {
    const c = Math.cos(ang), s = Math.sin(ang);
    return transform(src, function (v) {
      const x = v[0] * c + v[2] * s, z = -v[0] * s + v[2] * c;
      v[0] = x; v[2] = z;
    });
  }

  const MAT_SKIN = 0;      /* soft, wrapped diffuse — fruit flesh reads well */
  const MAT_GLOSS = 2;     /* tight specular — waxy skins */
  const MAT_MATTE = 3;     /* rough — leaves, husks, roots */

  /* Project a direction on the unit sphere onto an entry's form.

     This is the same construction as revolve(), driven by a sphere direction
     instead of a grid: polar angle picks the profile parameter, azimuth picks
     the way round. That means any specimen can be expressed on the being's own
     icosphere topology — same vertex count, same adjacency — so becoming one is
     a morph of rest positions rather than a mesh swap. */
  const FALLBACK_PROFILE = [0, 0.55, 0.84, 0.96, 1.0, 1.0, 0.96, 0.84, 0.55, 0];

  P.formOnSphere = function (out, spec, dx, dy, dz) {
    /* Primitives are defined directly rather than as a revolved profile: a
       cube is not a solid of revolution. The L-infinity mapping (divide the
       direction by its largest component) lands exactly on a box surface. */
    if (spec.kind === 'point') {
      out[0] = dx * spec.size; out[1] = dy * spec.size; out[2] = dz * spec.size;
      return out;
    }
    if (spec.kind === 'box') {
      const m = Math.max(Math.abs(dx), Math.abs(dy), Math.abs(dz)) || 1;
      out[0] = (dx / m) * spec.hx;
      out[1] = (dy / m) * spec.hy;
      out[2] = (dz / m) * spec.hz;
      return out;
    }
    /* A liquid at rest: wide, domed on top, nearly flat underneath, with a
       rim that is not quite a circle. Latitude drives height and the
       horizontal part of the direction is kept as-is, so the shell flattens
       into a disc without any part of it folding through another. */
    if (spec.kind === 'puddle') {
      const az = Math.atan2(dz, dx);
      const lobe = 1 + 0.10 * Math.sin(az * 3 + 0.7) + 0.06 * Math.sin(az * 5 - 1.3);
      out[0] = dx * spec.radius * lobe;
      out[1] = dy * (dy > 0 ? spec.dome : spec.base);
      out[2] = dz * spec.radius * lobe;
      return out;
    }
    /* A gas has no profile worth revolving. Three interfering sines give a
       lumpy blob the shader can then churn, and keeping it radial means the
       shape stays star-convex, so picking and the camera fit still work. */
    if (spec.kind === 'cloud') {
      const n = Math.sin(dx * 3.1 + 1.7) * Math.sin(dy * 2.6 - 0.9) * Math.sin(dz * 3.4 + 2.2);
      const r = spec.radius * (1 + spec.wobble * n);
      out[0] = dx * r; out[1] = dy * r; out[2] = dz * r;
      return out;
    }

    /* A hull is lofted along its own length rather than revolved about an
       axis, because most made things are not solids of revolution. Polar
       angle about X picks the station down the body; the angle round X picks
       the way round; and the cross-section there is a superellipse, which is
       a rounded rectangle when you want one and an ellipse when you do not.

       Separate top and bottom profiles are what make it a car rather than a
       loaf: the roofline and the floorpan are unrelated curves. */
    if (spec.kind === 'hull') {
      const sc = P.cm(1);
      const len = spec.lengthCm * sc;
      const halfW = spec.widthCm * 0.5 * sc;
      const tall = spec.heightCm * sc;

      const t = 1 - Math.acos(M.clamp(dx, -1, 1)) / Math.PI;
      const top = sampleProfile(spec.top, t);
      const bot = sampleProfile(spec.bottom, t);
      const wide = sampleProfile(spec.wide, t);

      const hy = Math.max((top - bot) * 0.5 * tall, 1e-3);
      const cy = (top + bot) * 0.5 * tall - tall * 0.5;   /* origin at mid-height */
      const hz = Math.max(wide * halfW, 1e-3);

      const phi = Math.atan2(dy, dz);
      const ay = Math.cos(phi), az = Math.sin(phi);
      const n = spec.corner || 4;
      const r = 1 / Math.pow(
        Math.pow(Math.abs(ay / hy), n) + Math.pow(Math.abs(az / hz), n), 1 / n);

      let y = ay * r, z = az * r;

      /* Tumblehome: the section narrows as it rises. Without it every station
         is a slab of constant width and the result is a loaf — a car is
         widest at the shoulder and tucks in above and below it. The taper is
         applied after solving the section, which keeps the curve closed. */
      if (spec.taper) {
        const yn = M.clamp((y + hy) / (2 * hy), 0, 1);
        z *= sampleProfile(spec.taper, yn);
      }

      out[0] = (t - 0.5) * len;
      out[1] = y + cy;
      out[2] = z;
      return out;
    }

    /* A face is its own module: too much of it is anatomy rather than
       geometry, and it is the one form that keeps moving after it arrives. */
    if (spec.kind === 'face') return NG.FACE.onSphere(out, spec, dx, dy, dz, spec._mouth);

    if (spec.cluster) {
      const h = clusterHit(spec, dx, dy, dz);
      out[0] = dx * h.t; out[1] = dy * h.t; out[2] = dz * h.t;
      return out;
    }

    const scale = P.cm(1);
    const height = (spec.lengthCm || spec.sizeCm) * scale;
    const radius = (spec.widthCm || spec.sizeCm) * 0.5 * scale;
    const profile = spec.profile || FALLBACK_PROFILE;

    const t = 1 - Math.acos(M.clamp(dy, -1, 1)) / Math.PI;
    let r = sampleProfile(profile, t) * radius;
    if (r < 0) r = 0;
    let y = axisY(dimpleSolve(spec.dimple, profile, height, radius), t) * height;

    const phi = Math.atan2(dz, dx);
    if (spec.ribs) {
      const fade = Math.sin(Math.PI * t);
      r *= 1 - (spec.ribDepth || 0) * fade * (0.5 - 0.5 * Math.cos(spec.ribs * phi));
    }

    let x = Math.cos(phi) * r;
    let z = Math.sin(phi) * r;

    if (spec.bend) {
      const k = spec.bend / Math.max(height, 1e-5);
      const ang = y * k;
      const rad = 1 / k;
      const cx = x + rad;
      x = Math.cos(ang) * cx - rad;
      y = Math.sin(ang) * cx;
    }

    if (spec.lie) { const nx = -y; y = x; x = nx; }

    out[0] = x; out[1] = y; out[2] = z;
    return out;
  };

  /* ---- clusters: a bunch of grapes ------------------------------------- */

  /* A bunch is not a shape, it is an arrangement, and it is the one specimen
     here whose topology is genuinely not a sphere. Two things follow.

     First, the arrangement is generated once and used by both the standalone
     bunch (real separate berries, real gaps) and by the being wearing it —
     otherwise the thing standing next to you and the thing you turned into
     are two different bunches.

     Second, the being cannot have gaps: it is one closed surface. So what it
     wears is the *union* of the berries, which sounds like a compromise and
     is very nearly not one — a real bunch is packed tight enough that you
     rarely see through it, and a union of packed spheres has exactly the
     lumpy silhouette and the creases between berries that make a bunch read
     as a bunch. */
  function clusterBerries(spec) {
    if (spec._berries) return spec._berries;
    const c = spec.cluster;
    const scale = P.cm(1);
    const r0 = (c.berryCm || 1.6) * 0.5 * scale;
    /* Berry *centres* are packed into an envelope one berry-radius inside the
       bunch's stated size, because each berry then sticks a radius out past
       it. Packed to the stated size instead, an 11 cm bunch measured 12.6. */
    const H = (spec.lengthCm || spec.sizeCm) * scale - r0 * 2;
    const R = (spec.widthCm || spec.sizeCm) * 0.5 * scale - r0;
    const rnd = M.rng(spec.seed || 7);
    const want = c.count || 140;
    /* Shoulders at the top, tapering to a point: the profile of the envelope
       the berries are packed into, top to bottom. */
    const shape = c.shape || [0.60, 0.88, 1.00, 0.98, 0.91, 0.80, 0.66, 0.50, 0.31, 0.10];
    /* How close two berries may sit, as a fraction of their radius. Under two
       they are touching, which is what a bunch does — the berries press on
       each other hard enough to flatten where they meet. */
    const near = (c.pack || 1.42) * r0;
    const near2 = near * near;

    const list = [];
    let tries = 0;
    while (list.length < want && tries < want * 300) {
      tries++;
      /* Biased up the bunch, because the top half holds most of the fruit. */
      const t = Math.pow(rnd(), 0.82);
      const rad = sampleProfile(shape, t) * R;
      const a = rnd() * Math.PI * 2;
      /* Pushed out towards the skin of the bunch rather than spread through
         its volume. Two reasons, and the second is the real one: the middle
         of a bunch is stems, not fruit; and a berry sitting further in than
         its neighbours is seen obliquely by the radial field that carries it,
         which stretches it into a finger. Packed onto a shell, the berries
         are all seen roughly face-on and stay round. */
      const q = Math.pow(rnd(), 0.30);
      const px = Math.cos(a) * rad * q;
      const pz = Math.sin(a) * rad * q;
      const py = (0.5 - t) * H;
      let ok = true;
      for (let i = 0; i < list.length; i++) {
        const b = list[i];
        const ddx = b.x - px, ddy = b.y - py, ddz = b.z - pz;
        if (ddx * ddx + ddy * ddy + ddz * ddz < near2) { ok = false; break; }
      }
      if (!ok) continue;
      list.push({ x: px, y: py, z: pz, r: r0 * (0.88 + rnd() * 0.26), i: list.length });
    }
    /* The envelope goes with the arrangement, so the surface that fills the
       gaps between berries is the surface they were packed into. */
    list.envelope = { R: R, H: H, shape: shape };
    Object.defineProperty(spec, '_berries', { value: list });
    return list;
  }
  P.clusterBerries = clusterBerries;

  /* Where a ray from the middle of the bunch leaves the union of the berries,
     and which berry it left through.

     For a berry the ray misses, the far intersection does not exist, so the
     tangent point is used instead and falls away smoothly past the rim. That
     keeps the field continuous everywhere, which matters: a hole in it would
     be a vertex of the being flung to the origin. */
  /* How far the tapering envelope of the bunch reaches in a direction. Found
     by bisection rather than solved, because the envelope is a profile
     revolved about the axis and the ray is not perpendicular to it.

     This is what fills the gaps between berries. Without it, a direction that
     threads between two berries has nothing to land on, and the only
     available answer — the tangent point of the nearest berry — falls away
     so steeply that every berry ends up a spike. With it, a gap simply shows
     the mass of the bunch a few millimetres further in, which is what a gap
     in a real bunch shows: more grapes. */
  function envelopeReach(shape, R, H, dx, dy, dz) {
    const lat = Math.hypot(dx, dz);
    let lo = 0, hi = Math.max(R, H) * 1.2;
    for (let i = 0; i < 20; i++) {
      const t = (lo + hi) * 0.5;
      const py = dy * t;
      if (Math.abs(py) > H * 0.5) { hi = t; continue; }
      const tt = M.clamp(0.5 - py / H, 0, 1);
      if (lat * t <= sampleProfile(shape, tt) * R) lo = t; else hi = t;
    }
    return lo;
  }

  const HIT = { t: 0, i: -1, nx: 0, ny: 0, nz: 0 };
  function clusterHit(spec, dx, dy, dz) {
    const list = clusterBerries(spec);
    const e = list.envelope;
    /* Exactly the envelope the centres were packed into, so a berry's cap
       meets it tangentially at the edge of the berry and there is no step.
       Set lower, every berry on the silhouette ended in a cliff and the
       bunch grew a fringe of pegs. */
    const fill = envelopeReach(e.shape, e.R, e.H, dx, dy, dz)
      * (spec.cluster.fill === undefined ? 1.0 : spec.cluster.fill);

    let best = fill, bi = -1;
    for (let k = 0; k < list.length; k++) {
      const b = list[k];
      const proj = b.x * dx + b.y * dy + b.z * dz;
      if (proj <= 0) continue;
      const perp2 = b.x * b.x + b.y * b.y + b.z * b.z - proj * proj;
      const rr = b.r * b.r;
      if (perp2 > rr) continue;
      const t = proj + Math.sqrt(rr - perp2);
      if (t > best) { best = t; bi = k; }
    }
    HIT.t = Math.max(best, 0.02);
    /* In a gap, the colour belongs to whichever berry is nearest — the wax
       down in a crevice is the wax on the berries around it. */
    if (bi < 0) {
      let nd = 1e9;
      for (let k = 0; k < list.length; k++) {
        const b = list[k];
        const ddx = b.x - dx * HIT.t, ddy = b.y - dy * HIT.t, ddz = b.z - dz * HIT.t;
        const d2 = ddx * ddx + ddy * ddy + ddz * ddz;
        if (d2 < nd) { nd = d2; bi = k; }
      }
    }
    const b = list[bi];
    HIT.i = bi;
    /* Outward normal of the berry it left through — which way that berry is
       facing is what decides how much bloom sits on it. */
    const hx = dx * HIT.t - b.x, hy = dy * HIT.t - b.y, hz = dz * HIT.t - b.z;
    const l = Math.hypot(hx, hy, hz) || 1;
    HIT.nx = hx / l; HIT.ny = hy / l; HIT.nz = hz / l;
    return HIT;
  }
  P.clusterHit = clusterHit;

  /* The colour of a berry, and of the bloom on it.

     Bloom is the whole read. A grape is a very dark, almost black purple with
     a coat of pale waxy dust over it, and it is the dust you actually see —
     it is why grapes photograph slate blue rather than black, and why they
     look matte in a bowl of otherwise shiny fruit. Left off, this comes out
     as a bag of glass beads.

     It is not uniform. It sits heaviest where the berry faces up and out, and
     it is missing where berries have rubbed against each other, so the darker
     skin shows through in patches down in the crevices. */
  function berryColour(out, spec, i, nx, ny, nz) {
    const c = spec.cluster;
    const skin = spec.color;
    const bloom = c.bloomColor || [0.130, 0.144, 0.238];
    const varies = c.ripeColor || null;

    /* A cheap hash of the berry index: some berries are riper than others,
       and a bunch where every berry is the same colour reads as manufactured. */
    const h = ((i * 2654435761) >>> 0) / 4294967296;
    out[0] = skin[0]; out[1] = skin[1]; out[2] = skin[2];
    if (varies) M.mix3(out, out, varies, Math.pow(h, 1.5));

    /* Facing up and outward: how much wax has settled and stayed. */
    const up = M.clamp(ny * 0.55 + 0.55, 0, 1);
    const k = (c.bloomAmount === undefined ? 0.80 : c.bloomAmount)
      * (0.42 + 0.58 * Math.pow(up, 1.4))
      * (0.80 + 0.20 * h);
    M.mix3(out, out, bloom, M.clamp(k, 0, 1));
    return out;
  }
  P.berryColour = berryColour;

  P.clusterPaint = function (out, spec, dx, dy, dz) {
    const h = clusterHit(spec, dx, dy, dz);
    return berryColour(out, spec, h.i, h.nx, h.ny, h.nz);
  };

  /* What colour the surface is at a given direction.

     One flat colour per specimen is most of why they read as plastic: a real
     apple is red on the side that saw the sun and yellow-green underneath, a
     banana browns at both ends, a mango is red over gold. None of that is
     texture — it is large, soft variation across the body, and it is the
     cheapest realism available.

     `paint.top` / `paint.bottom` blend toward the poles; `paint.blush` blends
     toward a direction, which is what a fruit ripening on one side looks
     like. */
  P.paintOnSphere = function (out, spec, dx, dy, dz) {
    if (spec.kind === 'face') return NG.FACE.paint(out, spec, dx, dy, dz);
    if (spec.cluster) return P.clusterPaint(out, spec, dx, dy, dz);
    const base = spec.color;
    out[0] = base[0]; out[1] = base[1]; out[2] = base[2];
    const paint = spec.paint;
    if (!paint) return out;

    if (paint.bottom) {
      const k = Math.pow(M.clamp(-dy, 0, 1), paint.bottomPower || 2.2);
      M.mix3(out, out, paint.bottom, k * (paint.bottomAmount || 1));
    }
    if (paint.top) {
      const k = Math.pow(M.clamp(dy, 0, 1), paint.topPower || 2.2);
      M.mix3(out, out, paint.top, k * (paint.topAmount || 1));
    }
    if (paint.blush) {
      const b = paint.blush, d = b.dir;
      const k = Math.pow(M.clamp(dx * d[0] + dy * d[1] + dz * d[2], 0, 1), b.power || 1.8);
      M.mix3(out, out, b.color, k * (b.amount === undefined ? 1 : b.amount));
    }
    return out;
  };

  /* Which procedural surface the shader should draw on this thing. */
  P.SKINS = {
    none: 0,
    pitted: 1,      /* citrus: oil glands, dimpled */
    celled: 2,      /* pineapple: fused fruitlets in a diamond lattice */
    seeded: 3,      /* strawberry: achenes sitting in their own pits */
    freckled: 4,    /* banana: sparse dark spots over faint ridges */
    waxy: 5,        /* apple, plum: fine lenticel speckle under a sheen */
    pores: 6,       /* skin: fine grain, and a highlight that scatters */
    bloom: 7        /* grapes, plums: pale wax dust, matte, rubbed off in patches */
  };

  /* A lofted shell, built by pushing a sphere through the same mapping the
     being uses — so there is one definition of the shape and the standalone
     specimen and the worn form cannot drift apart. */
  function hullMesh(spec) {
    const unit = G.icosphere(4);
    const n = unit.positions.length / 3;
    const pos = new Float32Array(n * 3);
    const o = [0, 0, 0];
    for (let i = 0; i < n; i++) {
      P.formOnSphere(o, spec,
        unit.positions[i * 3], unit.positions[i * 3 + 1], unit.positions[i * 3 + 2]);
      pos[i * 3] = o[0]; pos[i * 3 + 1] = o[1]; pos[i * 3 + 2] = o[2];
    }
    return { positions: pos, indices: unit.indices };
  }

  /* Build one produce mesh from a knowledge-base entry.

     With `trimOnly`, the body is left out and only the stem, leaves and crown
     are built. Those are the parts that cannot be expressed on the being's
     own topology — a closed sphere has nowhere to put a pineapple's crown —
     so when it *becomes* a specimen they are attached separately, in this
     same local frame, and ride its transform. Returns null when the specimen
     has no such parts. */
  P.build = function (spec, trimOnly) {
    /* Eyes, ears and hair. There is no standalone face — it is only ever
       something the being is wearing, so there is no body to build here. */
    if (spec.kind === 'face') return trimOnly ? NG.FACE.mesh(spec) : null;

    const part = new Part();
    const scale = P.cm(1);
    const height = (spec.lengthCm || spec.sizeCm) * scale;
    const radius = (spec.widthCm || spec.sizeCm) * 0.5 * scale;
    const mat = spec.gloss === false ? MAT_SKIN : MAT_GLOSS;

    if (trimOnly) {
      /* body skipped */
    } else if (spec.kind === 'hull') {
      const hull = hullMesh(spec);
      part.add(hull.positions, hull.indices, spec.color, mat);
    } else if (spec.cluster) {
      /* The bunch you can stand next to: real separate berries, so it has
         real gaps and a real silhouette. Same arrangement the being wears. */
      const berries = clusterBerries(spec);
      const unit = G.icosphere(2);
      const col = [0, 0, 0];
      const n = unit.positions.length / 3;
      for (let k = 0; k < berries.length; k++) {
        const b = berries[k];
        const pos = new Float32Array(n * 3);
        /* Very slightly taller than wide. A berry hanging in a bunch is not a
           marble; it is squashed by its neighbours and pulled by its own
           weight, and perfect spheres are most of why a cluster of them
           reads as beads. */
        for (let v = 0; v < n; v++) {
          pos[v * 3] = b.x + unit.positions[v * 3] * b.r;
          pos[v * 3 + 1] = b.y + unit.positions[v * 3 + 1] * b.r * 1.06;
          pos[v * 3 + 2] = b.z + unit.positions[v * 3 + 2] * b.r;
        }
        /* Coloured per berry from its own upward face, the same rule the worn
           form uses, so the two bunches are the same bunch. */
        berryColour(col, spec, k, 0, 0.55, 0.5);
        part.add(pos, unit.indices, col, mat);
      }
    } else {
      const body = revolve({
        rings: spec.rings || 28,
        segments: spec.segments || 32,
        height: height,
        radius: radius,
        profile: spec.profile,
        dimple: spec.dimple,
        ribs: spec.ribs || 0,
        ribDepth: spec.ribDepth || 0,
        bend: spec.bend || 0,
        twist: spec.twist || 0
      });
      part.add(body.positions, body.indices, spec.color, mat);
    }

    /* Stem */
    if (spec.stem) {
      const sh = spec.stem.lengthCm * scale;
      const sr = (spec.stem.widthCm || 0.5) * 0.5 * scale;
      const stem = revolve({
        rings: 8, segments: 10, height: sh, radius: sr,
        profile: [0.9, 1, 1, 0.9, 0.7]
      });
      const y = height * (spec.stem.at !== undefined ? spec.stem.at : 0.5) + sh * 0.5;
      part.add(translate(stem.positions, 0, y, 0), stem.indices,
        spec.stem.color || [0.34, 0.26, 0.14], MAT_MATTE);
    }

    /* One or two leaves off the stem */
    if (spec.leaves) {
      const n = spec.leaves.count || 1;
      for (let i = 0; i < n; i++) {
        const l = leaf(spec.leaves.lengthCm * scale, spec.leaves.widthCm * 0.5 * scale, 0.02,
          spec.leaves);
        let g = rotateZ(l.positions, spec.leaves.tilt !== undefined ? spec.leaves.tilt : 0.7);
        g = rotateY(g, (i / n) * Math.PI * 2 + 0.4);
        const y = height * (spec.leaves.at !== undefined ? spec.leaves.at : 0.5);
        part.add(translate(g, 0, y, 0), l.indices,
          spec.leaves.color || [0.22, 0.45, 0.16], MAT_MATTE);
      }
    }

    /* Crown of stiff leaves, for pineapples and the like */
    if (spec.crown) {
      const n = spec.crown.count || 9;
      for (let i = 0; i < n; i++) {
        const t = i / n;
        const len = spec.crown.lengthCm * scale * (0.6 + 0.4 * ((i * 7) % n) / n);
        const l = leaf(len, spec.crown.widthCm * 0.5 * scale, 0.01);
        let g = rotateZ(l.positions, 0.25 + (i % 3) * 0.22);
        g = rotateY(g, t * Math.PI * 2 * 2.3);
        part.add(translate(g, 0, height * 0.45, 0), l.indices,
          spec.crown.color || [0.26, 0.46, 0.20], MAT_MATTE);
      }
    }

      /* The nose is three parts: a narrow dorsum running down from between
         the brows, a rounded ball at the tip, and two wings either side of
         it. One bump gives a snout every time. Together they stand about
         1.7 cm off the face, which is what a nose does. */
      bridge: F(D(0, -1.6), noseProjection * 0.34, bridgeWidth * 0.5, 2.6),
      tip: F(D(0, CM.noseTip), noseProjection * 0.88, alarWidth * 0.26, 1.1),
      alaL: F(D(-alaX, CM.noseBase), 0.60, alaHalfW, 0.8),
      alaR: F(D(alaX, CM.noseBase), 0.60, alaHalfW, 0.8),
      nostrilL: F(D(-alaX * 0.52, CM.noseBase - 0.5), -0.34, 0.42, 0.55),
      nostrilR: F(D(alaX * 0.52, CM.noseBase - 0.5), -0.34, 0.42, 0.55),
      /* Philtrum: the groove from the nose down to the lip. Small, and its
         absence is one of those things you cannot name but do notice. */
      philtrum: F(D(0, -5.7), -0.25, 0.5, 0.8),

      /* Brow ridge, then the sockets under it. The ridge is most of what
         makes a face read as male; the sockets are what stop the eyes
         floating on the front of a ball. */
      browL: F(D(-3.4, CM.glabella), browProjection, 1.9, 0.9),
      browR: F(D(3.4, CM.glabella), browProjection, 1.9, 0.9),
      socketL: F(D(-CM.eyeX, CM.eye), -0.75, 1.9, 1.1),
      socketR: F(D(CM.eyeX, CM.eye), -0.75, 1.9, 1.1),
      /* Nasion, the dip between the brows. Without it the ridge runs straight
         across and the face reads as a mask. */
      nasion: F(D(0, CM.nasion), -0.40, 0.9, 0.8),

      /* The lids, which are the single reason an eye reads as an eye rather
         than a ball glued to a head. They are here at rest — over the eyeball
         from above, and less so from below, leaving the almond between them.
         A blink is simply this, further. */
      lidUpL: F(D(-CM.eyeX, CM.eye + 0.85), 0.90, 1.9, 0.55),
      lidUpR: F(D(CM.eyeX, CM.eye + 0.85), 0.90, 1.9, 0.55),
      lidLoL: F(D(-CM.eyeX, CM.eye - 0.90), 0.72, 1.9, 0.55),
      lidLoR: F(D(CM.eyeX, CM.eye - 0.90), 0.72, 1.9, 0.55),

      /* Malar prominence — the cheekbone — and the softer cheek under it. */
      malarL: S(D(-(bizygomatic * 0.5 - 0.9), CM.malar), 0.50, 2.6, 2.0),
      malarR: S(D(bizygomatic * 0.5 - 0.9, CM.malar), 0.50, 2.6, 2.0),
      cheekL: S(D(-CM.cheekX, CM.cheek), 0.30, 2.4, 2.2),
      cheekR: S(D(CM.cheekX, CM.cheek), 0.30, 2.4, 2.2),

      /* The mouth. A seam, two lips either side of it, and the muzzle they
         both sit on — lips are not stuck to a flat plane, they are wrapped
         round the front of the teeth. */
      muzzle: F(D(0, CM.mouth + 0.4), 0.60, mouthWidth * 0.55, 2.6),
      seam: F(D(0, CM.mouth), -0.52, lipHalfW, 0.55),
      /* Vermilion: each lip is as tall as it measures, centred on its own
         half of that height either side of the seam. */
      upperLip: F(D(0, CM.mouth + vermUpper * 0.5), 0.55, lipHalfW, vermUpper * 0.5),
      lowerLip: F(D(0, CM.mouth - vermLower * 0.5), 0.62, lipHalfW, vermLower * 0.5),
      /* The coloured area, which is a separate question from the shape and is
         where caricature actually hides. Sized to the lip and no larger; the
         first version let the paint mask spread 124 mm across the face. */
      vermilion: F(D(0, CM.mouth + (vermUpper - vermLower) * 0.25), 0,
        mouthWidth * 0.62, (vermUpper + vermLower) * 0.42),
      /* What is behind the lips. A mouth that opens without one is a crease
         in the chin: the jaw drops, the lips part, and there is nothing but
         more face behind them. This recesses when it opens, and is painted
         near black, so the same feature is a dark line when the mouth is shut
         and a dark opening when it is not. */
      cavity: F(D(0, CM.mouth - 0.10), 0, 1.75, 1.15),
      /* The crease under the lower lip, which is what gives a chin its shelf. */
      mentolabial: F(D(0, -8.3), -0.30, 1.7, 0.8),
      chin: F(D(0, CM.chin), chinProjection, 2.6, 1.8),

      /* Jaw corners: where the mandible turns up towards the ear. */
      jawL: S(D(-CM.jawX, CM.jaw), 0.80, 2.8, 2.4),
      jawR: S(D(CM.jawX, CM.jaw), 0.80, 2.8, 2.4),
      /* Temples, pulled in, or the skull is a ball above the eyes. */
      templeL: S(D(-CM.templeX, CM.temple), -0.45, 2.2, 2.2),
      templeR: S(D(CM.templeX, CM.temple), -0.45, 2.2, 2.2),
      /* The mound the ear attaches to, a little behind the midline. */
      earL: S(D(-7.6, CM.ear, true), 0.30, 1.6, 3.0),
      earR: S(D(7.6, CM.ear, true), 0.30, 1.6, 3.0)
    };

    R._list = Object.keys(R).filter(function (k) { return k[0] !== '_'; })
      .map(function (k) { return R[k]; });
    Object.defineProperty(spec, '_rig', { value: R });
    return R;
  }
  FACE.rig = rig;

  /* ---- the head as a radial field ------------------------------------- */

  /* `mouth` is { open, round }, both 0..1, applied while it is talking.
     Opening the mouth is a jaw rotation, so it has to move the chin and the
     whole lower face, not just part the lips — a mouth that opens without
     the jaw following is the single most common way a talking model looks
     wrong. */
  FACE.onSphere = function (out, spec, dx, dy, dz, mouth) {
    const R = rig(spec);
    const open = mouth ? mouth.open : 0;
    const round = mouth ? mouth.round : 0;
    const blink = mouth ? mouth.blink : 0;

    let r = 1.0;

    /* The back of the head is fuller than the front, because a skull is, and
       a head symmetric front to back reads as a helmet. */
    r += 0.050 * Math.pow(Math.max(0, -dz), 1.6);

    const list = R._list;
    for (let i = 0; i < list.length; i++) {
      const f = list[i];
      r += f.amp * at(f, dx, dy, dz);
    }

    /* Rounding the lips for an "oo" pushes the muzzle forward and narrows it;
       spreading for an "ee" does the opposite. Cheap, and it is most of what
       separates a mouth flapping from a mouth speaking. */
    if (open > 0.001) {
      r -= open * 0.175 * at(R.cavity, dx, dy, dz);
    }

    if (round > 0.001) {
      const m = at(R.muzzle, dx, dy, dz);
      r += round * 0.045 * m;
      r -= round * 0.030 * (at(R.cheekL, dx, dy, dz) + at(R.cheekR, dx, dy, dz));
    }

    /* A blink is the lids doing more of what they are already doing: they
       travel towards each other and forward, far enough to swallow an eyeball
       that is sitting proud of its own socket. No second piece of geometry to
       animate, which is why it can happen on a body that is also a sphere. */
    if (blink > 0.001) {
      const lids = at(R.lidUpL, dx, dy, dz) + at(R.lidUpR, dx, dy, dz)
        + at(R.lidLoL, dx, dy, dz) + at(R.lidLoR, dx, dy, dz);
      /* The socket's own dent is filled in as well, or the lids close over a
         hollow and the eye stays visible at the bottom of it. */
      const aperture = at(R.socketL, dx, dy, dz) + at(R.socketR, dx, dy, dz);
      r += blink * (0.085 * lids + 0.150 * aperture);
    }

    const s = spec.face || {};
    const scale = P.cm(1);
    const halfW = HW * scale;
    const halfH = HH * scale;
    const halfD = HD * scale;

    /* The radial field is unit-ish; the ellipsoid scaling is what turns it
       into a head rather than a face painted on a ball. */
    let x = dx * r * halfW;
    let y = dy * r * halfH;
    let z = dz * r * halfD;

    /* The jaw narrows and the crown narrows, and both of those are widths
       rather than radii — done as a radial taper they shortened the head at
       the same time, so the chin climbed and the face lost its lower third.
       A skull is widest just above the ears and comes in from there in both
       directions, and that is a scaling of x alone. */
    const down = Math.max(0, -dy), up = Math.max(0, dy);
    /* Cubed rather than squared, and gentler: a mandible keeps its width most
       of the way to the chin and then turns the corner. Squared, the jaw fell
       away from the cheekbones in a straight line and the face came to a
       point like a pear. */
    x *= 1 - 0.22 * down * down * down - 0.16 * up * up;
    z *= 1 - 0.09 * down * down;

    /* The jaw. A rotation about the condyle — roughly the ear, level with the
       top of the lobe — applied to everything below it, weighted in so the
       cheeks bend rather than shear. */
    if (open > 0.001) {
      const hingeY = 0.10 * halfH;
      const hingeZ = -0.30 * halfD;
      const w = M.clamp((hingeY - y) / (0.85 * halfH), 0, 1);
      if (w > 0) {
        const ang = open * (s.jawDrop === undefined ? 0.30 : s.jawDrop) * w * w;
        const ca = Math.cos(ang), sa = Math.sin(ang);
        const py = y - hingeY, pz = z - hingeZ;
        y = hingeY + py * ca - pz * sa;
        z = hingeZ + py * sa + pz * ca;
      }
    }

    out[0] = x; out[1] = y; out[2] = z;
    return out;
  };

  /* ---- colour ---------------------------------------------------------- */

  /* Skin is not one colour and never has been. The lips are darker and
     redder, the cheeks and the tip of the nose catch more blood, the brow and
     the jaw sit in their own shade. All of it authored in linear light,
     because the composite's 1/2.2 will lift it — a skin tone picked to look
     right in the source comes out ashy on screen, which is a specific and
     avoidable way to get a face wrong. */
  FACE.paint = function (out, spec, dx, dy, dz) {
    const R = rig(spec);
    const c = spec.face || {};
    const base = spec.color;
    const lipC = c.lipColor || [0.085, 0.028, 0.026];
    const deep = c.shadeColor || [0.038, 0.017, 0.011];
    const warm = c.warmColor || [0.155, 0.058, 0.038];

    out[0] = base[0]; out[1] = base[1]; out[2] = base[2];

    /* Warmth where the blood is: cheekbones, nose, ears, chin. */
    const flush = M.clamp(
      (at(R.malarL, dx, dy, dz) + at(R.malarR, dx, dy, dz)) * 0.55 +
      at(R.tip, dx, dy, dz) * 0.75 +
      (at(R.earL, dx, dy, dz) + at(R.earR, dx, dy, dz)) * 0.60 +
      at(R.chin, dx, dy, dz) * 0.35, 0, 1);
    M.mix3(out, out, warm, flush * 0.45);

    /* Shade in the sockets, under the brow, and along the jaw — the places a
       face is genuinely darker rather than merely unlit. */
    const shade = M.clamp(
      (at(R.socketL, dx, dy, dz) + at(R.socketR, dx, dy, dz)) * 0.85 +
      (at(R.jawL, dx, dy, dz) + at(R.jawR, dx, dy, dz)) * 0.35 +
      at(R.mentolabial, dx, dy, dz) * 0.5, 0, 1);
    M.mix3(out, out, deep, shade * 0.55);

    /* Lips. The seam is darkest, the vermilion of both lips a shade under the
       surrounding skin — on darker skin the contrast is lower than people
       tend to draw it, and overdoing it is what turns a face into a mask. */
    /* The coloured area is its own feature, sized to the lip, rather than
       whatever three overlapping gaussians happen to add up to. Measured, the
       old mask painted a patch 124 mm across and 58 mm tall onto a face
       155 mm wide — most of the lower half of it — which is precisely the
       shape of the thing this must not be.

       Vermilion also has an edge, which is what the word means; blended as a
       smooth falloff the lips dissolve into the chin and stop being a
       feature at all. So: a hard-ish edge over a small area, at low contrast,
       rather than a soft one over a large area. */
    const lip = M.smoothstep(0.30, 0.72, at(R.vermilion, dx, dy, dz));
    M.mix3(out, out, lipC, lip * (c.lipAmount === undefined ? 0.34 : c.lipAmount));

    /* And the dark behind them. */
    const inner = M.smoothstep(0.20, 0.66, at(R.cavity, dx, dy, dz));
    M.mix3(out, out, c.mouthColor || [0.007, 0.002, 0.003], inner * 0.96);

    /* Eyebrows are painted, not modelled: a brow is hair lying flat on skin,
       and a geometric ridge with no colour reads as a swelling. */
    const brow = M.clamp(
      browMask(R.browL, dx, dy, dz) + browMask(R.browR, dx, dy, dz), 0, 1);
    M.mix3(out, out, c.hairColor || [0.012, 0.009, 0.008], brow * 0.95);

    return out;
  };

  /* The brow itself is wider and thinner than the ridge it sits on, and it
     stops at the inner corner rather than meeting its twin. */
  function browMask(f, dx, dy, dz) {
    const c = f.c;
    const d = dx * c[0] + dy * c[1] + dz * c[2];
    if (d <= 0.2) return 0;
    const ex = dx - c[0] * d, ey = dy - c[1] * d, ez = dz - c[2] * d;
    const u = ex * f.t[0] + ey * f.t[1] + ez * f.t[2];
    const v = ex * f.b[0] + ey * f.b[1] + ez * f.b[2];
    /* Inner end squared off, outer end tapering away. */
    const along = u * (c[0] < 0 ? -1 : 1);
    const taper = M.clamp(1 - Math.max(0, along - 0.06) * 7.0, 0, 1);
    /* 2.4 cm out from its own centre, 0.5 cm top to bottom. */
    const e = wide(2.4) * u * u + fine(0.5) * v * v;
    if (e > 10) return 0;
    return Math.exp(-e) * d * taper;
  }

  /* ---- the parts a radial field cannot express ------------------------- */

  /* Three of them, and each for a different reason. An eyeball is a second
     surface along the same ray as the socket it sits in. An ear is a thin fin
     standing off the skull. Hair is its own volume with its own silhouette.
     Everything else on this head is the body itself. */

  const MAT = { SKIN: 0, SCLERA: 1, GLOSS: 2, HAIR: 3, GLINT: 4 };

  function ellipsoid(unit, centre, axes, radii) {
    const n = unit.positions.length / 3;
    const out = new Float32Array(n * 3);
    for (let i = 0; i < n; i++) {
      const x = unit.positions[i * 3] * radii[0];
      const y = unit.positions[i * 3 + 1] * radii[1];
      const z = unit.positions[i * 3 + 2] * radii[2];
      out[i * 3] = centre[0] + axes[0][0] * x + axes[1][0] * y + axes[2][0] * z;
      out[i * 3 + 1] = centre[1] + axes[0][1] * x + axes[1][1] * y + axes[2][1] * z;
      out[i * 3 + 2] = centre[2] + axes[0][2] * x + axes[1][2] * y + axes[2][2] * z;
    }
    return out;
  }

  /* Where the head's surface actually is along a direction, and which way it
     faces there. The head is scaled per axis after the radial sculpt, so the
     surface point is NOT on the ray through `dir` — taking the real point and
     stepping along its own outward direction is what seats an eye correctly
     instead of leaving it hovering. */
  function seat(spec, dx, dy, dz, inset) {
    const d = M.normalized(dx, dy, dz);
    const s = FACE.onSphere([0, 0, 0], spec, d[0], d[1], d[2], null);
    const outward = M.norm3([0, 0, 0], s);
    return {
      c: M.addScaled3([0, 0, 0], s, outward, inset),
      out: outward,
      frame: M.frame(outward)
    };
  }

  /* Cheap cellular noise: distance to the nearest of one feature point per
     grid cell. Two decorrelated fracts of one hash place the point, so a
     sample costs 27 hashes rather than 81.

     Value noise cannot do hair. Hair is not smooth undulation, it is a field
     of discrete rounded clumps packed against each other, and that is exactly
     what the distance to a scattered point set looks like. */
  function hash3(i, j, k) {
    let h = (i * 374761393 + j * 668265263 + k * 1274126177) | 0;
    h = Math.imul(h ^ (h >>> 13), 1274126177);
    return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
  }
  function worley(x, y, z) {
    const ix = Math.floor(x), iy = Math.floor(y), iz = Math.floor(z);
    let best = 9;
    for (let a = -1; a <= 1; a++) {
      for (let b = -1; b <= 1; b++) {
        for (let c = -1; c <= 1; c++) {
          const gx = ix + a, gy = iy + b, gz = iz + c;
          const h = hash3(gx, gy, gz);
          const px = gx + h;
          const py = gy + (h * 57.31) % 1;
          const pz = gz + (h * 131.77) % 1;
          const ux = px - x, uy = py - y, uz = pz - z;
          const d = ux * ux + uy * uy + uz * uz;
          if (d < best) best = d;
        }
      }
    }
    return Math.sqrt(best);
  }
  /* 1 at the middle of a clump, 0 in the gap between clumps. */
  function clump(x, y, z) {
    const t = M.clamp(1 - worley(x, y, z) / 0.62, 0, 1);
    /* Rounded, not conical. The distance to a point falls off linearly, so
       used raw it builds a cone on every feature and the head grows spines. */
    return t * t * (3 - 2 * t);
  }

  /* Hair as one closed shell rather than a heap of blobs: no intersecting
     spheres to catch the light along their seams, and the edge can be as soft
     as the function that makes it. Over the face the shell's radius drops
     below the head's, so it is simply buried there and the hairline is
     wherever it surfaces.

     What it is *not* is the head plus a constant thickness. That was the
     first version and it is why it read as a swimming cap: offsetting an egg
     gives a slightly larger egg, and an afro is not the shape of the skull
     underneath it. A picked afro is close to its own sphere — the hair stands
     out from the scalp by however much it has grown and then holds a round
     silhouette almost independent of the head inside it. So the shell aims at
     a sphere of its own, fitted to stand `hairMm` off the crown, and blends
     to the scalp at the hairline where the hair is genuinely short. */
  function hairShell(spec) {
    const f = spec.face || {};
    const cm = P.cm(1);
    const stand = (f.hairMm === undefined ? 55 : f.hairMm) * 0.1;    /* cm */

    /* Fit the sphere: it must reach `stand` above the crown and a little less
       than that out at the sides, because an afro is taller than it is wide. */
    const topY = HH + stand;
    const sideR = HW + stand * 0.90;
    const cy = (topY * topY - sideR * sideR) / (2 * topY);
    const Rs = topY - cy;
    const cz = -0.6;                    /* sits a little back off the face */
    const C = [0, cy * cm, cz * cm], Rw = Rs * cm;
    const CC = C[0] * C[0] + C[1] * C[1] + C[2] * C[2] - Rw * Rw;

    /* At subdiv 6 the vertices are about 2.4 mm apart on this shell, which is
       what lets an 8 mm clump exist at all — and the clumps breaking the
       outline is most of the difference between hair and a helmet. */
    const unit = G.icosphere(6);
    const n = unit.positions.length / 3;
    const pos = new Float32Array(n * 3);
    const col = new Float32Array(n * 3);
    const lift = new Float32Array(n);
    const base = f.hairColor || [0.011, 0.008, 0.007];
    const s = [0, 0, 0];

    for (let i = 0; i < n; i++) {
      const dx = unit.positions[i * 3], dy = unit.positions[i * 3 + 1],
        dz = unit.positions[i * 3 + 2];
      FACE.onSphere(s, spec, dx, dy, dz, null);
      const headR = Math.hypot(s[0], s[1], s[2]);

      /* Where the sphere is, along this ray. */
      const b = C[0] * dx + C[1] * dy + C[2] * dz;
      const disc = b * b - CC;
      const afroR = disc > 0 ? b + Math.sqrt(disc) : headR;

      /* The hairline: 7.7 cm up at the forehead, dropping past the temples
         and further down the nape. Plus two things a straight line does not
         have — the temples recede, and no hairline anywhere is a smooth
         curve, so it is roughened by the same noise that makes the clumps. */
      const temple = M.smoothstep(0.45, 0.95, Math.abs(dx)) * Math.max(0, dz);
      /* Barely any wobble on the *line* itself. Moving the hairline is a very
         blunt instrument: in the transition band a few millimetres of shift
         swings the surface most of the way from scalp to dome, so noise on
         the line came out as radial tongues — a mane of spokes round the
         face. The edge gets broken by the clumps instead, below. */
      const wob = (clump(dx * 17.0, dy * 17.0, dz * 17.0) - 0.5) * 0.10;
      const line = (2.0 + 5.4 * dz + 0.7 * temple + wob) / HH;
      /* Nearly a step. The shell has to climb four and a half centimetres
         from the scalp to the dome, and *any* band wide enough to see that
         climb happen reads as a smooth funnel round the face — a collar,
         which is the one thing this cannot be. Done over three millimetres
         of head height it is a cliff instead, and almost all of the cliff is
         inside the head where nobody can see it. What is left outside is a
         crisp hairline with clumps already on it. */
      const k = M.smoothstep(0, 1, M.clamp((dy - line) / 0.030 + 0.5, 0, 1));

      /* Tight coils: a dense field of small round clumps, with a coarser
         lumpiness under them so the mass is not evenly stippled. Both ride on
         `k`, so the hairline stays smooth while the crown is textured. */
      const px = dx * afroR, py = dy * afroR, pz = dz * afroR;
      const fine = clump(px * 15.0, py * 15.0, pz * 15.0);
      const coarse = clump(px * 6.4 + 11, py * 6.4 + 5, pz * 6.4 - 7);
      /* In centimetres, then converted once. Written without that conversion
         the first time, which put a four *centimetre* spike on every clump
         and turned the head into a sea urchin. */
      const bumpCm = ((fine - 0.5) * 0.115 + (coarse - 0.5) * 0.065) * stand;

      /* The clumps come in well before the hair reaches full depth, so the
         hairline is textured rather than a clean curve. Tied to `k` directly
         they faded out exactly where the edge is, which is the one place the
         eye looks for them. */
      const tex = M.clamp(k * 3.2, 0, 1);
      const r = headR + Math.pow(k, 1.35) * Math.max(0, afroR - headR)
        - (1 - k) * (0.9 * stand * cm + 0.02);

      pos[i * 3] = dx * r; pos[i * 3 + 1] = dy * r; pos[i * 3 + 2] = dz * r;
      lift[i] = tex * bumpCm * cm;

      /* Hair is dark, but not evenly dark. What reads is the shadow packed
         into the gaps between the clumps — occlusion baked where the surface
         is already low, which costs nothing and is most of what stops a dark
         mass looking like moulded rubber. Hair this dark also wants a
         *narrow* range: opened up, the clump tops went grey and the whole
         mass read as steel wool. */
      const lit = 0.48 + 0.38 * M.clamp(fine * 0.70 + coarse * 0.45, 0, 1);
      col[i * 3] = base[0] * lit;
      col[i * 3 + 1] = base[1] * lit;
      col[i * 3 + 2] = base[2] * lit;
    }

    /* Second pass: push the clumps out along the surface's own normal rather
       than along the ray from the middle of the head.

       This is the difference between coils and a comb-over. Where the shell
       is steep — the band just above the hairline, where it climbs from the
       scalp to the full depth of the hair — a radial displacement runs almost
       *along* the surface instead of out of it, so the clumps there stretched
       into streaks and the face wore a slicked collar. Along the normal they
       are clumps everywhere, which is what they are. */
    const nrm = G.computeNormals(pos, unit.indices, n);
    for (let i = 0; i < n; i++) {
      const t = lift[i];
      if (t !== 0) {
        pos[i * 3] += nrm[i * 3] * t;
        pos[i * 3 + 1] += nrm[i * 3 + 1] * t;
        pos[i * 3 + 2] += nrm[i * 3 + 2] * t;
      }

     middle lofts between the two radii — a plain cylinder with ball ends

     along its whole length. */
  function capsule(unit, ax, ay, az, bx, by, bz, r0, r1, flat) {
    const fz = flat === undefined ? 1 : flat;

      const c = t * len + y * r;
      const rz = r * fz;

      out[i * 3 + 1] = ay + u[1] * x * r + v[1] * z * rz + w[1] * c;
      out[i * 3 + 2] = az + u[2] * x * r + v[2] * z * rz + w[2] * c;

     60, and each divides into phalanges at roughly 45 / 27 / 28 per cent.

     glove is that **a relaxed hand is never flat**. Every joint sits at some
     flexion even at rest — about 20 degrees at the knuckle, 40 at the middle
     joint, 15 at the last — and the amount increases from index to little, so
     the fingertips fall along a curve rather than a line. Flat fingers are
     what shop mannequins have and the reason they look dead. */
  FACE.hand = function (spec, side) {
    const parts = { pos: [], col: [], mat: [], idx: [] };
    const seg = G.icosphere(2);
    const ball = G.icosphere(2);
    const mm = 0.01;                       /* 1 mm in world units */
    const f = spec.face || {};
    const skin = spec.color;
    /* Palms and the underside of the fingers are markedly lighter than the
       back of the hand. True of everyone, and leaving it out is most of why
       a monochrome hand reads as a prop. */
    const palmar = f.palmColor ||
      [skin[0] * 1.25 + 0.016, skin[1] * 1.50 + 0.013, skin[2] * 1.65 + 0.009];
    const nail = f.nailColor ||
      [skin[0] * 1.7 + 0.055, skin[1] * 2.0 + 0.040, skin[2] * 2.1 + 0.034];

      const base = parts.pos.length / 3;

      { x: 9.5, y: 107, z: 4, len: 82, r: 11.0, flex: [0.26, 0.56, 0.22] }, /* middle */

      normals: G.computeNormals(positions, indices, positions.length / 3),
      colors: new Float32Array(parts.col),
      mats: new Float32Array(parts.mat),

    const dyn = new Float32Array(n * 7);
    const sta = new Float32Array(n * 4);
    for (let i = 0; i < n; i++) {
      dyn[i * 7] = mesh.positions[i * 3];
      dyn[i * 7 + 1] = mesh.positions[i * 3 + 1];
      dyn[i * 7 + 2] = mesh.positions[i * 3 + 2];
      dyn[i * 7 + 3] = mesh.normals[i * 3];
      dyn[i * 7 + 4] = mesh.normals[i * 3 + 1];
      dyn[i * 7 + 5] = mesh.normals[i * 3 + 2];
      dyn[i * 7 + 6] = 0;
      sta[i * 4] = mesh.colors[i * 3];
      sta[i * 4 + 1] = mesh.colors[i * 3 + 1];
      sta[i * 4 + 2] = mesh.colors[i * 3 + 2];
      sta[i * 4 + 3] = mesh.mats[i];
    }

    const vao = gl.createVertexArray();
    gl.bindVertexArray(vao);

    const vb = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, vb);
    gl.bufferData(gl.ARRAY_BUFFER, dyn, gl.STATIC_DRAW);
    gl.enableVertexAttribArray(S.LOC.POS);
    gl.vertexAttribPointer(S.LOC.POS, 3, gl.FLOAT, false, 28, 0);
    gl.enableVertexAttribArray(S.LOC.NOR);
    gl.vertexAttribPointer(S.LOC.NOR, 3, gl.FLOAT, false, 28, 12);
    gl.enableVertexAttribArray(S.LOC.STRETCH);
    gl.vertexAttribPointer(S.LOC.STRETCH, 1, gl.FLOAT, false, 28, 24);

    const cb = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, cb);
    gl.bufferData(gl.ARRAY_BUFFER, sta, gl.STATIC_DRAW);
    gl.enableVertexAttribArray(S.LOC.COL);
    gl.vertexAttribPointer(S.LOC.COL, 3, gl.FLOAT, false, 16, 0);
    gl.enableVertexAttribArray(S.LOC.MAT);
    gl.vertexAttribPointer(S.LOC.MAT, 1, gl.FLOAT, false, 16, 12);

    const ib = gl.createBuffer();
    gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, ib);
    gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, mesh.indices, gl.STATIC_DRAW);
    gl.bindVertexArray(null);

    return {
      vao: vao, count: mesh.indices.length, buffers: [vb, cb, ib],
      heightUnits: mesh.heightUnits, radiusUnits: mesh.radiusUnits, topUnits: mesh.topUnits
    };
  };

  Renderer.prototype.destroyProp = function (prop) {
    const gl = this.gl;
    if (!prop) return;
    gl.deleteVertexArray(prop.vao);
    prop.buffers.forEach(function (b) { gl.deleteBuffer(b); });
  };

  Renderer.prototype.drawProps = function (props, useProgram) {
    const gl = this.gl;
    if (!props || !props.length) return;
    for (let i = 0; i < props.length; i++) {
      const p = props[i];
      if (!p.handle) continue;
      gl.uniformMatrix4fv(useProgram.u.uModel, false, p.matrix);
      gl.uniform1f(useProgram.u.uSkin, p.skin || 0);
      gl.uniform1f(useProgram.u.uSkinAmt, p.skinAmt || 0.35);
      gl.uniform1f(useProgram.u.uSkinShade, p.skinShade || 0.30);
      gl.bindVertexArray(p.handle.vao);
      gl.drawElements(gl.TRIANGLES, p.handle.count, gl.UNSIGNED_INT, 0);
    }
  };

  /* ---- character mesh --------------------------------------------------- */

  Renderer.prototype.setMesh = function (mesh) {
    const gl = this.gl;

    /* Switching quality rebuilds the mesh; release the previous GPU objects
       so repeated preset changes do not leak buffers. */
    if (this.meshVAOs) {
      this.meshVAOs.forEach(function (v) { gl.deleteVertexArray(v); });
      this.dynBuffers.forEach(function (b) { gl.deleteBuffer(b); });
      gl.deleteBuffer(this.staticBuffer);
      gl.deleteBuffer(this.colorBuffer);
      gl.deleteBuffer(this.indexBuffer);
    }

    this.mesh = mesh;
    this.vertexCount = mesh.total;
    this.indexCount = mesh.indices.length;
    this.dyn = new Float32Array(mesh.total * 7);

    const staticData = new Float32Array(mesh.total * 4);
    for (let i = 0; i < mesh.total; i++) {
      staticData[i * 4] = mesh.colors[i * 3];
      staticData[i * 4 + 1] = mesh.colors[i * 3 + 1];
      staticData[i * 4 + 2] = mesh.colors[i * 3 + 2];
      staticData[i * 4 + 3] = mesh.mats[i];
    }
    this.staticBuffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, this.staticBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, staticData, gl.STATIC_DRAW);

    /* Colour lives in its own buffer rather than in the per-frame stream:
       it only changes while a form is being painted on, which is a handful of
       frames per morph, and streaming it every frame to say nothing would cost
       a third again on the hot upload. */
    const initial = new Float32Array(mesh.total * 3);
    for (let i = 0; i < mesh.total * 3; i++) initial[i] = mesh.colors[i];
    this.colorBuffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, this.colorBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, initial, gl.DYNAMIC_DRAW);

    this.indexBuffer = gl.createBuffer();
    gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, this.indexBuffer);
    gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, mesh.indices, gl.STATIC_DRAW);

    /* Two interleaved streaming buffers, alternated per frame: writing the
       buffer the GPU is still reading from is the classic way to stall a
       driver, and at 120 Hz there is no slack to absorb that. */
    const ds = 7 * 4;
    this.dynBuffers = [];
    this.meshVAOs = [];
    for (let i = 0; i < 2; i++) {
      const vao = gl.createVertexArray();
      gl.bindVertexArray(vao);

      const buf = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, buf);
      gl.bufferData(gl.ARRAY_BUFFER, this.dyn.byteLength, gl.STREAM_DRAW);
      gl.enableVertexAttribArray(S.LOC.POS);
      gl.vertexAttribPointer(S.LOC.POS, 3, gl.FLOAT, false, ds, 0);
      gl.enableVertexAttribArray(S.LOC.NOR);
      gl.vertexAttribPointer(S.LOC.NOR, 3, gl.FLOAT, false, ds, 12);
      gl.enableVertexAttribArray(S.LOC.STRETCH);
      gl.vertexAttribPointer(S.LOC.STRETCH, 1, gl.FLOAT, false, ds, 24);

      gl.bindBuffer(gl.ARRAY_BUFFER, this.colorBuffer);
      gl.enableVertexAttribArray(S.LOC.COL);
      gl.vertexAttribPointer(S.LOC.COL, 3, gl.FLOAT, false, 12, 0);

      gl.bindBuffer(gl.ARRAY_BUFFER, this.staticBuffer);
      gl.enableVertexAttribArray(S.LOC.MAT);
      gl.vertexAttribPointer(S.LOC.MAT, 1, gl.FLOAT, false, 16, 12);

      gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, this.indexBuffer);

      this.dynBuffers.push(buf);
      this.meshVAOs.push(vao);
    }
    this.dynIndex = 0;
    gl.bindVertexArray(null);
  };

  /* Repaint the body. Only called when the paint actually changes. */
  Renderer.prototype.updateColors = function (colors) {
    const gl = this.gl;
    gl.bindBuffer(gl.ARRAY_BUFFER, this.colorBuffer);
    gl.bufferSubData(gl.ARRAY_BUFFER, 0, colors);
  };

  /* Interleave the solver output and stream it into the next buffer. */
  Renderer.prototype.updateDynamic = function (pos, nrm, stretch) {
    const gl = this.gl;
    const dyn = this.dyn;
    const n = this.vertexCount;
    for (let i = 0; i < n; i++) {
      const s = i * 7, p = i * 3;
      dyn[s] = pos[p];
      dyn[s + 1] = pos[p + 1];
      dyn[s + 2] = pos[p + 2];
      dyn[s + 3] = nrm[p];
      dyn[s + 4] = nrm[p + 1];
      dyn[s + 5] = nrm[p + 2];
      dyn[s + 6] = stretch[i];
    }
    this.dynIndex ^= 1;
    gl.bindBuffer(gl.ARRAY_BUFFER, this.dynBuffers[this.dynIndex]);
    gl.bufferSubData(gl.ARRAY_BUFFER, 0, dyn);
  };

  /* ---- render targets ---------------------------------------------------- */

  function makeTex(gl, w, h, internal, filter) {
    const t = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, t);
    gl.texStorage2D(gl.TEXTURE_2D, 1, internal, w, h);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, filter);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, filter);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    return t;
  }

  Renderer.prototype._releaseTargets = function () {
    const gl = this.gl;
    ['scene', 'ms', 'bloomA', 'bloomB'].forEach(function (k) {
      if (this.fb[k]) { gl.deleteFramebuffer(this.fb[k]); this.fb[k] = null; }
    }, this);
    ['scene', 'bloomA', 'bloomB'].forEach(function (k) {
      if (this.tex[k]) { gl.deleteTexture(this.tex[k]); this.tex[k] = null; }
    }, this);
    ['sceneDepth', 'msColor', 'msDepth'].forEach(function (k) {
      if (this.rb[k]) { gl.deleteRenderbuffer(this.rb[k]); this.rb[k] = null; }
    }, this);
  };

  Renderer.prototype.setShadowSize = function (size) {
    const gl = this.gl;
    if (this.shadowSize === size) return;
    if (this.fb.shadow) { gl.deleteFramebuffer(this.fb.shadow); this.fb.shadow = null; }
    if (this.tex.shadow) { gl.deleteTexture(this.tex.shadow); this.tex.shadow = null; }
    this.shadowSize = size;

    const t = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, t);
    gl.texStorage2D(gl.TEXTURE_2D, 1, gl.DEPTH_COMPONENT24, size, size);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_COMPARE_MODE, gl.COMPARE_REF_TO_TEXTURE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_COMPARE_FUNC, gl.LEQUAL);
    this.tex.shadow = t;

    const f = gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER, f);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.DEPTH_ATTACHMENT, gl.TEXTURE_2D, t, 0);
    gl.drawBuffers([gl.NONE]);
    gl.readBuffer(gl.NONE);
    this.fb.shadow = f;
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  };

  /* Allocate the scene chain at `w` x `h`. Returns true when reallocation
     actually happened. */
  Renderer.prototype.setRenderSize = function (w, h, samples) {
    const gl = this.gl;
    w = Math.max(16, Math.min(w | 0, this.maxTexture));
    h = Math.max(16, Math.min(h | 0, this.maxTexture));
    samples = Math.min(samples | 0, this.maxSamples);
    if (w === this.renderW && h === this.renderH && samples === this.samples) return false;

    this._releaseTargets();
    this.renderW = w;
    this.renderH = h;
    this.samples = samples;

    const colorFmt = this.hdr ? gl.RGBA16F : gl.RGBA8;

    this.tex.scene = makeTex(gl, w, h, colorFmt, gl.LINEAR);
    this.fb.scene = gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER, this.fb.scene);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, this.tex.scene, 0);
    if (samples === 0) {
      this.rb.sceneDepth = gl.createRenderbuffer();
      gl.bindRenderbuffer(gl.RENDERBUFFER, this.rb.sceneDepth);
      gl.renderbufferStorage(gl.RENDERBUFFER, gl.DEPTH_COMPONENT24, w, h);
      gl.framebufferRenderbuffer(gl.FRAMEBUFFER, gl.DEPTH_ATTACHMENT, gl.RENDERBUFFER, this.rb.sceneDepth);
    }

    if (samples > 0) {
      this.rb.msColor = gl.createRenderbuffer();
      gl.bindRenderbuffer(gl.RENDERBUFFER, this.rb.msColor);
      gl.renderbufferStorageMultisample(gl.RENDERBUFFER, samples, colorFmt, w, h);
      this.rb.msDepth = gl.createRenderbuffer();
      gl.bindRenderbuffer(gl.RENDERBUFFER, this.rb.msDepth);
      gl.renderbufferStorageMultisample(gl.RENDERBUFFER, samples, gl.DEPTH_COMPONENT24, w, h);
      this.fb.ms = gl.createFramebuffer();
      gl.bindFramebuffer(gl.FRAMEBUFFER, this.fb.ms);
      gl.framebufferRenderbuffer(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.RENDERBUFFER, this.rb.msColor);
      gl.framebufferRenderbuffer(gl.FRAMEBUFFER, gl.DEPTH_ATTACHMENT, gl.RENDERBUFFER, this.rb.msDepth);
      if (gl.checkFramebufferStatus(gl.FRAMEBUFFER) !== gl.FRAMEBUFFER_COMPLETE) {
        /* Fall back to single-sampled rather than failing outright. */
        gl.deleteFramebuffer(this.fb.ms);
        this.fb.ms = null;
        this.samples = 0;
        this.rb.sceneDepth = gl.createRenderbuffer();
        gl.bindRenderbuffer(gl.RENDERBUFFER, this.rb.sceneDepth);
        gl.renderbufferStorage(gl.RENDERBUFFER, gl.DEPTH_COMPONENT24, w, h);
        gl.bindFramebuffer(gl.FRAMEBUFFER, this.fb.scene);
        gl.framebufferRenderbuffer(gl.FRAMEBUFFER, gl.DEPTH_ATTACHMENT, gl.RENDERBUFFER, this.rb.sceneDepth);
      }
    }

    const bw = Math.max(8, w >> 1), bh = Math.max(8, h >> 1);
    this.bloomW = bw; this.bloomH = bh;
    this.tex.bloomA = makeTex(gl, bw, bh, colorFmt, gl.LINEAR);
    this.tex.bloomB = makeTex(gl, bw, bh, colorFmt, gl.LINEAR);
    this.fb.bloomA = gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER, this.fb.bloomA);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, this.tex.bloomA, 0);
    this.fb.bloomB = gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER, this.fb.bloomB);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, this.tex.bloomB, 0);

    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    return true;
  };

  /* ---- GPU timing --------------------------------------------------------- */

  Renderer.prototype.beginTimer = function () {
    const gl = this.gl, ext = this.extTimer;
    if (!ext) return;
    if (this.timerQueries.length < 4) {
      for (let i = this.timerQueries.length; i < 4; i++) {
        this.timerQueries.push({ q: gl.createQuery(), pending: false });
      }
    }
    const slot = this.timerQueries[this.timerIndex];
    if (slot.pending) return;
    gl.beginQuery(ext.TIME_ELAPSED_EXT, slot.q);
    slot.pending = true;
    this._timerActive = true;
  };

  Renderer.prototype.endTimer = function () {
    const gl = this.gl, ext = this.extTimer;
    if (!ext || !this._timerActive) return;
    gl.endQuery(ext.TIME_ELAPSED_EXT);
    this._timerActive = false;
    this.timerIndex = (this.timerIndex + 1) % this.timerQueries.length;

    const disjoint = gl.getParameter(ext.GPU_DISJOINT_EXT);
    for (let i = 0; i < this.timerQueries.length; i++) {
      const slot = this.timerQueries[i];
      if (!slot.pending) continue;
      if (disjoint) { slot.pending = false; continue; }
      if (gl.getQueryParameter(slot.q, gl.QUERY_RESULT_AVAILABLE)) {
        const ns = gl.getQueryParameter(slot.q, gl.QUERY_RESULT);
        slot.pending = false;
        const ms = ns / 1e6;
        this.gpuTimeMs = this.gpuTimeMs ? this.gpuTimeMs * 0.85 + ms * 0.15 : ms;
      }
    }
  };

  /* ---- frame -------------------------------------------------------------- */

  Renderer.prototype.drawFullscreen = function () {
    const gl = this.gl;
    gl.bindVertexArray(this.emptyVAO);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  };

  Renderer.prototype.renderShadow = function (state) {
    const gl = this.gl;
    gl.bindFramebuffer(gl.FRAMEBUFFER, this.fb.shadow);
    gl.viewport(0, 0, this.shadowSize, this.shadowSize);
    gl.enable(gl.DEPTH_TEST);
    gl.depthMask(true);
    gl.depthFunc(gl.LEQUAL);
    gl.clear(gl.DEPTH_BUFFER_BIT);

    const pr = this.prog.depth;
    gl.useProgram(pr.p);
    gl.uniformMatrix4fv(pr.u.uModel, false, state.model);
    gl.uniformMatrix4fv(pr.u.uLightVP, false, state.lightVP);
    /* A cloud casting a hard-edged shadow is the one thing that would give
       the gas away, so above halfway it stops casting one. */
    if (!(state.gas > 0.5)) {
      gl.bindVertexArray(this.meshVAOs[this.dynIndex]);
      gl.drawElements(gl.TRIANGLES, this.indexCount, gl.UNSIGNED_INT, 0);
    }
    this.drawProps(state.props, pr);
    this.drawProps(state.attached, pr);
  };

  Renderer.prototype.renderScene = function (state) {
    const gl = this.gl;
    const target = this.samples > 0 ? this.fb.ms : this.fb.scene;
    gl.bindFramebuffer(gl.FRAMEBUFFER, target);
    gl.viewport(0, 0, this.renderW, this.renderH);
    gl.disable(gl.BLEND);
    gl.enable(gl.DEPTH_TEST);
    gl.depthMask(true);
    gl.clearColor(0, 0, 0, 1);
    gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);

    /* background */
    let pr = this.prog.bg;
    gl.useProgram(pr.p);
    gl.disable(gl.DEPTH_TEST);
    gl.depthMask(false);
    gl.uniform3fv(pr.u.uRayF, state.rayF);
    gl.uniform3fv(pr.u.uRayR, state.rayR);
    gl.uniform3fv(pr.u.uRayU, state.rayU);
    gl.uniform1f(pr.u.uTime, state.time);
    gl.uniform3fv(pr.u.uTopColor, state.sky.top);
    gl.uniform3fv(pr.u.uBotColor, state.sky.bottom);
    gl.uniform3fv(pr.u.uGlowColor, state.sky.glowColor);
    gl.uniform1f(pr.u.uGlow, state.sky.glow);
    this.drawFullscreen();

    gl.enable(gl.DEPTH_TEST);
    gl.depthMask(true);

    /* floor */
    if (state.showFloor) {
      pr = this.prog.floor;
      gl.useProgram(pr.p);
      gl.uniformMatrix4fv(pr.u.uViewProj, false, state.viewProj);
      gl.uniformMatrix4fv(pr.u.uLightVP, false, state.lightVP);
      gl.uniform3fv(pr.u.uEye, state.eye);
      gl.uniform3fv(pr.u.uGridColor, state.floor.grid);
      gl.uniform3fv(pr.u.uFloorColor, state.floor.base);
      gl.uniform1f(pr.u.uTime, state.time);
      gl.uniform1f(pr.u.uFade, state.floorFade || 26);
      gl.uniform3fv(pr.u.uPoolPos, state.poolPos);
      gl.uniform3fv(pr.u.uPoolColor, state.poolColor);
      gl.uniform2f(pr.u.uShadowTexel, 1 / this.shadowSize, 1 / this.shadowSize);
      gl.activeTexture(gl.TEXTURE0);
      gl.bindTexture(gl.TEXTURE_2D, this.tex.shadow);
      gl.uniform1i(pr.u.uShadow, 0);
      gl.bindVertexArray(this.floorVAO);
      gl.drawArrays(gl.TRIANGLES, 0, 6);
    }

    /* character */
    pr = this.prog.surface;
    gl.useProgram(pr.p);
    gl.uniformMatrix4fv(pr.u.uModel, false, state.model);
    gl.uniformMatrix4fv(pr.u.uViewProj, false, state.viewProj);
    gl.uniformMatrix4fv(pr.u.uLightVP, false, state.lightVP);
    gl.uniform3fv(pr.u.uEye, state.eye);
    const L = state.light;
    gl.uniform3fv(pr.u.uLightDir, L.dir);
    gl.uniform3fv(pr.u.uLightColor, L.color);
    gl.uniform3fv(pr.u.uFillDir, L.fillDir);
    gl.uniform3fv(pr.u.uFillColor, L.fillColor);
    gl.uniform3fv(pr.u.uAmbSky, L.ambSky);
    gl.uniform3fv(pr.u.uAmbGround, L.ambGround);
    gl.uniform3fv(pr.u.uRimColor, L.rim);
    gl.uniform3fv(pr.u.uSSSColor, L.sss);
    gl.uniform3fv(pr.u.uStretchTint, L.stretchTint);
    gl.uniform3fv(pr.u.uStretchGlow, L.stretchGlow);
    gl.uniform1f(pr.u.uTime, state.time);
    gl.uniform1f(pr.u.uHighlightAmount, state.highlight);
    gl.uniform3fv(pr.u.uFocusDir, state.focusDir);
    gl.uniform3fv(pr.u.uFocusColor, state.being.focus);
    gl.uniform3fv(pr.u.uCoreColor, state.being.core);
    gl.uniform1f(pr.u.uVoice, state.voice);
    gl.uniform1f(pr.u.uMorph, state.morph);
    gl.uniform3fv(pr.u.uFormColor, state.formColor);
    gl.uniform2f(pr.u.uShadowTexel, 1 / this.shadowSize, 1 / this.shadowSize);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, this.tex.shadow);
    gl.uniform1i(pr.u.uShadow, 0);

    /* Vapour accumulates instead of occluding: additive, no depth write, and
       with culling off it is drawn through both faces, which is what makes it
       thicken toward the silhouette on its own. */
    const gas = state.gas || 0;
    gl.uniform1f(pr.u.uGas, gas);
    gl.uniform1f(pr.u.uBoil, state.boil || 0);
    gl.uniform1f(pr.u.uInert, state.inert || 0);
    gl.uniform1f(pr.u.uSkin, state.skin || 0);
    gl.uniform1f(pr.u.uSkinAmt, state.skinAmt || 0.35);
    gl.uniform1f(pr.u.uSkinShade, state.skinShade || 0.30);
    gl.uniform1f(pr.u.uPaint, state.paint ? 1 : 0);
    if (gas > 0.01) {
      gl.enable(gl.BLEND);
      gl.blendFunc(gl.SRC_ALPHA, gl.ONE);
      gl.depthMask(false);
    }
    gl.bindVertexArray(this.meshVAOs[this.dynIndex]);
    gl.drawElements(gl.TRIANGLES, this.indexCount, gl.UNSIGNED_INT, 0);
    if (gas > 0.01) {
      gl.disable(gl.BLEND);
      gl.depthMask(true);
    }
    /* Props share this program, and the billow in the vertex shader is not
       material-gated, so it has to be switched off before they are drawn. */
    gl.uniform1f(pr.u.uGas, 0);
    gl.uniform1f(pr.u.uBoil, 0);
    gl.uniform1f(pr.u.uPaint, 0);

    this.drawProps(state.props, pr);
    this.drawProps(state.attached, pr);
    this.drawProps(state.overlay, pr);

    if (this.samples > 0) {
      gl.bindFramebuffer(gl.READ_FRAMEBUFFER, this.fb.ms);
      gl.bindFramebuffer(gl.DRAW_FRAMEBUFFER, this.fb.scene);
      gl.blitFramebuffer(0, 0, this.renderW, this.renderH,
        0, 0, this.renderW, this.renderH, gl.COLOR_BUFFER_BIT, gl.NEAREST);
      gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    }
  };

  Renderer.prototype.renderPost = function (state) {
    const gl = this.gl;
    gl.disable(gl.DEPTH_TEST);
    gl.depthMask(false);
    gl.disable(gl.BLEND);

    if (state.bloom > 0) {
      gl.viewport(0, 0, this.bloomW, this.bloomH);
      let pr = this.prog.bright;
      gl.bindFramebuffer(gl.FRAMEBUFFER, this.fb.bloomA);
      gl.useProgram(pr.p);
      gl.activeTexture(gl.TEXTURE0);
      gl.bindTexture(gl.TEXTURE_2D, this.tex.scene);
      gl.uniform1i(pr.u.uScene, 0);
      gl.uniform1f(pr.u.uThreshold, state.bloomThreshold);
      gl.uniform1f(pr.u.uKnee, 0.55);
      this.drawFullscreen();

      pr = this.prog.blur;
      gl.useProgram(pr.p);
      gl.uniform1i(pr.u.uSource, 0);
      for (let pass = 0; pass < state.bloomPasses; pass++) {
        gl.bindFramebuffer(gl.FRAMEBUFFER, this.fb.bloomB);
        gl.bindTexture(gl.TEXTURE_2D, this.tex.bloomA);
        gl.uniform2f(pr.u.uDirection, 1 / this.bloomW, 0);
        this.drawFullscreen();

        gl.bindFramebuffer(gl.FRAMEBUFFER, this.fb.bloomA);
        gl.bindTexture(gl.TEXTURE_2D, this.tex.bloomB);
