<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Produce Atlas</title>

<style>
  /* The scene is the page. Everything here is a thin overlay on top of it and
     is expected to get out of the way — nothing owns a permanent block of the
     screen except one input. Committed dark theme: the stage is a rendered 3-D
     scene and a light mode would fight it. */
  :root {
    --ink:      #0C0F0D;
    --line:     rgba(233, 229, 218, 0.16);
    --paper:    #F2EFE7;
    --muted:    #9AA097;
    --accent:   #D6A93C;
    --accent-2: #F4CC69;

    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Times New Roman", serif;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;

    /* Text sits directly on the render, so it carries its own legibility. */
    --lift: 0 1px 2px rgba(0,0,0,0.9), 0 2px 18px rgba(0,0,0,0.75);
    --rail: min(660px, calc(100vw - 40px));
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    background: var(--ink);
    color: var(--paper);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
  }

  #gl {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    touch-action: none;
    cursor: grab;
  }
  #gl:active { cursor: grabbing; }

  /* ---- wordmark -------------------------------------------------------- */

  #mark {
    position: fixed;
    top: 20px;
    left: 24px;
    z-index: 10;
    font-family: var(--serif);
    font-size: 15px;
    letter-spacing: 0.02em;
    color: var(--muted);
    text-shadow: var(--lift);
    pointer-events: none;
    user-select: none;
  }
  #mark em { font-style: italic; color: var(--accent); }

  /* ---- conversation ----------------------------------------------------- */

  /* Bottom-anchored and transient. Lines stack upward, dissolve at the top
     edge, and remove themselves once read — so the conversation never becomes
     a wall standing in front of the scene. */
  #hud {
    position: fixed;
    inset: 0;
    z-index: 10;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    align-items: center;
    padding: 0 20px max(20px, env(safe-area-inset-bottom));
    pointer-events: none;
  }

  #dialogue {
    width: var(--rail);
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    gap: 9px;
    max-height: 32vh;
    overflow: hidden;
    -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 15%);
    mask-image: linear-gradient(to bottom, transparent 0, #000 15%);
  }

  .msg {
    font-size: 14.5px;
    line-height: 1.55;
    text-shadow: var(--lift);
    text-wrap: pretty;
    opacity: 1;
    transition: opacity 1.1s ease, transform 1.1s ease;
  }
  .msg.gone { opacity: 0; transform: translateY(-8px); }

  .msg.him { color: var(--paper); }
  .msg.him.typing::after {
    content: "";
    display: inline-block;
    width: 7px;
    height: 15px;
    margin-left: 3px;
    vertical-align: -2px;
    background: var(--accent);
    animation: blink 1s steps(2) infinite;
  }
  @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }

  .msg.you {
    align-self: flex-end;
    max-width: 85%;
    text-align: right;
    color: var(--accent-2);
    font-size: 13px;
  }

  /* ---- starter prompts --------------------------------------------------- */

  /* Only while the field is focused and empty. Discoverability when you want
     it, nothing on screen when you don't. */
  #chips {
    width: var(--rail);
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 12px;
    opacity: 0;
    transform: translateY(4px);
    transition: opacity 0.2s ease, transform 0.2s ease;
    pointer-events: none;
  }
  body.hint #chips { opacity: 1; transform: none; pointer-events: auto; }
  .chip {
    font-family: var(--sans);
    font-size: 12px;
    color: var(--paper);
    background: rgba(12, 16, 14, 0.72);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid var(--line);
    border-radius: 100px;
    padding: 6px 13px;
    cursor: pointer;
    transition: color 0.15s ease, border-color 0.15s ease;
  }
  .chip:hover, .chip:focus-visible {
    color: var(--accent-2);
    border-color: var(--accent);
    outline: none;
  }

  /* ---- composer ---------------------------------------------------------- */

  #composer {
    width: var(--rail);
    display: flex;
    gap: 8px;
    margin-top: 14px;
    pointer-events: auto;
  }
  #prompt {
    flex: 1;
    min-width: 0;
    background: rgba(12, 16, 14, 0.72);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 1px solid var(--line);
    border-radius: 100px;
    color: var(--paper);
    font-family: var(--sans);
    /* 16px minimum: anything smaller makes iOS zoom the page on focus. */
    font-size: 16px;
    padding: 12px 20px;
    outline: none;
    transition: border-color 0.15s ease;
  }
  #prompt:focus { border-color: rgba(214, 169, 60, 0.7); }
  #prompt::placeholder { color: rgba(154, 160, 151, 0.8); }
  #send {
    flex: none;
    border: 1px solid var(--line);
    background: rgba(12, 16, 14, 0.72);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    color: var(--accent);
    border-radius: 100px;
    padding: 0 20px;
    font-family: var(--sans);
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
  }
  #send:hover, #send:focus-visible {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--ink);
    outline: none;
  }

  /* ---- specimen caption --------------------------------------------------- */

  #tags {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 8;
  }
  .caption {
    position: absolute;
    transform: translate(-50%, -50%);
    text-align: center;
    white-space: nowrap;
    transition: opacity 0.3s ease;
  }
  .caption .name {
    font-family: var(--serif);
    font-style: italic;
    font-size: 15px;
    color: var(--paper);
    text-shadow: var(--lift);
  }
  .caption .size {
    display: block;
    margin-top: 2px;
    font-family: var(--mono);
    font-size: 10.5px;
    letter-spacing: 0.1em;
    color: var(--accent);
    font-variant-numeric: tabular-nums;
    text-shadow: var(--lift);
  }
  .caption::after {
    content: "";
    position: absolute;
    left: 50%;
    top: calc(100% + 5px);
    width: 1px;
    height: 16px;
    background: linear-gradient(to bottom, var(--accent), transparent);
  }

  /* ---- sound --------------------------------------------------------------- */

  #sound {
    position: fixed;
    right: 24px;
    top: 20px;
    z-index: 10;
    border: none;
    background: transparent;
    color: var(--muted);
    font-family: var(--sans);
    font-size: 10.5px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    cursor: pointer;
    padding: 4px 2px;
    text-shadow: var(--lift);
    transition: color 0.15s ease;
  }
  #sound:hover, #sound:focus-visible { color: var(--paper); outline: none; }

  /* ---- boot ---------------------------------------------------------------- */

  #boot {
    position: fixed;
    inset: 0;
    z-index: 30;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--ink);
    font-family: var(--serif);
    font-style: italic;
    font-size: 16px;
    color: var(--muted);
    transition: opacity 0.5s ease;
  }
  #boot.gone { opacity: 0; pointer-events: none; }

  #fail {
    max-width: 420px;
    padding: 0 24px;
    text-align: center;
    line-height: 1.6;
    font-family: var(--sans);
    font-style: normal;
    font-size: 13px;
  }

  @media (prefers-reduced-motion: reduce) {
    .msg { transition: opacity 0.2s ease; }
    .msg.him.typing::after { animation: none; }
    #boot, #chips { transition: none; }
  }

  @media (max-width: 640px) {
    #mark { font-size: 13px; top: 16px; left: 16px; }
    #sound { top: 16px; right: 16px; }
    .msg { font-size: 13.5px; }
    #dialogue { max-height: 24vh; }
  }
</style>

      const cache = new Map();
      const next = [];
      const mid = function (a, b) {
        const key = a < b ? a * 1000003 + b : b * 1000003 + a;
        let idx = cache.get(key);
        if (idx !== undefined) return idx;
        const va = verts[a], vb = verts[b];
        idx = verts.length;
        verts.push(M.normalized(va[0] + vb[0], va[1] + vb[1], va[2] + vb[2]));
        cache.set(key, idx);
        return idx;
      };
      for (let f = 0; f < faces.length; f++) {
        const a = faces[f][0], b = faces[f][1], c = faces[f][2];
        const ab = mid(a, b), bc = mid(b, c), ca = mid(c, a);
        next.push([a, ab, ca], [b, bc, ab], [c, ca, bc], [ab, bc, ca]);
      }
      faces = next;
    }

    const positions = new Float32Array(verts.length * 3);
    for (let i = 0; i < verts.length; i++) {
      positions[i * 3] = verts[i][0];
      positions[i * 3 + 1] = verts[i][1];
      positions[i * 3 + 2] = verts[i][2];
    }
    const indices = new Uint32Array(faces.length * 3);
    for (let f = 0; f < faces.length; f++) {
      indices[f * 3] = faces[f][0];
      indices[f * 3 + 1] = faces[f][1];
      indices[f * 3 + 2] = faces[f][2];
    }
    return { positions: positions, indices: indices };
  };

  /* One-ring adjacency in CSR form. A closed, consistently oriented manifold
     yields every directed half-edge exactly once, so no dedup pass is needed. */
  G.buildAdjacency = function (indices, vertexCount) {
    const counts = new Int32Array(vertexCount);
    for (let i = 0; i < indices.length; i += 3) {
      counts[indices[i]]++;
      counts[indices[i + 1]]++;
      counts[indices[i + 2]]++;
    }
    const offset = new Int32Array(vertexCount + 1);
    for (let i = 0; i < vertexCount; i++) offset[i + 1] = offset[i] + counts[i];
    const idx = new Int32Array(offset[vertexCount]);
    const cursor = offset.slice(0, vertexCount);
    for (let i = 0; i < indices.length; i += 3) {
      const a = indices[i], b = indices[i + 1], c = indices[i + 2];
      idx[cursor[a]++] = b;
      idx[cursor[b]++] = c;
      idx[cursor[c]++] = a;
    }
    return { offset: offset, idx: idx };
  };

  /* ---- torus (ring targets) ------------------------------------------ */

  G.torus = function (R, r, nu, nv) {
    const positions = new Float32Array(nu * nv * 3);
    const normals = new Float32Array(nu * nv * 3);
    const indices = new Uint32Array(nu * nv * 6);
    let p = 0, ii = 0;
    for (let i = 0; i < nu; i++) {
      const u = (i / nu) * Math.PI * 2;
      const cu = Math.cos(u), su = Math.sin(u);
      for (let j = 0; j < nv; j++) {
        const v = (j / nv) * Math.PI * 2;
        const cv = Math.cos(v), sv = Math.sin(v);
        const nx = cu * cv, ny = su * cv, nz = sv;
        positions[p] = cu * R + nx * r;
        positions[p + 1] = su * R + ny * r;
        positions[p + 2] = nz * r;
        normals[p] = nx; normals[p + 1] = ny; normals[p + 2] = nz;
        p += 3;
        const a = i * nv + j;
        const b = ((i + 1) % nu) * nv + j;
        const c = ((i + 1) % nu) * nv + (j + 1) % nv;
        const d = i * nv + (j + 1) % nv;
        indices[ii++] = a; indices[ii++] = b; indices[ii++] = c;
        indices[ii++] = a; indices[ii++] = c; indices[ii++] = d;
      }
    }
    return { positions: positions, normals: normals, indices: indices };
  };

  /* ---- head sculpt ---------------------------------------------------- */

  /* An anisotropic gaussian bump anchored to a direction on the unit sphere.
     ku / kv are 1/(2*sigma^2) along the feature's tangent / bitangent. */
  function feature(cx, cy, cz, tx, ty, tz, amp, ku, kv) {
    const c = M.normalized(cx, cy, cz);
    let t;
    if (tx === null) {
      const f = M.frame(c);
      t = f[0];
    } else {
      /* Orthogonalise the requested tangent against the centre direction. */
      const d = cx * tx + cy * ty + cz * tz;
      t = M.normalized(tx - c[0] * d, ty - c[1] * d, tz - c[2] * d);
    }
    const b = M.cross3([0, 0, 0], c, t);
    return { c: c, t: t, b: b, amp: amp, ku: ku, kv: kv };
  }

  /* Normalised strength of one feature at a direction, in 0..1. */
  function evalFeature(dx, dy, dz, f) {
    const c = f.c;
    const d = dx * c[0] + dy * c[1] + dz * c[2];
    if (d <= 0.05) return 0;
    const ex = dx - c[0] * d, ey = dy - c[1] * d, ez = dz - c[2] * d;
    const u = ex * f.t[0] + ey * f.t[1] + ez * f.t[2];
    const v = ex * f.b[0] + ey * f.b[1] + ez * f.b[2];
    const e = f.ku * u * u + f.kv * v * v;
    if (e > 12) return 0;
    return Math.exp(-e) * d;
  }
  G.feature = feature;
  G.evalFeature = evalFeature;

  /* Named features are reused by both the sculpt and the vertex colouring. */
  const F = {
    /* Narrow vertical bridge (high ku = tight horizontally, low kv = tall)
       capped by a tight ball, so the nose reads as a nose and not a snout. */
    noseBridge: feature(0, 0.04, 1, 1, 0, 0, 0.17, 15.0, 4.2),
    noseTip: feature(0, -0.09, 1, 1, 0, 0, 0.36, 24.0, 24.0),
    nostrilL: feature(-0.17, -0.14, 0.97, 1, 0, 0, -0.045, 70.0, 70.0),
    nostrilR: feature(0.17, -0.14, 0.97, 1, 0, 0, -0.045, 70.0, 70.0),
    browL: feature(-0.40, 0.40, 0.86, 1, 0, 0, 0.075, 9.5, 32.0),
    browR: feature(0.40, 0.40, 0.86, 1, 0, 0, 0.075, 9.5, 32.0),
    cheekL: feature(-0.60, -0.26, 0.72, null, 0, 0, 0.105, 7.0, 7.0),
    cheekR: feature(0.60, -0.26, 0.72, null, 0, 0, 0.105, 7.0, 7.0),
    chin: feature(0, -0.72, 0.62, 1, 0, 0, 0.13, 9.0, 10.0),
    socketL: feature(-0.42, 0.13, 0.88, 1, 0, 0, -0.10, 13.0, 13.0),
    socketR: feature(0.42, 0.13, 0.88, 1, 0, 0, -0.10, 13.0, 13.0),
    mouth: feature(0, -0.45, 0.90, 1, 0, 0, -0.095, 8.5, 110.0),
    lowerLip: feature(0, -0.565, 0.86, 1, 0, 0, 0.055, 13.0, 60.0),
    upperLip: feature(0, -0.355, 0.92, 1, 0, 0, 0.035, 15.0, 95.0),
    /* Just the mound the (separately meshed) ear attaches to. */
    earL: feature(-1.0, 0.08, -0.02, 0, 1, 0, 0.13, 6.0, 26.0),
    earR: feature(1.0, 0.08, -0.02, 0, 1, 0, 0.13, 6.0, 26.0)
  };
  G.F = F;

  const FEATURES = Object.keys(F).map(function (k) { return F[k]; });

  /* Radial displacement field evaluated for a unit direction. */
  function sculptRadius(dx, dy, dz) {
    let r = 1.0;
    /* cranium volume and jaw taper */
    r += 0.11 * Math.pow(Math.max(0, dy), 1.4);
    const below = Math.max(0, -dy);
    r -= 0.20 * below * below;

    for (let i = 0; i < FEATURES.length; i++) {
      const f = FEATURES[i];
      r += f.amp * evalFeature(dx, dy, dz, f);
    }
    return r;
  }

  /* Sculpted surface point for a unit direction. */
  G.sculpt = function (out, dx, dy, dz) {
    const r = sculptRadius(dx, dy, dz);
    out[0] = dx * r * 0.90;
    out[1] = dy * r * 1.08;
    out[2] = dz * r * 1.02;
    return out;
  };

  /* ---- mesh builder --------------------------------------------------- */

  function Builder() {
    this.pos = [];
    this.col = [];
    this.mat = [];
    this.idx = [];
  }

  Builder.prototype.vertexCount = function () { return this.pos.length / 3; };

  Builder.prototype.append = function (positions, indices, color, matId) {
    const base = this.pos.length / 3;
    for (let i = 0; i < positions.length; i++) this.pos.push(positions[i]);
    for (let i = 0; i < positions.length / 3; i++) {
      this.col.push(color[0], color[1], color[2]);
      this.mat.push(matId);
    }
    for (let i = 0; i < indices.length; i++) this.idx.push(indices[i] + base);
    return base;
  };

  /* Ellipsoid built from a unit icosphere: centre + u*ru + v*rv + w*rw. */
  function ellipsoid(unit, center, axes, radii) {
    const n = unit.positions.length / 3;
    const out = new Float32Array(n * 3);
    for (let i = 0; i < n; i++) {
      const x = unit.positions[i * 3] * radii[0];
      const y = unit.positions[i * 3 + 1] * radii[1];
      const z = unit.positions[i * 3 + 2] * radii[2];
      out[i * 3] = center[0] + axes[0][0] * x + axes[1][0] * y + axes[2][0] * z;
      out[i * 3 + 1] = center[1] + axes[0][1] * x + axes[1][1] * y + axes[2][1] * z;
      out[i * 3 + 2] = center[2] + axes[0][2] * x + axes[1][2] * y + axes[2][2] * z;
    }
    return out;
  }

  /* ---- binding grid (skin sub-objects to the head deformation field) --- */

  function SpatialGrid(positions, count, cell) {
    this.cell = cell;
    this.map = new Map();
    this.positions = positions;
    for (let i = 0; i < count; i++) {
      const k = this.key(positions[i * 3], positions[i * 3 + 1], positions[i * 3 + 2]);
      let bucket = this.map.get(k);
      if (!bucket) { bucket = []; this.map.set(k, bucket); }
      bucket.push(i);
    }
  }
  SpatialGrid.prototype.key = function (x, y, z) {
    const cx = Math.floor(x / this.cell) + 512;
    const cy = Math.floor(y / this.cell) + 512;
    const cz = Math.floor(z / this.cell) + 512;
    return (cx * 1024 + cy) * 1024 + cz;
  };
  /* Collect candidate indices within `rings` cells of (x,y,z). */
  SpatialGrid.prototype.gather = function (x, y, z, rings, out) {
    out.length = 0;
    const cx = Math.floor(x / this.cell) + 512;
    const cy = Math.floor(y / this.cell) + 512;
    const cz = Math.floor(z / this.cell) + 512;
    for (let i = -rings; i <= rings; i++) {
      for (let j = -rings; j <= rings; j++) {
        for (let k = -rings; k <= rings; k++) {
          const bucket = this.map.get(((cx + i) * 1024 + (cy + j)) * 1024 + (cz + k));
          if (bucket) for (let b = 0; b < bucket.length; b++) out.push(bucket[b]);
        }
      }
    }
    return out;
  };

  const BIND_K = 4;

  function bindToHead(rest, headCount, total) {
    const grid = new SpatialGrid(rest, headCount, 0.16);
    const partCount = total - headCount;
    const bindIdx = new Int32Array(partCount * BIND_K);
    const bindW = new Float32Array(partCount * BIND_K);
    const cand = [];
    const bestI = new Int32Array(BIND_K);
    const bestD = new Float64Array(BIND_K);

    for (let p = 0; p < partCount; p++) {
      const vi = headCount + p;
      const x = rest[vi * 3], y = rest[vi * 3 + 1], z = rest[vi * 3 + 2];
      let rings = 1;
      grid.gather(x, y, z, rings, cand);
      while (cand.length < BIND_K && rings < 12) {
        rings++;
        grid.gather(x, y, z, rings, cand);
      }
      for (let k = 0; k < BIND_K; k++) { bestI[k] = 0; bestD[k] = Infinity; }
      for (let c = 0; c < cand.length; c++) {
        const hi = cand[c];
        const dx = rest[hi * 3] - x, dy = rest[hi * 3 + 1] - y, dz = rest[hi * 3 + 2] - z;
        const d = dx * dx + dy * dy + dz * dz;
        if (d >= bestD[BIND_K - 1]) continue;
        let k = BIND_K - 1;
        while (k > 0 && bestD[k - 1] > d) { bestD[k] = bestD[k - 1]; bestI[k] = bestI[k - 1]; k--; }
        bestD[k] = d; bestI[k] = hi;
      }
      let sum = 0;
      for (let k = 0; k < BIND_K; k++) {
        const w = 1 / (bestD[k] + 1e-4);
        bindW[p * BIND_K + k] = w;
        bindIdx[p * BIND_K + k] = bestI[k];
        sum += w;
      }
      for (let k = 0; k < BIND_K; k++) bindW[p * BIND_K + k] /= sum;
    }
    return { k: BIND_K, idx: bindIdx, w: bindW };
  }

  /* ---- character ------------------------------------------------------ */

  const SKIN = [0.90, 0.64, 0.49];
  const SKIN_WARM = [0.84, 0.47, 0.38];
  const LIP = [0.74, 0.34, 0.33];
  const ROSY = [0.90, 0.52, 0.45];
  const SCLERA = [0.96, 0.96, 0.99];
  const IRIS = [0.09, 0.46, 0.56];
  const PUPIL = [0.03, 0.03, 0.05];
  const HAIR = [0.26, 0.14, 0.10];
  const GLINT = [1.0, 1.0, 1.0];

  /* Area-weighted vertex normals; used once at build time so that parts,
     which only ever translate, can keep static normals at runtime. */
  G.computeNormals = function (positions, indices, count) {
    const nrm = new Float32Array(count * 3);
    for (let t = 0; t < indices.length; t += 3) {
      const a = indices[t] * 3, b = indices[t + 1] * 3, c = indices[t + 2] * 3;
      const ax = positions[a], ay = positions[a + 1], az = positions[a + 2];
      const e1x = positions[b] - ax, e1y = positions[b + 1] - ay, e1z = positions[b + 2] - az;
      const e2x = positions[c] - ax, e2y = positions[c + 1] - ay, e2z = positions[c + 2] - az;
      const nx = e1y * e2z - e1z * e2y;
      const ny = e1z * e2x - e1x * e2z;
      const nz = e1x * e2y - e1y * e2x;
      nrm[a] += nx; nrm[a + 1] += ny; nrm[a + 2] += nz;
      nrm[b] += nx; nrm[b + 1] += ny; nrm[b + 2] += nz;
      nrm[c] += nx; nrm[c + 1] += ny; nrm[c + 2] += nz;
    }
    for (let i = 0; i < nrm.length; i += 3) {
      const l = Math.hypot(nrm[i], nrm[i + 1], nrm[i + 2]);
      if (l > 1e-9) { nrm[i] /= l; nrm[i + 1] /= l; nrm[i + 2] /= l; }
      else { nrm[i + 1] = 1; }
    }
    return nrm;
  };

  /* Builds the full stretchable specimen. Returns typed arrays ready for
     upload plus the topology the soft-body solver needs. */
  /* The being: a near-spherical iridescent shell. It has no face, so all of
     its expression comes from the soft-body deformation, its drift, and the
     focal point the shader paints wherever it is looking. The slight lobing
     keeps it off a perfect primitive — a flawless sphere reads as untouched
     default geometry. */
  G.buildOrb = function (subdiv) {
    const sphere = G.icosphere(subdiv);
    const n = sphere.positions.length / 3;
    const R = 1.15;
    const rest = new Float32Array(n * 3);

    for (let i = 0; i < n; i++) {
      const x = sphere.positions[i * 3];
      const y = sphere.positions[i * 3 + 1];
      const z = sphere.positions[i * 3 + 2];
      const lobe = 1
        + 0.030 * Math.sin(y * 3.1 + 0.6)
        + 0.022 * Math.sin(x * 2.4 - 1.2)
        + 0.018 * Math.sin(z * 2.9 + 2.1);
      const r = R * lobe;
      rest[i * 3] = x * r;
      rest[i * 3 + 1] = y * r * 1.03;
      rest[i * 3 + 2] = z * r;
    }

    const colors = new Float32Array(n * 3);
    const mats = new Float32Array(n);
    for (let i = 0; i < n; i++) {
      colors[i * 3] = 0.42; colors[i * 3 + 1] = 0.62; colors[i * 3 + 2] = 0.95;
      mats[i] = MAT.SHELL;
    }

    return {
      rest: rest,
      restNormals: G.computeNormals(rest, sphere.indices, n),
      colors: colors,
      mats: mats,
      indices: sphere.indices,
      headCount: n,
      total: n,
      adjacency: G.buildAdjacency(sphere.indices, n),
      headIndices: sphere.indices,
      /* Nothing is skinned to it — the shell is the whole being. */
      binding: { k: 4, idx: new Int32Array(0), w: new Float32Array(0) }
    };
  };

  /* A halo ring. Rendered as a prop with its own transform so it can turn
     independently of the shell. */
  G.buildHalo = function (radius, tube) {
    const t = G.torus(radius, tube, 96, 8);
    const n = t.positions.length / 3;
    const colors = new Float32Array(n * 3);
    const mats = new Float32Array(n);
    for (let i = 0; i < n; i++) {
      colors[i * 3] = 0.72; colors[i * 3 + 1] = 0.86; colors[i * 3 + 2] = 1.0;
      mats[i] = MAT.HALO;
    }
    return {
      positions: t.positions, normals: t.normals, colors: colors, mats: mats,
      indices: t.indices, heightUnits: tube * 2, radiusUnits: radius, topUnits: tube
    };
  };

  G.buildCharacter = function (subdiv) {
    const b = new Builder();
    const sphere = G.icosphere(subdiv);
    const n = sphere.positions.length / 3;

    /* --- head --- */
    const headPos = new Float32Array(n * 3);
    const tmp = [0, 0, 0];
    for (let i = 0; i < n; i++) {
      G.sculpt(tmp, sphere.positions[i * 3], sphere.positions[i * 3 + 1], sphere.positions[i * 3 + 2]);
      headPos[i * 3] = tmp[0];
      headPos[i * 3 + 1] = tmp[1];
      headPos[i * 3 + 2] = tmp[2];
    }
    b.append(headPos, sphere.indices, SKIN, MAT.SKIN);
    const headCount = n;

    /* Vertex colour carries the facial detail that geometry alone reads too
       softly: lips, nose tip, ear cartilage and a cheek flush. */
    const tmpCol = [0, 0, 0];
    for (let i = 0; i < n; i++) {
      const dx = sphere.positions[i * 3];
      const dy = sphere.positions[i * 3 + 1];
      const dz = sphere.positions[i * 3 + 2];

      const lip = M.clamp(
        evalFeature(dx, dy, dz, F.mouth) * 1.25 +
        evalFeature(dx, dy, dz, F.lowerLip) * 1.05 +
        evalFeature(dx, dy, dz, F.upperLip) * 1.0, 0, 1);
      const nose = M.clamp(evalFeature(dx, dy, dz, F.noseTip) * 0.95, 0, 1);
      const ear = M.clamp(
        (evalFeature(dx, dy, dz, F.earL) + evalFeature(dx, dy, dz, F.earR)) * 0.75, 0, 1);
      const cheek = M.clamp(
        (evalFeature(dx, dy, dz, F.cheekL) + evalFeature(dx, dy, dz, F.cheekR)) * 0.55, 0, 1);

      M.copy3(tmpCol, SKIN);
      M.mix3(tmpCol, tmpCol, ROSY, cheek * 0.45);
      M.mix3(tmpCol, tmpCol, SKIN_WARM, Math.max(nose, ear) * 0.75);
      M.mix3(tmpCol, tmpCol, LIP, lip * 0.9);

      b.col[i * 3] = tmpCol[0];
      b.col[i * 3 + 1] = tmpCol[1];
      b.col[i * 3 + 2] = tmpCol[2];
    }

    /* Anchor a sub-object to the sculpted surface along a direction. The head
       is scaled per axis after the radial sculpt, so the surface point is NOT
       on the ray through `dir`; taking the real point and offsetting along its
       own outward direction is what keeps eyes and ears seated correctly. */
    const anchor = function (dirX, dirY, dirZ, inset) {
      const d = M.normalized(dirX, dirY, dirZ);
      const s = [0, 0, 0];
      G.sculpt(s, d[0], d[1], d[2]);
      const outward = M.norm3([0, 0, 0], s);
      return {
        center: M.addScaled3([0, 0, 0], s, outward, inset),
        out: outward,
        frame: M.frame(outward)
      };
    };

    /* --- eyes ---
       The eyeballs sit proud of their sockets so the sclera reads from the
       front; that is also what makes them deform so legibly when pulled. */
    const midSphere = G.icosphere(Math.min(3, subdiv));
    const tinySphere = G.icosphere(2);

    for (let e = 0; e < 2; e++) {
      const sx = e === 0 ? -1 : 1;
      const a = anchor(sx * 0.42, 0.13, 0.88, -0.13);
      const frame = a.frame, out = a.out;

      b.append(ellipsoid(midSphere, a.center, frame, [0.30, 0.32, 0.30]),
        midSphere.indices, SCLERA, MAT.SCLERA);

      const irisC = M.addScaled3([0, 0, 0], a.center, out, 0.245);
      b.append(ellipsoid(tinySphere, irisC, frame, [0.125, 0.125, 0.085]),
        tinySphere.indices, IRIS, MAT.IRIS);

      const pupilC = M.addScaled3([0, 0, 0], a.center, out, 0.285);
      b.append(ellipsoid(tinySphere, pupilC, frame, [0.060, 0.060, 0.040]),
        tinySphere.indices, PUPIL, MAT.IRIS);

      const glintC = M.addScaled3([0, 0, 0], a.center, out, 0.295);
      M.addScaled3(glintC, glintC, frame[0], -0.085);
      M.addScaled3(glintC, glintC, frame[1], 0.085);
      b.append(ellipsoid(tinySphere, glintC, frame, [0.036, 0.036, 0.030]),
        tinySphere.indices, GLINT, MAT.GLINT);
    }

    /* --- ears ---
       A radial height field over a sphere cannot produce an ear: it has no way
       to make a thin fin that stands off the skull. So the ears are separate
       flattened ellipsoids, skinned to the head like the eyes — which also
       makes them the most satisfying thing on the model to pull. */
    for (let e = 0; e < 2; e++) {
      const sx = e === 0 ? -1 : 1;
      const a = anchor(sx * 1.0, 0.10, -0.06, 0.03);
      const u = a.frame[0], v = a.frame[1], w = a.frame[2];  /* back, up, out */

      b.append(ellipsoid(midSphere, a.center, [u, v, w], [0.22, 0.35, 0.09]),
        midSphere.indices, SKIN, MAT.SKIN);

      /* Pointed upper lobe, pushed up and back off the main disc. */
      const tip = M.addScaled3([0, 0, 0], a.center, v, 0.25);
      M.addScaled3(tip, tip, u, 0.08);
      b.append(ellipsoid(tinySphere, tip, [u, v, w], [0.115, 0.17, 0.070]),
        tinySphere.indices, SKIN, MAT.SKIN);

      /* Concha: a smaller, warmer inset disc facing outward. */
      const inner = M.addScaled3([0, 0, 0], a.center, w, 0.05);
      M.addScaled3(inner, inner, u, -0.035);
      b.append(ellipsoid(tinySphere, inner, [u, v, w], [0.115, 0.20, 0.055]),
        tinySphere.indices, SKIN_WARM, MAT.SKIN);
    }

    /* --- eyebrows --- */
    for (let e = 0; e < 2; e++) {
      const sx = e === 0 ? -1 : 1;

/* NOGGIN — what he says back.

   Not a language model. This runs entirely offline: it matches an entry in the
   atlas, works out which aspect you asked about, and answers from curated data.
   That is a deliberate trade — for an evidence-led atlas, a small set of
   verified answers beats a large set of confident guesses.

   It keeps a subject in context, so "how big is it?" works after "let's talk
   about an apple". */

  'use strict';

  const K = NG.K;
  const P = NG.P;
  const M = NG.M;

  /* It is about this wide, which is the yardstick for every comparison. */
  const SELF_CM = 23;

  const ASPECTS = [
    { id: 'size', words: ['how big', 'how large', 'how small', 'how tall', 'how wide', 'size', 'scale', 'dimensions', 'measure', 'cm', 'centimet', 'inches'] },
    { id: 'origin', words: ['where', 'from', 'origin', 'native', 'come from', 'grown', 'grow', 'country', 'region'] },
    { id: 'family', words: ['family', 'related', 'relative', 'cousin', 'genus', 'species', 'binomial', 'latin', 'scientific name', 'botanical name', 'called'] },
    { id: 'type', words: ['what is it', 'what is a', 'what are', 'fruit or veg', 'is it a fruit', 'is it a vegetable', 'is it a berry', 'berry', 'classif', 'botanically', 'technically'] },
    { id: 'taste', words: ['taste', 'flavour', 'flavor', 'sweet', 'sour', 'bitter', 'eat', 'edible', 'nice'] },
    { id: 'history', words: ['history', 'domestic', 'ancient', 'wild', 'ancestor', 'bred', 'first', 'old'] },
    { id: 'seeds', words: ['seed', 'seeds', 'pip', 'pips', 'stone', 'pit', 'core'] },
    { id: 'more', words: ['more', 'else', 'another', 'fact', 'interesting', 'tell me', 'go on', 'anything'] }
  ];

  const GREETING_WORDS = ['hello', 'hi ', 'hey', 'yo ', 'howdy', 'how are you', 'how is it going', 'hows it going', 'good morning', 'good evening', 'sup'];
  const CLEAR_WORDS = ['clear', 'remove', 'delete', 'get rid', 'take it away', 'put it back', 'tidy', 'reset the'];
  const LIST_WORDS = ['what do you know', 'what can you', 'help', 'list', 'options', 'everything', 'what have you got', 'topics'];
  const THANKS_WORDS = ['thank', 'thanks', 'cheers', 'nice one', 'good job'];

  function has(text, words) {
    for (let i = 0; i < words.length; i++) if (text.indexOf(words[i]) !== -1) return true;
    return false;

  /* "a apple" reads as a bug even when the botany is right. */

  function an(word) { return article(word) + ' ' + word; }

  function plural(name) {
    if (/s$/.test(name)) return name;
    if (/(ch|sh|x|z)$/.test(name)) return name + 'es';
    if (/o$/.test(name)) return name + 'es';
    if (/[^aeiou]y$/.test(name)) return name.slice(0, -1) + 'ies';
    return name + 's';

  function Brain() {
    this.subject = null;
    this.factCursor = {};
    this.introduced = false;   /* the menu of options is worth saying once */
    this.rand = M.rng((Date.now() & 0x7fffffff) || 3);
    this.turns = 0;
  }

  Brain.prototype._pick = function (list) {
    return list[Math.floor(this.rand() * list.length) % list.length];

  /* "8 cm across — about a third the width of my head" */
  Brain.prototype._sizeLine = function (e) {
    const long = e.lengthCm || e.sizeCm;
    const wide = e.widthCm || e.sizeCm;
    const ratio = wide / SELF_CM;
    let cmp;
    if (ratio < 0.12) cmp = 'a mote next to me';
    else if (ratio < 0.3) cmp = 'about a quarter of my width';
    else if (ratio < 0.45) cmp = 'roughly a third of me';
    else if (ratio < 0.7) cmp = 'over half my width';
    else if (ratio < 1.1) cmp = 'as wide across as I am, which is upsetting';
    else cmp = 'wider than I am. Look at it. LOOK at it';

  };

  Brain.prototype._nextFact = function (e) {
    const i = this.factCursor[e.id] || 0;

    if (has(text, CLEAR_WORDS) && !K.find(raw)) {

        clear: true,
        lines: had
          ? ['Fine. The ' + had.name + ' is gone. I hope you are happy.',
             'I can bring back literally any of ' + K.ENTRIES.length + ' things. Just say the word. Say a word. Any word.']
          : ['There is nothing to clear. You cleared nothing. Congratulations.']
      };
    }

    if (has(text, LIST_WORDS)) {
      const names = K.names();
      return {
        lines: ['I have ' + names.length + ' things I can pull into the room, at their real size.',
          names.join(', ') + '.',
          'Name one and it appears. Then ask me how big it is, where it is from, what family it is in, what it tastes like, or just say "more" and I will keep going until you stop me.']
      };
    }

    const entry = K.find(raw);

    /* A new subject: bring it into the room. */
    if (entry && entry !== this.subject) {
      this.subject = entry;
      const aspect = this._detectAspect(text);
      const lines = ['Oh, ' + an(entry.name) + '! Yes. Hold on, I will get one.'];
      if (aspect && aspect !== 'more') {
        lines.push.apply(lines, this._answer(entry, aspect));
      } else {
        lines.push('There it is. A real one — ' + this._sizeLine(entry));
        if (!this.introduced) {
          this.introduced = true;
          lines.push('Ask me where it is from, what family it is in, what it tastes like. Or say "more".');
        }
      }
      return { lines: lines, spawn: entry };
    }

    if (has(text, GREETING_WORDS)) {
      return {
        lines: [this._pick([
          'Hey! Hi. Hello. You typed at me!',
          'Oh good, you are here. I have been talking to nobody.',
          'Hello! I was starting to think you were furniture.'
        ]),
          'Name any food plant and I will pull a real one into the room, correctly sized, and then talk about it until you physically stop me. Try "let\'s talk about an apple".']
      };
    }

    if (has(text, THANKS_WORDS)) {
      return { lines: [this._pick([
        'You are welcome. Do not go. Ask another one.',
        'Finally, some recognition. Ask me about pineapples.',
        'See, this is what I am here for. Well. This and being stretched.'
      ])] };
    }

    /* Follow-up about whatever is already floating there. */
    if (this.subject) {
      const aspect = this._detectAspect(text);
      if (aspect) return { lines: this._answer(this.subject, aspect) };
      /* No known aspect and no known plant: admit it, then carry on anyway. */
      const lines = [this._pick([
        'I have no idea what you just asked me.',
        'That went straight past me.',
        'No clue. Not in the atlas, not in my head.'
      ])];
      lines.push('Here is another thing about ' + plural(this.subject.name) + ' instead, because I am like this.');
      lines.push(cap(this._nextFact(this.subject)) + '.');
      return { lines: lines };
    }

    return {
      lines: [this._pick([
        'I do not have that one. I am an atlas of food plants, not a search engine.',
        'No idea what that is. Ask me about something you could eat.',
        'That is outside my remit, and my remit is plants you can put in a pan.'
      ]),
        'Try one of these: ' + K.names().slice(0, 8).join(', ') + '... or say "help" for the whole list.']
    };
  };

  Brain.prototype._detectAspect = function (text) {
    for (let i = 0; i < ASPECTS.length; i++) {
      if (has(text, ASPECTS[i].words)) return ASPECTS[i].id;
    }
    return null;
  };

  Brain.prototype.greeting = function () {
    return ['Hey. Name a food plant and I will bring a real one in, at its actual size.',
      'You can also reach in and pull at me. I am not as solid as I look.'];
  };

  NG.Brain = Brain;
})(window.NG = window.NG || {});

/* NOGGIN — the chat surface.

   His replies type out one character at a time with the same blip voice as his
   idle rambling, so the panel reads as him speaking rather than as a log
   printing. Queued lines drain in order, and pressing send while he is still
   going makes him finish the current line instantly — he will not be told to
   hurry up twice. */
(function (NG) {
  'use strict';

  const CHARS_PER_SEC = 90;
  const LINE_GAP = 0.18;
  /* How long a finished line stays before it dissolves. Long enough to read a
     three-sentence answer without hurrying, short enough that the scene is
     never standing behind a wall of old text. */
  const LINGER = 20;
  const FADE = 1.2;
  const MAX_VISIBLE = 3;

  function Chat(audio, brain, els) {
    this.audio = audio;
    this.brain = brain;
    this.log = els.log;
    this.input = els.input;
    this.form = els.form;

    this.queue = [];
    this.live = [];      /* on-screen lines with their remaining lifetime */
    this.typingEl = null;
    this.full = '';
    this.shown = 0;
    this.gap = 0;
    this.lastActivity = -1e9;
    this._blip = 0;
    this.onSpawn = null;
    this.onClear = null;

    const self = this;
    this.form.addEventListener('submit', function (e) {
      e.preventDefault();
      self.send(self.input.value);
      self.input.value = '';
    });
    /* Typing in the box must not trigger the game's single-key shortcuts. */
    this.input.addEventListener('keydown', function (e) { e.stopPropagation(); });
  }

  Chat.prototype.busy = function () {
    return !!this.typingEl || this.queue.length > 0;
  };

  Chat.prototype._append = function (cls, text) {
    const row = document.createElement('div');
    row.className = 'msg ' + cls;
    row.textContent = text || '';
    this.log.appendChild(row);

    const entry = { el: row, life: LINGER, held: true };
    this.live.push(entry);
    /* Older lines leave early rather than stacking into a block. */
    while (this.live.length > MAX_VISIBLE) {
      const old = this.live[0];
      if (old.life > FADE) old.life = FADE;
      if (this.live.length > MAX_VISIBLE + 2) this._drop(0);
      else break;
    }
    return row;
  };

  Chat.prototype._drop = function (i) {
    const e = this.live[i];
    if (e.el.parentNode) e.el.parentNode.removeChild(e.el);
    this.live.splice(i, 1);
  };

  /* Age the visible lines. A line still being typed does not age. */
  Chat.prototype._ageLines = function (dt) {
    for (let i = this.live.length - 1; i >= 0; i--) {
      const e = this.live[i];
      if (e.el === this.typingEl) continue;
      e.life -= dt;
      if (e.life <= FADE && !e.el.classList.contains('gone')) e.el.classList.add('gone');
      if (e.life <= 0) this._drop(i);
    }
  };

  /* Queue entries carry an optional callback that fires the moment that line
     finishes typing, which is how the specimen arrives *after* he has said he
     will fetch it rather than materialising while he is still offering. */
  Chat.prototype.say = function (lines, afterFirstLine) {
    for (let i = 0; i < lines.length; i++) {
      this.queue.push({ text: lines[i], after: i === 0 ? (afterFirstLine || null) : null });
    }
  };

  Chat.prototype.send = function (raw) {
    const text = String(raw || '').trim();
    if (!text) return;
    this.lastActivity = 0;

    /* A second send finishes the current line rather than stacking up. Run its
       pending callback too, or an interrupted line would swallow its spawn. */
    if (this.typingEl) {
      this.typingEl.textContent = this.full;
      this.typingEl.classList.remove('typing');
      this.typingEl = null;
      this._runAfter();
    }

    this._append('you', text);
    if (this.onSend) this.onSend();
    const reply = this.brain.respond(text);
    if (reply.clear && this.onClear) this.onClear();
    const self = this;
    this.say(reply.lines, reply.spawn ? function () {
      if (self.onSpawn) self.onSpawn(reply.spawn);
    } : null);
  };

  Chat.prototype.update = function (dt) {
    this.lastActivity += dt;
    this._ageLines(dt);

    if (!this.typingEl) {
      if (this.gap > 0) { this.gap -= dt; return; }
      if (!this.queue.length) return;
      const item = this.queue.shift();
      this.full = item.text;
      this._after = item.after;
      this.shown = 0;
      this.typingEl = this._append('him typing', '');
      return;
    }

    const before = Math.floor(this.shown);
    this.shown = Math.min(this.full.length, this.shown + CHARS_PER_SEC * dt);
    const now = Math.floor(this.shown);
    if (now !== before) {
      this.typingEl.textContent = this.full.slice(0, now);
      for (let i = before; i < now; i++) {
        const ch = this.full.charAt(i);
        if (ch === ' ' || ch === '\n') continue;
        if (++this._blip % 5 === 0) this.audio.blip(ch.charCodeAt(0));
      }
    }
    if (this.shown >= this.full.length) {
      this.typingEl.classList.remove('typing');
      this.typingEl = null;
      this.gap = LINE_GAP;
      this._runAfter();
    }
  };

  Chat.prototype._runAfter = function () {
    const fn = this._after;
    this._after = null;
    if (fn) fn();
  };

  NG.Chat = Chat;
})(window.NG = window.NG || {});

/* ===== src/shaders.js ===== */
/* NOGGIN — GLSL ES 3.00 shader sources. */
(function (NG) {
  'use strict';

  const S = {};

  /* Attribute locations are fixed so one VAO can feed several programs. */
  S.LOC = { POS: 0, NOR: 1, COL: 2, MAT: 3, STRETCH: 4 };

  const COMMON = `
const float PI = 3.14159265;

vec3 acesFilm(vec3 x) {
  const float a = 2.51, b = 0.03, c = 2.43, d = 0.59, e = 0.14;
  return clamp((x * (a * x + b)) / (x * (c * x + d) + e), 0.0, 1.0);
}

float hash12(vec2 p) {
  vec3 p3 = fract(vec3(p.xyx) * 0.1031);
  p3 += dot(p3, p3.yzx + 33.33);
  return fract((p3.x + p3.y) * p3.z);
}

float hash13(vec3 p3) {
  p3 = fract(p3 * 0.1031);
  p3 += dot(p3, p3.zyx + 31.32);
  return fract((p3.x + p3.y) * p3.z);
}
`;

  /* ---- fullscreen triangle -------------------------------------------- */

  S.fullscreenVS = `#version 300 es
out vec2 vUV;
void main() {
  vec2 p = vec2(float((gl_VertexID << 1) & 2), float(gl_VertexID & 2));
  vUV = p;
  gl_Position = vec4(p * 2.0 - 1.0, 0.0, 1.0);
}`;

  /* ---- background ------------------------------------------------------ */

  S.bgFS = `#version 300 es
precision highp float;
in vec2 vUV;
uniform vec3 uRayF, uRayR, uRayU;
uniform float uTime;
uniform vec3 uTopColor, uBotColor, uGlowColor;
uniform float uGlow;
out vec4 oColor;
${COMMON}

void main() {
  vec2 ndc = vUV * 2.0 - 1.0;
  vec3 dir = normalize(uRayF + uRayR * ndc.x + uRayU * ndc.y);

  // Seamless sweep: a lit backdrop, not a sky.
  float h = dir.y * 0.5 + 0.5;
  vec3 col = mix(uBotColor, uTopColor, pow(h, 0.9));

  // Soft pool of light behind the subject.
  float d = length(ndc * vec2(0.85, 1.0));
  col += uGlowColor * uGlow * pow(max(0.0, 1.0 - d * 0.55), 3.5);

  oColor = vec4(col, 1.0);
}`;

  /* ---- surface (head, eyes, brows, hair) ------------------------------- */

  S.surfaceVS = `#version 300 es
layout(location = 0) in vec3 aPos;
layout(location = 1) in vec3 aNor;
layout(location = 2) in vec3 aCol;
layout(location = 3) in float aMat;
layout(location = 4) in float aStretch;

uniform mat4 uModel;
uniform mat4 uViewProj;
uniform mat4 uLightVP;

out vec3 vWPos;
out vec3 vNor;
out vec3 vCol;
out float vMat;
out float vStretch;
out vec4 vLPos;

void main() {
  vec4 wp = uModel * vec4(aPos, 1.0);
  vec3 wn = mat3(uModel) * aNor;
  vWPos = wp.xyz;
  vNor = wn;
  vCol = aCol;
  vMat = aMat;
  vStretch = aStretch;
  // Normal-offset the shadow lookup to kill acne on the curved skin.
  vLPos = uLightVP * vec4(wp.xyz + normalize(wn) * 0.035, 1.0);
  gl_Position = uViewProj * wp;
}`;

  S.surfaceFS = `#version 300 es
precision highp float;
in vec3 vWPos;
in vec3 vNor;
in vec3 vCol;
in float vMat;
in float vStretch;
in vec4 vLPos;

uniform vec3 uEye;
uniform vec3 uLightDir, uLightColor;
uniform vec3 uFillDir, uFillColor;
uniform vec3 uAmbSky, uAmbGround;
uniform vec3 uRimColor, uSSSColor;
uniform vec3 uStretchTint, uStretchGlow;
uniform highp sampler2DShadow uShadow;
uniform vec2 uShadowTexel;
uniform float uTime;
uniform float uHighlightAmount;
uniform vec3 uFocusDir;      /* world direction it is attending to */
uniform vec3 uFocusColor;
uniform vec3 uCoreColor;
uniform float uVoice;        /* 0..1, rises while it is speaking */

out vec4 oColor;
${COMMON}

float ggx(vec3 N, vec3 V, vec3 L, float rough) {
  vec3 H = normalize(V + L);
  float a = max(rough * rough, 0.002);
  float a2 = a * a;
  float NdH = max(dot(N, H), 0.0);
  float NdV = max(dot(N, V), 1e-4);
  float NdL = max(dot(N, L), 0.0);
  float den = NdH * NdH * (a2 - 1.0) + 1.0;
  float D = a2 / (PI * den * den);
  float k = a * 0.5;
  float G = (NdV / (NdV * (1.0 - k) + k)) * (NdL / (NdL * (1.0 - k) + k));
  return D * G;
}

float sampleShadow(vec4 lpos) {
  vec3 p = lpos.xyz / lpos.w;
  p = p * 0.5 + 0.5;
  if (p.z > 1.0 || p.x < 0.0 || p.x > 1.0 || p.y < 0.0 || p.y > 1.0) return 1.0;
  float s = 0.0;
  for (int y = -1; y <= 1; y++) {
    for (int x = -1; x <= 1; x++) {
      s += texture(uShadow, vec3(p.xy + vec2(float(x), float(y)) * uShadowTexel, p.z - 0.0016));
    }
  }
  return s / 9.0;
}

void main() {
  vec3 N = normalize(vNor);
  if (!gl_FrontFacing) N = -N;
  vec3 V = normalize(uEye - vWPos);
  vec3 L = normalize(uLightDir);
  float m = vMat;

  float ndvAll = clamp(dot(N, V), 0.0, 1.0);

  // Halo rings: emissive filament, brightest edge-on.
  if (m > 5.5) {
    float edge = pow(1.0 - ndvAll, 1.4);
    oColor = vec4(vCol * (0.5 + 2.6 * edge) * (0.8 + 0.4 * uVoice), 1.0);
    return;
  }

  // The being itself: a thin-film shell over a lit core.
  if (m > 4.5) {
    float st2 = clamp(vStretch * 0.9, 0.0, 1.0);

    // Thin-film interference. Film thickness varies with view angle and drifts
    // slowly over the surface, so the hue sweeps the way an oil film does.
    float f = pow(1.0 - ndvAll, 1.5);
    float flow = sin(vWPos.y * 2.7 + uTime * 0.35)
               + sin(vWPos.x * 2.1 - uTime * 0.27)
               + sin(vWPos.z * 2.4 + uTime * 0.31);
    float phase = f * 2.6 + flow * 0.11 + uTime * 0.05 + st2 * 0.5;
    vec3 iri = 0.5 + 0.5 * cos(6.28318 * (phase + vec3(0.0, 0.33, 0.67)));

    // Lit core showing through the middle, iridescence gathering at the rim.
    vec3 col = uCoreColor * (0.09 + 0.30 * ndvAll);
    /* Pearl, not tie-dye: light through the middle, spectrum gathering
       outward. The film reaches full saturation well before the silhouette so
       the bands stay visible across the body. */
    vec3 film = mix(vec3(0.88, 0.92, 1.0), iri, clamp(f * 1.15, 0.0, 1.0));
    col += film * (0.17 + 1.40 * f);

    // A crisp specular keeps it reading as a surface, not a fog.
    col += uLightColor * ggx(N, V, L, 0.12) * 0.5;

    // The focal point: with no face, this is the only thing that can show
    // where its attention is, so it carries all of the looking.
    float focus = pow(max(dot(N, normalize(uFocusDir)), 0.0), 13.0);
    col += uFocusColor * focus * (1.5 + 0.8 * uVoice);

    // Speech travels outward from the focal point as concentric rings.
    if (uVoice > 0.001) {
      float band = dot(N, normalize(uFocusDir));
      float wave = 0.5 + 0.5 * sin(band * 17.0 - uTime * 7.5);
      col += iri * wave * uVoice * 0.30;
    }

    // Pulled hard, the shell stresses and glows along the strain.
    col += vec3(0.55, 0.80, 1.15) * pow(st2, 1.8) * 1.1;

    oColor = vec4(col, 1.0);
    return;
  }

  // Pure emissive material for the eye glints.
  if (m > 3.5) {
    oColor = vec4(vCol * (1.45 + uHighlightAmount * 0.5), 1.0);
    return;
  }

  float rough = 0.55, specI = 0.07, sssAmt = 1.0;
  if (m > 0.5 && m < 1.5)      { rough = 0.15; specI = 0.45; sssAmt = 0.12; }
  else if (m > 1.5 && m < 2.5) { rough = 0.09; specI = 0.70; sssAmt = 0.0;  }
  else if (m > 2.5)            { rough = 0.62; specI = 0.10; sssAmt = 0.05; }

  float st = clamp(vStretch * 0.72, 0.0, 1.0);
  vec3 base = vCol;
  if (m < 0.5) base = mix(base, uStretchTint, st * 0.8);

  float sh = sampleShadow(vLPos);
  float ndl = dot(N, L);

  // Wrapped diffuse reads as soft skin without a full BSSRDF.
  float wrap = clamp((ndl + 0.4) / 1.4, 0.0, 1.0);
  vec3 diffuse = uLightColor * wrap * mix(1.0, sh, 0.85);

  // Cheap forward-scatter term: light bleeding through thin stretched parts.
  float back = clamp(-ndl * 0.5 + 0.5, 0.0, 1.0);
  float thin = clamp(st * 1.4 + 0.15, 0.0, 1.0);
  vec3 sss = uSSSColor * pow(back, 2.2) * sssAmt * thin * 0.55;

  float ndf = clamp(dot(N, normalize(uFillDir)) * 0.5 + 0.5, 0.0, 1.0);
  vec3 fill = uFillColor * ndf * 0.55;

  vec3 ambient = mix(uAmbGround, uAmbSky, N.y * 0.5 + 0.5);

  vec3 lit = base * (diffuse + fill + ambient + sss);

  float spec = ggx(N, V, L, rough) * specI * sh;
  lit += uLightColor * spec;

  float ndv = clamp(dot(N, V), 0.0, 1.0);
  float rim = pow(1.0 - ndv, 3.2);
  lit += uRimColor * rim * (0.45 + 0.9 * st);

  // Rubber under tension goes hot: direct visual feedback for how far the
  // player has pulled a region.
  lit += uStretchGlow * pow(st, 2.4) * 0.9;

  oColor = vec4(lit, 1.0);
}`;

  /* ---- shadow depth pass ----------------------------------------------- */

  S.depthVS = `#version 300 es
layout(location = 0) in vec3 aPos;
uniform mat4 uModel;
uniform mat4 uLightVP;
void main() {
  gl_Position = uLightVP * uModel * vec4(aPos, 1.0);
}`;

  S.depthFS = `#version 300 es
precision highp float;
void main() {}`;

  /* ---- floor ------------------------------------------------------------ */

  S.floorVS = `#version 300 es
layout(location = 0) in vec3 aPos;
uniform mat4 uViewProj;
uniform mat4 uLightVP;
out vec3 vWPos;
out vec4 vLPos;
void main() {

  vLPos = uLightVP * vec4(aPos, 1.0);
  gl_Position = uViewProj * vec4(aPos, 1.0);
}`;

precision highp float;
in vec3 vWPos;
in vec4 vLPos;
uniform vec3 uEye;
uniform vec3 uGridColor, uFloorColor;
uniform vec3 uPoolPos, uPoolColor;
uniform highp sampler2DShadow uShadow;
uniform vec2 uShadowTexel;
uniform float uTime;
out vec4 oColor;
${COMMON}

float gridMask(vec2 p, float step) {
  vec2 q = p / step;
  vec2 g = abs(fract(q - 0.5) - 0.5) / max(fwidth(q), 1e-5);
  return 1.0 - min(min(g.x, g.y), 1.0);
}

void main() {

  float fade = smoothstep(26.0, 4.0, d);
  if (fade <= 0.001) discard;

  vec3 p = vLPos.xyz / vLPos.w * 0.5 + 0.5;
  float sh = 1.0;
  if (p.z <= 1.0 && p.x > 0.0 && p.x < 1.0 && p.y > 0.0 && p.y < 1.0) {

    for (int y = -2; y <= 2; y++) {
      for (int x = -2; x <= 2; x++) {

  col *= fade;

  oColor = vec4(col, 1.0);
}`;

  /* ---- post: bloom prefilter, blur, composite ---------------------------- */

  S.brightFS = `#version 300 es
precision highp float;
in vec2 vUV;
uniform sampler2D uScene;
uniform float uThreshold, uKnee;
out vec4 oColor;
void main() {

precision highp float;
in vec2 vUV;
uniform sampler2D uSource;
uniform vec2 uDirection;
out vec4 oColor;
void main() {

  const float o1 = 1.3846153846;
  const float o2 = 3.2307692308;

  c += texture(uSource, vUV - uDirection * o1).rgb * 0.3162162162;
  c += texture(uSource, vUV + uDirection * o2).rgb * 0.0702702703;
  c += texture(uSource, vUV - uDirection * o2).rgb * 0.0702702703;
  oColor = vec4(c, 1.0);

  S.compositeFS = `#version 300 es
precision highp float;
in vec2 vUV;
uniform sampler2D uScene;
uniform sampler2D uBloom;
uniform float uBloomIntensity;
uniform float uExposure;
uniform float uVignette;
uniform float uAberration;
uniform float uTime;
out vec4 oColor;
${COMMON}

void main() {
  vec2 uv = vUV;
  vec2 off = (uv - 0.5) * uAberration;

    c.r = texture(uScene, uv + off).r;
    c.g = texture(uScene, uv).g;
    c.b = texture(uScene, uv - off).b;

    c = texture(uScene, uv).rgb;

  c *= uExposure;
  c = acesFilm(c);

  c *= 1.0 - uVignette * pow(clamp(v * 1.5, 0.0, 1.0), 2.2);

  oColor = vec4(c, 1.0);

/* NOGGIN — WebGL2 renderer.

   Pipeline: shadow depth -> HDR scene (optionally multisampled, resolved) ->
   bloom prefilter + separable blur at half res -> tonemapped composite to the
   default framebuffer. The scene target is sized independently of the canvas
   so the app can trade internal resolution for frame time without touching the
   backing store, which is what keeps a 3840x2160 canvas inside a 120 Hz
   budget on hardware that cannot shade 8.3 Mpx natively. */

  'use strict';

  const S = NG.S;

  function compile(gl, type, src, label) {
    const sh = gl.createShader(type);
    gl.shaderSource(sh, src);
    gl.compileShader(sh);
    if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) {
      const log = gl.getShaderInfoLog(sh);
      console.error('[noggin] shader compile failed (' + label + ')\n' + log);
      throw new Error('Shader compile failed: ' + label + '\n' + log);
    }
    return sh;
  }

  function program(gl, vsSrc, fsSrc, label) {
    const p = gl.createProgram();
    const vs = compile(gl, gl.VERTEX_SHADER, vsSrc, label + '.vert');
    const fs = compile(gl, gl.FRAGMENT_SHADER, fsSrc, label + '.frag');
    gl.attachShader(p, vs);
    gl.attachShader(p, fs);
    gl.linkProgram(p);
    if (!gl.getProgramParameter(p, gl.LINK_STATUS)) {
      const log = gl.getProgramInfoLog(p);
      throw new Error('Program link failed: ' + label + '\n' + log);
    }
    gl.deleteShader(vs);
    gl.deleteShader(fs);
    const u = {};
    const count = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
    for (let i = 0; i < count; i++) {
      const info = gl.getActiveUniform(p, i);
      const name = info.name.replace(/\[0\]$/, '');
      u[name] = gl.getUniformLocation(p, name);
    }
    return { p: p, u: u };

    const attribs = {
      alpha: false,
      depth: false,
      stencil: false,
      antialias: false,
      premultipliedAlpha: false,
      preserveDrawingBuffer: false,
      desynchronized: true,
      powerPreference: 'high-performance'
    };
    const gl = canvas.getContext('webgl2', attribs);
    if (!gl) throw new Error('WebGL2 is not available in this browser.');

    this.canvas = canvas;
    this.gl = gl;

    this.extFloat = gl.getExtension('EXT_color_buffer_float');
    this.extFloatBlend = gl.getExtension('EXT_float_blend');
    this.extTimer = gl.getExtension('EXT_disjoint_timer_query_webgl2');

    this.maxTexture = gl.getParameter(gl.MAX_TEXTURE_SIZE);
    this.maxRenderbuffer = gl.getParameter(gl.MAX_RENDERBUFFER_SIZE);

    const dbg = gl.getExtension('WEBGL_debug_renderer_info');
    this.gpuName = dbg ? gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER);

    this.prog = {
      surface: program(gl, S.surfaceVS, S.surfaceFS, 'surface'),
      depth: program(gl, S.depthVS, S.depthFS, 'depth'),
      bg: program(gl, S.fullscreenVS, S.bgFS, 'bg'),
      floor: program(gl, S.floorVS, S.floorFS, 'floor'),
      bright: program(gl, S.fullscreenVS, S.brightFS, 'bright'),
      blur: program(gl, S.fullscreenVS, S.blurFS, 'blur'),
      composite: program(gl, S.fullscreenVS, S.compositeFS, 'composite')
    };

    this.emptyVAO = gl.createVertexArray();

    this.renderW = 1;
    this.renderH = 1;
    this.samples = 0;
    this.shadowSize = 0;

    this.fb = { scene: null, ms: null, bloomA: null, bloomB: null, shadow: null };
    this.tex = { scene: null, bloomA: null, bloomB: null, shadow: null };
    this.rb = { sceneDepth: null, msColor: null, msDepth: null };

    this._buildFloor();

    this.timerQueries = [];
    this.timerIndex = 0;
    this.gpuTimeMs = 0;
    this._timerActive = false;
  }

  /* ---- static geometry ------------------------------------------------- */

  Renderer.prototype._buildFloor = function () {
    const gl = this.gl;
    const y = -3.35, e = 30;
    const verts = new Float32Array([
      -e, y, -e, e, y, -e, e, y, e,
      -e, y, -e, e, y, e, -e, y, e
    ]);
    this.floorVAO = gl.createVertexArray();
    gl.bindVertexArray(this.floorVAO);
    const b = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, b);
    gl.bufferData(gl.ARRAY_BUFFER, verts, gl.STATIC_DRAW);
    gl.enableVertexAttribArray(0);
    gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 0, 0);
    gl.bindVertexArray(null);
  };



  /* ---- props (summoned objects) ------------------------------------------ */

  /* Props share the character's vertex layout so they go through the same
     surface shader, lighting and shadow pass. They never deform, so their
     buffers are static and `stretch` is a constant zero. */
  Renderer.prototype.createProp = function (mesh) {
    const gl = this.gl;
    const n = mesh.positions.length / 3;
    const dyn = new Float32Array(n * 7);
    const sta = new Float32Array(n * 4);
    for (let i = 0; i < n; i++) {
      dyn[i * 7] = mesh.positions[i * 3];
      dyn[i * 7 + 1] = mesh.positions[i * 3 + 1];
      dyn[i * 7 + 2] = mesh.positions[i * 3 + 2];
      dyn[i * 7 + 3] = mesh.normals[i * 3];
      dyn[i * 7 + 4] = mesh.normals[i * 3 + 1];
      dyn[i * 7 + 5] = mesh.normals[i * 3 + 2];
      dyn[i * 7 + 6] = 0;
      sta[i * 4] = mesh.colors[i * 3];
      sta[i * 4 + 1] = mesh.colors[i * 3 + 1];
      sta[i * 4 + 2] = mesh.colors[i * 3 + 2];
      sta[i * 4 + 3] = mesh.mats[i];
    }

    const vao = gl.createVertexArray();
    gl.bindVertexArray(vao);

    const vb = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, vb);
    gl.bufferData(gl.ARRAY_BUFFER, dyn, gl.STATIC_DRAW);
    gl.enableVertexAttribArray(S.LOC.POS);
    gl.vertexAttribPointer(S.LOC.POS, 3, gl.FLOAT, false, 28, 0);
    gl.enableVertexAttribArray(S.LOC.NOR);
    gl.vertexAttribPointer(S.LOC.NOR, 3, gl.FLOAT, false, 28, 12);
    gl.enableVertexAttribArray(S.LOC.STRETCH);
    gl.vertexAttribPointer(S.LOC.STRETCH, 1, gl.FLOAT, false, 28, 24);

    const cb = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, cb);
    gl.bufferData(gl.ARRAY_BUFFER, sta, gl.STATIC_DRAW);
    gl.enableVertexAttribArray(S.LOC.COL);
    gl.vertexAttribPointer(S.LOC.COL, 3, gl.FLOAT, false, 16, 0);
    gl.enableVertexAttribArray(S.LOC.MAT);
    gl.vertexAttribPointer(S.LOC.MAT, 1, gl.FLOAT, false, 16, 12);

    const ib = gl.createBuffer();
    gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, ib);
    gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, mesh.indices, gl.STATIC_DRAW);
    gl.bindVertexArray(null);

    return {
      vao: vao, count: mesh.indices.length, buffers: [vb, cb, ib],
      heightUnits: mesh.heightUnits, radiusUnits: mesh.radiusUnits, topUnits: mesh.topUnits
    };
  };

  Renderer.prototype.destroyProp = function (prop) {
    const gl = this.gl;
    if (!prop) return;
    gl.deleteVertexArray(prop.vao);
    prop.buffers.forEach(function (b) { gl.deleteBuffer(b); });
  };

  Renderer.prototype.drawProps = function (props, useProgram) {
    const gl = this.gl;
    if (!props || !props.length) return;
    for (let i = 0; i < props.length; i++) {
      const p = props[i];
      if (!p.handle) continue;
      gl.uniformMatrix4fv(useProgram.u.uModel, false, p.matrix);
      gl.bindVertexArray(p.handle.vao);
      gl.drawElements(gl.TRIANGLES, p.handle.count, gl.UNSIGNED_INT, 0);
    }
  };

  /* ---- character mesh --------------------------------------------------- */

  Renderer.prototype.setMesh = function (mesh) {
    const gl = this.gl;

    /* Switching quality rebuilds the mesh; release the previous GPU objects
       so repeated preset changes do not leak buffers. */
    if (this.meshVAOs) {
      this.meshVAOs.forEach(function (v) { gl.deleteVertexArray(v); });
      this.dynBuffers.forEach(function (b) { gl.deleteBuffer(b); });
      gl.deleteBuffer(this.staticBuffer);
      gl.deleteBuffer(this.indexBuffer);
    }

    this.mesh = mesh;
    this.vertexCount = mesh.total;
    this.indexCount = mesh.indices.length;
    this.dyn = new Float32Array(mesh.total * 7);

    const staticData = new Float32Array(mesh.total * 4);
    for (let i = 0; i < mesh.total; i++) {
      staticData[i * 4] = mesh.colors[i * 3];
      staticData[i * 4 + 1] = mesh.colors[i * 3 + 1];
      staticData[i * 4 + 2] = mesh.colors[i * 3 + 2];
      staticData[i * 4 + 3] = mesh.mats[i];
    }
    this.staticBuffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, this.staticBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, staticData, gl.STATIC_DRAW);

    this.indexBuffer = gl.createBuffer();
    gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, this.indexBuffer);
    gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, mesh.indices, gl.STATIC_DRAW);

    /* Two interleaved streaming buffers, alternated per frame: writing the
       buffer the GPU is still reading from is the classic way to stall a
       driver, and at 120 Hz there is no slack to absorb that. */
    const ds = 7 * 4;
    this.dynBuffers = [];
    this.meshVAOs = [];
    for (let i = 0; i < 2; i++) {
      const vao = gl.createVertexArray();
      gl.bindVertexArray(vao);

      const buf = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, buf);
      gl.bufferData(gl.ARRAY_BUFFER, this.dyn.byteLength, gl.STREAM_DRAW);
      gl.enableVertexAttribArray(S.LOC.POS);
      gl.vertexAttribPointer(S.LOC.POS, 3, gl.FLOAT, false, ds, 0);
      gl.enableVertexAttribArray(S.LOC.NOR);
      gl.vertexAttribPointer(S.LOC.NOR, 3, gl.FLOAT, false, ds, 12);
      gl.enableVertexAttribArray(S.LOC.STRETCH);
      gl.vertexAttribPointer(S.LOC.STRETCH, 1, gl.FLOAT, false, ds, 24);

      gl.bindBuffer(gl.ARRAY_BUFFER, this.staticBuffer);
      gl.enableVertexAttribArray(S.LOC.COL);
      gl.vertexAttribPointer(S.LOC.COL, 3, gl.FLOAT, false, 16, 0);
      gl.enableVertexAttribArray(S.LOC.MAT);
      gl.vertexAttribPointer(S.LOC.MAT, 1, gl.FLOAT, false, 16, 12);

      gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, this.indexBuffer);

      this.dynBuffers.push(buf);
      this.meshVAOs.push(vao);
    }
    this.dynIndex = 0;
    gl.bindVertexArray(null);
  };

  /* Interleave the solver output and stream it into the next buffer. */
  Renderer.prototype.updateDynamic = function (pos, nrm, stretch) {
    const gl = this.gl;
    const dyn = this.dyn;
    const n = this.vertexCount;
    for (let i = 0; i < n; i++) {
      const s = i * 7, p = i * 3;
      dyn[s] = pos[p];
      dyn[s + 1] = pos[p + 1];
      dyn[s + 2] = pos[p + 2];
      dyn[s + 3] = nrm[p];
      dyn[s + 4] = nrm[p + 1];
      dyn[s + 5] = nrm[p + 2];
      dyn[s + 6] = stretch[i];
    }
    this.dynIndex ^= 1;
    gl.bindBuffer(gl.ARRAY_BUFFER, this.dynBuffers[this.dynIndex]);
    gl.bufferSubData(gl.ARRAY_BUFFER, 0, dyn);
  };

  /* ---- render targets ---------------------------------------------------- */

  function makeTex(gl, w, h, internal, filter) {
    const t = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, t);
    gl.texStorage2D(gl.TEXTURE_2D, 1, internal, w, h);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, filter);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, filter);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    return t;
  }

  Renderer.prototype._releaseTargets = function () {
    const gl = this.gl;
    ['scene', 'ms', 'bloomA', 'bloomB'].forEach(function (k) {
      if (this.fb[k]) { gl.deleteFramebuffer(this.fb[k]); this.fb[k] = null; }
    }, this);
    ['scene', 'bloomA', 'bloomB'].forEach(function (k) {
      if (this.tex[k]) { gl.deleteTexture(this.tex[k]); this.tex[k] = null; }
    }, this);
    ['sceneDepth', 'msColor', 'msDepth'].forEach(function (k) {
      if (this.rb[k]) { gl.deleteRenderbuffer(this.rb[k]); this.rb[k] = null; }
    }, this);
  };

  Renderer.prototype.setShadowSize = function (size) {
    const gl = this.gl;
    if (this.shadowSize === size) return;
    if (this.fb.shadow) { gl.deleteFramebuffer(this.fb.shadow); this.fb.shadow = null; }
    if (this.tex.shadow) { gl.deleteTexture(this.tex.shadow); this.tex.shadow = null; }
    this.shadowSize = size;

    const t = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, t);
    gl.texStorage2D(gl.TEXTURE_2D, 1, gl.DEPTH_COMPONENT24, size, size);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_COMPARE_MODE, gl.COMPARE_REF_TO_TEXTURE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_COMPARE_FUNC, gl.LEQUAL);
    this.tex.shadow = t;

    const f = gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER, f);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.DEPTH_ATTACHMENT, gl.TEXTURE_2D, t, 0);
    gl.drawBuffers([gl.NONE]);
    gl.readBuffer(gl.NONE);
    this.fb.shadow = f;
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  };

  /* Allocate the scene chain at `w` x `h`. Returns true when reallocation
     actually happened. */
  Renderer.prototype.setRenderSize = function (w, h, samples) {
    const gl = this.gl;
    w = Math.max(16, Math.min(w | 0, this.maxTexture));
    h = Math.max(16, Math.min(h | 0, this.maxTexture));
    samples = Math.min(samples | 0, this.maxSamples);
    if (w === this.renderW && h === this.renderH && samples === this.samples) return false;

    this._releaseTargets();
    this.renderW = w;
    this.renderH = h;
    this.samples = samples;

    const colorFmt = this.hdr ? gl.RGBA16F : gl.RGBA8;

    this.tex.scene = makeTex(gl, w, h, colorFmt, gl.LINEAR);
    this.fb.scene = gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER, this.fb.scene);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, this.tex.scene, 0);
    if (samples === 0) {
      this.rb.sceneDepth = gl.createRenderbuffer();
      gl.bindRenderbuffer(gl.RENDERBUFFER, this.rb.sceneDepth);
      gl.renderbufferStorage(gl.RENDERBUFFER, gl.DEPTH_COMPONENT24, w, h);
      gl.framebufferRenderbuffer(gl.FRAMEBUFFER, gl.DEPTH_ATTACHMENT, gl.RENDERBUFFER, this.rb.sceneDepth);
    }

    if (samples > 0) {
      this.rb.msColor = gl.createRenderbuffer();
      gl.bindRenderbuffer(gl.RENDERBUFFER, this.rb.msColor);
      gl.renderbufferStorageMultisample(gl.RENDERBUFFER, samples, colorFmt, w, h);
      this.rb.msDepth = gl.createRenderbuffer();
      gl.bindRenderbuffer(gl.RENDERBUFFER, this.rb.msDepth);
      gl.renderbufferStorageMultisample(gl.RENDERBUFFER, samples, gl.DEPTH_COMPONENT24, w, h);
      this.fb.ms = gl.createFramebuffer();
      gl.bindFramebuffer(gl.FRAMEBUFFER, this.fb.ms);
      gl.framebufferRenderbuffer(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.RENDERBUFFER, this.rb.msColor);
      gl.framebufferRenderbuffer(gl.FRAMEBUFFER, gl.DEPTH_ATTACHMENT, gl.RENDERBUFFER, this.rb.msDepth);
      if (gl.checkFramebufferStatus(gl.FRAMEBUFFER) !== gl.FRAMEBUFFER_COMPLETE) {
        /* Fall back to single-sampled rather than failing outright. */
        gl.deleteFramebuffer(this.fb.ms);
        this.fb.ms = null;
        this.samples = 0;
        this.rb.sceneDepth = gl.createRenderbuffer();
        gl.bindRenderbuffer(gl.RENDERBUFFER, this.rb.sceneDepth);
        gl.renderbufferStorage(gl.RENDERBUFFER, gl.DEPTH_COMPONENT24, w, h);
        gl.bindFramebuffer(gl.FRAMEBUFFER, this.fb.scene);
        gl.framebufferRenderbuffer(gl.FRAMEBUFFER, gl.DEPTH_ATTACHMENT, gl.RENDERBUFFER, this.rb.sceneDepth);
      }
    }

    const bw = Math.max(8, w >> 1), bh = Math.max(8, h >> 1);
    this.bloomW = bw; this.bloomH = bh;
    this.tex.bloomA = makeTex(gl, bw, bh, colorFmt, gl.LINEAR);
    this.tex.bloomB = makeTex(gl, bw, bh, colorFmt, gl.LINEAR);
    this.fb.bloomA = gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER, this.fb.bloomA);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, this.tex.bloomA, 0);
    this.fb.bloomB = gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER, this.fb.bloomB);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, this.tex.bloomB, 0);

    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    return true;
  };

  /* ---- GPU timing --------------------------------------------------------- */

  Renderer.prototype.beginTimer = function () {
    const gl = this.gl, ext = this.extTimer;
    if (!ext) return;
    if (this.timerQueries.length < 4) {
      for (let i = this.timerQueries.length; i < 4; i++) {
        this.timerQueries.push({ q: gl.createQuery(), pending: false });
      }
    }
    const slot = this.timerQueries[this.timerIndex];
    if (slot.pending) return;
    gl.beginQuery(ext.TIME_ELAPSED_EXT, slot.q);
    slot.pending = true;
    this._timerActive = true;
  };

  Renderer.prototype.endTimer = function () {
    const gl = this.gl, ext = this.extTimer;
    if (!ext || !this._timerActive) return;
    gl.endQuery(ext.TIME_ELAPSED_EXT);
    this._timerActive = false;
    this.timerIndex = (this.timerIndex + 1) % this.timerQueries.length;

    const disjoint = gl.getParameter(ext.GPU_DISJOINT_EXT);
    for (let i = 0; i < this.timerQueries.length; i++) {
      const slot = this.timerQueries[i];
      if (!slot.pending) continue;
      if (disjoint) { slot.pending = false; continue; }
      if (gl.getQueryParameter(slot.q, gl.QUERY_RESULT_AVAILABLE)) {
        const ns = gl.getQueryParameter(slot.q, gl.QUERY_RESULT);
        slot.pending = false;
        const ms = ns / 1e6;
        this.gpuTimeMs = this.gpuTimeMs ? this.gpuTimeMs * 0.85 + ms * 0.15 : ms;
      }
    }
  };

  /* ---- frame -------------------------------------------------------------- */

  Renderer.prototype.drawFullscreen = function () {
    const gl = this.gl;
    gl.bindVertexArray(this.emptyVAO);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  };

  Renderer.prototype.renderShadow = function (state) {
    const gl = this.gl;
    gl.bindFramebuffer(gl.FRAMEBUFFER, this.fb.shadow);
    gl.viewport(0, 0, this.shadowSize, this.shadowSize);
    gl.enable(gl.DEPTH_TEST);
    gl.depthMask(true);
    gl.depthFunc(gl.LEQUAL);
    gl.clear(gl.DEPTH_BUFFER_BIT);

    const pr = this.prog.depth;
    gl.useProgram(pr.p);
    gl.uniformMatrix4fv(pr.u.uModel, false, state.model);
    gl.uniformMatrix4fv(pr.u.uLightVP, false, state.lightVP);
    gl.bindVertexArray(this.meshVAOs[this.dynIndex]);
    gl.drawElements(gl.TRIANGLES, this.indexCount, gl.UNSIGNED_INT, 0);
    this.drawProps(state.props, pr);
  };

  Renderer.prototype.renderScene = function (state) {
    const gl = this.gl;
    const target = this.samples > 0 ? this.fb.ms : this.fb.scene;
    gl.bindFramebuffer(gl.FRAMEBUFFER, target);
    gl.viewport(0, 0, this.renderW, this.renderH);
    gl.disable(gl.BLEND);
    gl.enable(gl.DEPTH_TEST);
    gl.depthMask(true);
    gl.clearColor(0, 0, 0, 1);
    gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);

    /* background */
    let pr = this.prog.bg;
    gl.useProgram(pr.p);
    gl.disable(gl.DEPTH_TEST);
    gl.depthMask(false);
    gl.uniform3fv(pr.u.uRayF, state.rayF);
    gl.uniform3fv(pr.u.uRayR, state.rayR);
    gl.uniform3fv(pr.u.uRayU, state.rayU);
    gl.uniform1f(pr.u.uTime, state.time);
    gl.uniform3fv(pr.u.uTopColor, state.sky.top);
    gl.uniform3fv(pr.u.uBotColor, state.sky.bottom);
    gl.uniform3fv(pr.u.uGlowColor, state.sky.glowColor);
    gl.uniform1f(pr.u.uGlow, state.sky.glow);
    this.drawFullscreen();

    gl.enable(gl.DEPTH_TEST);
    gl.depthMask(true);

    /* floor */
    if (state.showFloor) {
      pr = this.prog.floor;
      gl.useProgram(pr.p);
      gl.uniformMatrix4fv(pr.u.uViewProj, false, state.viewProj);
      gl.uniformMatrix4fv(pr.u.uLightVP, false, state.lightVP);
      gl.uniform3fv(pr.u.uEye, state.eye);
      gl.uniform3fv(pr.u.uGridColor, state.floor.grid);
      gl.uniform3fv(pr.u.uFloorColor, state.floor.base);
      gl.uniform1f(pr.u.uTime, state.time);
      gl.uniform3fv(pr.u.uPoolPos, state.poolPos);
      gl.uniform3fv(pr.u.uPoolColor, state.poolColor);
      gl.uniform2f(pr.u.uShadowTexel, 1 / this.shadowSize, 1 / this.shadowSize);
      gl.activeTexture(gl.TEXTURE0);
      gl.bindTexture(gl.TEXTURE_2D, this.tex.shadow);
      gl.uniform1i(pr.u.uShadow, 0);
      gl.bindVertexArray(this.floorVAO);
      gl.drawArrays(gl.TRIANGLES, 0, 6);
    }

    /* character */
    pr = this.prog.surface;
    gl.useProgram(pr.p);
    gl.uniformMatrix4fv(pr.u.uModel, false, state.model);
    gl.uniformMatrix4fv(pr.u.uViewProj, false, state.viewProj);
    gl.uniformMatrix4fv(pr.u.uLightVP, false, state.lightVP);
    gl.uniform3fv(pr.u.uEye, state.eye);
    const L = state.light;
    gl.uniform3fv(pr.u.uLightDir, L.dir);
    gl.uniform3fv(pr.u.uLightColor, L.color);
    gl.uniform3fv(pr.u.uFillDir, L.fillDir);
    gl.uniform3fv(pr.u.uFillColor, L.fillColor);
    gl.uniform3fv(pr.u.uAmbSky, L.ambSky);
    gl.uniform3fv(pr.u.uAmbGround, L.ambGround);
    gl.uniform3fv(pr.u.uRimColor, L.rim);
    gl.uniform3fv(pr.u.uSSSColor, L.sss);
    gl.uniform3fv(pr.u.uStretchTint, L.stretchTint);
    gl.uniform3fv(pr.u.uStretchGlow, L.stretchGlow);
    gl.uniform1f(pr.u.uTime, state.time);
    gl.uniform1f(pr.u.uHighlightAmount, state.highlight);
    gl.uniform3fv(pr.u.uFocusDir, state.focusDir);
    gl.uniform3fv(pr.u.uFocusColor, state.being.focus);
    gl.uniform3fv(pr.u.uCoreColor, state.being.core);
    gl.uniform1f(pr.u.uVoice, state.voice);
    gl.uniform2f(pr.u.uShadowTexel, 1 / this.shadowSize, 1 / this.shadowSize);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, this.tex.shadow);
    gl.uniform1i(pr.u.uShadow, 0);
    gl.bindVertexArray(this.meshVAOs[this.dynIndex]);
    gl.drawElements(gl.TRIANGLES, this.indexCount, gl.UNSIGNED_INT, 0);
    this.drawProps(state.props, pr);
    this.drawProps(state.halos, pr);

    if (this.samples > 0) {
      gl.bindFramebuffer(gl.READ_FRAMEBUFFER, this.fb.ms);
      gl.bindFramebuffer(gl.DRAW_FRAMEBUFFER, this.fb.scene);
      gl.blitFramebuffer(0, 0, this.renderW, this.renderH,
        0, 0, this.renderW, this.renderH, gl.COLOR_BUFFER_BIT, gl.NEAREST);
      gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    }
  };

  Renderer.prototype.renderPost = function (state) {
    const gl = this.gl;
    gl.disable(gl.DEPTH_TEST);
    gl.depthMask(false);
    gl.disable(gl.BLEND);

    if (state.bloom > 0) {
      gl.viewport(0, 0, this.bloomW, this.bloomH);
      let pr = this.prog.bright;
      gl.bindFramebuffer(gl.FRAMEBUFFER, this.fb.bloomA);
      gl.useProgram(pr.p);
      gl.activeTexture(gl.TEXTURE0);
      gl.bindTexture(gl.TEXTURE_2D, this.tex.scene);
      gl.uniform1i(pr.u.uScene, 0);
      gl.uniform1f(pr.u.uThreshold, state.bloomThreshold);
      gl.uniform1f(pr.u.uKnee, 0.55);
      this.drawFullscreen();

      pr = this.prog.blur;
      gl.useProgram(pr.p);
      gl.uniform1i(pr.u.uSource, 0);
      for (let pass = 0; pass < state.bloomPasses; pass++) {
        gl.bindFramebuffer(gl.FRAMEBUFFER, this.fb.bloomB);
        gl.bindTexture(gl.TEXTURE_2D, this.tex.bloomA);
        gl.uniform2f(pr.u.uDirection, 1 / this.bloomW, 0);
        this.drawFullscreen();

        gl.bindFramebuffer(gl.FRAMEBUFFER, this.fb.bloomA);
        gl.bindTexture(gl.TEXTURE_2D, this.tex.bloomB);
        gl.uniform2f(pr.u.uDirection, 0, 1 / this.bloomH);
        this.drawFullscreen();
      }
    }

    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.viewport(0, 0, this.canvas.width, this.canvas.height);
    const pr = this.prog.composite;
    gl.useProgram(pr.p);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, this.tex.scene);
    gl.uniform1i(pr.u.uScene, 0);
    gl.activeTexture(gl.TEXTURE1);
    gl.bindTexture(gl.TEXTURE_2D, state.bloom > 0 ? this.tex.bloomA : this.tex.scene);
    gl.uniform1i(pr.u.uBloom, 1);
    gl.uniform1f(pr.u.uBloomIntensity, state.bloom);
    gl.uniform1f(pr.u.uExposure, state.exposure);

/* NOGGIN — fully procedural audio. No assets: every sound is synthesised from
   oscillators and a shared noise buffer, so the whole thing stays a handful of
   text files. */
(function (NG) {
  'use strict';

  function Audio() {
    this.ctx = null;

    this.ready = false;
    this.master = null;
    this.noiseBuffer = null;

    if (this.ready) return true;

      this.ctx = new Ctor();
    } catch (e) {
      return false;
    }
    const ctx = this.ctx;

    this.master = ctx.createGain();
    this.master.gain.value = this.enabled ? 0.75 : 0.0;
    const comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -14;
    comp.ratio.value = 6;
    comp.attack.value = 0.004;
    comp.release.value = 0.18;
    this.master.connect(comp);
    comp.connect(ctx.destination);

    /* One second of white noise, reused by every percussive sound. */
    const len = Math.floor(ctx.sampleRate);
    const buf = ctx.createBuffer(1, len, ctx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
    this.noiseBuffer = buf;

    /* Continuous voice driven by how far the face is being pulled. */
    const g = ctx.createGain();
    g.gain.value = 0;
    const filt = ctx.createBiquadFilter();
    filt.type = 'lowpass';
    filt.frequency.value = 400;
    filt.Q.value = 6;
    const oscA = ctx.createOscillator();
    oscA.type = 'sawtooth';
    oscA.frequency.value = 90;
    const oscB = ctx.createOscillator();
    oscB.type = 'triangle';
    oscB.frequency.value = 90 * 1.005;
    oscA.connect(filt);
    oscB.connect(filt);
    filt.connect(g);
    g.connect(this.master);
    oscA.start();
    oscB.start();
    this.stretch = { gain: g, filter: filt, oscA: oscA, oscB: oscB };

    this.ready = true;
    return true;
  };

    if (!this.ready) this.init();

    const g = ctx.createGain();

    osc.frequency.exponentialRampToValueAtTime(70 + s * 40, t + dur);

    lfo.frequency.exponentialRampToValueAtTime(4, t + dur);
    const lfoGain = ctx.createGain();
    lfoGain.gain.setValueAtTime(top * 0.32, t);
    lfoGain.gain.exponentialRampToValueAtTime(1, t + dur);
    lfo.connect(lfoGain);
    lfoGain.connect(osc.frequency);

    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.16 + s * 0.16, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);

    const osc = ctx.createOscillator();
    osc.type = 'square';
    osc.frequency.setValueAtTime(freq, t);
    osc.frequency.exponentialRampToValueAtTime(freq * 1.16, t + 0.05);

    filt.type = 'lowpass';
    filt.frequency.value = 1700;

    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.05, t + 0.006);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.075);

    osc.connect(filt); filt.connect(g); g.connect(this.master);
