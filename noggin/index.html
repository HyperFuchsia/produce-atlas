<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Produce Atlas</title>
<style>
  /* A lit display case in a dark room. Committed single theme on purpose:
     the stage is a rendered 3-D scene, and a light mode would fight it. */
  :root {
    --ink:      #0C0F0D;
    --ink-2:    #141917;
    --line:     rgba(233, 229, 218, 0.13);
    --line-2:   rgba(233, 229, 218, 0.07);
    --paper:    #E9E5DA;
    --muted:    #939990;
    --accent:   #D6A93C;
    --accent-2: #F0C55E;

    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Times New Roman", serif;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;

    --panel-w: min(400px, 34vw);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    background: var(--ink);
    color: var(--paper);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
  }

  #gl {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    touch-action: none;
    cursor: grab;
  }
  #gl:active { cursor: grabbing; }

  /* ---- the conversation column ---------------------------------------- */

  /* Docked rather than floating: one surface the stage runs behind, so the
     eye reads stage-then-notes instead of hunting across scattered cards. */
  #panel {
    position: fixed;
    top: 0;
    left: 0;
    bottom: 0;
    width: var(--panel-w);
    display: flex;
    flex-direction: column;
    background: linear-gradient(to right, rgba(9, 12, 10, 0.94) 60%, rgba(9, 12, 10, 0.74));
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    border-right: 1px solid var(--line);
    z-index: 10;
  }

  header {
    padding: 26px 26px 18px;
    border-bottom: 1px solid var(--line-2);
  }
  h1 {
    margin: 0;
    font-family: var(--serif);
    font-size: 25px;
    font-weight: 400;
    letter-spacing: 0.01em;
    color: var(--paper);
  }
  h1 em {
    font-style: italic;
    color: var(--accent);
  }
  .sub {
    margin-top: 7px;
    font-size: 11.5px;
    line-height: 1.5;
    color: var(--muted);
  }

  /* Starter prompts: the atlas holds 26 specimens, so naming a few beats
     making people guess at a blank box. */
  #chips {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    padding: 14px 26px 0;
  }
  .chip {
    font-family: var(--sans);
    font-size: 11px;
    color: var(--muted);
    background: transparent;
    border: 1px solid var(--line);
    border-radius: 100px;
    padding: 5px 11px;
    cursor: pointer;
    transition: color 0.15s ease, border-color 0.15s ease;
  }
  .chip:hover, .chip:focus-visible {
    color: var(--accent-2);
    border-color: var(--accent);
    outline: none;
  }

  #transcript {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding: 20px 26px 8px;
    display: flex;
    flex-direction: column;
    gap: 15px;
    scrollbar-width: thin;
    scrollbar-color: var(--line) transparent;
  }
  #transcript::-webkit-scrollbar { width: 7px; }
  #transcript::-webkit-scrollbar-thumb {
    background: var(--line);
    border-radius: 4px;
  }

  .msg {
    font-size: 13.5px;
    line-height: 1.62;
    text-wrap: pretty;
  }
  .msg.him { color: var(--paper); }
  .msg.him.typing::after {
    content: "";
    display: inline-block;
    width: 7px;
    height: 14px;
    margin-left: 2px;
    vertical-align: -2px;
    background: var(--accent);
    animation: blink 1s steps(2) infinite;
  }
  @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }

  .msg.you {
    align-self: flex-end;
    max-width: 88%;
    color: var(--accent-2);
    font-size: 12.5px;
    text-align: right;
  }
  .msg.you::before {
    content: "you  ";
    color: var(--muted);
    font-size: 10px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
  }

  #composer {
    display: flex;
    gap: 8px;
    padding: 16px 26px 22px;
    border-top: 1px solid var(--line-2);
  }
  #prompt {
    flex: 1;
    min-width: 0;
    background: var(--ink-2);
    border: 1px solid var(--line);
    border-radius: 7px;
    color: var(--paper);
    font-family: var(--sans);
    /* 16px minimum: anything smaller makes iOS zoom the page on focus. */
    font-size: 16px;
    padding: 10px 13px;
    outline: none;
    transition: border-color 0.15s ease;
  }
  #prompt:focus { border-color: var(--accent); }
  #prompt::placeholder { color: rgba(147, 153, 144, 0.7); }
  #send {
    border: 1px solid var(--accent);
    background: transparent;
    color: var(--accent);
    border-radius: 7px;
    padding: 0 16px;
    font-family: var(--sans);
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease;
  }
  #send:hover, #send:focus-visible {
    background: var(--accent);
    color: var(--ink);
    outline: none;
  }

  /* ---- specimen caption ------------------------------------------------ */

  #tags {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 8;
  }
  .caption {
    position: absolute;
    transform: translate(-50%, -50%);
    text-align: center;
    white-space: nowrap;
    transition: opacity 0.3s ease;
  }
  .caption .name {
    font-family: var(--serif);
    font-style: italic;
    font-size: 15px;
    color: var(--paper);
    text-shadow: 0 2px 14px rgba(0, 0, 0, 0.9);
  }
  .caption .size {
    display: block;
    margin-top: 2px;
    font-family: var(--mono);
    font-size: 10.5px;
    letter-spacing: 0.1em;
    color: var(--accent);
    font-variant-numeric: tabular-nums;
    text-shadow: 0 2px 14px rgba(0, 0, 0, 0.9);
  }
  /* A hairline dropping from the caption to the specimen. */
  .caption::after {
    content: "";
    position: absolute;
    left: 50%;
    top: calc(100% + 5px);
    width: 1px;
    height: 16px;
    background: linear-gradient(to bottom, var(--accent), transparent);
  }

  /* ---- sound ------------------------------------------------------------ */

  #sound {
    position: fixed;
    right: 20px;
    bottom: 18px;
    z-index: 10;
    border: none;
    background: transparent;
    color: var(--muted);
    font-family: var(--sans);
    font-size: 10.5px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    cursor: pointer;
    padding: 6px 2px;
    transition: color 0.15s ease;
  }
  #sound:hover, #sound:focus-visible { color: var(--paper); outline: none; }

  /* ---- boot ------------------------------------------------------------- */

  #boot {
    position: fixed;
    inset: 0;
    z-index: 30;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--ink);
    font-family: var(--serif);
    font-style: italic;
    font-size: 16px;
    color: var(--muted);
    transition: opacity 0.5s ease;
  }
  #boot.gone { opacity: 0; pointer-events: none; }

  #fail {
    max-width: 420px;
    padding: 0 24px;
    text-align: center;
    line-height: 1.6;
    font-family: var(--sans);
    font-style: normal;
    font-size: 13px;
  }

  @media (prefers-reduced-motion: reduce) {
    .msg.him.typing::after { animation: none; }
    #boot { transition: none; }
  }

  /* Narrow: the column becomes a sheet along the bottom, stage above it. */
  @media (max-width: 760px) {
    :root { --panel-w: 100%; }
    #panel {
      top: auto;
      height: 52vh;
      border-right: none;
      border-top: 1px solid var(--line);
      background: linear-gradient(to top, rgba(9, 12, 10, 0.96) 70%, rgba(9, 12, 10, 0.8));
    }
    header { padding: 16px 20px 12px; }
    h1 { font-size: 20px; }
    #chips { padding: 10px 20px 0; }
    #transcript { padding: 14px 20px 6px; }
    #composer { padding: 12px 20px 16px; }
    #sound { bottom: auto; top: 14px; right: 16px; }
  }
</style>
</head>
<body>

<canvas id="gl"></canvas>

<div id="tags"></div>

<div id="panel">
  <header>
    <h1>Produce <em>Atlas</em></h1>
    <p class="sub">Name a food plant. He brings one into the room at its real size and tells you far more about it than you asked for.</p>
  </header>

  <div id="chips"></div>

  <div id="transcript"></div>

  <form id="composer" autocomplete="off">
    <input id="prompt" type="text" placeholder="let's talk about an apple" maxlength="200" aria-label="Ask about a food plant">
    <button id="send" type="submit">Send</button>
  </form>
</div>

<button id="sound" type="button">Sound on</button>

<div id="boot"><span>preparing the specimen…</span></div>

<script src="src/math.js"></script>
<script src="src/geometry.js"></script>
<script src="src/softbody.js"></script>
<script src="src/produce.js"></script>
<script src="src/knowledge.js"></script>
<script src="src/brain.js"></script>
<script src="src/chat.js"></script>
<script src="src/shaders.js"></script>
<script src="src/renderer.js"></script>
<script src="src/audio.js"></script>
<script src="src/main.js"></script>
</body>
</html>
