  const now=performance.now()/1000;
  const cyc=(now+def.freezeOff)%11;
  ANIM.frozen=cyc>8.7&&cyc<9.9; // full stop: the worst thing it does is nothing
  if(!ANIM.frozen)ANIM.t+=dt;
}
function radiusAt(def,u){
  const n=def.radii.length-1,x=u*n,i=clamp(Math.floor(x),0,n-1),f=x-i;
  if(def.step)return def.radii[f<0.5?i:i+1]; // machined: no fairing between stations
  const a=def.radii[i],b=def.radii[i+1];
  return a+(b-a)*(0.5-0.5*Math.cos(f*Math.PI));
}
function inCut(def,u,a){
  a=((a%TAU)+TAU)%TAU;
  for(const c of def.cuts){
    if(u<c.u0||u>c.u1)continue;
    if(c.a0<=c.a1){if(a>=c.a0&&a<=c.a1)return true;}
    else if(a>=c.a0||a<=c.a1)return true;
  }
  return false;
}
function drawAlien(L,cid,dt){
  const r=L.plate,def=ALIEN_DEFS[cid];
  if(!def)return;
  alienAnimTick(dt,def);
  const t=ANIM.t;
  box(r.x,r.y,r.w,r.h,C.chassis);
  label(r.x+6,r.y+4,"CONTACT IMAGE — SYNTHETIC RECONSTRUCTION",C.label,9);
  label(r.x+r.w-6,r.y+4,cultureById[cid].designation,C.contact,9,"right");
  if(ANIM.frozen)label(r.x+r.w/2,r.y+r.h-16,"MOTION HOLD",C.warn,9,"center");
  const cx=r.x+r.w/2,cy=r.y+r.h/2;
  const SC=Math.min(r.w,r.h)*0.30;
  const yaw=t*0.22,cyw=Math.cos(yaw),syw=Math.sin(yaw);
  const pitch=-0.12,cp=Math.cos(pitch),sp=Math.sin(pitch);
  const bob=Math.sin(t*0.4)*SC*0.02;
  const proj=p=>{ // creature frame → screen; perspective by hand
    let x=p[0]*cyw-p[2]*syw,z=p[0]*syw+p[2]*cyw,y=p[1];
    let y2=y*cp-z*sp,z2=y*sp+z*cp;
    const f=4.2;
    const s=f/(f+z2/SC*0.9);
    return {x:cx+x*s,y:cy+(y2+bob)*s,z:z2};
  };
  const NU=13,NT=16;
  const surf=(u,th)=>{
    const rad=radiusAt(def,u)*def.cross(th,u)*SC*1.9;
    const bend=Math.sin(u*2.4+t*0.3)*SC*0.05;
    return [bend+Math.cos(th)*rad,(u-0.5)*def.height*SC,Math.sin(th)*rad];
  };
  sctx.save();
  sctx.beginPath();sctx.rect(r.x+1,r.y+1,r.w-2,r.h-2);sctx.clip();
  sctx.lineWidth=1;
  const P=[];
  for(let iu=0;iu<=NU;iu++){
    P[iu]=[];
    for(let it=0;it<NT;it++)P[iu][it]=proj(surf(iu/NU,it/NT*TAU));
  }
  const seg=(a,b,cut)=>{
    if(cut)return;
    const zb=clamp(0.62-((a.z+b.z)/2)/(SC*2.4),0.16,0.95);
    sctx.strokeStyle=`rgba(255,79,216,${zb})`;
    sctx.beginPath();sctx.moveTo(a.x,a.y);sctx.lineTo(b.x,b.y);sctx.stroke();
  };
  for(let iu=0;iu<=NU;iu++)for(let it=0;it<NT;it++){
    const u=iu/NU,a0=it/NT*TAU,a1=((it+1)%NT)/NT*TAU;
    seg(P[iu][it],P[iu][(it+1)%NT],inCut(def,u,a0)||inCut(def,u,a1));
    if(iu<NU&&it%2===0)
      seg(P[iu][it],P[iu+1][it],inCut(def,u,a0)||inCut(def,(iu+1)/NU,a0));
  }
  // features sit inside their cut windows, on black
  for(const e of def.eyes||[]){
    const q=proj(surf(e.u,e.a).map((v,i)=>i===0||i===2?v*0.72:v));
    if(e.style==="lens"){
      sctx.strokeStyle=C.contact;
      for(const rr of [3,6])
        {sctx.beginPath();sctx.arc(q.x,q.y,rr,0,TAU);sctx.stroke();}
    }else if(e.style==="pore"){
      sctx.strokeStyle="rgba(255,79,216,0.9)";
      sctx.beginPath();sctx.arc(q.x,q.y,1.6,0,TAU);sctx.stroke();
    }else{
      const blink=(t%7)<0.18;
      if(!blink){sctx.strokeStyle=C.read;sctx.beginPath();sctx.arc(q.x,q.y,2.2,0,TAU);sctx.stroke();}
    }
  }
  if(def.mouth){
    const m=def.mouth,q=proj(surf(m.u,m.a).map((v,i)=>i===0||i===2?v*0.72:v));
    sctx.strokeStyle="rgba(255,79,216,0.85)";
    if(m.style==="slit"){
      const o=2+1.6*Math.max(0,Math.sin(t*1.7)); // it works constantly, at nothing
      sctx.beginPath();sctx.moveTo(q.x,q.y-6-o);sctx.lineTo(q.x,q.y+6+o);sctx.stroke();
      sctx.beginPath();sctx.moveTo(q.x-3,q.y-3);sctx.lineTo(q.x+3,q.y+3);sctx.stroke();
    }else{
      for(let k=0;k<6;k++){
        const a=k/6*TAU+t*0.3,ir=3+2*Math.sin(t*0.9);
        sctx.beginPath();sctx.moveTo(q.x+Math.cos(a)*ir,q.y+Math.sin(a)*ir);
        sctx.lineTo(q.x+Math.cos(a)*(ir+5),q.y+Math.sin(a)*(ir+5));sctx.stroke();
      }
    }
  }
  // limbs: chain kinematics in a precessing bend plane, phase lagging tipward
  for(const lb of def.limbs){
    const att=surf(lb.u,lb.a);
    const out=v3.norm([Math.cos(lb.a),0.1,Math.sin(lb.a)]);
    const phi=lb.prec*t*TAU/4+lb.a;
    const e2=v3.norm([-Math.sin(phi)*out[2],Math.cos(phi),Math.sin(phi)*out[0]]);
    let ang=0,px2=0,py2=0;
    const pts=[proj(att)];
    const segl=lb.len*SC/lb.segs;
    for(let k=0;k<lb.segs;k++){
      let b=lb.rest[k]+lb.amp*Math.sin(t*lb.freq*TAU/4-k*lb.lag);
      if(lb.quant)b=Math.round(b*3)/3; // pistons move in detents
      ang+=b;
      px2+=Math.cos(ang)*segl;py2+=Math.sin(ang)*segl;
      const p=[att[0]+out[0]*px2+e2[0]*py2,att[1]+out[1]*px2+e2[1]*py2,att[2]+out[2]*px2+e2[2]*py2];
      pts.push(proj(p));
    }
    for(let k=0;k<pts.length-1;k++){
      const zb=clamp(0.7-((pts[k].z+pts[k+1].z)/2)/(SC*2.4),0.2,1)*(1-k/(pts.length+2)*0.4);
      sctx.strokeStyle=`rgba(255,79,216,${zb})`;
      sctx.beginPath();sctx.moveTo(pts[k].x,pts[k].y);sctx.lineTo(pts[k+1].x,pts[k+1].y);sctx.stroke();
      sctx.beginPath();sctx.arc(pts[k+1].x,pts[k+1].y,1.4,0,TAU);sctx.stroke();
    }
  }
  sctx.restore();
}

/* ============================================================================
   BOOT & DEATH
   ========================================================================= */
function makeBootLines(resume){
  const ln=[];
  ln.push("WEYLAND-KIBBLE CLASS W-4 COMMERCIAL LIGHTER");
  ln.push("REGISTRY 226/PA 'PRODUCE ATLAS' — CONSOLE 2/2");
  ln.push("");
  ln.push("POWER-ON SELF TEST");
  ln.push("  PHOSPHOR PERSISTENCE ............ OK");
  ln.push("  BEAM INDEX / CONVERGENCE ........ OK");
  ln.push("  CATALOGUE "+STARS.length+" ENTRIES ........... OK");
  ln.push("  SPEECH ROM 3-FORMANT ............ OK");
  ln.push("  EMISSION LOG .................... ARMED");
  ln.push("");
  ln.push("CATALOGUE CONVENTION: EQUATORIAL, REF ORIGIN");
  ln.push("  X=R·COSδ·COSα  Y=R·SINδ  Z=R·COSδ·SINα");
  ln.push("");
  ln.push("POLICY 88-C IN FORCE. CLAUSE 14(C): COVER");
  ln.push("VOIDS BEYOND 25.0 LY OF ORIGIN. NO EXCEPTION.");
  ln.push("");
  if(resume){
    ln.push("TOUR IN PROGRESS — SEED "+S.seed);
    ln.push("OPERATOR OF RECORD: RESUMED");
  }else{
    ln.push("STANDING ORDER: LIFT 6 SURVEY PACKETS,");
    ln.push("RETURN TO TERMINAL. AIR IS THE SCHEDULE.");
  }
  ln.push("");
  return ln;
}
function drawBoot(dt){
  SCR.bootT+=dt*640; // characters per second, beam-writing pace
  const lines=SCR.bootLines;
  const x=Math.max(PAD+8,(VW-360)/2),y0=Math.max(30,VH*0.10);
  let budget=Math.floor(SCR.bootT),y=y0;
  box(x-10,y0-14,Math.min(380,VW-2*PAD-4),Math.min(lines.length*15+92,VH-y0-14),C.chassis);
  for(const ln of lines){
    if(budget<=0)break;
    const show=ln.slice(0,budget);
    budget-=ln.length+1;
    label(x,y,show,ln.startsWith("  ")?C.read:(ln.includes("CLAUSE")||ln.includes("POLICY")?C.warn:C.label),11);
    y+=15;
  }
  if(PT.justUp&&!PT.moved)SCR.bootT=Math.max(SCR.bootT,2600);
  if(budget>0){
    const bw=170,bh=44,bx=x+20,by=y+10;
    if(SCR.canResume){
      if(btn("b.resume",bx,by,bw,bh,["RESUME TOUR","SEED "+S.seed],C.ok,{px:11})){AUDIO.init();SCR.mode="main";}
      if(btn("b.new",bx+bw+10,by,110,bh,["SCRATCH","NEW TOUR"],C.warn,{px:10})){AUDIO.init();newRun();SCR.canResume=false;SCR.mode="main";}
    }else{
      if(btn("b.init",bx,by,bw,bh,"INITIALISE ▸",C.ok,{px:12})){AUDIO.init();if(!S)newRun();SCR.mode="main";}
    }
    label(x,by+bh+12,"OPERATE WITH ONE THUMB. READ THE LABELS.",C.chassis,9);
  }
}
function drawDeath(){
  const d=S.death;
  const w=Math.min(380,VW-2*PAD-4),x=(VW-w)/2,y0=Math.max(24,VH*0.08);
  box(x,y0,w,Math.min(430,VH-y0-70),C.bad);
  let y=y0+10;const cw=w-24,cx0=x+12;
  label(cx0,y,"INCIDENT REPORT — FORM 30-K",C.bad,12);y+=22;
  dotLead(cx0,y,cw,"CAUSE",d.cause,C.label,C.bad,10);y+=16;
  if(d.detail){label(cx0,y,d.detail,C.read,9);y+=16;}
  const fx=xyzToRaDec(d.pos);
  dotLead(cx0,y,cw,"FINAL FIX","α"+fx.ra.toFixed(1)+" δ"+fx.dec.toFixed(1)+" R"+fx.r.toFixed(2),C.label,C.read,10);y+=15;
  dotLead(cx0,y,cw,"TIME",fmtH(d.t),C.label,C.read,10);y+=15;
  dotLead(cx0,y,cw,"POLICY",d.recovered?"CLAUSE 9 RECOVERY":(d.insured?"IN FORCE — HULL CLAIM FILED":"VOID — CLAUSE 14(C) — NO RECOVERY"),C.label,d.insured?C.ok:C.warn,10);y+=15;
  dotLead(cx0,y,cw,"TOUR / PACKETS",S.tour+" / "+S.order.filter(o=>o.delivered).length+" DELIVERED",C.label,C.read,10);y+=15;
  dotLead(cx0,y,cw,"JUMPS LOGGED",String(S.jumps),C.label,C.read,10);y+=15;
  for(const cu of CULTURES){
    if(cu.id==="buoy")continue;
    dotLead(cx0,y,cw,"COMPREHENSION "+cu.designation.split(" — ")[0],Math.round(comprehension(cu.id)*100)+"%",C.label,C.contact,10);y+=15;
  }
  dotLead(cx0,y,cw,"SEED",S.seed,C.label,C.read,10);y+=20;
  label(cx0,y,"CONTRIBUTING FACTORS (LOG EXTRACT):",C.label,9);y+=13;
  for(const e of S.log.slice(-4)){label(cx0,y,"T+"+fmtH(e.t)+" "+e.text.slice(0,44),e.color,8);y+=11;}
  y+=12;
  label(cx0,y,"LANGUAGE RECORDS SYNCED TO COMPANY CODEBOOK.",C.label,8);y+=11;
  label(cx0,y,"THE NEXT OPERATOR INHERITS THEM.",C.label,8);y+=16;
  if(btn("b.restart",x+w/2-80,Math.min(y,VH-70),160,44,"NEXT OF ROSTER ▸",C.label,{px:11})){
    newRun();
    SCR.mode="boot";SCR.bootT=0;SCR.bootLines=makeBootLines(false);SCR.canResume=false;
    alarmMem={};
  }
}

/* ============================================================================
   MAIN LOOP
   ========================================================================= */
const FPS={arr:new Float32Array(240),i:0,n:0};
let lastTS=0;
function frame(ts){
  const dt=Math.min(0.1,lastTS?(ts-lastTS)/1000:0.016);
  lastTS=ts;
  FPS.arr[FPS.i]=dt;FPS.i=(FPS.i+1)%FPS.arr.length;FPS.n=Math.min(FPS.n+1,FPS.arr.length);
  processTestQueue();
  beginFrame();
  if(SCR.mode==="boot")drawBoot(dt);
  else if(SCR.mode==="death")drawDeath();
  else{
    const L=computeLayout(SCR.panel==="comms");
    if(SCR.mode==="main"){
      advanceHours(dt*0.2); // the idle clock: reading costs air too
      if(S.alive){
        drawHeader(L);
        const cu=cultureHere();
        if(SCR.panel==="comms"&&cu&&S.greeted[cu.id])drawAlien(L,cu.id,dt);
        else if(SCR.instrument==="chart"||SCR.panel==="plan")drawChart(L);
        else drawField(L,dt);
        if(SCR.panel==="plan")planDataPanel(L);
        else if(SCR.panel==="comms")drawComms(L);
        else if(SCR.panel==="log")drawLog(L);
        else if(SCR.panel==="manual")drawManual(L);
        else navDataPanel(L);
        drawControls(L);
      }
    }else if(SCR.mode==="transit"){drawHeader(L);drawTransit(L);}
    else if(SCR.mode==="report"){drawHeader(L);drawReport(L);}
    if(BANNER&&performance.now()/1000<BANNER.until){
      const bw=Math.min(VW-20,360);
      box((VW-bw)/2,L.head.y+L.head.h+4,bw,22,BANNER.color);
      label(VW/2,L.head.y+L.head.h+9,BANNER.text.slice(0,52),BANNER.color,9,"center");
    }
  }
  endFrame();
  if(PT.justUp){PT.justUp=false;PT.moved=false;}
  requestAnimationFrame(frame);
}

/* ============================================================================
   TEST HARNESS — enabled only with #test in the URL. Measurement hooks for
   the headless verification rig; not an instrument, so allowed to know things.
   ========================================================================= */
const TESTQ=[];
function processTestQueue(){
  const q=TESTQ[0];
  if(!q)return;
  if(q.t==="tap"){
    PT.downX=PT.x=q.x;PT.downY=PT.y=q.y;PT.justUp=true;PT.moved=false;PT.down=false;
    TESTQ.shift();
  }else if(q.t==="drag"){
    if(q.k===undefined){q.k=0;PT.down=true;PT.downX=PT.x=q.x0;PT.downY=PT.y=q.y0;PT.moved=true;}
    q.k++;
    const f=q.k/q.frames;
    const nx=lerp(q.x0,q.x1,Math.min(1,f)),ny=lerp(q.y0,q.y1,Math.min(1,f));
    PT.dragDX+=nx-PT.x;PT.dragDY+=ny-PT.y;PT.x=nx;PT.y=ny;PT.moved=true;
    if(q.k>=q.frames){PT.down=false;PT.justUp=true;TESTQ.shift();}
  }
}
if(location.hash.indexOf("test")>=0){
  window.ATLAS={
    S:()=>S,SCR,CH,FIELD,LANG:()=>LANG,STARS,CULTURES,
    fps(){
      let s=0,mx=0;const a=[];
      for(let k=0;k<FPS.n;k++){const v=FPS.arr[k];s+=v;mx=Math.max(mx,v);a.push(v);}
      a.sort((x,y)=>x-y);
      return {avgFps:FPS.n/s,worstMs:mx*1000,p95Ms:(a[Math.floor(a.length*0.95)]||0)*1000,frames:FPS.n};
    },
    dbfs:()=>AUDIO.dbfs(),audio:()=>AUDIO,
    layout:()=>computeLayout(SCR.panel==="comms"),
    tap:(x,y)=>TESTQ.push({t:"tap",x,y}),
    drag:(x0,y0,x1,y1,frames)=>TESTQ.push({t:"drag",x0,y0,x1,y1,frames:frames||10}),
    queueLen:()=>TESTQ.length,
    boot(){if(SCR.mode==="boot"){AUDIO.init();if(!S)newRun();SCR.mode="main";}},
    newRun:()=>newRun(),
    resolveJump:(b,e,r)=>resolveJump(b,e,r),
    corridor:(a,b,known)=>corridorLoad(a,b,S.hazards,!!known),
    solution:n=>consoleSolution(starByName[n]),
    raDecToXYZ,xyzToRaDec,nearestStar,
    setPos(p){S.pos=p.slice();const n=nearestStar(S.pos);S.locus=n.dist<0.1?{mode:"system",star:n.star.name}:(n.dist<1.2?{mode:"adrift",star:n.star.name}:{mode:"deep",star:null});},
    learn(cid,frac){
      const cu=cultureById[cid];
      for(let gi=0;gi<Math.floor(cu.glyphN*frac);gi++)LANG[cid][gi]=cu.need;
      saveLang();
    },
    give(k){S.reductions[k]=true;},
    court(cid,v){S.courtesy[cid]=v;},
    wipe(){try{localStorage.clear();}catch(e){}},
    msgs:()=>S.msgs,comp:comprehension,
    hazards:()=>S.hazards,
    advance:h=>advanceHours(h)
  };
}

/* ---- power on ---- */
resize();
SCR.canResume=loadRun();
SCR.bootLines=makeBootLines(SCR.canResume);
requestAnimationFrame(frame);

</script>
