<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#101018">
<title>WILDBOUND — Amber Edition</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%23d8a23c'/><rect x='3' y='3' width='10' height='10' fill='%23241a10'/></svg>">
<style>
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: #0b0b10;
    color: #d8d8e0;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none; user-select: none;
    overscroll-behavior: none;
    touch-action: none;
  }
  #stage {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background:
      radial-gradient(ellipse at 50% 40%, #1c1c2a 0%, #0b0b10 70%);
  }
  #screen {
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    display: block;
    background: #000;
    box-shadow: 0 0 0 3px #23232f, 0 0 0 6px #14141c, 0 18px 50px rgba(0,0,0,.75);
    border-radius: 2px;
  }
  #boot {
    position: fixed; inset: 0; z-index: 30;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 18px; background: #0b0b10; cursor: pointer;
    text-align: center; padding: 24px;
  }
  #boot h1 {
    margin: 0; font-size: clamp(22px, 5vw, 40px); letter-spacing: .22em;
    color: #ffd25e; text-shadow: 0 3px 0 #7a4a12;
  }
  #boot p { margin: 0; font-size: 13px; line-height: 1.7; color: #9a9ab0; max-width: 38ch; }
  #boot .key { color: #d8d8e0; }
  #boot .press { color: #7fd06a; animation: blink 1.1s steps(2, start) infinite; font-size: 14px; }
  @keyframes blink { to { visibility: hidden; } }
  #touch {
    position: fixed; inset: 0; z-index: 20; display: none;
    pointer-events: none;
  }
  body.touch #touch { display: block; }
  #touch .pad, #touch .btn {
    position: absolute; pointer-events: auto;
    border-radius: 50%;
    background: rgba(230,230,245,.10);
    border: 2px solid rgba(230,230,245,.22);
    display: flex; align-items: center; justify-content: center;
    color: rgba(240,240,255,.6); font-size: 18px; font-weight: 700;
  }
  #touch .pad { width: 46px; height: 46px; border-radius: 10px; }
  #touch .btn { width: 58px; height: 58px; }
  #touch .btn.small { width: 46px; height: 46px; font-size: 11px; }
  #touch .act { background: rgba(120,200,120,.16); }
  #touch [data-down="1"] { background: rgba(255,255,255,.30); }
</style>
</head>
<body>
  <div id="stage"><canvas id="screen" width="240" height="160"></canvas></div>

  <div id="touch">
    <div class="pad" data-btn="UP"    style="left:78px;  bottom:150px;">▲</div>
    <div class="pad" data-btn="DOWN"  style="left:78px;  bottom:52px;">▼</div>
    <div class="pad" data-btn="LEFT"  style="left:26px;  bottom:101px;">◀</div>
    <div class="pad" data-btn="RIGHT" style="left:130px; bottom:101px;">▶</div>
    <div class="btn act" data-btn="A"  style="right:26px;  bottom:76px;">A</div>
    <div class="btn"     data-btn="B"  style="right:96px;  bottom:118px;">B</div>
    <div class="btn small" data-btn="START"  style="right:34px; bottom:170px;">MENU</div>
    <div class="btn small" data-btn="SELECT" style="right:100px; bottom:34px;">RUN</div>
  </div>

  <div id="boot">
    <h1>WILDBOUND</h1>
    <p>
      <span class="key">Arrows / WASD</span> — move &nbsp;·&nbsp;
      <span class="key">Z / Space</span> — confirm &nbsp;·&nbsp;
      <span class="key">X / Esc</span> — cancel<br>
      <span class="key">Shift</span> — run &nbsp;·&nbsp;
      <span class="key">Enter</span> — menu &nbsp;·&nbsp;
      <span class="key">M</span> — mute
    </p>
    <p class="press">— CLICK OR PRESS ANY KEY TO START —</p>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
