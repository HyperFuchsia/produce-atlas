<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no,maximum-scale=1">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<title>LIGHTER MC-44 / OPERATOR CONSOLE</title>
<style>
/* The document is a bezel around one canvas. Nothing here may introduce a fill,
   a radius or a shadow: every mark the operator sees is stroked by the beam. */
*{margin:0;padding:0;box-sizing:border-box;border-radius:0!important}
html,body{
  height:100%;width:100%;background:#000;overflow:hidden;
  overscroll-behavior:none;touch-action:none;
  -webkit-user-select:none;user-select:none;
  -webkit-tap-highlight-color:transparent;
  -webkit-touch-callout:none;
}
canvas{display:block;position:fixed;left:0;top:0;width:100%;height:100%;background:#000}
</style>
</head>
<body>
<canvas id="scr"></canvas>
<script>
"use strict";
/* ==========================================================================
   LIGHTER MC-44 "CASSANDRA" — OPERATOR CONSOLE
   One file. No libraries, no assets, no network, no build.
   ========================================================================== */

/* ---------------------------------------------------------------- numbers */

/* xorshift32. The console prints its seed, so anything derived from it can be
   reproduced by the operator on paper if they are stubborn enough. */
function rng(seed){
  let s = seed>>>0 || 0x9e3779b9;
  return function(){
    s ^= s<<13; s>>>=0;
    s ^= s>>>17;
    s ^= s<<5;  s>>>=0;
    return s/4294967296;
  };
}
function hashStr(str){
  let h = 0x811c9dc5;
  for(let i=0;i<str.length;i++){ h ^= str.charCodeAt(i); h = Math.imul(h,0x01000193)>>>0; }
  return h>>>0;
}
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const TAU=Math.PI*2, D2R=Math.PI/180, R2D=180/Math.PI;
const fmt=(v,d)=>{ const s=(v<0?'-':''), a=Math.abs(v); return s+a.toFixed(d); };
/* Tabular figures: pad to a fixed column so digits never dance between frames. */
function pad(v,w,d){ let s=(d===undefined)?String(v):fmt(v,d); while(s.length<w) s=' '+s; return s; }
function pad0(v,w){ let s=String(Math.floor(v)); while(s.length<w) s='0'+s; return s; }

function v3(x,y,z){ return {x:x,y:y,z:z}; }
function vsub(a,b){ return {x:a.x-b.x,y:a.y-b.y,z:a.z-b.z}; }
function vadd(a,b){ return {x:a.x+b.x,y:a.y+b.y,z:a.z+b.z}; }
function vmul(a,s){ return {x:a.x*s,y:a.y*s,z:a.z*s}; }
function vdot(a,b){ return a.x*b.x+a.y*b.y+a.z*b.z; }
function vlen(a){ return Math.sqrt(a.x*a.x+a.y*a.y+a.z*a.z); }
function vdist(a,b){ const dx=a.x-b.x,dy=a.y-b.y,dz=a.z-b.z; return Math.sqrt(dx*dx+dy*dy+dz*dz); }
function vnorm(a){ const l=vlen(a)||1; return {x:a.x/l,y:a.y/l,z:a.z/l}; }

/* Bearing/elevation are what the operator actually types, so the conversion
   between them and a unit vector is the single most load-bearing function in
   the vehicle. Bearing is measured in the equatorial plane from +X toward +Z;
   elevation is above that plane toward +Y. */
function beToVec(bearingDeg, elevDeg){
  const b=bearingDeg*D2R, e=elevDeg*D2R, ce=Math.cos(e);
  return {x:ce*Math.cos(b), y:Math.sin(e), z:ce*Math.sin(b)};
}
function vecToBE(v){
  const r=vlen(v)||1e-9;
  let b=Math.atan2(v.z,v.x)*R2D; if(b<0) b+=360;
  return {bearing:b, elev:Math.asin(clamp(v.y/r,-1,1))*R2D, range:r};
}

/* ------------------------------------------------------------- the palette */

/* Colour is a channel, not a taste. Nothing is coloured for looks; if a mark
   changes colour the operator must be able to say what changed. */
const C = {
  CHASSIS:'#3f7bff',   /* structure, frames, graticules — the vehicle itself   */
  NOMINAL:'#2bff6a',   /* within limits                                        */
  CAUTION:'#ffb01f',   /* out of limits, recoverable                           */
  ALARM  :'#ff2f28',   /* out of limits, not recoverable by waiting            */
  CONTACT:'#ff3fc8',   /* something else that moves                            */
  LABEL  :'#35dcff',   /* a name for a thing, never a value                    */
  READOUT:'#e6f2ff'    /* a value                                              */
};
/* Elevation is brightness. There is no depth here, only how hard the beam is
   driven, so these are the only three "layers" the console has. */
const B = { DIM:0.30, MID:0.62, HI:1.0 };

/* ------------------------------------------------------------ vector font */

/* A 5x7 stroke font on an integer lattice: x in 0..4, y in 0..6 with y down.
   Each glyph is a run of "xy" digit pairs, polylines separated by "/". This is
   the same machinery the alien scripts use, which is why they can share a line
   of text with roman glyphs without either looking pasted in. */
const FONT_SRC = {
  ' ':'',
  'A':'062046/1434','B':'0006/003041423303/033344453606','C':'4130100105163645',
  'D':'0006/003041453606','E':'40000646/0333','F':'400006/0333',
  'G':'41301001051636454323','H':'0006/4046/0343','I':'1030/2026/1636',
  'J':'1030/2025/20251605','K':'0006/400346','L':'000646','M':'0600234046',
  'N':'06004640','O':'103041453616050110','P':'0006/003041423303',
  'Q':'103041453616050110/2446','R':'0006/003041423303/2346',
  'S':'413010010213334445361605','T':'0040/2026','U':'000516364540',
  'V':'002640','W':'0016223640','X':'0046/4006','Y':'0023/4023/2326','Z':'00400646',
  '0':'103041453616050110/0541','1':'0122/2026/1636',
  '2':'01103041420646','3':'01103041423313/334445361605',
  '4':'36300444','5':'400003334445361605','6':'30100105163645443303',
  '7':'004016/1333','8':'13030201103041423313/1304051636454433',
  '9':'16364541301001021343',
  '.':'2526','·':'2425',',':'252616',':':'2223/2526',';':'2223/252616',
  '-':'1343','=':'1232/1434','_':'0646','+':'1333/2125','*':'2125/0244/0442',
  '/':'4006','\\':'0046','|':'2026','(':'30111536',')':'10313516',
  '[':'30101636',']':'10303616','<':'400346','>':'004306',
  '!':'2024/2526','?':'01103041422324/2526','#':'1016/3036/0242/0444',
  '%':'0446/0010111001/3545464635','\'':'2022','"':'1012/3032',
  '°':'2031221120','^':'0221/2140','~':'0312213241','&':'4106',
  '\u00b1':'0333/2124/0646',
  '@':'41301001051636453323132132 4',
  '$':'2026/4110300112223342444536261606'
};
/* Glyph the console prints where it has a character but no way to draw it. */
const TOFU='0040460600';

function parseGlyph(src){
  const polys=[];
  const parts=src.split('/');
  for(let p=0;p<parts.length;p++){
    const s=parts[p].replace(/[^0-9]/g,'');
    if(s.length<4) continue;
    const pts=[];
    for(let i=0;i+1<s.length;i+=2) pts.push(+s[i], +s[i+1]);
    polys.push(pts);
  }
  return polys;
}
const FONT={};
for(const k in FONT_SRC) FONT[k]=parseGlyph(FONT_SRC[k]);
const FONT_TOFU=parseGlyph(TOFU);

/* --------------------------------------------------- batched stroke queue */

/* Every mark for the frame is accumulated by colour/width/brightness and then
   emitted as one path per bucket. A dense panel is 3000+ segments; without
   this the phone spends the whole budget in the driver. */
const LAYERS=new Map();
const LAYER_ORDER=[];
function bucket(col,w,a){
  const k=col+w.toFixed(2)+a.toFixed(2);
  let L=LAYERS.get(k);
  if(!L){ L={col:col,w:w,a:a,d:[],n:0}; LAYERS.set(k,L); LAYER_ORDER.push(L); }
  return L;
}
function pushSeg(L,x0,y0,x1,y1){ const d=L.d; d[L.n++]=x0; d[L.n++]=y0; d[L.n++]=x1; d[L.n++]=y1; }
function line(x0,y0,x1,y1,col,a,w){ pushSeg(bucket(col,w||1,a===undefined?B.MID:a),x0,y0,x1,y1); }
function polyline(pts,col,a,w,close){
  const L=bucket(col,w||1,a===undefined?B.MID:a);
  for(let i=0;i+3<pts.length;i+=2) pushSeg(L,pts[i],pts[i+1],pts[i+2],pts[i+3]);
  if(close&&pts.length>=4) pushSeg(L,pts[pts.length-2],pts[pts.length-1],pts[0],pts[1]);
}
function rect(x,y,w,h,col,a,lw){
  const L=bucket(col,lw||1,a===undefined?B.MID:a);
  pushSeg(L,x,y,x+w,y); pushSeg(L,x+w,y,x+w,y+h);
  pushSeg(L,x+w,y+h,x,y+h); pushSeg(L,x,y+h,x,y);
}
function circle(cx,cy,r,col,a,lw,seg){
  const n=seg||Math.max(10,Math.min(34,Math.round(r*0.62)+8));
  const L=bucket(col,lw||1,a===undefined?B.MID:a);
  let px=cx+r, py=cy;
  for(let i=1;i<=n;i++){
    const t=i/n*TAU, x=cx+Math.cos(t)*r, y=cy+Math.sin(t)*r;
    pushSeg(L,px,py,x,y); px=x; py=y;
  }
}
function arc(cx,cy,r,a0,a1,col,a,lw,seg){
  const n=seg||Math.max(4,Math.round(Math.abs(a1-a0)*r*0.35)+3);
  const L=bucket(col,lw||1,a===undefined?B.MID:a);
  let px=cx+Math.cos(a0)*r, py=cy+Math.sin(a0)*r;
  for(let i=1;i<=n;i++){
    const t=a0+(a1-a0)*i/n, x=cx+Math.cos(t)*r, y=cy+Math.sin(t)*r;
    pushSeg(L,px,py,x,y); px=x; py=y;
  }
}
function cross(x,y,r,col,a,lw){
  const L=bucket(col,lw||1,a===undefined?B.MID:a);
  pushSeg(L,x-r,y,x+r,y); pushSeg(L,x,y-r,x,y+r);
}
function diamond(x,y,r,col,a,lw){
  polyline([x,y-r,x+r,y,x,y+r,x-r,y],col,a,lw,true);
}

/* ------------------------------------------------------------ text output */

const TRACK=5/6;                       /* advance in cap-heights            */
function textW(str,size){ return str.length*size*TRACK; }
/* Cut a line to the width it has. A readout that runs off its panel has
   stopped being a readout. */
function fit(str,size,width){
  const n=Math.floor(width/(size*TRACK));
  if(str.length<=n) return str;
  return n>1?str.substr(0,n-1)+'-':str.substr(0,Math.max(0,n));
}

/* script: null for roman, else a generated alien glyph table. Unknown code
   points draw as tofu rather than silently vanishing — a missing character is
   itself a fault report. */
function text(x,y,size,str,col,a,w,script){
  const s=size/6, adv=size*TRACK;
  const L=bucket(col,w||1,a===undefined?B.MID:a);
  for(let i=0;i<str.length;i++){
    const ch=str[i];
    let g;
    if(script){ g=script.glyphs[script.map(ch)]; }
    else { g=FONT[ch] || FONT[ch.toUpperCase()] || (ch===' '?FONT[' ']:FONT_TOFU); }
    if(!g){ i===i; }
    const ox=x+i*adv;
    if(g) for(let p=0;p<g.length;p++){
      const pts=g[p];
      for(let q=0;q+3<pts.length;q+=2)
        pushSeg(L, ox+pts[q]*s, y+pts[q+1]*s, ox+pts[q+2]*s, y+pts[q+3]*s);
    }
  }
  return str.length*adv;
}
function textR(xRight,y,size,str,col,a,w){ return text(xRight-textW(str,size),y,size,str,col,a,w); }
function textC(cx,y,size,str,col,a,w){ return text(cx-textW(str,size)/2,y,size,str,col,a,w); }

/* A label, a value, and a dotted rule joining them: the console never leaves
   the eye to guess which number belongs to which name. */
function leader(x,y,wid,size,label,value,lcol,vcol,a){
  text(x,y,size,label,lcol||C.LABEL,a===undefined?B.MID:a);
  const vw=textW(value,size);
  textR(x+wid,y,size,value,vcol||C.READOUT,a===undefined?B.HI:a);
  const lw=textW(label,size);
  const x0=x+lw+size*0.5, x1=x+wid-vw-size*0.5;
  if(x1>x0){
    const L=bucket(lcol||C.LABEL,1,B.DIM);
    const step=size*0.62;
    for(let px=x0;px<x1;px+=step) pushSeg(L,px,y+size*0.86,px+0.9,y+size*0.86);
  }
}

/* ------------------------------------------------------------ the display */

const scr=document.getElementById('scr');
const mainCtx=scr.getContext('2d',{alpha:false,desynchronized:true});
let VW=0, VH=0, DPR=1, PW=1, PH=1;

const vec=document.createElement('canvas');
const vctx=vec.getContext('2d',{alpha:false});
const bloomA=document.createElement('canvas'), bctxA=bloomA.getContext('2d',{alpha:false});
const bloomB=document.createElement('canvas'), bctxB=bloomB.getContext('2d',{alpha:false});
const bloomC=document.createElement('canvas'), bctxC=bloomC.getContext('2d',{alpha:false});
let grilleH=4;

/* Display-side faults. These are not mood: every one of them is a function of
   HULL, so the operator reads the structural state off the picture before any
   gauge has told them. */
const CRT={
  persistence:0.34,   /* how fast the phosphor gives up the previous frame    */
  jitter:0,           /* beam deflection error, px                            */
  tear:0,             /* probability/extent of horizontal line displacement   */
  grain:0,            /* phosphor grain                                       */
  roll:0,             /* interlace roll bar position, 0..1                    */
  rollRate:0.035,
  bloom:0.85,
  fault:0             /* the single term the three above are driven from      */
};

function sizeDisplay(force){
  const w=Math.max(240,window.innerWidth|0), h=Math.max(240,window.innerHeight|0);
  /* The backing store is capped by TOTAL pixels, not by device ratio: a large
     desktop window at 2x asks for four times a phone's work for the same
     picture, and the grille throws most of it away regardless. */
  const byArea=Math.sqrt(PERF.pxBudget/(w*h));
  const dpr=Math.max(1,Math.min(window.devicePixelRatio||1, PERF.dprCap, byArea));
  if(!force && w===VW && h===VH && Math.abs(dpr-DPR)<0.01) return;
  VW=w; VH=h; DPR=dpr; PW=Math.round(w*dpr); PH=Math.round(h*dpr);
  scr.width=PW; scr.height=PH;
  vec.width=PW; vec.height=PH;
  bloomA.width=Math.max(2,Math.round(PW*0.5)); bloomA.height=Math.max(2,Math.round(PH*0.5));
  bloomB.width=Math.max(2,Math.round(PW*0.25)); bloomB.height=Math.max(2,Math.round(PH*0.25));
  bloomC.width=Math.max(2,Math.round(PW*0.125)); bloomC.height=Math.max(2,Math.round(PH*0.125));
  vctx.setTransform(1,0,0,1,0,0);
  vctx.fillStyle='#000'; vctx.fillRect(0,0,PW,PH);
  bctxA.fillStyle='#000'; bctxA.fillRect(0,0,bloomA.width,bloomA.height);
  bctxB.fillStyle='#000'; bctxB.fillRect(0,0,bloomB.width,bloomB.height);
  bctxC.fillStyle='#000'; bctxC.fillRect(0,0,bloomC.width,bloomC.height);
  buildGrille();
  layout();
}

/* The aperture grille, the scanline gaps and the phosphor grain all live in
   one repeating tile, because they are all properties of the same screen and
   because one pattern fill is all the fill rate a phone can spare. The grain
   level is quantised into buckets so a tile only has to be rebuilt when the
   hull damage actually changes what the operator would see. */
const GRILLE={pitch:0,line:0,tiles:null,bucket:-1};
function buildGrille(){
  const px=Math.max(1,Math.round(DPR));
  GRILLE.pitch=Math.max(3,Math.round(DPR*1.6));
  GRILLE.line=Math.max(2,Math.round(DPR*2.0));
  grilleH=GRILLE.line;
  GRILLE.bucket=-1;
  GRILLE.tiles=null;
  makeGrilleTiles(0);
}
function makeGrilleTiles(bucket){
  const gw=GRILLE.pitch, gh=GRILLE.line, px=Math.max(1,Math.round(DPR));
  /* Eight tiles wide so the noise does not read as a repeating stamp. */
  const TW=gw*8, TH=gh*8;
  const grainAmt=bucket/8;
  const out=[];
  for(let k=0;k<3;k++){
    const t=document.createElement('canvas'); t.width=TW; t.height=TH;
    const c=t.getContext('2d');
    const img=c.createImageData(TW,TH);
    const d=img.data;
    const r=rng(0x51ed+k*7919+bucket*104729);
    for(let y=0;y<TH;y++){
      for(let x=0;x<TW;x++){
        const i=(y*TW+x)*4;
        let rr=0,gg=0,bb=0,aa=0;
        /* Grille bar and scanline gap: opaque black at partial alpha. */
        const bar=(x%gw)>=gw-px, lin=(y%gh)>=gh-px;
        if(bar||lin){ aa=Math.max(bar?0.30:0, lin?0.26:0); }
        /* Grain: a speck of phosphor that is brighter or dimmer than its
           neighbours. Mixed into the same tile so it costs no extra pass. */
        const v=r();
        if(grainAmt>0 && v>0.90){
          const s=(v-0.90)/0.10*grainAmt;
          const na=Math.min(0.5,s*0.55);
          const t2=na/(na+aa+1e-6);
          rr=gg=bb=255; aa=aa*(1-t2)+na;
          if(aa>0){ const w=na/aa; rr=gg=bb=Math.round(255*w); }
        }
        d[i]=rr; d[i+1]=gg; d[i+2]=bb; d[i+3]=Math.round(clamp(aa,0,1)*255);
      }
    }
    c.putImageData(img,0,0);
    out.push(mainCtx.createPattern(t,'repeat'));
  }
  GRILLE.tiles=out; GRILLE.bucket=bucket;
}

function beginFrame(){
  for(let i=0;i<LAYER_ORDER.length;i++) LAYER_ORDER[i].n=0;
}

/* Faults are one number. Everything the tube does wrong is a function of it,
   so a cracked hull looks like a cracked hull without a single word of text. */
function setFault(f){
  CRT.fault=f;
  CRT.jitter=f*1.9;
  CRT.tear=f*f*1.35;
  CRT.grain=0.05+f*0.55;
  CRT.persistence=0.34-f*0.14;
}

let jitPhase=0;

/* One pass of the beam over the frame's geometry, and the single most
   expensive thing the console does — better than four fifths of the frame at
   three thousand strokes. Butt caps rather than round: at these widths the
   difference is under a device pixel and the bloom covers it, while the
   rasteriser charges half again as much for the round ones. Measured. */
function strikeLayers(ctx,jx,jy){
  ctx.setTransform(DPR,0,0,DPR,jx,jy);
  ctx.globalCompositeOperation='lighter';
  ctx.lineCap='butt';
  for(let i=0;i<LAYER_ORDER.length;i++){
    const L=LAYER_ORDER[i];
    if(!L.n) continue;
    ctx.strokeStyle=L.col;
    ctx.globalAlpha=L.a;
    ctx.lineWidth=L.w;
    ctx.beginPath();
    const d=L.d;
    for(let j=0;j<L.n;j+=4){ ctx.moveTo(d[j],d[j+1]); ctx.lineTo(d[j+2],d[j+3]); }
    ctx.stroke();
  }
  ctx.globalAlpha=1;
  ctx.setTransform(1,0,0,1,0,0);
}

function endFrame(dt,rand){
  /* Persistence: the tube is never cleared, only asked to forget a little. */
  vctx.setTransform(1,0,0,1,0,0);
  vctx.globalCompositeOperation='source-over';
  vctx.globalAlpha=1;
  vctx.fillStyle='rgba(0,0,0,'+CRT.persistence.toFixed(3)+')';
  vctx.fillRect(0,0,PW,PH);

  /* Beam deflection error. A steady deflection amplifier drifts; a damaged one
     hunts. The jitter is therefore correlated frame to frame, not white. */
  jitPhase+=dt*11;
  const jx=(Math.sin(jitPhase*1.7)+Math.sin(jitPhase*4.3)*0.5)*CRT.jitter*0.5+(rand()-0.5)*CRT.jitter;
  const jy=(Math.sin(jitPhase*2.3+1.1))*CRT.jitter*0.35+(rand()-0.5)*CRT.jitter*0.6;

  strikeLayers(vctx,jx,jy);
  composite(dt,rand);
}

function composite(dt,rand){
  const m=mainCtx;
  m.setTransform(1,0,0,1,0,0);
  m.globalCompositeOperation='copy';
  m.globalAlpha=1;

  /* Horizontal tear. A line-rate fault displaces whole scanline groups; it is
     drawn as a displacement of the raster, not as an effect over it. */
  const bands=(CRT.tear>0.02 && rand()<clamp(CRT.tear,0,0.9))?(3+((rand()*5)|0)):0;
  if(!bands){
    m.drawImage(vec,0,0);
  } else {
    m.fillStyle='#000'; m.fillRect(0,0,PW,PH);
    m.globalCompositeOperation='source-over';
    let y=0;
    while(y<PH){
      const h=Math.max(4,((rand()*PH/6)|0));
      const off=(rand()<0.4)?((rand()-0.5)*CRT.tear*90*DPR):0;
      const hh=Math.min(h,PH-y);
      m.drawImage(vec,0,y,PW,hh,off,y,PW,hh);
      y+=hh;
    }
  }

  /* Bloom, on the display side and at half resolution and below. Each level is
     a coarser sampling of the phosphor than the last; they are summed into the
     first one so the full-resolution upscale happens exactly once, and that
     upscale is deliberately unfiltered — a blocky halo at half a scanline is
     indistinguishable from phosphor structure and costs half as much. */
  if(PERF.bloom>0){
    bctxA.globalCompositeOperation='copy'; bctxA.globalAlpha=1;
    bctxA.drawImage(vec,0,0,bloomA.width,bloomA.height);
    if(PERF.bloom>1){
      bctxB.globalCompositeOperation='copy'; bctxB.globalAlpha=1;
      bctxB.drawImage(bloomA,0,0,bloomB.width,bloomB.height);
      if(PERF.bloom>2){
        bctxC.globalCompositeOperation='copy'; bctxC.globalAlpha=1;
        bctxC.drawImage(bloomB,0,0,bloomC.width,bloomC.height);
      }
      bctxA.globalCompositeOperation='lighter';
      bctxA.globalAlpha=0.70; bctxA.drawImage(bloomB,0,0,bloomA.width,bloomA.height);
      if(PERF.bloom>2){ bctxA.globalAlpha=0.55; bctxA.drawImage(bloomC,0,0,bloomA.width,bloomA.height); }
      bctxA.globalAlpha=1;
    }
    m.imageSmoothingEnabled=false;
    m.globalCompositeOperation='lighter';
    m.globalAlpha=0.46*CRT.bloom;
    m.drawImage(bloomA,0,0,PW,PH);
    m.imageSmoothingEnabled=true;
  }

  /* The interlace roll bar: one frame of vertical sync error, sliding. It is
     drawn before the grille because the sync error is in the signal, and the
     grille is in front of it. */
  CRT.roll+=dt*CRT.rollRate*(1+CRT.fault*6);
  if(CRT.roll>1) CRT.roll-=1;
  const rb=CRT.roll*(PH+260)-130;
  m.globalCompositeOperation='lighter';
  m.globalAlpha=0.030+CRT.fault*0.055;
  m.fillStyle='#9fc8ff';
  m.fillRect(0,rb,PW,26*DPR);
  m.globalAlpha=0.016;
  m.fillRect(0,rb-20*DPR,PW,20*DPR);

  /* Grille, scanlines and grain: one tile, one pass, rolling with the sync. */
  const wantBucket=Math.min(8,Math.round(CRT.grain*8));
  if(wantBucket!==GRILLE.bucket) makeGrilleTiles(wantBucket);
  m.globalCompositeOperation='source-over';
  m.globalAlpha=1;
  m.save();
  /* The tile is shifted only by whole grille pitches and whole scanlines, so
     the bars land on the same screen columns every frame and only the grain
     inside them changes. The one sub-line component is the roll itself. */
  const kx=(rand()*8)|0, ky=(rand()*8)|0;
  m.translate(-kx*GRILLE.pitch, CRT.roll*GRILLE.line-GRILLE.line*(8+ky));
  m.fillStyle=GRILLE.tiles[(grainFrame++)%3];
  m.fillRect(0,0,PW+GRILLE.pitch*8,PH+GRILLE.line*17+2);
  m.restore();
  m.globalAlpha=1;
}
let grainFrame=0;

/* Measured, not guessed: the loop watches its own frame time and sheds the
   most expensive display work before it starts dropping frames. Bloom levels
   go first because losing the outermost halo is the least legible loss; the
   backing resolution goes last because that is where the strokes live. */
const PERF={ dprCap:2, pxBudget:2.4e6, bloom:2, fps:60, ms:16.7, samples:0, sum:0, cooldown:2.0 };
function perfStep(dt,frameMs){
  PERF.sum+=frameMs; PERF.samples++;
  PERF.cooldown-=dt;
  if(PERF.samples<30) return;
  const avg=PERF.sum/PERF.samples;
  PERF.ms=avg; PERF.fps=1000/avg;
  PERF.sum=0; PERF.samples=0;
  if(PERF.cooldown>0) return;
  /* Shed in proportion to how far over budget the frame is. A console that
     takes nine seconds to work out it is too slow has already spent them. */
  if(avg>30){
    PERF.bloom=0;
    if(PERF.pxBudget>0.9e6){ PERF.pxBudget=Math.max(0.9e6,PERF.pxBudget*0.45); sizeDisplay(true); }
    PERF.cooldown=1.4;
  }
  else if(avg>20.5 && PERF.bloom>1){ PERF.bloom--; PERF.cooldown=1.0; }
  else if(avg>20.5 && PERF.pxBudget>0.9e6){ PERF.pxBudget*=0.62; PERF.cooldown=1.4; sizeDisplay(true); }
  else if(avg>20.5 && PERF.bloom>0){ PERF.bloom=0; PERF.cooldown=1.4; }
  else if(avg<11.5 && PERF.bloom<3){ PERF.bloom++; PERF.cooldown=6.0; }
}

/* ------------------------------------------------------------ layout grid */

/* One thumb, portrait. The instrument gets the top, the controls get the
   bottom third where the thumb actually reaches. In landscape the same blocks
   are re-stacked side by side rather than scaled down. */
const LY={};
function layout(){
  const w=VW,h=VH;
  const safeT=Math.max(13,Math.round(h*0.017)), safeB=Math.max(10,Math.round(h*0.012));
  LY.w=w; LY.h=h;
  LY.portrait = h>=w;
  LY.pad=Math.max(5,Math.round(Math.min(w,h)*0.017));
  const p=LY.pad;
  /* The type scale is set by the narrowest column that has to carry a line of
     text, never by the viewport. A tall desktop window does not make the
     status column any wider, and a sixteen-pixel cap height in a three-hundred
     pixel column is how readouts end up written on top of each other. */
  const colW=LY.portrait?0:clamp(Math.round(w*0.30),200,430);
  const textCol=LY.portrait?(w-p*2-12):(colW-14);
  const CHARS=60;
  LY.t0=clamp(Math.round(textCol/(CHARS*TRACK)),6,12);   /* dense tables      */
  LY.t1=Math.max(LY.t0+1,Math.round(LY.t0*1.22));        /* body              */
  LY.t2=Math.max(LY.t1+1,Math.round(LY.t0*1.62));        /* headings          */
  LY.t3=Math.max(LY.t2+2,Math.round(LY.t0*2.30));        /* the one big number*/
  LY.lh0=Math.round(LY.t0*1.75); LY.lh1=Math.round(LY.t1*1.72); LY.lh2=Math.round(LY.t2*1.6);

  if(LY.portrait){
    LY.status={x:p,y:safeT,w:w-p*2,h:Math.max(102,Math.round(h*0.128))};
    const ctrlH=Math.round(h*0.345);
    LY.ctrl={x:p,y:h-safeB-ctrlH,w:w-p*2,h:ctrlH};
    /* A strip the instrument may not use, so the console always has somewhere
       to put the last thing it said. */
    LY.newsH=LY.lh0+4;
    const instTop=LY.status.y+LY.status.h+p;
    LY.inst={x:p,y:instTop,w:w-p*2,h:LY.ctrl.y-p-LY.newsH-instTop};
    LY.newsY=LY.inst.y+LY.inst.h+3;
  } else {
    LY.status={x:p,y:safeT,w:colW,h:h-safeT-safeB};
    LY.ctrl={x:w-p-colW,y:safeT,w:colW,h:h-safeT-safeB};
    const iw=LY.ctrl.x-p-(LY.status.x+colW+p);
    const ih=Math.min(h-safeT-safeB, Math.max(iw*0.92, (h-safeT-safeB)*0.62));
    LY.inst={x:LY.status.x+colW+p,y:safeT,w:iw,h:ih};
    LY.newsH=(h-safeT-safeB)-ih-3;
    LY.newsY=LY.inst.y+ih+3;
  }
  LY.instCx=LY.inst.x+LY.inst.w/2;
  LY.instCy=LY.inst.y+LY.inst.h/2;
  LY.instR=Math.min(LY.inst.w,LY.inst.h)/2;
}

/* ------------------------------------------------------------------ input */

/* Immediate-mode hit regions: a control that was not drawn this frame cannot
   be pressed, which removes a whole class of ghost-button faults. */
let HITS=[], pressId=null, pressRepeat=false, pressT=0, repeatT=0, pointer={x:0,y:0,down:false};
const lastUp={x:0,y:0};   /* where the thumb was lifted, for chart picking */
let drag={active:false,x:0,y:0,dx:0,dy:0,moved:0};
function hit(x,y,w,h,id,opts){ HITS.push({x:x,y:y,w:w,h:h,id:id,o:opts||null}); }
function hitAt(px,py){
  for(let i=HITS.length-1;i>=0;i--){
    const r=HITS[i];
    if(px>=r.x&&px<=r.x+r.w&&py>=r.y&&py<=r.y+r.h) return r;
  }
  return null;
}
let fired=null;
function consume(id){ if(fired===id){ fired=null; return true; } return false; }
function held(id){ return pressId===id; }

function ptPos(e){
  const t=(e.touches&&e.touches[0])||(e.changedTouches&&e.changedTouches[0])||e;
  return {x:t.clientX, y:t.clientY};
}
function onDown(e){
  audioKick();
  const p=ptPos(e); pointer.x=p.x; pointer.y=p.y; pointer.down=true;
  const r=hitAt(p.x,p.y);
  pressId=r?r.id:null; pressT=0; repeatT=0;
  pressRepeat=!!(r&&r.o&&r.o.repeat);
  drag.active=true; drag.x=p.x; drag.y=p.y;
  drag.dx=0; drag.dy=0; drag.moved=0;
  if(r&&r.o&&r.o.repeat){ fired=r.id; sfx('tick'); }
  else if(r) sfx('tick');
  e.preventDefault();
}
function onMove(e){
  if(!pointer.down) return;
  const p=ptPos(e);
  drag.dx=p.x-drag.x; drag.dy=p.y-drag.y;
  drag.moved+=Math.abs(drag.dx)+Math.abs(drag.dy);
  drag.x=p.x; drag.y=p.y;
  pointer.x=p.x; pointer.y=p.y;
  e.preventDefault();
}
function onUp(e){
  const p=ptPos(e);
  lastUp.x=p.x; lastUp.y=p.y;
  const r=hitAt(p.x,p.y);
  if(r && r.id===pressId && drag.moved<14 && !(r.o&&r.o.repeat)) { fired=r.id; sfx('press'); }
  pointer.down=false; pressId=null; pressRepeat=false;
  drag.active=false; drag.dx=0; drag.dy=0;
  e.preventDefault();
}
window.addEventListener('touchstart',onDown,{passive:false});
window.addEventListener('touchmove',onMove,{passive:false});
window.addEventListener('touchend',onUp,{passive:false});
window.addEventListener('touchcancel',onUp,{passive:false});
window.addEventListener('mousedown',onDown,{passive:false});
window.addEventListener('mousemove',onMove,{passive:false});
window.addEventListener('mouseup',onUp,{passive:false});
window.addEventListener('contextmenu',e=>e.preventDefault());

/* Hold-to-repeat on the stepper keys: a bearing is entered one degree at a
   time until the operator leans on it. */
function inputStep(dt){
  if(pressId!==null){
    pressT+=dt;
    if(pressRepeat&&pressT>0.34){
      repeatT+=dt;
      const iv=pressT>1.6?0.028:(pressT>0.9?0.055:0.10);
      if(repeatT>=iv){ repeatT=0; fired=pressId; sfx('tick',0.4); }
    }
  }
}

/* ---------------------------------------------------------- panel widgets */

/* A key. It reports three things without being read: whether it exists,
   whether it can be pressed, and whether it is being pressed. */
function key(x,y,w,h,id,label,col,enabled,note,sz){
  const on=enabled!==false;
  const pressed=held(id)&&on;
  const c=col||C.CHASSIS;
  rect(x,y,w,h,c,on?(pressed?B.HI:B.MID):B.DIM,pressed?1.6:1);
  if(pressed){ rect(x+2.5,y+2.5,w-5,h-5,c,B.MID,1); }
  const s=sz||LY.t1;
  const ty=y+h/2-s*(note?1.05:0.5);
  textC(x+w/2,ty,s,label,on?(pressed?C.READOUT:c):c,on?(pressed?B.HI:B.HI):B.DIM,1);
  if(note) textC(x+w/2,ty+s*1.55,LY.t0,note,C.LABEL,on?B.MID:B.DIM,1);
  if(on) hit(x,y,w,h,id);
  else if(!on){ /* struck through: the key exists, and it is unavailable */
    line(x+3,y+h-3,x+w-3,y+3,c,B.DIM,1);
  }
  return on;
}
function keyRepeat(x,y,w,h,id,label,col,enabled,sz){
  const on=enabled!==false;
  const pressed=held(id)&&on;
  const c=col||C.CHASSIS;
  rect(x,y,w,h,c,on?(pressed?B.HI:B.MID):B.DIM,pressed?1.6:1);
  const s=sz||LY.t2;
  textC(x+w/2,y+h/2-s*0.5,s,label,on?(pressed?C.READOUT:c):c,on?B.HI:B.DIM,1);
  if(on) hit(x,y,w,h,id,{repeat:true});
  return on;
}

/* A framed block with a name burnt into its top rule. Every box on this
   console says what it is; an unlabelled frame is decoration. */
function panel(x,y,w,h,title,col,a){
  const c=col||C.CHASSIS, al=a===undefined?B.MID:a;
  const s=LY.t0;
  const tw=title?textW(title,s)+s*0.8:0;
  const L=bucket(c,1,al);
  pushSeg(L,x,y,x+w,y); pushSeg(L,x+w,y,x+w,y+h);
  pushSeg(L,x+w,y+h,x,y+h); pushSeg(L,x,y+h,x,y);
  if(title){
    /* The title sits in a notch cut out of the frame, as on a real fascia. */
    const tx=x+s*0.9;
    const K=bucket('#000',3.2,1);
    pushSeg(K,tx-s*0.4,y,tx+tw-s*0.4,y);
    text(tx,y-s*0.5,s,title,c,B.HI,1);
  }
}

/* A horizontal bar gauge with a marked limit. Reads: value, range, and
   whether the value is where it should be. */
function bar(x,y,w,h,frac,col,label,vtext){
  rect(x,y,w,h,C.CHASSIS,B.DIM,1);
  const f=clamp(frac,0,1);
  const n=Math.max(1,Math.round(w/4.6));
  const L=bucket(col,1,B.HI);
  const filled=Math.round(n*f);
  for(let i=0;i<filled;i++){
    const px=x+1.5+i*(w-3)/n;
    pushSeg(L,px,y+1.8,px,y+h-1.8);
  }
  if(label) text(x,y-LY.t0*1.25,LY.t0,label,C.LABEL,B.MID,1);
  if(vtext) textR(x+w,y-LY.t0*1.25,LY.t0,vtext,col,B.HI,1);
}


/* ==========================================================================
   AUDIO — everything is synthesised. There are no samples in this file.
   ========================================================================== */

let AC=null, MASTER=null, BED=null, noiseBuf=null, glottalWave=null;

function audioKick(){
  if(AC){ if(AC.state==='suspended') AC.resume(); return; }
  const Ctor=window.AudioContext||window.webkitAudioContext;
  if(!Ctor) return;
  try{ AC=new Ctor(); }catch(e){ AC=null; return; }
  buildAudio();
}

function makeNoise(sec){
  const n=Math.floor(AC.sampleRate*sec);
  const b=AC.createBuffer(1,n,AC.sampleRate);
  const d=b.getChannelData(0);
  const r=rng(0xA17E);
  for(let i=0;i<n;i++) d[i]=r()*2-1;
  return b;
}
function noiseSrc(){ const s=AC.createBufferSource(); s.buffer=noiseBuf; s.loop=true; return s; }

/* A glottal pulse is not a sawtooth: the harmonic roll-off is steeper and the
   phase relationship is what makes a formant synthesiser sound like a throat
   rather than a buzzer. */
function buildGlottal(){
  const N=40, re=new Float32Array(N), im=new Float32Array(N);
  for(let n=1;n<N;n++){ im[n]=1/(n*n)*Math.sin(n*0.55); re[n]=1/(n*n)*(1-Math.cos(n*0.55))*0.7; }
  glottalWave=AC.createPeriodicWave(re,im,{disableNormalization:false});
}

function buildAudio(){
  MASTER=AC.createGain(); MASTER.gain.value=0.9; MASTER.connect(AC.destination);
  noiseBuf=makeNoise(2.0);
  buildGlottal();

  /* The bed. It runs from power-on and is never touched again except to be
     taken away. */
  const g=AC.createGain(); g.gain.value=0.0; g.connect(MASTER);
  const lp=AC.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=210; lp.Q.value=0.7; lp.connect(g);

  const o1=AC.createOscillator(); o1.type='sawtooth'; o1.frequency.value=48.5;
  const g1=AC.createGain(); g1.gain.value=0.30; o1.connect(g1); g1.connect(lp); o1.start();
  const o2=AC.createOscillator(); o2.type='sine'; o2.frequency.value=97.3;
  const g2=AC.createGain(); g2.gain.value=0.10; o2.connect(g2); g2.connect(g); o2.start();
  const o3=AC.createOscillator(); o3.type='square'; o3.frequency.value=120.0;
  const g3=AC.createGain(); g3.gain.value=0.012; o3.connect(g3); g3.connect(g); o3.start();

  /* Air handling: filtered noise with a slow cycle, because a hull with air in
     it is a hull with a fan in it. */
  const ns=noiseSrc();
  const bp=AC.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=340; bp.Q.value=0.6;
  const ng=AC.createGain(); ng.gain.value=0.055;
  ns.connect(bp); bp.connect(ng); ng.connect(g); ns.start();
  const lfo=AC.createOscillator(); lfo.type='sine'; lfo.frequency.value=0.043;
  const lg=AC.createGain(); lg.gain.value=0.022; lfo.connect(lg); lg.connect(ng.gain); lfo.start();

  BED={gain:g, air:ng, lp:lp};
  g.gain.setTargetAtTime(0.20, AC.currentTime, 1.6);
}

/* The absence of the bed is the loudest event the console can produce, so it
   is only ever used for the two things that deserve it. */
function bedSet(level,tc){
  if(!BED) return;
  BED.gain.gain.cancelScheduledValues(AC.currentTime);
  BED.gain.gain.setTargetAtTime(level, AC.currentTime, tc===undefined?0.05:tc);
}

function env(node,t0,a,d,peak){
  node.gain.cancelScheduledValues(t0);
  node.gain.setValueAtTime(0.0001,t0);
  node.gain.exponentialRampToValueAtTime(Math.max(0.0002,peak),t0+a);
  node.gain.exponentialRampToValueAtTime(0.0001,t0+a+d);
}

function sfx(kind,vol){
  if(!AC||!MASTER) return;
  const t=AC.currentTime, v=(vol===undefined?1:vol);
  const g=AC.createGain(); g.connect(MASTER);
  if(kind==='tick'){
    const o=AC.createOscillator(); o.type='square'; o.frequency.setValueAtTime(2100,t);
    o.connect(g); env(g,t,0.001,0.022,0.05*v); o.start(t); o.stop(t+0.05);
  } else if(kind==='press'){
    const o=AC.createOscillator(); o.type='square'; o.frequency.setValueAtTime(880,t);
    o.frequency.setValueAtTime(1320,t+0.018);
    o.connect(g); env(g,t,0.002,0.05,0.07*v); o.start(t); o.stop(t+0.09);
  } else if(kind==='deny'){
    const o=AC.createOscillator(); o.type='square'; o.frequency.setValueAtTime(180,t);
    o.frequency.setValueAtTime(120,t+0.07);
    o.connect(g); env(g,t,0.003,0.16,0.10*v); o.start(t); o.stop(t+0.2);
  } else if(kind==='alarm'){
    const o=AC.createOscillator(); o.type='square'; o.frequency.setValueAtTime(740,t);
    o.frequency.setValueAtTime(560,t+0.12);
    const f=AC.createBiquadFilter(); f.type='bandpass'; f.frequency.value=900; f.Q.value=3;
    o.connect(f); f.connect(g); env(g,t,0.004,0.30,0.13*v); o.start(t); o.stop(t+0.36);
  } else if(kind==='caution'){
    const o=AC.createOscillator(); o.type='triangle'; o.frequency.setValueAtTime(420,t);
    o.connect(g); env(g,t,0.004,0.22,0.09*v); o.start(t); o.stop(t+0.28);
  } else if(kind==='burn'){
    const ns=noiseSrc(); const f=AC.createBiquadFilter(); f.type='lowpass';
    f.frequency.setValueAtTime(120,t); f.frequency.exponentialRampToValueAtTime(1800,t+0.9);
    f.frequency.exponentialRampToValueAtTime(90,t+3.4); f.Q.value=1.4;
    ns.connect(f); f.connect(g);
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(0.30*v,t+0.7);
    g.gain.setValueAtTime(0.30*v,t+2.2);
    g.gain.exponentialRampToValueAtTime(0.0001,t+3.6);
    ns.start(t); ns.stop(t+3.7);
  } else if(kind==='impact'){
    const ns=noiseSrc(); const f=AC.createBiquadFilter(); f.type='bandpass';
    f.frequency.setValueAtTime(220,t); f.Q.value=1.1;
    const o=AC.createOscillator(); o.type='sine'; o.frequency.setValueAtTime(90,t);
    o.frequency.exponentialRampToValueAtTime(38,t+0.5);
    ns.connect(f); f.connect(g); o.connect(g);
    env(g,t,0.004,0.55,0.36*v); ns.start(t); ns.stop(t+0.7); o.start(t); o.stop(t+0.7);
  } else if(kind==='sweep'){
    const o=AC.createOscillator(); o.type='sine'; o.frequency.setValueAtTime(1500,t);
    o.connect(g); env(g,t,0.001,0.03,0.022*v); o.start(t); o.stop(t+0.06);
  } else if(kind==='contact'){
    const o=AC.createOscillator(); o.type='sine'; o.frequency.setValueAtTime(1900,t);
    o.connect(g); env(g,t,0.001,0.10,0.06*v); o.start(t); o.stop(t+0.14);
  } else if(kind==='xmit'){
    const o=AC.createOscillator(); o.type='sawtooth'; o.frequency.setValueAtTime(300,t);
    o.frequency.linearRampToValueAtTime(2400,t+0.55);
    const f=AC.createBiquadFilter(); f.type='bandpass'; f.frequency.value=1400; f.Q.value=1.6;
    o.connect(f); f.connect(g); env(g,t,0.01,0.6,0.075*v); o.start(t); o.stop(t+0.66);
  }
}

/* ------------------------------------------------- parallel formant voice */

/* Formant centres for a male tract. The whole point of the SC-01 topology is
   that these are STEPPED at phoneme boundaries and never interpolated, which
   is why the machine sounds like it is assembling words out of parts. */
const PHON={
/*        F1   F2   F3   voiced dur(ms) kind                                */
  'IY':[ 270,2290,3010, 1, 130,'v'], 'IH':[ 390,1990,2550, 1, 100,'v'],
  'EH':[ 530,1840,2480, 1, 115,'v'], 'AE':[ 660,1720,2410, 1, 140,'v'],
  'AA':[ 730,1090,2440, 1, 150,'v'], 'AO':[ 570, 840,2410, 1, 140,'v'],
  'UH':[ 440,1020,2240, 1, 100,'v'], 'UW':[ 300, 870,2240, 1, 135,'v'],
  'AH':[ 640,1190,2390, 1, 100,'v'], 'ER':[ 490,1350,1690, 1, 140,'v'],
  'AX':[ 500,1400,2400, 1,  70,'v'],
  'M' :[ 250,1100,2200, 1,  85,'n'], 'N' :[ 250,1700,2600, 1,  80,'n'],
  'NG':[ 250,2300,2750, 1,  90,'n'],
  'L' :[ 380, 880,2575, 1,  85,'v'], 'R' :[ 310,1060,1380, 1,  90,'v'],
  'W' :[ 300, 610,2200, 1,  75,'v'], 'Y' :[ 270,2290,3010, 1,  70,'v'],
  'B' :[ 350, 900,2200, 1,  55,'s'], 'D' :[ 350,1600,2600, 1,  55,'s'],
  'G' :[ 300,1900,2400, 1,  55,'s'],
  'P' :[ 350, 900,2200, 0,  70,'s'], 'T' :[ 350,1700,2600, 0,  70,'s'],

const VOWELS='AEIOUY', SIBILANTS=['S','C','G','Z','X','J','CH','SH'], VOICEDC='BDVGJLMNRWZ';
function isV(c){ return VOWELS.indexOf(c)>=0; }
function isC(c){ return c>='A'&&c<='Z'&&!isV(c); }

function matchLeft(pat,s,i){
  let p=pat.length-1, k=i-1;
  while(p>=0){
    const c=pat[p];
    if(c===' '){ if(!(k<0||s[k]===' ')) return false; if(k>=0&&s[k]===' ')k--; p--; }
    else if(c==='#'){ if(k<0||!isV(s[k])) return false; while(k>=0&&isV(s[k]))k--; p--; }
    else if(c===':'){ while(k>=0&&isC(s[k]))k--; p--; }
    else if(c==='^'){ if(k<0||!isC(s[k])) return false; k--; p--; }
    else if(c==='.'){ if(k<0||VOICEDC.indexOf(s[k])<0) return false; k--; p--; }
    else if(c==='+'){ if(k<0||'EIY'.indexOf(s[k])<0) return false; k--; p--; }
    else { if(k<0||s[k]!==c) return false; k--; p--; }
  }
  return true;
}
function matchRight(pat,s,i){
  let p=0, k=i;
  while(p<pat.length){
    const c=pat[p];
    if(c===' '){ if(!(k>=s.length||s[k]===' ')) return false; p++; if(k<s.length&&s[k]===' ')k++; }
    else if(c==='#'){ if(k>=s.length||!isV(s[k])) return false; while(k<s.length&&isV(s[k]))k++; p++; }
    else if(c===':'){ while(k<s.length&&isC(s[k]))k++; p++; }
    else if(c==='^'){ if(k>=s.length||!isC(s[k])) return false; k++; p++; }
    else if(c==='+'){ if(k>=s.length||'EIY'.indexOf(s[k])<0) return false; k++; p++; }
    else if(c==='&'){
      if(k<s.length&&'SCGZXJ'.indexOf(s[k])>=0){k++;p++;}
      else if(k+1<s.length&&(s.substr(k,2)==='CH'||s.substr(k,2)==='SH')){k+=2;p++;}
      else return false;
    }
    else if(c==='%'){
      const r=s.substr(k);
      let m=0;
      if(/^ING/.test(r))m=3; else if(/^ELY/.test(r))m=3; else if(/^ED/.test(r))m=2;
      else if(/^ES/.test(r))m=2; else if(/^ER/.test(r))m=2; else if(/^E/.test(r))m=1;
      if(!m) return false; k+=m; p++;
    }
    else if(c==='.'){ if(k>=s.length||VOICEDC.indexOf(s[k])<0) return false; k++; p++; }
    else { if(k>=s.length||s[k]!==c) return false; k++; p++; }
  }
  return true;
}

/* Letter-to-sound. It is wrong on plenty of English, which is honest: a 1979
   phoneme box was wrong on plenty of English too. */
function toPhonemes(txt){
  const s=' '+txt.toUpperCase().replace(/[^A-Z0-9'.,\- ]/g,' ').replace(/\s+/g,' ').trim()+' ';
  const out=[];
  let i=0;
  let guard=0;
  while(i<s.length && guard++<4000){
    const ch=s[i];
    const rules=LTS[ch];
    if(!rules){ i++; continue; }
    let done=false;
    for(let r=0;r<rules.length;r++){
      const R=rules[r], f=R[1];
      if(s.substr(i,f.length)!==f) continue;
      if(!matchLeft(R[0],s,i)) continue;
      if(!matchRight(R[2],s,i+f.length)) continue;
      const ph=R[3];
      if(ph) { const parts=ph.split(' '); for(let q=0;q<parts.length;q++) if(parts[q]) out.push(parts[q]); }
      i+=f.length; done=true; break;
    }
    if(!done) i++;
  }
  /* Expand diphthongs and affricates into their stepped targets. */
  const fin=[];
  for(let k=0;k<out.length;k++){
    const p=out[k];
    if(DIPH[p]){ fin.push(DIPH[p][0],DIPH[p][1]); }
    else if(p==='WH'){ fin.push('HH','W'); }
    else if(PHON[p]) fin.push(p);
  }
  return fin;
}

/* The reader. Three parallel bandpasses fed by a glottal buzz and a hiss;
   nothing glides. */
function speak(segments, opts){
  if(!AC||!MASTER) return 0;
  opts=opts||{};
  const t0=AC.currentTime+0.05;
  const out=AC.createGain(); out.gain.value=(opts.vol===undefined?0.55:opts.vol); out.connect(MASTER);

  const buzz=AC.createOscillator(); buzz.setPeriodicWave(glottalWave);
  const bg=AC.createGain(); bg.gain.value=0; buzz.connect(bg);
  const hiss=noiseSrc(); const hg=AC.createGain(); hg.gain.value=0; hiss.connect(hg);

  const F=[], FG=[];
  const AMP=[1.0,0.62,0.34];
  for(let k=0;k<3;k++){
    const f=AC.createBiquadFilter(); f.type='bandpass';
    f.frequency.value=500; f.Q.value=[7,9,11][k];
    const g=AC.createGain(); g.gain.value=AMP[k];
    bg.connect(f); hg.connect(f); f.connect(g); g.connect(out);
    F.push(f); FG.push(g);
  }
  const f0base=opts.f0||118;
  let t=t0, total=0;
  /* Count the speakable phonemes first so the declination lands on the last
     one whether or not the middle of the sentence was comprehensible. */
  let np=0;
  for(let i=0;i<segments.length;i++) np+=(segments[i].ph?segments[i].ph.length:0);
  let idx=0;
  for(let i=0;i<segments.length;i++){
    const seg=segments[i];
    if(seg.mute){
      /* An undecoded word: the reader has no phonemes for it and stops. The
         gap is the readout — the operator hears exactly what they cannot read. */
      bg.gain.setValueAtTime(0,t); hg.gain.setValueAtTime(0,t);
      t+=seg.dur||0.30; total+=seg.dur||0.30;
      continue;
    }
    if(!seg.ph) continue;
    for(let j=0;j<seg.ph.length;j++){
      const p=PHON[seg.ph[j]]; if(!p) continue;
      const dur=p[4]/1000*(opts.rate||1);
      const decl=1-0.22*(idx/Math.max(1,np-1));
      buzz.frequency.setValueAtTime(f0base*decl,t);
      F[0].frequency.setValueAtTime(p[0],t);
      F[1].frequency.setValueAtTime(p[1],t);
      F[2].frequency.setValueAtTime(p[2],t);
      const kind=p[5];
      if(kind==='q'){ bg.gain.setValueAtTime(0,t); hg.gain.setValueAtTime(0,t); }
      else if(kind==='s'){
        /* Stops: silence, then a burst. Without the closure they smear. */
        bg.gain.setValueAtTime(0,t); hg.gain.setValueAtTime(0,t);
        const tb=t+dur*0.55;
        hg.gain.setValueAtTime(p[3]?0.22:0.42,tb);
        bg.gain.setValueAtTime(p[3]?0.30:0,tb);
        bg.gain.setValueAtTime(0,t+dur); hg.gain.setValueAtTime(0,t+dur);
      }
      else if(kind==='f'){
        hg.gain.setValueAtTime(0.40,t);
        bg.gain.setValueAtTime(p[3]?0.32:0,t);
      }
      else if(kind==='n'){ bg.gain.setValueAtTime(0.55,t); hg.gain.setValueAtTime(0,t); }
      else { bg.gain.setValueAtTime(0.95,t); hg.gain.setValueAtTime(0.02,t); }
      t+=dur; total+=dur; idx++;
    }
  }
  bg.gain.setValueAtTime(0,t); hg.gain.setValueAtTime(0,t);
  buzz.start(t0); hiss.start(t0);
  buzz.stop(t+0.12); hiss.stop(t+0.12);
  out.gain.setValueAtTime(out.gain.value,t); out.gain.linearRampToValueAtTime(0,t+0.1);
  return total;
}

/* The differences below are mechanisms, not timbres: a stridulating file, a
   struck bar, a bladder under ring modulation, a bank of quantised
   oscillators. Nothing here shares a signal path with anything else. */
function voiceStridulate(dur,seedR,pitch){
  if(!AC) return;
  const t0=AC.currentTime+0.03;
  const out=AC.createGain(); out.gain.value=0.16; out.connect(MASTER);
  const bp=AC.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=3400; bp.Q.value=6;
  const bp2=AC.createBiquadFilter(); bp2.type='bandpass'; bp2.frequency.value=5200; bp2.Q.value=9;
  bp.connect(out); bp2.connect(out);
  const src=AC.createOscillator(); src.type='sawtooth';
  const g=AC.createGain(); g.gain.value=0; src.connect(g); g.connect(bp); g.connect(bp2);
  let t=t0;
  while(t<t0+dur){
    /* Each pulse is one pass of the file over the scraper. */
    const rate=90+seedR()*160;
    const n=4+((seedR()*9)|0);
    src.frequency.setValueAtTime(rate,t);
    bp.frequency.setValueAtTime(2600+seedR()*2600,t);
    for(let i=0;i<n;i++){
      const tt=t+i*0.014;
      g.gain.setValueAtTime(0.9,tt);
      g.gain.setValueAtTime(0.0,tt+0.008);
    }
    t+=n*0.014+0.02+seedR()*0.10;
  }
  g.gain.setValueAtTime(0,t);
  src.start(t0); src.stop(t+0.1);
}
function voiceBar(dur,seedR,pitch){
  if(!AC) return;
  const t0=AC.currentTime+0.03;
  const out=AC.createGain(); out.gain.value=0.10; out.connect(MASTER);
  /* Free-bar modes. They are not harmonic, and that is the whole character. */
  const modes=[1,2.756,5.404,8.933,13.34,18.64];
  let t=t0;
  while(t<t0+dur){
    const f=(pitch||150)*(0.8+seedR()*0.5);
    const decay=0.24+seedR()*0.5;
    for(let m=0;m<modes.length;m++){
      const o=AC.createOscillator(); o.type='sine'; o.frequency.value=f*modes[m];
      const g=AC.createGain(); g.gain.value=0; o.connect(g); g.connect(out);
      const amp=0.55/(1+m*1.25);
      g.gain.setValueAtTime(0.0001,t);
      g.gain.exponentialRampToValueAtTime(amp,t+0.004);
      g.gain.exponentialRampToValueAtTime(0.0001,t+decay*(1-m*0.11));
      o.start(t); o.stop(t+decay+0.05);
    }
    t+=0.10+seedR()*0.20;
  }
}
function voiceBladder(dur,seedR,pitch){
  if(!AC) return;
  const t0=AC.currentTime+0.03;
  const out=AC.createGain(); out.gain.value=0.16; out.connect(MASTER);
  const car=AC.createOscillator(); car.type='sine'; car.frequency.value=pitch||96;
  const mod=AC.createOscillator(); mod.type='sine'; mod.frequency.value=(pitch||96)*1.61;
  /* True ring modulation: the modulator drives the gain of a zero-biased VCA,
     so the carrier vanishes and only the sidebands survive. */
  const ring=AC.createGain(); ring.gain.value=0;
  mod.connect(ring.gain); car.connect(ring);
  const lp=AC.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=900; lp.Q.value=8;
  const amp=AC.createGain(); amp.gain.value=0;
  ring.connect(lp); lp.connect(amp); amp.connect(out);
  let t=t0;
  while(t<t0+dur){
    const seg=0.12+seedR()*0.34;
    const p=(pitch||96)*(0.6+seedR()*0.9);
    car.frequency.setValueAtTime(p,t);
    mod.frequency.setValueAtTime(p*(1.1+seedR()*1.4),t);
    lp.frequency.setValueAtTime(400+seedR()*1600,t);
    amp.gain.setValueAtTime(0.0001,t);
    amp.gain.exponentialRampToValueAtTime(0.9,t+seg*0.25);
    amp.gain.exponentialRampToValueAtTime(0.0001,t+seg);
    t+=seg+0.02;
  }
  car.start(t0); mod.start(t0); car.stop(t+0.1); mod.stop(t+0.1);

function voiceBank(dur,seedR,pitch){
  if(!AC) return;
  const t0=AC.currentTime+0.03;
  const out=AC.createGain(); out.gain.value=0.075; out.connect(MASTER);
  const N=6, oscs=[], gains=[];
  const grid=(pitch||55);
  for(let i=0;i<N;i++){
    const o=AC.createOscillator(); o.type=(i&1)?'square':'sawtooth';
    const g=AC.createGain(); g.gain.value=0;
    o.connect(g); g.connect(out); o.start(t0); oscs.push(o); gains.push(g);
  }
  let t=t0;
  const step=0.055;
  while(t<t0+dur){
    for(let i=0;i<N;i++){
      /* Everything snaps to the grid: no value between two steps exists. */
      const k=1+((seedR()*11)|0);
      oscs[i].frequency.setValueAtTime(grid*k*(i+1)*0.5,t);
      gains[i].gain.setValueAtTime(seedR()<0.55?0.30/(i*0.6+1):0,t);
    }
    t+=step;
  }
  for(let i=0;i<N;i++){ gains[i].gain.setValueAtTime(0,t); oscs[i].stop(t+0.08); }

/* Each culture writes with a different mechanism, so each script is generated
   by a different stroke grammar rather than by restyling one alphabet. The
   forms are deterministic from the console's seed: the operator can write them
   down and they will be the same tomorrow. */
function makeScript(kind,count,seed){
  const r=rng(seed), glyphs=[];
  for(let g=0;g<count;g++){
    const polys=[];
    if(kind==='angular'){
      /* Cut with a mandible against a hard surface: straight, few, and always
         meeting at a lattice point. */
      const xs=[0,2,4], ys=[0,2,4,6];
      const n=2+((r()*3)|0);
      let cx=xs[(r()*3)|0], cy=ys[(r()*4)|0];
      const pts=[cx,cy];
      for(let i=0;i<n;i++){
        let nx,ny,guard=0;
        do{ nx=xs[(r()*3)|0]; ny=ys[(r()*4)|0]; guard++; }while((nx===cx&&ny===cy)&&guard<8);
        pts.push(nx,ny); cx=nx; cy=ny;
      }
      polys.push(pts);
      if(r()<0.45){ const bx=xs[(r()*3)|0]; polys.push([bx,0,bx,6]); }
    } else if(kind==='arc'){
      /* Drawn by a limb that pivots: everything is a segment of a circle. */
      const n=1+((r()*2)|0);
      for(let i=0;i<=n;i++){
        const cx=1+r()*2, cy=1.5+r()*3, rad=1+r()*2;
        const a0=r()*TAU, a1=a0+(0.8+r()*3.0)*(r()<0.5?1:-1);
        const steps=6;
        const pts=[];
        for(let s=0;s<=steps;s++){
          const t=a0+(a1-a0)*s/steps;
          pts.push(clamp(cx+Math.cos(t)*rad,0,4),clamp(cy+Math.sin(t)*rad*1.3,0,6));
        }
        polys.push(pts);
      }
    } else if(kind==='bardot'){
      /* A spine with markers set against it — written by pressure, so the
         information is in where the marks are, not in the line. */
      const vertical=r()<0.7;
      if(vertical){ const bx=1+((r()*3)|0); polys.push([bx,0,bx,6]); }
      else { const by=1+((r()*5)|0); polys.push([0,by,4,by]); }
      const n=1+((r()*4)|0);
      for(let i=0;i<n;i++){
        const px=(r()*5)|0, py=(r()*7)|0;
        if(r()<0.55) polys.push([px,py,px+(r()<0.5?1:-1),py]);
        else polys.push([px,py,px,py+(r()<0.5?1:-1)]);
      }
    } else {
      /* Etched by a machine that only moves along two axes. */
      let cx=(r()*5)|0, cy=(r()*7)|0;
      const pts=[cx,cy];
      const n=3+((r()*4)|0);
      let horiz=r()<0.5;
      for(let i=0;i<n;i++){
        if(horiz){ cx=clamp(cx+(r()<0.5?-2:2)-((r()*2)|0),0,4); }
        else { cy=clamp(cy+(r()<0.5?-3:3)-((r()*2)|0),0,6); }
        pts.push(cx,cy); horiz=!horiz;
      }
      polys.push(pts);
    }
    glyphs.push(polys);
  }
  return glyphs;
}

/* Alien text is written by glyph index, not by character: there is no
   transliteration and the console never invents one. */
function alienText(x,y,size,ids,glyphs,col,a,w){
  const s=size/6, adv=size*TRACK;
  const L=bucket(col,w||1,a===undefined?B.MID:a);
  for(let i=0;i<ids.length;i++){
    const g=glyphs[ids[i]%glyphs.length];
    const ox=x+i*adv;
    for(let p=0;p<g.length;p++){
      const pts=g[p];
      for(let q=0;q+3<pts.length;q+=2)
        pushSeg(L, ox+pts[q]*s, y+pts[q+1]*s, ox+pts[q+2]*s, y+pts[q+3]*s);
    }
  }
  return ids.length*adv;
}

/* Words are built once, from the culture's own seed. Glyph frequency is then
   COUNTED off the corpus the culture actually transmits — the operator learns
   the signs in the order the signs are used, not in an order anybody chose. */
function buildLanguage(cu,seed){
  const r=rng(seed);
  cu.glyphs=makeScript(cu.script,cu.glyphN,seed^0x5bf03635);
  const D=DIALOGUE[cu.id];

  /* Count how often each concept is actually transmitted, before any sign is
     assigned to it. A writing system is not arbitrary: the words a culture
     says constantly are the words built from its commonest marks, and that is
     what makes learning one in frequency order possible at all. */
  const cfreq=new Array(CONCEPT.length).fill(0);
  for(let n=0;n<D.length;n++){
    const add=(toks,mult)=>{ for(let i=0;i<toks.length;i++) if(toks[i]!==STOP) cfreq[toks[i]]+=mult; };
    add(D[n].them,3);
    for(let q=0;q<D[n].replies.length;q++) add(D[n].replies[q].t,1);
  }
  const rank=cfreq.map((f,i)=>[f,i]).sort((a,b)=>b[0]-a[0]||a[1]-b[1]).map(p=>p[1]);
  let usedCount=0;
  for(let i=0;i<cfreq.length;i++) if(cfreq[i]>0) usedCount++;

  cu.words=new Array(CONCEPT.length);
  const taken={};
  for(let rk=0;rk<rank.length;rk++){
    const c=rank[rk];
    /* The pool of signs a word may be spelt from widens as the word gets
       rarer, so the commonest words are spelt entirely in the commonest
       signs and become readable first. */
    const frac=usedCount?Math.min(1,rk/Math.max(1,usedCount-1)):1;
    let pool=clamp(Math.round(2+frac*(cu.glyphN-2)),2,cu.glyphN);
    if(cfreq[c]===0) pool=cu.glyphN;
    let w=null;
    for(let attempt=0;attempt<40;attempt++){
      const len=cu.wordMin+((r()*(cu.wordMax-cu.wordMin+1))|0);
      const cand=[];
      for(let i=0;i<len;i++) cand.push((r()*pool)|0);
      const key=cand.join(',');
      if(!taken[key]){ taken[key]=1; w=cand; break; }
      /* Collision: widen the pool rather than emit a homograph. */
      pool=Math.min(cu.glyphN,pool+1);
    }
    if(!w){ w=[rk%cu.glyphN,(rk*7+1)%cu.glyphN]; }
    cu.words[c]=w;
  }

  /* Now count what the signs themselves do across the corpus. This is the
     order the operator will learn them in, and it is counted, not chosen. */
  const freq=new Array(cu.glyphN).fill(0);
  for(let n=0;n<D.length;n++){
    const add=(toks,mult)=>{ for(let i=0;i<toks.length;i++){ const t=toks[i]; if(t===STOP) continue;
      const w=cu.words[t]; if(!w) continue; for(let k=0;k<w.length;k++) freq[w[k]]+=mult; } };
    add(D[n].them,3);
    for(let q=0;q<D[n].replies.length;q++) add(D[n].replies[q].t,1);
  }
  cu.freqOrder=freq.map((f,i)=>[f,i]).sort((a,b)=>b[0]-a[0]||a[1]-b[1]).map(p=>p[1]);
  cu.freq=freq;
  cu.known=0;                    /* how many signs, in that order, are read   */
  cu.standing=0;
  cu.node=0;
  cu.gifted=false;
  cu.refused=false;
  cu.contacted=false;
  return cu;
}
function knownSet(cu){
  const s={};
  for(let i=0;i<cu.known&&i<cu.freqOrder.length;i++) s[cu.freqOrder[i]]=1;
  return s;
}
function wordKnown(cu,concept,ks){
  const w=cu.words[concept];
  if(!w) return false;
  for(let i=0;i<w.length;i++) if(!ks[w[i]]) return false;
  return true;
}
/* Comprehension is counted signs, and the console reports it as such. */
function comprehension(cu){ return cu.known/cu.glyphN; }
function canPhrase(cu,toks){
  const ks=knownSet(cu);
  for(let i=0;i<toks.length;i++){ if(toks[i]===STOP) continue; if(!wordKnown(cu,toks[i],ks)) return false; }
  return true;
}
/* How many distinct signs the operator is short of being able to say this.
   A reply that cannot be sent should say how far off it is, not merely that
   it is off. */
function missingSigns(cu,toks){
  const ks=knownSet(cu), need={};
  for(let i=0;i<toks.length;i++){
    const t=toks[i];
    if(t===STOP) continue;
    const w=cu.words[t];
    if(!w) continue;
    for(let k=0;k<w.length;k++) if(!ks[w[k]]) need[w[k]]=1;
  }
  return Object.keys(need).length;
}

/* ==========================================================================
   BODIES
   Lathed surfaces, not drawings. A spine of control radii runs down the
   midline and a per-race cross-section departs from circular wherever the
   anatomy does. The mesh is cut away over the eyes and the mouth so that the
   features have black to sit on. Nothing has an arm.
   ========================================================================== */

function rot(v,axis,ang){
  /* Rodrigues. The limbs need to turn a frame, not just a point. */
  const c=Math.cos(ang), s=Math.sin(ang);
  const d=vdot(axis,v);
  return {
    x:v.x*c + (axis.y*v.z-axis.z*v.y)*s + axis.x*d*(1-c),
    y:v.y*c + (axis.z*v.x-axis.x*v.z)*s + axis.y*d*(1-c),
    z:v.z*c + (axis.x*v.y-axis.y*v.x)*s + axis.z*d*(1-c)
  };
}

/* Cross-sections. Each returns a radial multiplier for an angle around the
   midline; a race whose anatomy is circular would return 1 and none do. */
const XSEC={
  /* Chitin: a dorsal keel and a flat ventral plate. */
  keel:function(th,u){ return 1+0.15*Math.cos(3*th)+0.13*Math.max(0,Math.cos(th))-0.07*Math.max(0,-Math.cos(th)); },
  /* Calcite bell: five lobes, because the thing rings in five modes. */
  lobed:function(th,u){ return 1+0.15*Math.cos(5*th)+0.05*Math.cos(2*th); },
  /* A bladder under pressure: near-circular, flattened where it is held. */
  bladder:function(th,u){ return 1+0.13*Math.cos(2*th+u*1.4)-0.09*Math.max(0,Math.cos(th+1.2)); },
  /* Machined: a superellipse, so every silhouette has corners in it. */
  box:function(th,u){
    const n=5, c=Math.abs(Math.cos(th)), s=Math.abs(Math.sin(th));
    return 0.86/Math.pow(Math.pow(c,n)+Math.pow(s,n),1/n);
  }
};

function inAperture(ap,u,v){
  for(let i=0;i<ap.length;i++){
    const a=ap[i];
    if(u>=a.u0&&u<=a.u1&&v>=a.v0&&v<=a.v1) return true;
  }
  return false;
}

/* One camera, hand-rolled. The console has no 3-D library and no need of one. */
function makeCam(cx,cy,scale,yaw,pitch,dist){
  const cy1=Math.cos(yaw), sy=Math.sin(yaw), cp=Math.cos(pitch), sp=Math.sin(pitch);
  return {cx:cx,cy:cy,s:scale,cy1:cy1,sy:sy,cp:cp,sp:sp,d:dist};
}
function project(p,cam,out){
  let x=p.x*cam.cy1 - p.z*cam.sy;
  let z=p.x*cam.sy + p.z*cam.cy1;
  let y=p.y*cam.cp - z*cam.sp;
  z=p.y*cam.sp + z*cam.cp;
  const zz=z+cam.d;
  if(zz<0.15){ out.ok=false; return out; }
  const k=cam.s/zz;
  out.x=cam.cx+x*k; out.y=cam.cy-y*k; out.z=zz; out.ok=true;
  return out;
}

/* Limbs are chains that bend in their own frame. The bend plane precesses and
   the oscillation lags further down the chain, so the motion arrives at the
   tip late — which is the only reason any of this reads as alive. */
function limbChain(root,dir0,up0,t,cfg,phase,scale){
  const pts=[root];
  let d=vnorm(dir0), up=vnorm(up0);
  let p=root;
  let right=vnorm({x:d.y*up.z-d.z*up.y, y:d.z*up.x-d.x*up.z, z:d.x*up.y-d.y*up.x});
  for(let k=0;k<cfg.seg;k++){
    const plane=phase*1.7+t*cfg.precess+k*0.45;
    const axis=vnorm(vadd(vmul(right,Math.cos(plane)),vmul(up,Math.sin(plane))));
    let bend=cfg.amp*Math.sin(t*2.1-k*cfg.lag+phase);
    if(cfg.sharp){
      /* A jointed limb does not curve: it holds an angle and then changes it. */
      bend=cfg.amp*(k===1?1.5:(k===3?-1.2:0.35))*(0.55+0.45*Math.sin(t*1.5-k*cfg.lag+phase));
    }
    d=vnorm(rot(d,axis,bend));
    up=vnorm(rot(up,axis,bend));
    right=vnorm({x:d.y*up.z-d.z*up.y, y:d.z*up.x-d.x*up.z, z:d.x*up.y-d.y*up.x});
    const seglen=cfg.len*scale/cfg.seg*(1-cfg.taper*k/cfg.seg);
    p=vadd(p,vmul(d,seglen));
    pts.push(p);
  }
  return pts;
}

const _pp={x:0,y:0,z:0,ok:false}, _pq={x:0,y:0,z:0,ok:false};
function drawAlien(raceIdx,cx,cy,size,t,col,agitation){
  const R=RACES[raceIdx%RACES.length];
  const xf=XSEC[R.xsec];
  const NI=R.ni, NJ=R.nj;
  const cam=makeCam(cx,cy,size*2.05,0.55+Math.sin(t*0.13)*0.30, -0.16+Math.sin(t*0.09)*0.10, 4.6);
  const breathe=1+0.045*Math.sin(t*(0.9+agitation*2.2));
  const scale=size/110;

  /* Build one ring at a time and stroke it against the previous ring, so the
     surface exists as geometry and never as a filled shape. */
  let prev=null, prevOK=null;
  const cur=new Array(NJ), curOK=new Array(NJ);
  for(let i=0;i<NI;i++){
    const u=i/(NI-1);
    const sx=(u-0.5)*R.len;
    const bowY=-R.bow*Math.sin(u*Math.PI);
    const rad=R.spine[i]*breathe;
    for(let j=0;j<NJ;j++){
      const v=j/NJ, th=v*TAU;
      const rr=rad*xf(th,u);
      const p={x:sx, y:bowY+Math.sin(th)*rr*R.aspect, z:Math.cos(th)*rr};
      const o={x:0,y:0,z:0,ok:false};
      project(p,cam,o);
      cur[j]=o;
      curOK[j]=o.ok && !inAperture(R.apertures,u,v);
    }
    /* Latitudinal: the ring itself. */
    for(let j=0;j<NJ;j++){
      const k=(j+1)%NJ;
      if(!curOK[j]||!curOK[k]) continue;
      const z=(cur[j].z+cur[k].z)*0.5;
      /* Depth is reported as brightness. There is no other depth here. */
      const b=clamp(1.35-(z-cam.d+1.2)*0.62,0.10,1)*B.HI;
      line(cur[j].x,cur[j].y,cur[k].x,cur[k].y,col,b*0.85,1);
    }
    /* Longitudinal: every second one carries the surface at this size. */
    if(prev){
      for(let j=0;j<NJ;j+=2){
        if(!curOK[j]||!prevOK[j]) continue;
        const z=(cur[j].z+prev[j].z)*0.5;
        const b=clamp(1.35-(z-cam.d+1.2)*0.62,0.10,1)*B.HI;
        line(prev[j].x,prev[j].y,cur[j].x,cur[j].y,col,b*0.6,1);
      }
    }
    prev=cur.slice(); prevOK=curOK.slice();
  }

  /* Features, drawn into the holes cut for them. */
  for(let e=0;e<R.eyes.length;e++){
    const E=R.eyes[e];
    const sx=(E.u-0.5)*R.len, th=E.v*TAU;
    const rad=R.spine[Math.min(R.spine.length-1,Math.round(E.u*(NI-1)))]*breathe;
    const rr=rad*xf(th,E.u);
    const c={x:sx, y:-R.bow*Math.sin(E.u*Math.PI)+Math.sin(th)*rr*R.aspect, z:Math.cos(th)*rr};
    project(c,cam,_pp);
    if(!_pp.ok) continue;
    const pr=E.r*cam.s/_pp.z;
    if(_pp.z>cam.d+0.05) continue;           /* an eye on the far side is not seen */
    if(E.iris){
      /* The machine's aperture reports its own state: it irises with agitation. */
      const ir=pr*(0.30+0.45*(1-agitation)+0.06*Math.sin(t*1.7));
      circle(_pp.x,_pp.y,pr,col,B.HI,1.3,E.seg);
      circle(_pp.x,_pp.y,ir,C.READOUT,B.HI,1,E.seg);
      for(let k=0;k<E.seg;k++){
        const a=k/E.seg*TAU+t*0.2;
        line(_pp.x+Math.cos(a)*ir,_pp.y+Math.sin(a)*ir,_pp.x+Math.cos(a)*pr,_pp.y+Math.sin(a)*pr,col,B.MID,1);
      }
    } else {
      circle(_pp.x,_pp.y,pr,col,B.HI,1.2,E.seg);
      circle(_pp.x,_pp.y,pr*0.62,col,B.MID,1,E.seg);
      /* The pupil moves. It is the only part of any of them that looks back. */
      const gx=Math.sin(t*0.7+e)*pr*0.24, gy=Math.cos(t*0.53+e*2)*pr*0.20;
      circle(_pp.x+gx,_pp.y+gy,pr*0.22,C.READOUT,B.HI,1,6);
    }
  }
  if(R.mouth){
    const M=R.mouth;
    const sx=(M.u-0.5)*R.len, th=M.v*TAU;
    const rad=R.spine[Math.min(R.spine.length-1,Math.round(M.u*(NI-1)))]*breathe;
    const rr=rad*xf(th,M.u);
    const c={x:sx,y:-R.bow*Math.sin(M.u*Math.PI)+Math.sin(th)*rr*R.aspect,z:Math.cos(th)*rr};
    project(c,cam,_pp);
    if(_pp.ok&&_pp.z<=cam.d+0.1){
      const w=M.w*cam.s/_pp.z;
      const gape=(0.25+0.75*agitation)*(0.5+0.5*Math.sin(t*3.1));
      if(M.kind==='mandible'){
        for(let s=-1;s<=1;s+=2){
          const a=s*(0.30+gape*0.55);
          polyline([_pp.x,_pp.y,
                    _pp.x+Math.cos(a)*w*0.9,_pp.y+Math.sin(a)*w*0.9,
                    _pp.x+Math.cos(a*0.3)*w*1.35,_pp.y+Math.sin(a*0.3)*w*1.35],col,B.HI,1.3);
        }
      } else {
        const h=w*0.10+w*0.42*gape;
        polyline([_pp.x-w*0.55,_pp.y, _pp.x-w*0.2,_pp.y-h, _pp.x+w*0.2,_pp.y-h, _pp.x+w*0.55,_pp.y,
                  _pp.x+w*0.2,_pp.y+h, _pp.x-w*0.2,_pp.y+h],col,B.HI,1.2,true);
      }
    }
  }

  /* Limbs. */
  const Lc=R.limbs;
  if(Lc) for(let l=0;l<Lc.n;l++){
    const frac=l/Lc.n;
    const th=frac*TAU+0.3;
    const sx=(Lc.from-0.5)*R.len;
    const rad=R.spine[Math.min(R.spine.length-1,Math.round(Lc.from*(NI-1)))]*breathe;
    const rr=rad*xf(th,Lc.from);
    const root={x:sx,y:-R.bow*Math.sin(Lc.from*Math.PI)+Math.sin(th)*rr*R.aspect,z:Math.cos(th)*rr};
    const outward=vnorm({x:-0.35,y:Math.sin(th)*Lc.spread,z:Math.cos(th)*Lc.spread});
    const up={x:1,y:0,z:0};
    const pts=limbChain(root,outward,up,t*(1+agitation*1.6),Lc,l*2.399,1);
    let px=null;
    for(let k=0;k<pts.length;k++){
      project(pts[k],cam,_pq);
      if(!_pq.ok){ px=null; continue; }
      const b=clamp(1.35-(_pq.z-cam.d+1.2)*0.62,0.12,1);
      if(px) line(px.x,px.y,_pq.x,_pq.y,col,b*B.HI,Math.max(0.8,1.9-k*0.22));
      if(Lc.prismatic && k>0 && k<pts.length-1){
        /* An armature has hardware at its joints. */
        const s=Math.max(1.5,7*cam.s/_pq.z/40);
        rect(_pq.x-s,_pq.y-s,s*2,s*2,col,b*B.MID,1);
      }
      px={x:_pq.x,y:_pq.y};
    }
  }
  const A=R.antennae;
  if(A) for(let l=0;l<A.n;l++){
    const th=(l?1:-1)*0.55;
    const sx=(A.from-0.5)*R.len;
    const rad=R.spine[Math.min(R.spine.length-1,Math.round(A.from*(NI-1)))]*breathe;
    const root={x:sx,y:Math.sin(th)*rad,z:Math.cos(th)*rad};
    const pts=limbChain(root,vnorm({x:-1,y:Math.sin(th),z:Math.cos(th)*0.4}),{x:0,y:1,z:0},
                        t*(1+agitation*2.2),A,l*1.7,1);
    let px=null;
    for(let k=0;k<pts.length;k++){
      project(pts[k],cam,_pq);
      if(!_pq.ok){ px=null; continue; }
      if(px) line(px.x,px.y,_pq.x,_pq.y,col,B.MID*(1-k/pts.length*0.6),1);
      px={x:_pq.x,y:_pq.y};
    }
  }
}

const STARS=[];
function buildCatalogue(){
  for(let i=0;i<CAT_SRC.length;i++){
    const c=CAT_SRC[i];
    const a=c[1]*D2R, d=c[2]*D2R, r=c[3];
    /* Equatorial spherical to equatorial Cartesian. Sol is the origin, which
       is exactly the problem the operator is going to have. */
    const s={
      name:c[0], ra:c[1], dec:c[2], dist:r, spec:c[4], planets:c[5], vmag:c[6],
      x:r*Math.cos(d)*Math.cos(a), y:r*Math.sin(d), z:r*Math.cos(d)*Math.sin(a),
      idx:i, visited:false, surveyed:false
    };
    const cm=/[OBAFGKMLTYDCWRNS]/.exec(c[4]||'');
    s.cls=cm?cm[0]:'K';
    /* Luminosity class drives the drawn body size and the well depth. */
    s.giant=/I{1,3}(?![VX])|IV/.test(c[4]||'') && !/V$/.test(c[4]||'');
    STARS.push(s);
  }
  SOL.x=0; SOL.y=0; SOL.z=0;
}
const SOL={name:'SOL',x:0,y:0,z:0,dist:0,spec:'G2V',planets:8,cls:'G',ra:0,dec:0,vmag:-26.7,idx:-1,visited:true,surveyed:true,giant:false};
function starAt(p,tol){
  let best=null,bd=tol===undefined?0.30:tol;
  const ds=vlen(p);
  if(ds<bd){ best=SOL; bd=ds; }
  for(let i=0;i<STARS.length;i++){
    const d=vdist(p,STARS[i]);
    if(d<bd){ bd=d; best=STARS[i]; }
  }
  return best?{star:best,d:bd}:null;
}

/* Approximate main-sequence properties from the spectral letter. The console
   labels these ESTIMATED wherever it uses them, because that is what they are. */
const SPEC_T={O:38000,B:19000,A:8600,F:6600,G:5600,K:4400,M:3100,D:9000,L:1900,T:1100,C:3000,W:60000,S:3000};
function starLum(s){
  const t=SPEC_T[s.cls]||4000;
  let L=Math.pow(t/5772,4)*Math.pow(t/5772,1.2);
  if(s.giant) L*=Math.pow(10, s.cls==='M'?3.4:2.6);
  if(s.cls==='D') L=0.002;
  return L;
}
function starRad(s){
  if(s.cls==='D') return 0.013;
  const t=SPEC_T[s.cls]||4000;
  let R=Math.pow(t/5772,1.1);
  if(s.giant) R*=Math.pow(10, s.cls==='M'?1.9:1.2);
  return R;
}

/* ------------------------------------------------------------ the hazards */

/* Debris streams, meteor swarms and drifting hulks, seeded onto routes that
   join real stars. A capsule is a segment and a radius; the corridor test is
   an honest line integral of the chord that falls inside it. */
const HAZ=[];
const HAZ_KIND=[
  {name:'DEBRIS STREAM', dens:[3,10],  rad:[0.10,0.34], len:[1.5,5.0]},
  {name:'METEOR SWARM',  dens:[7,22],  rad:[0.06,0.18], len:[0.6,2.4]},
  {name:'DRIFTING HULK', dens:[16,46], rad:[0.02,0.07], len:[0.05,0.40]}
];
function buildHazards(seed){
  HAZ.length=0;
  const r=rng(seed^0x2f8a71c3);
  /* Only routes anyone actually flies. A stream of debris exists because
     something shed it, and nothing sheds anything eight hundred light years
     out where no lighter has ever been sent. */
  const routable=[];
  for(let i=0;i<STARS.length;i++) if(STARS[i].dist<34) routable.push(STARS[i]);
  if(routable.length<2) return;
  const n=110;
  for(let i=0;i<n;i++){
    const ia=(r()*routable.length)|0;
    let ib=(r()*routable.length)|0;
    if(ib===ia) ib=(ib+1)%routable.length;
    const A=routable[ia], Bs=routable[ib];
    const dir=vnorm(vsub(Bs,A));
    const total=vdist(A,Bs);
    if(total<0.5) continue;
    const K=HAZ_KIND[(r()*HAZ_KIND.length)|0];
    const len=Math.min(total*0.7, lerp(K.len[0],K.len[1],r()));
    const t0=r()*(total-len);
    const a=vadd(A,vmul(dir,t0));
    const b=vadd(A,vmul(dir,t0+len));
    HAZ.push({
      a:a, b:b, r:lerp(K.rad[0],K.rad[1],r()), dens:lerp(K.dens[0],K.dens[1],r()),
      kind:K.name, found:false, id:i
    });
  }
}
function segPointDist2(p,a,b){
  const abx=b.x-a.x, aby=b.y-a.y, abz=b.z-a.z;
  const apx=p.x-a.x, apy=p.y-a.y, apz=p.z-a.z;
  const L2=abx*abx+aby*aby+abz*abz;
  let t=L2>0?(apx*abx+apy*aby+apz*abz)/L2:0;
  t=t<0?0:(t>1?1:t);
  const dx=apx-abx*t, dy=apy-aby*t, dz=apz-abz*t;
  return dx*dx+dy*dy+dz*dz;
}
/* The corridor integral. Sampling rather than solving the quartic: the sample
   count is fixed, so the answer is the same every time the same jump is
   flown, and the operator can be told what it was. */
const CORRIDOR_SAMPLES=128;
function corridor(p0,p1,onlyFound){
  const total=vdist(p0,p1);
  if(total<1e-6) return {dmg:0, hits:[]};
  const ds=total/CORRIDOR_SAMPLES;
  const hits=[];
  let dmg=0;
  for(let h=0;h<HAZ.length;h++){
    const H=HAZ[h];
    if(onlyFound&&!H.found) continue;
    const r2=H.r*H.r;
    let chord=0;
    for(let s=0;s<CORRIDOR_SAMPLES;s++){
      const t=(s+0.5)/CORRIDOR_SAMPLES;
      const p={x:lerp(p0.x,p1.x,t), y:lerp(p0.y,p1.y,t), z:lerp(p0.z,p1.z,t)};
      if(segPointDist2(p,H.a,H.b)<r2) chord+=ds;
    }
    if(chord>0){ const d=chord*H.dens; dmg+=d; hits.push({h:H,chord:chord,dmg:d}); }
  }
  return {dmg:dmg, hits:hits};
}

/* ---------------------------------------------------------- the astrogator */

/* The vehicle goes exactly where bearing, elevation and range point. The whole
   of the difficulty is that the catalogue is referenced to the origin and the
   operator is not at the origin any more. */
function catalogueSolution(target){
  const be=vecToBE(target);
  return {bearing:be.bearing, elev:be.elev, range:vlen(target)};
}
function trueSolution(from,target){
  const d=vsub(target,from);
  const be=vecToBE(d);
  return {bearing:be.bearing, elev:be.elev, range:vlen(d)};
}
/* What the computer will hand you, given what it has been taught. It can
   always fly a course; the reductions decide how tightly. */
function computerSolution(G,target){
  const s=G.red.parallax?trueSolution(G.pos,target):catalogueSolution(target);
  const e=solverError(G);
  const r=rng(hashStr(target.name+'|'+G.jumps+'|'+G.seed));
  return {
    bearing:(s.bearing+(r()*2-1)*e.ang+360)%360,
    elev:clamp(s.elev+(r()*2-1)*e.ang,-90,90),
    range:Math.max(0.05,s.range*(1+(r()*2-1)*e.rng))
  };
}
/* The residual the computer cannot remove. Every reduction shrinks it; the
   hull noise floor means it never reaches zero. */
function solverError(G){
  /* Un-taught, the machine is good enough to put the vehicle in a system's
     outer debris and no better. Each reduction tightens it; the hull noise
     floor means it never reaches zero. */
  let ang=0.90, rng_=0.020;
  if(G.red.parallax){ ang=0.45; rng_=0.012; }
  if(G.red.range){ rng_*=0.28; }
  if(G.red.epoch){ ang*=0.34; }
  if(G.red.closure){ ang*=0.30; rng_*=0.45; }
  const hull=1+(1-G.hull/100)*2.2;
  return {ang:ang*hull, rng:rng_*hull};
}
/* The uncertainty the console can honestly draw around its own answer. */
function solverSigma(G,range){
  const e=solverError(G);
  return Math.max(0.004, range*Math.sin(e.ang*D2R)*0.62 + range*e.rng*0.62);
}

function arrivalPoint(G){
  return vadd(G.pos, vmul(beToVec(G.bearing,G.elev), G.range));
}

/* Grading the miss. It is a curve, not a wall: there is always a worse and a
   better outcome and the operator is told which one they got and by how much. */
const ARRIVE_CLEAN=0.05, ARRIVE_HALO=0.38, ARRIVE_ADRIFT=2.2;
function gradeArrival(p,target){
  const d=vdist(p,target);
  if(d<=ARRIVE_CLEAN) return {grade:'CLEAN', d:d};
  if(d<=ARRIVE_HALO)  return {grade:'HALO',  d:d};
  if(d<=ARRIVE_ADRIFT) return {grade:'ADRIFT', d:d};
  return {grade:'LOST', d:d};
}
