};

function say(line,col){
  /* A console that prints the same fault six times has told the operator one
     thing and cost them five lines. */
  if(G.news.length && G.news[0].t===line){ G.news[0].n++; return; }
  G.news.unshift({t:line,c:col||C.READOUT,n:1});
  if(G.news.length>7) G.news.pop();
}
function newsLine(e){ return e.n>1?(e.t+' ('+e.n+')'):e.t; }
function logEvent(kind,text){
  G.log.push({t:G.t, kind:kind, text:text, p:{x:G.pos.x,y:G.pos.y,z:G.pos.z}});
  if(G.log.length>200) G.log.shift();
}

function newRun(seed){
  G.seed=seed>>>0;
  G.seedHex=('00000000'+G.seed.toString(16).toUpperCase()).slice(-8);
  G.rnd=rng(G.seed);
  buildCatalogue();
  buildHazards(G.seed);
  for(let i=0;i<CULTURES.length;i++){
    buildLanguage(CULTURES[i], G.seed ^ (0x9e3779b1*(i+1)));
    CULTURES[i].starIdx=STARS.findIndex(s=>s.name===CULTURES[i].host);
  }
  /* Well depth: the point past which the approach starts taking the hull. It
     is a property of the system, and the console can only estimate it. */
  const wells=STARS.concat([SOL]);
  for(let i=0;i<wells.length;i++){
    const r=rng(hashStr(wells[i].name+'|well|'+G.seed));
    wells[i].onset=0.30+r()*0.34;
    wells[i].onsetBias=(r()*2-1)*0.13;
    wells[i].yieldK=0.8+r()*0.7;
  }
  SOL._sys=null;
  /* The standing order. It is a form, and it was filled in by somebody who
     has never been here. */
  const cand=STARS.filter(s=>s.dist>13&&s.dist<24);
  const pick=cand.length?cand[(G.rnd()*cand.length)|0]:STARS[0];
  G.order={
    star:pick, docket:'MC-44/'+pad0((G.seed%9000)+1000,4)+'-R',
    surveyed:false, delivered:false,
    consignee:'BOARD OF TRADE, REGISTRY '+pad0((G.seed>>>7)%9000+1000,4)
  };
  G.pos=v3(0,0,0); G.hull=100; G.o2=G.o2max; G.fuel=64; G.power=100; G.t=0;
  G.jumps=0; G.broadcasts=0; G.voided=false; G.maxRange=0;
  G.target=null; G.here=SOL; G.adrift=false; G.dead=null; G.ending=null;
  G.log=[]; G.news=[]; G.red={parallax:false,range:false,epoch:false,closure:false};
  G.bearing=0; G.elev=0; G.range=1; G.depth=0.25;
  HUNT.active=false; HUNT.detected=false; HUNT.bearingKnown=null; HUNT.conf=0;
  logEvent('ORDER','STANDING ORDER '+G.order.docket+' ACCEPTED');
}

/* --------------------------------------------------------------- the burn */

function executeBurn(){
  if(G.range>G.fuel){ say('INSUFFICIENT REACTION MASS',C.ALARM); sfx('deny'); return; }
  const from={x:G.pos.x,y:G.pos.y,z:G.pos.z};
  const to=arrivalPoint(G);
  /* Everything in the corridor is in the sum, found or not. */
  const cor=corridor(from,to,false);
  const hours=G.range*12;
  G.fuel-=G.range;
  G.jumps++;
  G.pos=to;
  advanceTime(hours);
  const dist=vlen(G.pos);
  G.maxRange=Math.max(G.maxRange,dist);
  if(dist>INSURANCE_LIMIT && !G.voided){
    G.voided=true;
    say('INSURANCE VOID / CLAUSE 9(B)',C.ALARM);
    logEvent('CLAUSE','POLICY VOIDED AT '+fmt(dist,2)+' LY FROM ORIGIN');
    sfx('alarm');
  }
  if(cor.dmg>0){
    G.hull-=cor.dmg;
    G.shake=Math.min(1,cor.dmg/14);
    sfx('impact',Math.min(1,cor.dmg/16));
    for(let i=0;i<cor.hits.length;i++){
      const H=cor.hits[i];
      /* You have now found it. This is not the recommended method. */
      if(!H.h.found){ H.h.found=true; logEvent('HAZARD','FOUND BY CONTACT: '+H.h.kind); }
    }
    say('CORRIDOR CONTACT / HULL -'+fmt(cor.dmg,1),C.ALARM);
    logEvent('DAMAGE','CORRIDOR '+fmt(cor.dmg,1)+' OVER '+cor.hits.length+' BODIES');
  }
  let near=starAt(G.pos, ARRIVE_ADRIFT);
  /* At a close binary the companion can be nearer to the arrival point than
     the component that was aimed at. The operator selected one of them, and
     being in the system means being at the one they selected. */
  if(G.target){
    const dt=vdist(G.pos,G.target);
    if(dt<=ARRIVE_HALO && (!near||dt<=near.d+0.05)) near={star:G.target,d:dt};
  }
  G.here=null; G.adrift=true;
  const grade=near?gradeArrival(G.pos,near.star):{grade:'LOST',d:Infinity};
  if(grade.grade==='CLEAN'||grade.grade==='HALO'){
    G.here=near.star; G.adrift=false; near.star.visited=true;
    if(grade.grade==='HALO'){
      /* Through the halo: the outer debris of the system is real and it is in
         the way, and the console says so afterwards rather than before. */
      const halo=(near.d-ARRIVE_CLEAN)/(ARRIVE_HALO-ARRIVE_CLEAN);
      const dm=2+halo*17;
      G.hull-=dm;
      G.shake=Math.max(G.shake,halo);
      sfx('impact',halo);
      say('ARRIVED THROUGH SYSTEM HALO / HULL -'+fmt(dm,1),C.CAUTION);
      logEvent('ARRIVAL','HALO ENTRY AT '+near.star.name+' MISS '+fmt(near.d,3)+' LY');
    } else {
      say('ARRIVAL CLEAN / '+near.star.name,C.NOMINAL);
      logEvent('ARRIVAL','CLEAN AT '+near.star.name+' MISS '+fmt(near.d,3)+' LY');
    }
    G.target=null;
  } else if(grade.grade==='ADRIFT'){
    say('NO PRIMARY / ADRIFT '+fmt(near.d,2)+' LY FROM '+near.star.name,C.CAUTION);
    logEvent('ARRIVAL','ADRIFT '+fmt(near.d,2)+' LY SHORT OF '+near.star.name);
    G.here=null; G.adrift=true;
  } else {
    say('NO PRIMARY WITHIN INSTRUMENT RANGE',C.ALARM);
    logEvent('ARRIVAL','ADRIFT, NO PRIMARY WITHIN '+fmt(ARRIVE_ADRIFT,1)+' LY');
    G.here=null; G.adrift=true;
    sfx('alarm');
  }
  if(G.here===SOL && G.order.surveyed && !G.order.delivered){
    G.order.delivered=true;
    endRun('DISCHARGED');
  }
  G.mode=G.here?'FIELD':'CHART';
  G.sweep=0;
  checkVitals();
}

/* ------------------------------------------------------------ the approach */

/* One dial. Yield rises all the way down and never stops rising; damage starts
   at a floor the console can only estimate, and the estimate has a bias in it
   that the operator cannot measure and the console does not know about. */
function approachYield(s,d){ return s.yieldK*(0.10+d*d*3.1); }
function approachDamage(s,d){
  if(d<=s.onset) return 0;
  const x=(d-s.onset)/(1-s.onset+1e-6);
  return Math.pow(x,1.7)*46;
}
function approachOnsetEstimate(s){
  /* Better instruments narrow the band. They never remove the bias. */
  const w=0.16 - (G.red.epoch?0.05:0) - (G.red.closure?0.05:0);
  return {mid:clamp(s.onset+s.onsetBias,0.05,0.95), half:Math.max(0.03,w)};
}
function executeApproach(){
  const s=G.here;
  if(!s){ sfx('deny'); return; }
  const d=G.depth;
  const hours=9+d*46;
  advanceTime(hours);
  const y=approachYield(s,d);
  const gotFuel=Math.min(G.fuelmax-G.fuel, y*11);
  const gotO2=y*150;
  G.fuel+=gotFuel;
  G.o2=Math.min(G.o2max,G.o2+gotO2);
  const dm=approachDamage(s,d);
  if(dm>0){
    G.hull-=dm; G.shake=Math.min(1,dm/20); sfx('impact',Math.min(1,dm/22));
    say('WELL DEPTH EXCEEDED / HULL -'+fmt(dm,1),C.ALARM);
  } else {
    say('SCOOP NOMINAL',C.NOMINAL);
  }
  logEvent('APPROACH',s.name+' DEPTH '+fmt(d,2)+' MASS +'+fmt(gotFuel,1)+' GAS +'+fmt(gotO2,0)+' HULL -'+fmt(dm,1));
  s.surveyed=true;
  if(s===G.order.star && !G.order.surveyed){
    G.order.surveyed=true;
    say('SURVEY LODGED / ORDER '+G.order.docket,C.NOMINAL);
    logEvent('ORDER','SURVEY LODGED AT '+s.name);
  }
  checkVitals();
}

/* ------------------------------------------------------------ the survey */

function executeSurvey(){
  const cost=18;
  if(G.power<cost){ say('INSUFFICIENT BUS POWER',C.CAUTION); sfx('deny'); return; }
  G.power-=cost;
  advanceTime(6);
  let found=0;
  const REACH=5.0;
  for(let i=0;i<HAZ.length;i++){
    const H=HAZ[i];
    if(H.found) continue;
    if(Math.sqrt(segPointDist2(G.pos,H.a,H.b))<REACH){ H.found=true; found++; }
  }
  say(found?('SWEEP RETURNS '+found+' BODIES'):'SWEEP RETURNS NOTHING', found?C.CAUTION:C.NOMINAL);
  logEvent('SURVEY','PASSIVE SWEEP RADIUS '+fmt(REACH,1)+' LY / '+found+' BODIES');
  sfx('sweep');
  checkVitals();
}

/* ------------------------------------------------------- what listens back */

/* Nothing hunts the operator until the operator broadcasts. Every hail is a
   bearing, and the bearing is to wherever the vehicle was when it sent. */
const XMIT_HOURS=5;
function broadcast(reason){
  G.broadcasts++;
  sfx('xmit');
  /* Sending, waiting and being answered takes hours, and every one of those
     hours is spent sitting on the bearing that was just radiated. */
  advanceTime(XMIT_HOURS);
  const first=!HUNT.active;
  if(first){
    HUNT.active=true;
    HUNT.conf=0;
    const r=rng(G.seed^0x7a3b91d5);
    const dir=vnorm({x:r()*2-1,y:(r()*2-1)*0.5,z:r()*2-1});
    HUNT.pos=vadd(G.pos,vmul(dir,11+r()*7));
  }
  HUNT.fix={x:G.pos.x,y:G.pos.y,z:G.pos.z};
  HUNT.conf=clamp(HUNT.conf+0.085,0,1);
  logEvent('TRANSMIT',reason+' / BEARING RADIATED FROM '+
    fmt(G.pos.x,2)+' '+fmt(G.pos.y,2)+' '+fmt(G.pos.z,2));
  checkVitals();
}

function huntStep(hours){
  if(!HUNT.active||G.dead||!isFinite(HUNT.pos.x)) return;
  /* A bearing ages. Hours of silence are worth as much as distance, and they
     are the only thing the operator can spend that costs no consumable. */
  HUNT.conf=Math.max(0,HUNT.conf-hours/1100);
  /* Early on it can only walk down the last bearing it was given. As the
     bearings pile up it stops needing them and comes to where the operator
     actually is. */
  const c=HUNT.conf;
  const aim={x:lerp(HUNT.fix.x,G.pos.x,c), y:lerp(HUNT.fix.y,G.pos.y,c), z:lerp(HUNT.fix.z,G.pos.z,c)};
  const to=vsub(aim,HUNT.pos);
  const d=vlen(to);
  const step=HUNT.speed*(0.55+1.50*c)*hours;
  if(d>step){
    HUNT.pos=vadd(HUNT.pos,vmul(vnorm(to),step));
  } else {
    HUNT.pos={x:aim.x,y:aim.y,z:aim.z};
  }
  if(vdist(HUNT.pos,G.pos)<0.22) die('INTERCEPTED');
}

/* ------------------------------------------------------------- the vitals */

function checkVitals(){
  if(G.dead) return;
  /* A reading that is not a number is not a small reading. Trap it here rather
     than let it propagate through the vehicle silently. */
  if(!isFinite(G.hull)||!isFinite(G.o2)||!isFinite(G.fuel)||!isFinite(G.t)){
    G.hull=0; die('INSTRUMENT FAILURE'); return;
  }
  if(G.hull<=0){ G.hull=0; die('HULL FAILURE'); return; }
  if(G.o2<=0){ G.o2=0; die('ATMOSPHERE EXHAUSTED'); return; }
}
function die(why){
  if(G.dead) return;
  G.dead=G.t; G.deadWhy=why;
  G.screen='DEAD';
  logEvent('END',why);
  bedSet(0,0.03);
  sfx('alarm',1.4);
}
function endRun(kind){
  if(G.ending) return;
  G.ending=kind;
  G.screen='END';
  logEvent('END',kind);
}

/* Mission time passes in exactly one place. A burn that costs two hundred
   hours has to cost the operator everything two hundred hours costs, including
   two hundred hours of whatever is following the transmissions. */
function advanceTime(hours){
  if(hours<=0||!isFinite(hours)) return;
  G.t+=hours;
  G.o2-=hours;
  /* The reactor makes less when the hull is open. */
  G.power=Math.min(100, G.power + hours*(0.62*(0.35+0.65*Math.max(0,G.hull)/100)));
  huntStep(hours);
  if(G.o2<=0&&!G.dead){ G.o2=0; die('ATMOSPHERE EXHAUSTED'); }
}

/* The bed is the reactor and the air handling, so it reports them. A hull
   that has been opened makes less power and the hum drops with it; an air
   supply running out thins the handler note. The operator hears the vehicle
   getting worse before any gauge has said so. */
function bedTrack(){
  if(!BED||!AC||G.dead) return;
  const hull=clamp(G.hull/100,0,1), air=clamp(G.o2/G.o2max,0,1);
  BED.gain.gain.setTargetAtTime(0.20*(0.45+0.55*hull), AC.currentTime, 1.2);
  BED.lp.frequency.setTargetAtTime(150+120*hull, AC.currentTime, 1.5);
  BED.air.gain.setTargetAtTime(0.055*(0.25+0.75*air), AC.currentTime, 2.0);
}

/* Continuous time. It is slow, and it never stops, and the operator can feel
   it in the air supply while they are deciding what to do. */
const HOURS_PER_SECOND=0.42;
let bedT=0;
function simStep(dt){
  if(G.dead||G.ending) return;
  advanceTime(dt*HOURS_PER_SECOND);
  if(G.hull<=0){ G.hull=0; die('HULL FAILURE'); }
  bedT+=dt;
  if(bedT>0.75){ bedT=0; bedTrack(); }
}

/* ==========================================================================
   INSTRUMENT ONE — THE GALAXY CHART
   For deciding where to go. It is referenced to the origin, and so is the
   catalogue, and the operator is not at the origin.
   ========================================================================== */

const ZOOMS=[4,9,20,45,110];
let zoomIdx=2;
const _cp={x:0,y:0,z:0,ok:false};
function chartCam(){
  const R=ZOOMS[zoomIdx];
  const s=Math.min(LY.inst.w,LY.inst.h)*0.44;
  return {R:R, cam:makeCam(LY.instCx,LY.instCy,s*2.6,G.yaw,G.pitch,2.6), scale:s/R};
}
/* Chart space is centred on the vehicle: what the operator needs to fly is
   always a displacement from HERE, and the plot says so by construction. */
function chartProject(p,CC,out){
  const q={x:(p.x-G.pos.x)/CC.R, y:(p.y-G.pos.y)/CC.R, z:(p.z-G.pos.z)/CC.R};
  return project(q,CC.cam,out);
}

let chartHits=[];
function drawChart(dt){
  const IN=LY.inst;
  panel(IN.x,IN.y,IN.w,IN.h,fit('GALAXY CHART / EQUATORIAL J2000',LY.t0,IN.w-16),C.CHASSIS,B.MID);
  const CC=chartCam();
  chartHits=[];

  /* The equatorial plane, drawn as range rings about the ORIGIN — the frame
     the catalogue is written in, so the operator can see their own offset. */
  const rings=[5,10,15,20,25,50,100];
  for(let i=0;i<rings.length;i++){
    const rr=rings[i];
    if(rr>CC.R*2.4) continue;
    const isLimit=(rr===25);
    const col=isLimit?C.CAUTION:C.CHASSIS;
    const a=isLimit?B.MID:B.DIM;
    let px=null;
    const seg=isLimit?44:30;
    for(let k=0;k<=seg;k++){
      const th=k/seg*TAU;
      const p={x:Math.cos(th)*rr, y:0, z:Math.sin(th)*rr};
      chartProject(p,CC,_cp);
      if(_cp.ok&&px) line(px.x,px.y,_cp.x,_cp.y,col,a,isLimit?1.2:1);
      px=_cp.ok?{x:_cp.x,y:_cp.y}:null;
    }
    if(isLimit){
      chartProject({x:rr,y:0,z:0},CC,_cp);
      const lbl='25 LY / CLAUSE 9(B)';
      if(_cp.ok&&_cp.y>IN.y+LY.t0*3&&_cp.y<IN.y+IN.h-LY.t0)
        text(clamp(_cp.x+4,IN.x+4,IN.x+IN.w-textW(lbl,LY.t0)-4),_cp.y-LY.t0*1.6,LY.t0,lbl,C.CAUTION,B.MID,1);
    }
  }
  /* The origin itself. Everything in the catalogue is measured from this. */
  chartProject(SOL,CC,_cp);
  if(_cp.ok){
    circle(_cp.x,_cp.y,4,C.READOUT,B.HI,1,8);
    cross(_cp.x,_cp.y,7,C.READOUT,B.MID,1);
    text(_cp.x+9,_cp.y-LY.t0*0.5,LY.t0,'SOL / ORIGIN',C.READOUT,B.MID,1);
  }

  /* The vernier is an inset instrument bolted over the plate. Whatever it
     covers is not drawn, because it is not visible. */
  let VR=null;
  if(G.target){
    const vs0=Math.min(IN.w*0.42,IN.h*0.34,132);
    VR={x:IN.x+IN.w-vs0-6, y:IN.y+LY.t0*2.4, w:vs0, h:vs0};
  }
  const underVernier=function(x,y){
    return VR && x>VR.x-3 && x<VR.x+VR.w+3 && y>VR.y-LY.t0 && y<VR.y+VR.h+3;
  };

  /* Stars. Brightness reports distance from the vehicle, size reports class. */
  const shown=[];
  for(let i=0;i<STARS.length;i++){
    const s=STARS[i];
    const dv=vdist(s,G.pos);
    if(dv>CC.R*2.6) continue;
    chartProject(s,CC,_cp);
    if(!_cp.ok) continue;
    if(_cp.x<IN.x+3||_cp.x>IN.x+IN.w-3||_cp.y<IN.y+3||_cp.y>IN.y+IN.h-3) continue;
    if(underVernier(_cp.x,_cp.y)) continue;
    const near=clamp(1-dv/(CC.R*1.6),0.12,1);
    const sel=(G.target===s);
    const col=sel?C.READOUT:(s.visited?C.NOMINAL:C.CHASSIS);
    const r=s.giant?3.4:(s.cls==='M'||s.cls==='D'?1.6:2.4);
    cross(_cp.x,_cp.y,r+1.4,col,near*(sel?B.HI:B.MID),sel?1.5:1);
    if(s.planets>0){
      /* A system with confirmed planets is worth the extra ink. */
      circle(_cp.x,_cp.y,r+3.2,col,near*B.DIM,1,8);
    }
    shown.push({s:s,x:_cp.x,y:_cp.y,d:dv,near:near});
    chartHits.push({x:_cp.x-14,y:_cp.y-14,w:28,h:28,s:s,d:dv});
  }
  /* Label what is close, what is selected, and what is under standing order.
     Everything else stays a mark, because a chart full of names is unreadable. */
  shown.sort((a,b)=>a.d-b.d);
  let labels=0;
  const placed=[];
  const maxLabels=Math.max(5,Math.min(9,Math.floor(IN.h/54)));
  for(let i=0;i<shown.length&&labels<maxLabels;i++){
    const S=shown[i];
    const must=(G.target===S.s)||(S.s===G.order.star);
    if(!must && i>maxLabels-1) continue;
    const cu=CULTURES.find(c=>c.starIdx===S.s.idx&&c.contacted);
    const col=(S.s===G.order.star)?C.CAUTION:(cu?C.CONTACT:C.LABEL);
    /* Binary components project to the same pixel. The second name steps down
       until it has clear space, and gives up if it never finds any. */
    const lw=textW(S.s.name,LY.t0), lh=LY.t0*1.4;
    let lx=S.x+6, ly2=S.y+2, ok=false;
    for(let g=0;g<6;g++){
      let clash=false;
      for(let q=0;q<placed.length;q++){
        const P=placed[q];
        if(lx<P.x+P.w&&lx+lw>P.x&&ly2<P.y+lh&&ly2+lh>P.y){ clash=true; break; }
      }
      if(!clash && ly2+lh<IN.y+IN.h-LY.t0*3 && lx+lw<IN.x+IN.w-4
         && !underVernier(lx,ly2) && !underVernier(lx+lw,ly2+lh)){ ok=true; break; }
      ly2+=lh;
    }
    if(!ok) continue;
    placed.push({x:lx,y:ly2,w:lw,h:lh});
    text(lx,ly2,LY.t0,S.s.name,col,S.near*B.MID,1);
    labels++;
  }

  /* Hazards that have been found. One that has not been found is not drawn,
     is still in the corridor, and is still in the damage sum. */
  const hzL=bucket(C.CAUTION,1.2,B.MID), hzC=bucket(C.CAUTION,1,B.DIM);
  for(let i=0;i<HAZ.length;i++){
    const H=HAZ[i];
    if(!H.found) continue;
    chartProject(H.a,CC,_cp);
    if(!_cp.ok) continue;
    const ax=_cp.x, ay=_cp.y;
    chartProject(H.b,CC,_cp);
    if(!_cp.ok) continue;
    const bx=_cp.x, by=_cp.y;
    if(Math.max(ax,bx)<IN.x||Math.min(ax,bx)>IN.x+IN.w||
       Math.max(ay,by)<IN.y||Math.min(ay,by)>IN.y+IN.h) continue;
    pushSeg(hzL,ax,ay,bx,by);
    /* A caliper at each end rather than a ring: it reports the same radius,
       reads better at chart scale, and costs three strokes instead of twenty. */
    const pr=Math.max(2.5,H.r*CC.scale);
    let dx=bx-ax, dy=by-ay;
    const dl=Math.hypot(dx,dy)||1;
    const nx=-dy/dl*pr, ny=dx/dl*pr;
    pushSeg(hzC,ax-nx,ay-ny,ax+nx,ay+ny);
    pushSeg(hzC,bx-nx,by-ny,bx+nx,by+ny);
  }

  /* The vehicle. */
  chartProject(G.pos,CC,_cp);
  const sx=_cp.ok?_cp.x:LY.instCx, sy=_cp.ok?_cp.y:LY.instCy;
  diamond(sx,sy,5,C.NOMINAL,B.HI,1.4);
  circle(sx,sy,9,C.NOMINAL,B.DIM,1,12);

  /* The projected arrival: where the numbers currently dialled will actually
     put the vehicle. This is the whole instrument. */
  const ap=arrivalPoint(G);
  chartProject(ap,CC,_cp);
  if(_cp.ok){
    const ax=_cp.x, ay=_cp.y;
    line(sx,sy,ax,ay,C.CHASSIS,B.MID,1);
    /* Dashes along the flown line so its length reads as a length. */
    const n=Math.max(2,Math.min(18,Math.round(G.range*1.2)));
    for(let k=1;k<n;k++){
      const t=k/n;
      const px=lerp(sx,ax,t), py=lerp(sy,ay,t);
      cross(px,py,1.6,C.CHASSIS,B.DIM,1);
    }
    diamond(ax,ay,6,C.READOUT,B.HI,1.4);
    const sig=solverSigma(G,G.range)*CC.scale;
    circle(ax,ay,Math.max(3,sig),C.READOUT,B.DIM,1,16);
    if(G.target){
      chartProject(G.target,CC,_cp);
      if(_cp.ok){
        /* The residual, drawn as a line between where you are going and where
           you meant to go. Its length is the miss. */
        const miss=vdist(ap,G.target);
        const col=miss<=ARRIVE_CLEAN?C.NOMINAL:(miss<=ARRIVE_HALO?C.CAUTION:C.ALARM);
        line(ax,ay,_cp.x,_cp.y,col,B.HI,1.3);
        rect(_cp.x-7,_cp.y-7,14,14,col,B.HI,1.2);
      }
    }
  }

  /* The bearing to whatever answered. It is never identified. */
  if(HUNT.active&&HUNT.bearingKnown){
    const d=vnorm(HUNT.bearingKnown);
    const far=vadd(G.pos,vmul(d,CC.R*2.2));
    chartProject(far,CC,_cp);
    if(_cp.ok){
      const age=clamp(1-(G.t-HUNT.lastSeen)/400,0.12,1);
      line(sx,sy,_cp.x,_cp.y,C.CONTACT,age*B.MID,1);
      text(_cp.x+4,_cp.y,LY.t0,'UNRESOLVED',C.CONTACT,age*B.MID,1);
    }
  }

  /* The vernier. A second plot of the same geometry at a magnification the
     main chart cannot give, so the operator can null the residual by eye. It
     performs no arithmetic the solver is not allowed to do — it only draws
     what is already on the chart, larger. */
  if(G.target){
    const vs=VR.w, vx=VR.x, vy=VR.y;
    const off=vdist(ap,G.target);
    const SCALES=[0.12,0.4,1.2,4,12,40,120];
    let full=SCALES[SCALES.length-1];
    for(let i=0;i<SCALES.length;i++){ if(off*2.4<SCALES[i]||i===SCALES.length-1){ full=SCALES[i]; break; } }
    const k=vs/full;
    panel(vx,vy,vs,vs,'VERNIER',C.CHASSIS,B.MID);
    const vcx=vx+vs/2, vcy=vy+vs/2;
    /* The two thresholds the arrival will actually be graded against. */
    if(ARRIVE_CLEAN*k>1.5) circle(vcx,vcy,ARRIVE_CLEAN*k,C.NOMINAL,B.MID,1,20);
    if(ARRIVE_HALO*k>1.5&&ARRIVE_HALO*k<vs) circle(vcx,vcy,ARRIVE_HALO*k,C.CAUTION,B.MID,1,24);
    cross(vcx,vcy,5,C.READOUT,B.HI,1.2);
    rect(vcx-4,vcy-4,8,8,C.READOUT,B.MID,1);
    /* The projected arrival, rotated by the same yaw and pitch as the chart,
       so the depth ambiguity is still there and still has to be flown out. */
    const d=vsub(ap,G.target);
    const q={x:d.x,y:d.y,z:d.z};
    let rx=q.x*Math.cos(G.yaw)-q.z*Math.sin(G.yaw);
    let rz=q.x*Math.sin(G.yaw)+q.z*Math.cos(G.yaw);
    let ry=q.y*Math.cos(G.pitch)-rz*Math.sin(G.pitch);
    const px2=clamp(vcx+rx*k,vx+3,vx+vs-3), py2=clamp(vcy-ry*k,vy+3,vy+vs-3);
    const gc=off<=ARRIVE_CLEAN?C.NOMINAL:(off<=ARRIVE_HALO?C.CAUTION:C.ALARM);
    line(vcx,vcy,px2,py2,gc,B.HI,1.2);
    diamond(px2,py2,5,gc,B.HI,1.4);
    textC(vcx,vy+vs-LY.t0*1.5,LY.t0,fmt(full,2)+' LY FULL',C.LABEL,B.MID,1);
  }

  /* Chart furniture that reports the chart's own state. */
  const t0=LY.t0;
  text(IN.x+6,IN.y+t0*1.3,t0,'RANGE '+pad(ZOOMS[zoomIdx],3)+' LY',C.LABEL,B.MID,1);
  text(IN.x+6,IN.y+IN.h-t0*1.6,t0,'YAW '+pad(((G.yaw*R2D)%360+360)%360,5,1)+
       '  PIT '+pad(G.pitch*R2D,5,1),C.LABEL,B.MID,1);
  hit(IN.x,IN.y,IN.w,IN.h,'chartarea');
}

/* ==========================================================================
   INSTRUMENT TWO — THE NEAR FIELD
   For what happens once the vehicle has arrived somewhere.
   ========================================================================== */

/* Planets. Real elements where they are known; otherwise derived from the seed
   and labelled as derived, because a console that presented a guess as a
   measurement would be the most dangerous instrument on the vehicle. */
function systemOf(s){
  if(s._sys) return s._sys;
  const real=REAL_SYSTEMS[s.name];
  const out={real:!!real, planets:[], mass:1, lum:starLum(s)};
  if(real){
    out.mass=real.m||1; out.lum=real.L||out.lum;
    for(let i=0;i<real.p.length;i++){
      const p=real.p[i];
      out.planets.push({name:p[0], a:p[1], per:p[2], rad:p[3]||0, hz:!!p[4], real:true});
    }
  } else if(s.planets>0){
    const r=rng(hashStr(s.name+'|sys'));
    for(let i=0;i<s.planets;i++){
      const a=0.04*Math.pow(2.1,i)*(0.7+r()*0.9);
      const per=365.25*Math.sqrt(a*a*a/Math.max(0.08,out.mass));
      out.planets.push({name:s.name+' '+'BCDEFGHI'[i], a:a, per:per, rad:0, hz:false, real:false});
    }
  }
  s._sys=out;
  return out;
}

function drawField(dt){
  const IN=LY.inst;
  const s=G.here;
  panel(IN.x,IN.y,IN.w,IN.h, s?('NEAR FIELD / '+s.name):'NEAR FIELD / NO PRIMARY',C.CHASSIS,B.MID);
  const cx=LY.instCx, cy=LY.instCy;
  const plateR=Math.min(IN.w,IN.h)*0.42;

  /* The plate. Range rings and a sweep, and the sweep is the only thing that
     puts a contact on it. */
  for(let i=1;i<=4;i++) circle(cx,cy,plateR*i/4,C.CHASSIS,i===4?B.MID:B.DIM,1,30);
  for(let k=0;k<12;k++){
    const a=k/12*TAU;
    line(cx+Math.cos(a)*plateR*0.96,cy+Math.sin(a)*plateR*0.96,
         cx+Math.cos(a)*plateR,cy+Math.sin(a)*plateR,C.CHASSIS,B.MID,1);
  }
  G.sweep+=dt*0.75;
  if(G.sweep>TAU){ G.sweep-=TAU; }
  const sa=G.sweep;
  line(cx,cy,cx+Math.cos(sa)*plateR,cy+Math.sin(sa)*plateR,C.NOMINAL,B.MID,1);
  /* A short trailing arc, which is the persistence of the plate, not a shadow. */
  arc(cx,cy,plateR*0.99,sa-0.5,sa,C.NOMINAL,B.DIM,1);

  if(!s){
    textC(cx,cy-LY.t2,LY.t2,'NO PRIMARY',C.ALARM,B.HI,1.4);
    const near=starAt(G.pos,60);
    if(near) textC(cx,cy+LY.t1*0.6,LY.t1,'NEAREST '+near.star.name+' '+fmt(near.d,3)+' LY',C.CAUTION,B.MID,1);
    textC(cx,cy+LY.t1*2.4,LY.t0,'ADRIFT / RE-SOLVE ON THE CHART',C.LABEL,B.MID,1);
  } else {
    const sys=systemOf(s);
    let maxA=0.2;
    for(let i=0;i<sys.planets.length;i++) maxA=Math.max(maxA,sys.planets[i].a);
    const auScale=plateR*0.86/maxA;

    /* The primary, drawn as a body: a limb, limb ticks, and nothing implied
       about its surface that the console has not measured. */
    const br=Math.max(5,Math.min(plateR*0.20, 6+Math.log10(Math.max(0.002,starRad(s)))*7));
    const lum=clamp(0.35+Math.log10(Math.max(1e-4,sys.lum))*0.16,0.25,1);
    circle(cx,cy,br,C.READOUT,lum,1.5,26);
    for(let k=0;k<16;k++){
      const a=k/16*TAU;
      line(cx+Math.cos(a)*br,cy+Math.sin(a)*br,cx+Math.cos(a)*(br+3),cy+Math.sin(a)*(br+3),C.READOUT,lum*0.7,1);
    }
    /* The habitable zone, as a band, because that is how it is known. */
    const hz0=Math.sqrt(sys.lum/1.10), hz1=Math.sqrt(sys.lum/0.53);
    if(hz1*auScale<plateR*1.1&&hz0*auScale>br+3){
      circle(cx,cy,hz0*auScale,C.NOMINAL,B.DIM,1,28);
      circle(cx,cy,hz1*auScale,C.NOMINAL,B.DIM,1,28);
    }

    /* Orbits, on the elements the archive actually has. */
    const days=G.t/24;
    const pLabels=[];
    for(let i=0;i<sys.planets.length;i++){
      const P=sys.planets[i];
      const rr=P.a*auScale;
      if(rr>plateR*1.15) continue;
      const col=P.real?C.CHASSIS:C.CAUTION;
      circle(cx,cy,rr,col,P.real?B.DIM:B.DIM*0.8,1,Math.max(14,Math.min(30,rr*0.4|0)));
      const th=(days/P.per)*TAU + i*1.7;
      const px=cx+Math.cos(th)*rr, py=cy+Math.sin(th)*rr*0.96;
      diamond(px,py,P.hz?4:3,P.hz?C.NOMINAL:C.READOUT,B.HI,1.2);
      if(sys.planets.length<=8 && rr>br+8){
        /* Set outboard along the radius, and only where nothing is already
           written: an unreadable caption is worse than no caption. */
        const lw=textW(P.name,LY.t0), lh=LY.t0*1.35;
        const ox=clamp(Math.cos(th)>=0?px+6:px-6-lw, IN.x+4, IN.x+IN.w-lw-4);
        const oy=clamp(py-LY.t0*0.5+Math.sin(th)*5, IN.y+LY.t0*2, IN.y+IN.h-LY.t0*2);
        let clash=false;
        for(let q=0;q<pLabels.length;q++){
          const Q=pLabels[q];
          if(ox<Q.x+Q.w&&ox+lw>Q.x&&oy<Q.y+lh&&oy+lh>Q.y){ clash=true; break; }
        }
        if(!clash){ pLabels.push({x:ox,y:oy,w:lw}); text(ox,oy,LY.t0,P.name,C.LABEL,B.MID,1); }
      }
    }
    if(!sys.real&&sys.planets.length)
      text(IN.x+6,IN.y+IN.h-LY.t0*2.6,LY.t0,'ELEMENTS DERIVED / NOT SURVEYED',C.CAUTION,B.MID,1);

    /* The emission. Passive: hearing it costs nothing and gives nothing away. */
    const cu=CULTURES.find(c=>c.starIdx===s.idx);
    if(cu){
      const ea=1.05+Math.sin(G.t*0.01)*0.4;
      const er=plateR*0.63;
      const ex=cx+Math.cos(ea)*er, ey=cy+Math.sin(ea)*er;
      const swept=Math.abs(((sa-ea+Math.PI*3)%TAU)-Math.PI)<0.5;
      const a=swept?B.HI:B.MID;
      circle(ex,ey,5,C.CONTACT,a,1.3,10);
      cross(ex,ey,8,C.CONTACT,a*0.7,1);
      const el='EMISSION / '+cu.cls, elw=textW(el,LY.t0);
      text(clamp(ex+9,IN.x+4,IN.x+IN.w-elw-4),ey-LY.t0*0.5,LY.t0,el,C.CONTACT,a,1);
    }
  }

  /* Whatever is coming. The plate says nothing about it until the sweep finds
     it, and then it says only a range and a bearing. */
  if(HUNT.active){
    const rel=vsub(HUNT.pos,G.pos);
    const d=vlen(rel);
    if(d<3.0){
      const be=vecToBE(rel);
      const ha=be.bearing*D2R;
      const swept=Math.abs(((sa-ha+Math.PI*3)%TAU)-Math.PI)<0.42;
      if(swept){
        HUNT.detected=true; HUNT.lastSeen=G.t;
        HUNT.bearingKnown={x:rel.x,y:rel.y,z:rel.z};
        if(G.contactPing!==Math.floor(G.t)){ G.contactPing=Math.floor(G.t); sfx('contact'); }
      }
      const age=clamp(1-(G.t-HUNT.lastSeen)/60,0,1);
      if(age>0){
        const rr=clamp(d/3.0,0.05,1)*plateR;
        const hx=cx+Math.cos(ha)*rr, hy=cy+Math.sin(ha)*rr;
        rect(hx-5,hy-5,10,10,C.CONTACT,age*B.HI,1.4);
        cross(hx,hy,10,C.CONTACT,age*B.MID,1);
        text(hx+8,hy+LY.t0,LY.t0,'---- / '+fmt(d,2)+' LY',C.CONTACT,age*B.HI,1);
      }
    }
  }
  hit(IN.x,IN.y,IN.w,IN.h,'fieldarea');
}

/* ==========================================================================
   COMMS
   The operator is the visitor. Every culture here was here first.
   ========================================================================== */

/* How much of a culture's writing one transmission resolves. The furthest
   culture gives up the largest fraction of itself per message and the nearest
   the smallest, so the first thing the operator meets is the last thing they
   can read. */
function learnFrom(cu){
  const rate=Math.max(1,Math.round(cu.glyphN*cu.ease))+(cu.standing>=4?1:0);
  const before=cu.known;
  cu.known=Math.min(cu.glyphN,cu.known+rate);
  return cu.known-before;
}
function utteranceSegments(cu,toks){
  const ks=knownSet(cu), segs=[];
  for(let i=0;i<toks.length;i++){
    const t=toks[i];
    if(t===STOP){ segs.push({ph:['_']}); continue; }
    if(wordKnown(cu,t,ks)) segs.push({ph:toPhonemes(CONCEPT[t])});
    else segs.push({mute:true, dur:cu.words[t].length*0.16});
  }
  return segs;
}
function utteranceDuration(cu,toks){
  let d=0;
  const segs=utteranceSegments(cu,toks);
  for(let i=0;i<segs.length;i++){
    if(segs[i].mute||!segs[i].ph) d+=segs[i].dur||0.2;
    else for(let j=0;j<segs[i].ph.length;j++){ const p=PHON[segs[i].ph[j]]; if(p) d+=p[4]/1000; }
  }
  return d;
}
/* Both channels at once: their own mechanism carries the whole utterance, and
   the reader carries only the part that has been decoded. Where the reader has
   nothing, it stops, and the operator hears the hole in their comprehension. */
function utter(cu,toks){
  const dur=Math.max(0.6,utteranceDuration(cu,toks));
  VOICE_FN[cu.voice](dur,rng(hashStr(toks.join(',')+cu.code)),cu.pitch);
  speak(utteranceSegments(cu,toks),{vol:0.5,f0:110});
  G.comms.speakUntil=performance.now()/1000+dur;
}

function openComms(cu){
  G.comms={cu:cu, phase:'HAILING', sel:-1, t:0, speakUntil:0, learned:0, msg:null, gift:false};
  G.sub='COMMS';
}
function commsHail(){
  const cu=G.comms.cu;
  broadcast('HAIL TO '+cu.code);
  cu.contacted=true;
  const node=DIALOGUE[cu.id][Math.min(cu.node,DIALOGUE[cu.id].length-1)];
  G.comms.learned=learnFrom(cu);
  G.comms.msg=node.them;
  G.comms.phase='THEM';
  utter(cu,node.them);
  logEvent('COMMS',cu.code+' RESPONDED / '+cu.known+' OF '+cu.glyphN+' SIGNS READ');
}
/* Asking them to repeat themselves is the only way out of a sentence the
   operator cannot yet answer. It costs a broadcast, and it costs a little of
   their patience, which is the whole shape of this game in one key. */
function commsRepeat(){
  const cu=G.comms.cu;
  broadcast('REPEAT REQUEST TO '+cu.code);
  G.comms.learned=learnFrom(cu);
  utter(cu,G.comms.msg);
  logEvent('COMMS','REPEAT REQUESTED / '+cu.known+' OF '+cu.glyphN+' SIGNS READ');
}

function commsSend(idx){
  const cu=G.comms.cu;
  const D=DIALOGUE[cu.id];
  const node=D[Math.min(cu.node,D.length-1)];
  const rep=node.replies[idx];
  if(!canPhrase(cu,rep.t)){ sfx('deny'); say('REPLY CANNOT BE PHRASED',C.CAUTION); return; }
  broadcast('REPLY TO '+cu.code);
  cu.standing+=rep.w;
  logEvent('COMMS','SENT ['+rep.tag+'] STANDING '+(cu.standing>=0?'+':'')+cu.standing);
  if(cu.standing<=-10){
    cu.refused=true;
    G.comms.phase='REFUSED';
    say(cu.code+' HAS STOPPED ANSWERING',C.ALARM);
    logEvent('COMMS',cu.code+' CEASED TRANSMISSION');
    return;
  }
  cu.node++;
  if(cu.node>=D.length){
    if(cu.standing>=4&&!cu.gifted){
      cu.gifted=true;
      G.red[cu.giftKey]=true;
      G.comms.phase='GIFT';
      G.comms.gift=true;
      say('REDUCTION RECEIVED / '+cu.gift,C.NOMINAL);
      logEvent('GIFT',cu.code+' GAVE '+cu.gift);
      sfx('contact',1.4);
    } else if(!cu.gifted){
      G.comms.phase='WITHHELD';
      say(cu.code+' GAVE NOTHING',C.CAUTION);
      logEvent('COMMS',cu.code+' WITHHELD / STANDING '+cu.standing);
    } else {
      G.comms.phase='DONE';
    }
    cu.node=D.length-1;
    return;
  }
  const next=D[cu.node];
  G.comms.learned=learnFrom(cu);
  G.comms.msg=next.them;
  G.comms.phase='THEM';
  utter(cu,next.them);
}

/* An utterance drawn honestly: what has been decoded is set in roman and what
   has not stays in the sender's own script, in the middle of the sentence. */
function drawUtterance(x,y,wid,size,cu,toks,dim){
  const ks=knownSet(cu);
  let cx=x, cy=y, lines=1;
  const adv=size*TRACK;
  for(let i=0;i<toks.length;i++){
    const t=toks[i];
    if(t===STOP){
      text(cx,cy,size,'.',C.READOUT,B.MID,1);
      cx+=adv*1.6;
      if(i<toks.length-1&&cx>x+wid*0.55){ cx=x; cy+=size*1.9; lines++; }
      continue;
    }
    const known=wordKnown(cu,t,ks);
    const w=known?CONCEPT[t]:cu.words[t];
    const ww=(known?w.length:w.length)*adv;
    if(cx+ww>x+wid){ cx=x; cy+=size*1.9; lines++; }
    if(known) text(cx,cy,size,CONCEPT[t],C.READOUT,dim?B.MID:B.HI,1);
    else alienText(cx,cy,size,cu.words[t],cu.glyphs,C.CONTACT,dim?B.MID:B.HI,1);
    cx+=ww+adv;
  }
  return cy+size*1.9-y;
}

function drawComms(dt){
  const IN=LY.inst;
  const cu=G.comms.cu;
  const CM=G.comms;
  CM.t+=dt;
  panel(IN.x,IN.y,IN.w,IN.h,'COMMS / REGISTRY '+cu.code,C.CONTACT,B.MID);
  const px=IN.x+7, pw=IN.w-14;
  let y=IN.y+9;
  const t0=LY.t0, t1=LY.t1;

  leader(px,y,pw,t0,'SIGNAL CLASS',cu.cls,C.LABEL,C.CONTACT); y+=LY.lh0;
  leader(px,y,pw,t0,'SIGNS READ',cu.known+' OF '+cu.glyphN+'  '+pad(comprehension(cu)*100,5,1)+' PCT'); y+=LY.lh0;
  leader(px,y,pw,t0,'STANDING',(cu.standing>=0?'+':'')+cu.standing,C.LABEL,
    cu.standing<0?C.ALARM:(cu.standing>=4?C.NOMINAL:C.CAUTION)); y+=LY.lh0;

  /* Comprehension as a counted bar: one cell per sign, filled in the order the
     signs are actually used. */
  const cellW=Math.min(9,(pw-2)/cu.glyphN);
  const KN=bucket(C.NOMINAL,1.6,B.HI), UN=bucket(C.CHASSIS,1,B.DIM);
  for(let i=0;i<cu.glyphN;i++){
    const L2=i<cu.known?KN:UN, xx=px+i*cellW;
    pushSeg(L2,xx,y,xx,y+6);
  }
  line(px,y+8,px+cu.glyphN*cellW,y+8,C.CHASSIS,B.DIM,1);
  y+=15;

  /* The transmission is set at the foot of the panel and the body gets
     everything between: the operator spends the exchange looking at it. */
  const textBlock=Math.min(IN.h*0.34, LY.t1*2.0*5+LY.lh0*2);
  const bodyTop=y, bodyBot=IN.y+IN.h-textBlock-6;
  const bodyH=Math.max(70,bodyBot-bodyTop);
  const agit=clamp(0.15+(cu.standing<0?-cu.standing*0.06:0)+(CM.speakUntil>performance.now()/1000?0.5:0),0,1);
  drawAlien(cu.id, IN.x+IN.w*0.5, bodyTop+bodyH*0.5, bodyH*0.40, CM.t, C.CONTACT, agit);
  y=bodyBot;

  line(px,y,px+pw,y,C.CONTACT,B.DIM,1); y+=8;

  if(CM.phase==='HAILING'){
    text(px,y,t1,'CHANNEL OPEN. NOTHING SENT.',C.CAUTION,B.HI,1); y+=t1*2.2;
    text(px,y,t0,'A HAIL IS A BEARING. IT WILL BE HEARD BY',C.CAUTION,B.MID,1); y+=LY.lh0;
    text(px,y,t0,'WHOEVER IS LISTENING, NOT ONLY BY THEM.',C.CAUTION,B.MID,1);
  } else if(CM.phase==='REFUSED'){
    text(px,y,t1,'NO CARRIER.',C.ALARM,B.HI,1); y+=t1*2.2;
    text(px,y,t0,'THEY WERE HERE FIRST AND THEY ARE DONE.',C.ALARM,B.MID,1);
  } else if(CM.phase==='GIFT'){
    text(px,y,t1,'REDUCTION RECEIVED',C.NOMINAL,B.HI,1); y+=t1*2.2;
    text(px,y,t0,cu.gift,C.NOMINAL,B.HI,1); y+=LY.lh0;
    text(px,y,t0,cu.giftNote,C.LABEL,B.MID,1); y+=LY.lh0*1.4;
    text(px,y,t0,'GIVEN. NOT TAKEN. NOT EARNED.',C.LABEL,B.MID,1);
  } else if(CM.phase==='WITHHELD'){
    text(px,y,t1,'EXCHANGE CLOSED',C.CAUTION,B.HI,1); y+=t1*2.2;
    text(px,y,t0,'THEY OWED NOTHING AND GAVE ACCORDINGLY.',C.CAUTION,B.MID,1); y+=LY.lh0;
    text(px,y,t0,'HAIL AGAIN TO KEEP LISTENING.',C.LABEL,B.MID,1);
  } else if(CM.phase==='DONE'){
    text(px,y,t1,'NOTHING FURTHER',C.LABEL,B.HI,1); y+=t1*2.2;
    text(px,y,t0,'HAIL AGAIN ONLY IF THE SIGNS ARE WORTH IT.',C.LABEL,B.MID,1);
  } else if(CM.msg){
    if(CM.learned>0){
      text(px,y,t0,'+'+CM.learned+' SIGN'+(CM.learned>1?'S':'')+' RESOLVED FROM THIS TRANSMISSION',C.NOMINAL,B.MID,1);
      y+=LY.lh0*1.3;
    }
    y+=drawUtterance(px,y,pw,t1,cu,CM.msg,false);
  }
  hit(IN.x,IN.y,IN.w,IN.h,'commsarea');
}

function drawStatus(){
  const S=LY.status;
  panel(S.x,S.y,S.w,S.h,fit('MC-44 CASSANDRA / OPERATOR 1 OF 1',LY.t0,S.w-16),C.CHASSIS,B.MID);
  const px=S.x+6, pw=S.w-12, t0=LY.t0;
  let y=S.y+8;

  const days=G.t/24;
  text(px,y,t0,'SEED '+G.seedHex,C.LABEL,B.MID,1);
  textC(S.x+S.w*0.5,y,t0,'T+'+pad0(G.t,5)+' H',C.READOUT,B.HI,1);
  textR(px+pw,y,t0,G.voided?'POLICY VOID':'POLICY ACTIVE',G.voided?C.ALARM:C.NOMINAL,B.HI,1);
  y+=LY.lh0+2;

  /* Two gauges to a row only where a row is wide enough for both labels and
     both readouts; otherwise one to a row. A gauge whose label has been
     trodden on is not a gauge. */
  const twoCol=pw>=300;
  const half=twoCol?(pw-8)/2:pw;
  const hullC=G.hull>60?C.NOMINAL:(G.hull>25?C.CAUTION:C.ALARM);
  const o2C=G.o2>600?C.NOMINAL:(G.o2>200?C.CAUTION:C.ALARM);
  const fuelC=G.fuel>25?C.NOMINAL:(G.fuel>8?C.CAUTION:C.ALARM);
  const gauges=[
    [G.hull/100,hullC,'HULL',pad(G.hull,5,1)+' PCT'],
    [G.o2/G.o2max,o2C,'ATM',pad0(G.o2,4)+' H'],
    [G.fuel/G.fuelmax,fuelC,'MASS',pad(G.fuel,5,1)+' LY'],
    [G.power/100,C.CHASSIS,'BUS',pad(G.power,5,1)+' PCT']
  ];
  for(let i=0;i<gauges.length;i++){
    const gcol=twoCol?(i%2):0;
    const gx2=px+gcol*(half+8);
    bar(gx2,y+t0*1.3,half,8,gauges[i][0],gauges[i][1],gauges[i][2],gauges[i][3]);
    if(!twoCol||gcol===1) y+=t0*1.3+8+LY.lh0;
  }
  y-=2;

  const r=vlen(G.pos);
  text(px,y,t0,'X'+pad(G.pos.x,8,2)+' Y'+pad(G.pos.y,8,2)+' Z'+pad(G.pos.z,8,2),C.READOUT,B.MID,1);
  y+=LY.lh0-1;
  const rc=r>INSURANCE_LIMIT?C.ALARM:(r>INSURANCE_LIMIT*0.85?C.CAUTION:C.NOMINAL);
  text(px,y,t0,'R'+pad(r,8,3)+' LY',rc,B.HI,1);
  textR(px+pw,y,t0,'XMIT '+pad0(G.broadcasts,2)+'  JUMPS '+pad0(G.jumps,2),
    G.broadcasts?C.CONTACT:C.LABEL,B.MID,1);

  /* The most recent thing the console has to say, and what it said before. */
  if(!LY.portrait){
    y+=LY.lh0+4;
    line(S.x+4,y,S.x+S.w-4,y,C.CHASSIS,B.DIM,1); y+=6;
    for(let i=0;i<G.news.length&&y<S.y+S.h-LY.lh0;i++){
      text(px,y,t0,fit(newsLine(G.news[i]),t0,pw),G.news[i].c,i?B.DIM:B.HI,1);
      y+=LY.lh0;
    }
    y+=6;
    if(y<S.y+S.h-LY.lh0*8){
      line(S.x+4,y,S.x+S.w-4,y,C.CHASSIS,B.DIM,1); y+=6;
      text(px,y,t0,'STANDING ORDER '+G.order.docket,C.LABEL,B.MID,1); y+=LY.lh0;
      leader(px,y,pw,t0,'PROCEED TO',G.order.star.name); y+=LY.lh0;
      leader(px,y,pw,t0,'LODGE SURVEY',G.order.surveyed?'DONE':'PENDING',C.LABEL,
        G.order.surveyed?C.NOMINAL:C.CAUTION); y+=LY.lh0;
      leader(px,y,pw,t0,'RETURN TO SOL',G.order.delivered?'DONE':'PENDING',C.LABEL,C.CAUTION); y+=LY.lh0;
      y+=4;
      const R=G.red;
      text(px,y,t0,'REDUCTIONS HELD',C.LABEL,B.MID,1); y+=LY.lh0;
      const rl=[['PARALLAX',R.parallax],['RANGE',R.range],['EPOCH',R.epoch],['CLOSURE',R.closure]];
      for(let i=0;i<rl.length&&y<S.y+S.h-LY.lh0;i++){
        leader(px,y,pw,t0,rl[i][0],rl[i][1]?'HELD':'-----',C.LABEL,rl[i][1]?C.NOMINAL:C.CHASSIS,
          rl[i][1]?B.HI:B.DIM);
        y+=LY.lh0;
      }
      if(y<S.y+S.h-LY.lh0*4){
        y+=6;
        line(S.x+4,y,S.x+S.w-4,y,C.CHASSIS,B.DIM,1); y+=6;
        text(px,y,t0,'LOG',C.LABEL,B.MID,1);
        textR(px+pw,y,t0,G.log.length+' ENTRIES',C.LABEL,B.DIM,1);
        y+=LY.lh0;
        const room=Math.floor((S.y+S.h-LY.lh0-y)/LY.lh0);
        const start=Math.max(0,G.log.length-room);
        for(let i=start;i<G.log.length;i++){
          const e=G.log[i];
          const c=e.kind==='TRANSMIT'?C.CONTACT:(e.kind==='DAMAGE'||e.kind==='END'?C.ALARM:
                  (e.kind==='GIFT'?C.NOMINAL:C.CHASSIS));
          text(px,y,t0,fit('T+'+pad0(e.t,5)+' '+e.text,t0,pw),c,B.MID,1);
          y+=LY.lh0;
        }
      }
    }
  }
}

/* In portrait the news line lives just under the instrument, where the thumb
   is not covering it. */
function drawNews(){
  if(LY.portrait){
    if(G.news.length){
      const n=G.news[0];
      text(LY.ctrl.x+2,LY.newsY,LY.t0,fit(newsLine(n),LY.t0,LY.ctrl.w-4),n.c,B.HI,1);
    }
    return;
  }
  /* Landscape leaves a strip under the instrument. The console fills it with
     what it has most recently had to say, oldest at the bottom. */
  if(LY.newsH<LY.lh0*2) return;
  const x=LY.inst.x, w=LY.inst.w;
  panel(x,LY.newsY,w,LY.newsH,'CONSOLE',C.CHASSIS,B.DIM);
  let y=LY.newsY+LY.t0*1.4;
  for(let i=0;i<G.news.length&&y<LY.newsY+LY.newsH-LY.t0;i++){
    text(x+6,y,LY.t0,fit(newsLine(G.news[i]),LY.t0,w-12),G.news[i].c,i?B.DIM:B.HI,1);
    y+=LY.lh0;
  }
}

/* --------------------------------------------------------------- controls */

const STEPS=[10,1,0.1,0.01];
let stepIdx=1;
function stepper(x,y,w,h,label,value,unit,idBase,col,fmtd){
  const bw=Math.max(48,h*1.15);
  keyRepeat(x,y,bw,h,idBase+'-',"-",col,true,LY.t2);
  keyRepeat(x+w-bw,y,bw,h,idBase+'+',"+",col,true,LY.t2);
  const iw=w-bw*2-6;
  rect(x+bw+3,y,iw,h,C.CHASSIS,B.DIM,1);
  text(x+bw+8,y+Math.max(3,h*0.10),LY.t0,label,C.LABEL,B.MID,1);
  const vs=clamp(Math.min(LY.t3,h*0.40,iw/(fmtd.length*TRACK)-1),LY.t1,LY.t3*1.6);
  textR(x+w-bw-9,y+h-vs*1.02-LY.t0*1.35,vs,fmtd,C.READOUT,B.HI,1.3);
  textR(x+w-bw-9,y+h-LY.t0*1.25,LY.t0,unit,C.LABEL,B.MID,1);
}

/* Where a control stack should start in a block taller than it needs. The
   hand rests at the bottom of a console, so that is where the keys go. */
function stackTop(K,needed){ return K.y+Math.max(0,K.h-needed); }

function drawChartControls(){
  const K=LY.ctrl;
  const px=K.x, pw=K.w;
  const t0=LY.t0;
  const gap0=4, rows0=5;
  const hdrGuess=LY.lh0*3+10;
  const availAll=K.h-hdrGuess;
  const keyH0=clamp((Math.min(availAll,LY.portrait?availAll:K.w*1.35)-gap0*(rows0-1))/rows0,30,64);
  let y=stackTop(K,hdrGuess+keyH0*rows0+gap0*(rows0-1));

  /* What is selected, and what the catalogue says about it. The catalogue is
     referenced to the origin; the console never pretends otherwise. */
  const tg=G.target;
  const twoLineSol=tg&&(textW('CAT 000.0'+String.fromCharCode(176)+' -00.0'+String.fromCharCode(176)+' 00.000',t0)*2+22>=pw);
  const hdrH=LY.lh0*(twoLineSol?3:2)+6;
  rect(px,y,pw,hdrH,C.CHASSIS,B.DIM,1);
  if(tg){
    text(px+5,y+4,t0,'TARGET '+tg.name,C.READOUT,B.HI,1);
    textR(px+pw-5,y+4,t0,tg.spec+'  '+tg.planets+'P',C.LABEL,B.MID,1);
    const cs=catalogueSolution(tg), ts=trueSolution(G.pos,tg);
    const DEG=String.fromCharCode(176);
    const catS='CAT '+pad(cs.bearing,5,1)+DEG+pad(cs.elev,6,1)+DEG+pad(cs.range,7,3);
    /* The catalogue solution is always shown. The one referenced to HERE is
       shown only once somebody has taught the machine to form it. */
    const hereS=G.red.parallax
      ? 'HERE '+pad(ts.bearing,5,1)+DEG+pad(ts.elev,6,1)+DEG+pad(ts.range,7,3)
      : 'HERE ---.- ----.- ------';
    text(px+5,y+4+LY.lh0,t0,catS,C.LABEL,B.MID,1);
    if(textW(catS,t0)+textW(hereS,t0)+22<pw)
      textR(px+pw-5,y+4+LY.lh0,t0,hereS,G.red.parallax?C.NOMINAL:C.CHASSIS,G.red.parallax?B.HI:B.DIM,1);
    else
      text(px+5,y+4+LY.lh0*2,t0,hereS,G.red.parallax?C.NOMINAL:C.CHASSIS,G.red.parallax?B.HI:B.DIM,1);
  } else {
    text(px+5,y+4,t0,'NO TARGET SELECTED',C.CAUTION,B.MID,1);
    text(px+5,y+4+LY.lh0,t0,'TAP A STAR ON THE CHART',C.LABEL,B.DIM,1);
  }
  y+=hdrH+4;

  const gap=gap0, keyH=keyH0;
  stepper(px,y,pw,keyH,'BEARING',G.bearing,'DEG TRUE','bear',C.CHASSIS,pad(G.bearing,6,2)); y+=keyH+gap;
  stepper(px,y,pw,keyH,'ELEVATION',G.elev,'DEG','elev',C.CHASSIS,pad(G.elev,6,2)); y+=keyH+gap;
  stepper(px,y,pw,keyH,'RANGE',G.range,'LIGHT YEARS','rng',C.CHASSIS,pad(G.range,6,3)); y+=keyH+gap;

  const bw=(pw-gap*2)/3;
  key(px,y,bw,keyH,'step','STEP',C.CHASSIS,true,fmt(STEPS[stepIdx],2));
  key(px+bw+gap,y,bw,keyH,'compute','COMPUTE',C.CHASSIS,!!G.target,
      G.red.parallax?'REDUCED':'CATALOGUE');
  key(px+(bw+gap)*2,y,bw,keyH,'survey','SURVEY',C.CHASSIS,G.power>=18,'18 PCT BUS');
  y+=keyH+gap;

  /* The corridor, from what has been found. What has not been found is not in
     this number and is still in the corridor. */
  const ap=arrivalPoint(G);
  const known=corridor(G.pos,ap,true);
  const bw2=(pw-gap)/2;
  const canBurn=G.range<=G.fuel&&G.range>0.001;
  key(px,y,bw2,keyH,'burn','BURN',canBurn?C.ALARM:C.CHASSIS,canBurn,
      known.dmg>0?('CORRIDOR -'+fmt(known.dmg,1)):'CORRIDOR CLEAR*');
  key(px+bw2+gap,y,bw2,keyH,'tofield','NEAR FIELD',C.CHASSIS,true,
      G.here?G.here.name:'NO PRIMARY');
}

function drawFieldControls(){
  const K=LY.ctrl;
  const px=K.x, pw=K.w, t0=LY.t0, gap=4;
  const availAll=K.h-(LY.lh0*2+10);
  const keyH0=clamp((Math.min(availAll,LY.portrait?availAll:K.w*1.5)-64)/2.7,32,72);
  const gh0=clamp(Math.min(availAll,LY.portrait?availAll:K.w*1.5)-keyH0*2-gap*2-LY.lh0-t0*1.5-6,
                  22,Math.max(26,keyH0*1.5));
  let y=stackTop(K,(LY.lh0*2+10)+t0*1.5+gh0+LY.lh0+2+keyH0*2+gap*2);
  const s=G.here;
  const cu=s?CULTURES.find(c=>c.starIdx===s.idx):null;

  rect(px,y,pw,LY.lh0*2+6,C.CHASSIS,B.DIM,1);
  if(s){
    const sys=systemOf(s);
    const nm='PRIMARY '+s.name, cls=s.spec+'  '+fmt(s.dist,2)+' LY';
    text(px+5,y+4,t0,fit(nm,t0,pw-10),C.READOUT,B.HI,1);
    if(textW(nm,t0)+textW(cls,t0)+16<pw) textR(px+pw-5,y+4,t0,cls,C.LABEL,B.MID,1);
    text(px+5,y+4+LY.lh0,t0,(textW(nm,t0)+textW(cls,t0)+16<pw?'':cls+'   ')+
      'R '+fmt(starRad(s),3)+' SOL   L '+(sys.lum<10?fmt(sys.lum,3):fmt(sys.lum,0))+
      ' SOL   '+sys.planets.length+' BODIES',C.LABEL,B.MID,1);
  } else {
    text(px+5,y+4,t0,'NO PRIMARY / ADRIFT',C.ALARM,B.HI,1);
    text(px+5,y+4+LY.lh0,t0,'RETURN TO THE CHART AND RE-SOLVE',C.LABEL,B.DIM,1);
  }
  y+=LY.lh0*2+10;

  /* Whatever the keys do not need goes to the well gauge, which is the only
     instrument on this screen the operator actually flies. */
  const keyH=keyH0, gh=gh0;
  const gx=px, gw=pw;
  y+=LY.t0*1.5;

  /* The well. One dial. Yield rises all the way down; the damage floor is an
     estimate with a band on it and the band is the honest part. */
  rect(gx,y,gw,gh,C.CHASSIS,B.MID,1);
  const est=s?approachOnsetEstimate(s):{mid:0.5,half:0.2};
  const b0=clamp(est.mid-est.half,0,1), b1=clamp(est.mid+est.half,0,1);
  const L=bucket(C.CAUTION,1,B.MID);
  for(let px2=gx+2+b0*(gw-4); px2<gx+2+b1*(gw-4); px2+=4.6) pushSeg(L,px2,y+2,px2,y+gh-2);
  const fx=gx+2+G.depth*(gw-4);
  const dmgNow=s?approachDamage(s,G.depth):0;
  line(fx,y-3,fx,y+gh+3,dmgNow>0?C.ALARM:C.READOUT,B.HI,1.6);
  const n=Math.max(1,Math.round((gw-4)/4.6));
  const F=bucket(dmgNow>0?C.ALARM:C.NOMINAL,1,B.HI);
  for(let i=0;i<n*G.depth;i++) pushSeg(F,gx+2+i*(gw-4)/n,y+gh*0.35,gx+2+i*(gw-4)/n,y+gh-3);
  text(gx+3,y-t0*1.3,t0,'APPROACH DEPTH',C.LABEL,B.MID,1);
  textR(gx+gw-3,y-t0*1.3,t0,pad(G.depth*100,5,1)+' PCT OF WELL',C.READOUT,B.HI,1);
  y+=gh+3;
  text(gx+3,y,t0,'DAMAGE ONSET EST '+fmt(est.mid,2)+' '+String.fromCharCode(177)+' '+fmt(est.half,2),C.CAUTION,B.MID,1);
  textR(gx+gw-3,y,t0,'YIELD '+fmt(s?approachYield(s,G.depth):0,2),C.NOMINAL,B.HI,1);
  y+=LY.lh0+2;

  const bw=(pw-gap)/2;
  keyRepeat(px,y,bw,keyH,'depth-','SHALLOWER',C.CHASSIS,!!s,LY.t1);
  keyRepeat(px+bw+gap,y,bw,keyH,'depth+','DEEPER',C.CHASSIS,!!s,LY.t1);
  y+=keyH+gap;

  const bw3=(pw-gap*2)/3;
  key(px,y,bw3,keyH,'approach','APPROACH',C.CAUTION,!!s,
      dmgNow>0?('EST -'+fmt(dmgNow,1)+' HULL'):'NO DAMAGE EST');
  key(px+bw3+gap,y,bw3,keyH,'hail','HAIL',C.CONTACT,!!cu&&!cu.refused,
      cu?(cu.refused?'NO CARRIER':'RADIATES A BEARING'):'NO EMISSION');
  key(px+(bw3+gap)*2,y,bw3,keyH,'tochart','CHART',C.CHASSIS,true,'ASTROGATION');
}

function drawCommsControls(){
  const K=LY.ctrl;
  const px=K.x, pw=K.w, t0=LY.t0, gap=4;
  let y=K.y;
  const cu=G.comms.cu, CM=G.comms;
  const D=DIALOGUE[cu.id];
  const node=D[Math.min(cu.node,D.length-1)];
  const keyH=Math.max(30,(K.h-LY.lh0*2)/4-gap);

  if(CM.phase==='HAILING'||CM.phase==='GIFT'||CM.phase==='WITHHELD'||CM.phase==='DONE'||CM.phase==='REFUSED'){
    const canHail=!cu.refused;
    key(px,y,pw,keyH*1.2,'dohail',CM.phase==='HAILING'?'TRANSMIT HAIL':'HAIL AGAIN',
        C.CONTACT,canHail, canHail?'BROADCAST NUMBER '+pad0(G.broadcasts+1,2):'THEY HAVE STOPPED');
    y+=keyH*1.2+gap;
    key(px,y,pw,keyH,'closecomms','CLOSE CHANNEL',C.CHASSIS,true,'PASSIVE / SILENT');
    return;
  }

  /* Replies. The panel marks what each one costs BEFORE it is sent, and it
     strikes out the ones the operator does not have the signs to phrase. */
  text(px,y,t0,'REPLY / EVERY REPLY IS ALSO A BEARING',C.CAUTION,B.MID,1);
  y+=LY.lh0+1;
  for(let i=0;i<node.replies.length;i++){
    const rep=node.replies[i];
    const ok=canPhrase(cu,rep.t);
    const costC=rep.w<0?C.ALARM:(rep.w>0?C.NOMINAL:C.LABEL);
    const h=keyH;
    const pressed=held('reply'+i)&&ok;
    rect(px,y,pw,h,ok?(pressed?C.READOUT:C.CHASSIS):C.CHASSIS,ok?(pressed?B.HI:B.MID):B.DIM,pressed?1.5:1);
    /* The reply in their script, with the glosses the operator can read. */
    let cx2=px+5;
    const ks=knownSet(cu);
    for(let k=0;k<rep.t.length;k++){
      const t=rep.t[k];
      if(t===STOP){ cx2+=t0*TRACK*1.2; continue; }
      if(wordKnown(cu,t,ks)) cx2+=text(cx2,y+4,t0,CONCEPT[t],C.READOUT,ok?B.HI:B.DIM,1)+t0*TRACK;
      else cx2+=alienText(cx2,y+4,t0,cu.words[t],cu.glyphs,C.CONTACT,ok?B.MID:B.DIM,1)+t0*TRACK;
    }
    text(px+5,y+4+LY.lh0,t0,'['+rep.tag+'] '+rep.note,C.LABEL,ok?B.MID:B.DIM,1);
    textR(px+pw-5,y+4,t0,(rep.w>0?'+':'')+rep.w+' STANDING',costC,ok?B.HI:B.DIM,1);
    if(ok) hit(px,y,pw,h,'reply'+i);
    else {
      /* Struck through the words themselves, not across the whole control:
         it is the sentence that cannot be said, not the key that is broken. */
      line(px+5,y+4+t0*0.55,Math.min(cx2,px+pw-5),y+4+t0*0.55,C.CAUTION,B.MID,1);
      const miss=missingSigns(cu,rep.t);
      textR(px+pw-5,y+4+LY.lh0,t0,miss+' SIGN'+(miss===1?'':'S')+' SHORT',C.CAUTION,B.MID,1);
    }
    y+=h+gap;
  }
  const bh=Math.max(26,K.y+K.h-y);
  const half=(pw-gap)/2;
  key(px,y,half,bh,'repeat','ASK AGAIN',C.CONTACT,true,'ANOTHER BEARING / +SIGNS');
  key(px+half+gap,y,half,bh,'closecomms','CLOSE',C.CHASSIS,true,'PASSIVE / SILENT');
}

let bootT=0;
function drawBoot(dt){
  bootT+=dt;
  const w=LY.w, h=LY.h, p=LY.pad;
  const x=p+2, wid=w-p*2-4;
  let y=Math.max(14,h*0.045);
  const t0=LY.t0, t1=LY.t1, t2=LY.t2;

  panel(x,y,wid,h-y-Math.max(70,h*0.13),'REGISTRY DOCUMENT / DO NOT DETACH',C.CHASSIS,B.MID);
  const px=x+8, pw=wid-16;
  y+=12;

  textC(x+wid/2,y,t2,'COMMERCIAL LIGHTER MC-44',C.READOUT,B.HI,1.4); y+=t2*1.9;
  textC(x+wid/2,y,t1,'CASSANDRA',C.READOUT,B.HI,1.2); y+=t1*2.4;
  line(px,y,px+pw,y,C.CHASSIS,B.MID,1); y+=8;

  leader(px,y,pw,t0,'DOCKET',G.order.docket); y+=LY.lh0;
  leader(px,y,pw,t0,'CONSIGNEE',G.order.consignee); y+=LY.lh0;
  leader(px,y,pw,t0,'COMPLEMENT','1 OF 1'); y+=LY.lh0;
  leader(px,y,pw,t0,'ATMOSPHERE',pad0(G.o2max,4)+' H NOMINAL'); y+=LY.lh0;
  leader(px,y,pw,t0,'REACTION MASS',fmt(G.fuel,1)+' LY EQUIVALENT'); y+=LY.lh0;

  text(px,y,t0,'1. PROCEED TO '+G.order.star.name,C.READOUT,B.HI,1); y+=LY.lh0;
  text(px,y,t0,'   '+G.order.star.spec+'  '+fmt(G.order.star.dist,2)+' LY  '+
    G.order.star.planets+' CONFIRMED BODIES',C.LABEL,B.MID,1); y+=LY.lh0;

  text(px,y,t0,'3. RETURN TO SOL AND PRESENT THIS DOCKET',C.READOUT,B.HI,1); y+=LY.lh0*1.5;

  text(px,y,t0,'COVER IS VOID BEYOND 25 LIGHT YEARS OF THE',C.CAUTION,B.MID,1); y+=LY.lh0;

  text(px,y,t0,'DISTANCE. IT WILL NOT BE RECOVERED FROM IT.',C.CAUTION,B.MID,1); y+=LY.lh0*1.6;

}

function drawDead(dt){
  const w=LY.w,h=LY.h,p=LY.pad;
  const x=p+2, wid=w-p*2-4;
  let y=Math.max(14,h*0.05);
  const t0=LY.t0,t1=LY.t1,t2=LY.t2;
  panel(x,y,wid,h-y-Math.max(56,h*0.10),'CASUALTY REPORT / FORM 4-K',C.ALARM,B.MID);
  const px=x+8, pw=wid-16;
  y+=12;
  textC(x+wid/2,y,t2,G.deadWhy,C.ALARM,B.HI,1.5); y+=t2*2.4;
  line(px,y,px+pw,y,C.ALARM,B.MID,1); y+=8;
  leader(px,y,pw,t0,'MISSION TIME',pad0(G.t,5)+' H'); y+=LY.lh0;
  leader(px,y,pw,t0,'JUMPS FLOWN',String(G.jumps)); y+=LY.lh0;
  leader(px,y,pw,t0,'TRANSMISSIONS',String(G.broadcasts),C.LABEL,G.broadcasts?C.CONTACT:C.READOUT); y+=LY.lh0;
  leader(px,y,pw,t0,'FURTHEST FROM ORIGIN',fmt(G.maxRange,2)+' LY'); y+=LY.lh0;
  leader(px,y,pw,t0,'POLICY',G.voided?'VOID / CLAUSE 9(B)':'ACTIVE',C.LABEL,G.voided?C.ALARM:C.NOMINAL); y+=LY.lh0;
  leader(px,y,pw,t0,'SEED',G.seedHex); y+=LY.lh0*1.5;

  line(px,y,px+pw,y,C.ALARM,B.MID,1); y+=8;
  text(px,y,t1,'LOG EXTRACT',C.LABEL,B.HI,1); y+=t1*2.0;
  /* Every transmission, with the time and the place it was radiated from. It
     was always in the log. It was legible the whole time. */
  const rows=G.log.filter(function(e){ return e.kind==='TRANSMIT'||e.kind==='END'||e.kind==='GIFT'||e.kind==='CLAUSE'; });
  const maxRows=Math.max(3,Math.floor((h-y-Math.max(70,h*0.14))/LY.lh0));
  const start=Math.max(0,rows.length-maxRows);
  if(!rows.length){ text(px,y,t0,'NO TRANSMISSIONS RECORDED.',C.NOMINAL,B.MID,1); y+=LY.lh0; }
  for(let i=start;i<rows.length;i++){
    const e=rows[i];
    const c=e.kind==='TRANSMIT'?C.CONTACT:(e.kind==='END'?C.ALARM:C.LABEL);
    text(px,y,t0,fit('T+'+pad0(e.t,5)+' '+e.text,t0,pw),c,B.MID,1);
    y+=LY.lh0;
  }
  const bh=Math.max(46,h*0.075);
  key(x,h-bh-Math.max(12,h*0.024),wid,bh,'again','NEW DOCKET',C.CHASSIS,true,'A DIFFERENT SEED / THE SAME CLAUSE',LY.t2);
}

function drawEnd(dt){
  const w=LY.w,h=LY.h,p=LY.pad;
  const x=p+2, wid=w-p*2-4;
  let y=Math.max(16,h*0.06);
  const t0=LY.t0,t1=LY.t1,t2=LY.t2;
  panel(x,y,wid,h-y-Math.max(56,h*0.10),'SETTLEMENT / FORM 2-A',C.NOMINAL,B.MID);
  const px=x+8, pw=wid-16;
  y+=14;
  textC(x+wid/2,y,t2,'ORDER DISCHARGED',C.NOMINAL,B.HI,1.5); y+=t2*2.6;
  leader(px,y,pw,t0,'DOCKET',G.order.docket); y+=LY.lh0;
  leader(px,y,pw,t0,'MISSION TIME',pad0(G.t,5)+' H'); y+=LY.lh0;
  leader(px,y,pw,t0,'HULL REMAINING',fmt(G.hull,1)+' PCT'); y+=LY.lh0;
  leader(px,y,pw,t0,'ATMOSPHERE REMAINING',pad0(G.o2,4)+' H'); y+=LY.lh0;
  leader(px,y,pw,t0,'TRANSMISSIONS',String(G.broadcasts),C.LABEL,G.broadcasts?C.CONTACT:C.READOUT); y+=LY.lh0;
  leader(px,y,pw,t0,'FURTHEST FROM ORIGIN',fmt(G.maxRange,2)+' LY'); y+=LY.lh0*1.5;
  line(px,y,px+pw,y,C.NOMINAL,B.MID,1); y+=8;
  if(G.voided){
    text(px,y,t1,'SETTLEMENT WITHHELD',C.ALARM,B.HI,1); y+=t1*2.0;
    text(px,y,t0,'THE VEHICLE PASSED 25 LIGHT YEARS FROM THE',C.CAUTION,B.MID,1); y+=LY.lh0;
    text(px,y,t0,'ORIGIN. UNDER CLAUSE 9(B) NO SUM IS DUE.',C.CAUTION,B.MID,1); y+=LY.lh0;
    text(px,y,t0,'THE OPERATOR RETURNED ANYWAY.',C.READOUT,B.HI,1); y+=LY.lh0*1.6;
  } else {
    text(px,y,t1,'SETTLEMENT PAYABLE',C.NOMINAL,B.HI,1); y+=t1*2.0;
    text(px,y,t0,'COVER HELD THROUGHOUT. NO CLAUSE INVOKED.',C.NOMINAL,B.MID,1); y+=LY.lh0*1.6;
  }
  let gifts=0;
  for(let i=0;i<CULTURES.length;i++) if(CULTURES[i].gifted) gifts++;
  text(px,y,t0,'REDUCTIONS RECEIVED: '+gifts+' OF '+CULTURES.length,C.LABEL,B.MID,1); y+=LY.lh0;
  for(let i=0;i<CULTURES.length;i++){
    const cu=CULTURES[i];
    if(!cu.contacted) continue;
    text(px,y,t0,cu.code+'  '+cu.known+'/'+cu.glyphN+' SIGNS  '+
      (cu.gifted?('GAVE '+cu.gift):(cu.refused?'CEASED':'GAVE NOTHING')),
      cu.gifted?C.NOMINAL:C.CAUTION,B.MID,1);
    y+=LY.lh0;
  }
  const bh=Math.max(46,h*0.075);
  key(x,h-bh-Math.max(12,h*0.024),wid,bh,'again','NEW DOCKET',C.CHASSIS,true,'A DIFFERENT SEED',LY.t2);
}

/* ==========================================================================
   ACTIONS
   ========================================================================== */

function applyStep(field,dir){
  const s=STEPS[stepIdx]*dir;
  if(field==='bear'){ G.bearing=(G.bearing+s+360)%360; }
  else if(field==='elev'){ G.elev=clamp(G.elev+s,-90,90); }
  else if(field==='rng'){ G.range=clamp(G.range+s,0,240); }
}
function handleInput(){
  if(G.screen==='BOOT'){ if(consume('poweron')){ G.screen='RUN'; audioKick(); sfx('press'); } return; }
  if(G.screen==='DEAD'||G.screen==='END'){
    if(consume('again')){ newRun((Math.floor(performance.now()*1000)^(G.seed*2654435761))>>>0); G.screen='BOOT'; bedSet(0.20,1.2); sfx('press'); }
    return;
  }
  if(consume('bear-')) applyStep('bear',-1);
  if(consume('bear+')) applyStep('bear',1);
  if(consume('elev-')) applyStep('elev',-1);
  if(consume('elev+')) applyStep('elev',1);
  if(consume('rng-')) applyStep('rng',-1);
  if(consume('rng+')) applyStep('rng',1);
  if(consume('step')) stepIdx=(stepIdx+1)%STEPS.length;
  if(consume('compute')&&G.target){
    const s=computerSolution(G,G.target);
    G.bearing=s.bearing; G.elev=s.elev; G.range=s.range;
    say(G.red.parallax?'SOLUTION REDUCED TO PRESENT POSITION':'SOLUTION IS CATALOGUE / ORIGIN REFERENCED',
        G.red.parallax?C.NOMINAL:C.CAUTION);
  }
  if(consume('survey')) executeSurvey();
  if(consume('burn')){ sfx('burn'); executeBurn(); }
  if(consume('tofield')){ G.mode='FIELD'; G.sub=null; }
  if(consume('tochart')){ G.mode='CHART'; G.sub=null; }
  if(consume('zoomin')){ zoomIdx=Math.max(0,zoomIdx-1); }
  if(consume('zoomout')){ zoomIdx=Math.min(ZOOMS.length-1,zoomIdx+1); }
  if(consume('depth-')) G.depth=clamp(G.depth-0.01,0,1);
  if(consume('depth+')) G.depth=clamp(G.depth+0.01,0,1);
  if(consume('approach')) executeApproach();
  if(consume('hail')){
    const cu=G.here?CULTURES.find(c=>c.starIdx===G.here.idx):null;
    if(cu&&!cu.refused) openComms(cu);
  }
  if(consume('dohail')) commsHail();
  if(consume('repeat')) commsRepeat();
  if(consume('closecomms')){ G.sub=null; G.comms=null; }
  for(let i=0;i<4;i++) if(consume('reply'+i)) commsSend(i);
  if(consume('chartarea')){
    /* Tapping the chart picks a target: the nearest mark to the thumb, with a
       generous radius, because the thumb is not a stylus. */
    let best=null,bd=26;
    for(let i=0;i<chartHits.length;i++){
      const c=chartHits[i];
      const d=Math.hypot(lastUp.x-(c.x+c.w/2), lastUp.y-(c.y+c.h/2));
      if(d<bd){ bd=d; best=c; }
    }
    if(best){
      G.target=best.s;
      say('TARGET '+best.s.name+' / '+fmt(vdist(best.s,G.pos),3)+' LY FROM HERE',C.READOUT);
      sfx('press');
    }
  }
}

function dragStep(dt){
  if(!pointer.down) return;
  if(G.screen!=='RUN') return;
  if(pressId==='chartarea'&&G.mode==='CHART'&&!G.sub){
    G.yaw-=drag.dx*0.008;
    G.pitch=clamp(G.pitch+drag.dy*0.008,-1.45,1.45);
    drag.dx=0; drag.dy=0;
  }
}

/* ==========================================================================
   THE LOOP
   ========================================================================== */

const frameRnd=rng(0xC0FFEE);
let last=0, started=false;
function frame(now){
  requestAnimationFrame(frame);
  if(!last) last=now;
  let ms=now-last;
  const dt=Math.min(0.05,ms/1000);
  last=now;

  sizeDisplay();
  beginFrame();
  HITS=[];

  inputStep(dt);
  dragStep(dt);
  handleInput();

  if(G.screen==='RUN'){
    simStep(dt);
    G.shake=Math.max(0,G.shake-dt*1.4);
    /* The picture is the hull report. One fault term drives the jitter, the
       tear and the grain, so a cracked vehicle looks like one. */
    setFault(clamp((1-G.hull/100)*0.85 + G.shake*0.7, 0, 1.25));
    drawStatus();
    if(G.sub==='COMMS'&&G.comms){ drawComms(dt); drawCommsControls(); }
    else if(G.mode==='CHART'){ drawChart(dt); drawChartControls(); }
    else { drawField(dt); drawFieldControls(); }
    drawNews();
    /* Chart range keys live on the instrument, not in the thumb block, so the
       hand never covers the thing it is scaling. */
    if(G.mode==='CHART'&&!G.sub){
      const s=Math.max(24,LY.t2*2.2);
      key(LY.inst.x+LY.inst.w-s*2-8,LY.inst.y+LY.inst.h-s-5,s,s,'zoomin','-',C.CHASSIS,zoomIdx>0,null,LY.t2);
      key(LY.inst.x+LY.inst.w-s-5,LY.inst.y+LY.inst.h-s-5,s,s,'zoomout','+',C.CHASSIS,zoomIdx<ZOOMS.length-1,null,LY.t2);
    }
  } else if(G.screen==='BOOT'){
    setFault(0.06);
    drawBoot(dt);
  } else if(G.screen==='DEAD'){
    setFault(clamp(0.55+Math.sin(now*0.0013)*0.35,0,1.2));
    drawDead(dt);
  } else {
    setFault(0.05);
    drawEnd(dt);
  }

  endFrame(dt,frameRnd);
  perfStep(dt,ms);
  fired=null;
}

window.addEventListener('resize',function(){ sizeDisplay(true); });
window.addEventListener('orientationchange',function(){ setTimeout(function(){sizeDisplay(true);},120); });

newRun((0x5f3a91c7)>>>0);
sizeDisplay(true);
requestAnimationFrame(frame);

</script>
