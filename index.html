<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0e0c14">
<title>WILDBOUND — Amber Edition</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%23d8a23c'/><rect x='3' y='3' width='10' height='10' fill='%23241a10'/></svg>">
<style>
  /* The game owns the visual identity; this shell is the device around it —
     a dark room, a warm bezel, an amber cartridge label. Deliberately one
     theme: a handheld screen doesn't have a light mode. */
  :root {
    --void: #0e0c14;
    --shell: #241a10;
    --bezel: #14100c;
    --amber: #d8a23c;
    --amber-hi: #ffd25e;
    --phosphor: #7fd06a;
    --label: #9a8f7e;
    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: var(--void);
    color: var(--label);
    font-family: var(--mono);
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none; user-select: none;
    overscroll-behavior: none;
    touch-action: none;
  }

  #stage {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 14px;
    background:
      radial-gradient(ellipse 70% 55% at 50% 42%, #1d1728 0%, var(--void) 78%);
  }

  /* bezel: a warm shell with an inset screen well */
  #bezel {
    padding: 10px;
    border-radius: 10px;
    background: linear-gradient(#2e2216, #1a1209 62%, #241a10);
    box-shadow:
      0 1px 0 rgba(255, 214, 140, .18) inset,
      0 -2px 0 rgba(0, 0, 0, .5) inset,
      0 24px 60px rgba(0, 0, 0, .7);
  }
  #screen {
    display: block;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    background: #000;
    border-radius: 2px;
    box-shadow:
      0 0 0 3px var(--bezel),
      0 0 0 4px rgba(255, 214, 140, .10),
      0 0 26px rgba(120, 90, 40, .18);
  }

  /* device label under the screen */
  #legend {
    display: flex; flex-wrap: wrap; gap: 4px 16px;
    justify-content: center; align-items: baseline;
    max-width: min(92vw, 640px);
    font-size: 11px; letter-spacing: .06em;
    color: var(--label);
  }
  #legend b {
    color: var(--amber);
    font-weight: 600;
  }
  #legend span { white-space: nowrap; }
  body.touch #legend { display: none; }
  @media (max-height: 520px) { #legend { display: none; } }

  /* boot gate — also the gesture that unlocks audio */
  #boot {
    position: fixed; inset: 0; z-index: 30;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 22px; padding: 24px; text-align: center;
    background: radial-gradient(ellipse 60% 50% at 50% 45%, #1a1526 0%, #0b0910 80%);
    cursor: pointer;
    border: 0;
    font: inherit;
    color: inherit;
    width: 100%;
  }
  #boot:focus-visible { outline: 2px solid var(--amber); outline-offset: -6px; }
  #boot h1 {
    margin: 0;
    font-size: clamp(24px, 6vw, 46px);
    letter-spacing: .30em; text-indent: .30em;
    font-weight: 700;
    color: var(--amber-hi);
    text-shadow: 0 3px 0 #7a4a12, 0 4px 12px rgba(216, 162, 60, .3);
  }
  #boot .edition {
    font-size: 11px; letter-spacing: .42em; text-indent: .42em;
    color: var(--label);
  }
  #boot hr {
    width: min(64vw, 300px); height: 1px; border: 0; margin: 0;
    background: linear-gradient(90deg, transparent, rgba(216, 162, 60, .55), transparent);
  }
  #boot .keys {
    display: grid; grid-template-columns: auto auto; gap: 6px 20px;
    font-size: 12px; line-height: 1.5;
  }
  #boot .keys b { color: var(--amber); font-weight: 600; }
  #boot .keys span:nth-child(odd) { text-align: right; }
  #boot .keys span:nth-child(even) { text-align: left; color: #cfc4b2; }
  #boot .press {
    color: var(--phosphor); font-size: 13px; letter-spacing: .16em;
    animation: blink 1.15s steps(2, start) infinite;
  }
  @keyframes blink { to { visibility: hidden; } }
  @media (prefers-reduced-motion: reduce) {
    #boot .press { animation: none; }
  }

  /* on-screen controls for touch */
  #touch { position: fixed; inset: 0; z-index: 20; display: none; pointer-events: none; }
  body.touch #touch { display: block; }
  #touch .pad, #touch .btn {
    position: absolute; pointer-events: auto;
    display: flex; align-items: center; justify-content: center;
    border-radius: 50%;
    background: rgba(232, 220, 200, .10);
    border: 2px solid rgba(232, 220, 200, .22);
    color: rgba(245, 236, 220, .62);
    font-family: var(--mono); font-size: 18px; font-weight: 700;
  }
  #touch .pad { width: 46px; height: 46px; border-radius: 10px; }
  #touch .btn { width: 58px; height: 58px; }
  #touch .btn.small { width: 46px; height: 46px; font-size: 10px; letter-spacing: .04em; }
  #touch .act { background: rgba(216, 162, 60, .22); border-color: rgba(216, 162, 60, .4); }
  #touch [data-down="1"] { background: rgba(255, 255, 255, .3); }
</style>
</head>
<body>
  <div id="stage">
    <div id="bezel"><canvas id="screen" width="240" height="160"></canvas></div>
    <div id="legend">
      <span><b>Arrows / WASD</b> move</span>
      <span><b>Z</b> confirm</span>
      <span><b>X</b> back</span>
      <span><b>Enter</b> menu</span>
      <span><b>Shift</b> run</span>
      <span><b>M</b> mute</span>
    </div>
  </div>

  <div id="touch">
    <div class="pad" data-btn="UP"    style="left:78px;  bottom:150px;">▲</div>
    <div class="pad" data-btn="DOWN"  style="left:78px;  bottom:52px;">▼</div>
    <div class="pad" data-btn="LEFT"  style="left:26px;  bottom:101px;">◀</div>
    <div class="pad" data-btn="RIGHT" style="left:130px; bottom:101px;">▶</div>
    <div class="btn act" data-btn="A"  style="right:26px;  bottom:76px;">A</div>
    <div class="btn"     data-btn="B"  style="right:96px;  bottom:118px;">B</div>
    <div class="btn small" data-btn="START"  style="right:34px; bottom:170px;">MENU</div>
    <div class="btn small" data-btn="SELECT" style="right:100px; bottom:34px;">RUN</div>
  </div>

  <button id="boot" type="button" aria-label="Start Wildbound">
    <div>
      <h1>WILDBOUND</h1>
      <div class="edition">AMBER EDITION</div>
    </div>
    <hr>
    <div class="keys">
      <span><b>Arrows / WASD</b></span><span>walk</span>
      <span><b>Z</b> or <b>Space</b></span><span>talk, confirm</span>
      <span><b>X</b> or <b>Esc</b></span><span>back</span>
      <span><b>Enter</b></span><span>menu</span>
      <span><b>Shift</b></span><span>run</span>
    </div>
    <div class="press">PRESS ANY KEY TO BEGIN</div>
  </button>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
