/* --- 1. Cold open: paper in, coffee out (0 – 7) -------------------------- */
function sceneOpen(t) {
  const p = ease(clamp(t / 7, 0, 1));
  beginScene(V(lerp(1.5, .5, p), lerp(1.85, 1.62, p), lerp(4.4, 3.5, p)), V(0, 1.12, 0), 40);
  groundGrid();
  const give = ease((t - 1.2) / 1.5), back = ease((t - 3.2) / 1.4);
  const reachA = clamp((t - .9) / .6, 0, 1) * (1 - clamp((t - 3.0) / .8, 0, 1));
  const reachB = clamp((t - 1.6) / .6, 0, 1) * (1 - clamp((t - 4.4) / .8, 0, 1));
  const sway = s => Math.sin(t * 1.1 + s) * 1.2;
  shadow(-.85, 0, .30); shadow(.85, 0, .30);
  const FA = figure3d({
    pos: V(-.85, 0, 0), yaw: 90, lean: sway(0),
    armR: [lerp(14, 74, reachA), lerp(0, 90, reachA), lerp(16, 88, reachA), lerp(0, 90, reachA)],
    face: t > 4.2 ? 'happy' : 'plain'
  });
  const FB = figure3d({
    pos: V(.85, 0, 0), yaw: -90, lean: sway(1.7),
    armR: [lerp(14, 74, reachB), lerp(0, 90, reachB), lerp(16, 88, reachB), lerp(0, 90, reachB)],
    face: t > 2.9 ? 'happy' : 'plain'
  });
  const a = FA.hands.R, b = FB.hands.R;
  if (win(t, .8, 6.9, .5, .4) > 0) {
    const c = vlerp(a, b, give);
    c.y += Math.sin(Math.PI * give) * .16;
    note3d(mMul(mT(c.x, c.y, c.z), mMul(mRY(rad(lerp(-22, -8, give))), mRZ(rad(Math.sin(t*2)*7)))), { denom: '20' });
  }
  if (back > 0 && win(t, 3.2, 6.9, .3, .4) > 0) {
    const c = vlerp(b, a, back);
    c.y += Math.sin(Math.PI * back) * .14;
    draw(UNIT.cyl, mMul(mT(c.x, c.y - .05, c.z), mS(.052, .12, .052)), { color: INK, amb: .16, lit: .5 });
    draw(UNIT.torus, mMul(mT(c.x + .07, c.y + .02, c.z), mMul(mRY(rad(90)), mS(.034, .034, .034))), { color: INK, amb: .16, lit: .5, edgeW: 1.8 });
  }
  flush();
  A(win(t, 5.0, 6.8, .5, .3), () => text('?', 960, 300, { size: 170, color: GOLD, weight: '700' }));
}

/* --- 6. 1971, the link is cut (53 – 68) --------------------------------- */
function sceneCut(t) {
  const p = ease(clamp((t - 3) / 6, 0, 1));
  beginScene(V(Math.sin(t * .10) * .35, 1.32, lerp(2.7, 2.25, p)), V(0, 1.19, 0), 44);
  const snap = clamp((t - 5.6) / .25, 0, 1);
  const drift = easeO((t - 5.85) / 2.2);
  draw(INGOT, mMul(mT(-1.02, 1.13, 0), mRY(rad(14))), { color: GOLD, amb: .18, lit: .42 });
  const n = 12;
  for (let i = 0; i < n; i++) {
    const u = i / (n - 1);
    let c = V(lerp(-.86, .90, u), 1.20 - Math.sin(u * Math.PI) * .035, 0), al = 1;
    if (snap > 0) {
      const fall = easeI(clamp((t - 5.6 - Math.abs(u - .5) * .16) / .75, 0, 1));
      c = V(c.x + (u - .5) * fall * .5, c.y - fall * 1.6, c.z + n11(i, 2, 1) * fall * .3);
      al = clamp(1 - fall * 2.0, 0, 1);
    }
    if (al > .02) chainLink(c, (i % 2 ? 0 : Math.PI / 2) + (snap ? drift * i : 0), .062, al);
  }
  const nx = 1.06 + (snap ? Math.sin(t * .9) * .05 * drift : 0);
  const ny = 1.20 + (snap ? drift * .22 : 0);
  note3d(mMul(mT(nx, ny, 0), mMul(mRY(rad(-14)), mMul(mRZ(snap ? Math.sin(t * .8) * .13 * drift : 0), mS(1.15, 1.15, 1.15)))), { denom: '1' });
  if (win(t, 3.9, 6.4, .4, .5) > 0) {
    const app = easeO((t - 3.9) / 1.4);
    const sy = lerp(2.1, 1.30, app);
    const open = snap > 0 ? lerp(rad(26), rad(7), snap) : lerp(rad(7), rad(26), clamp((t - 4.9) / .7, 0, 1));
    for (const s of [-1, 1]) {
      const piv = V(0, sy, 0);
      const tip = vadd(piv, V(Math.sin(open) * s * .30, -.30, 0));
      const han = vadd(piv, V(-Math.sin(open) * s * .30, .34, 0));
      /* the box is centred on its own origin, so shift it half its length
         along the axis to run from the pivot to the end point */
      const bar = (a, b, w, d) => {
        const L = vlen(vsub(b, a));
        draw(UNIT.box, mMul(axisMat(a, b), mMul(mT(0, L / 2, 0), mS(w, L, d))), { color: RED, amb: .20, lit: .38 });
      };
      bar(piv, tip, .028, .062);
      bar(piv, han, .032, .032);
      draw(UNIT.torus, mMul(mT(han.x, han.y, han.z), mMul(mRX(rad(90)), mS(.066, .066, .066))), { color: RED, amb: .20, lit: .38, edgeW: 2.1 });
    }
  }
  flush();
  A(win(t, .2, 14.6, .5, .4), () => {
    const g = at2d(V(-1.02, 1.02, 0));
    if (g) text('GOLD', g.x, g.y + 52, { size: 30, color: GOLD, spacing: '3px' });
  });
  A(win(t, 1.6, 5.25, .5, .25), () => text('convertible into gold', 960, 250, { size: 36, color: DIM, spacing: '1px' }));
  A(win(t, 5.7, 14.6, .35, .4), () => {
    const q = easeO((t - 5.7) / .5);
    ctx.save(); ctx.globalAlpha *= q;
    text('1971', 960, 270 - (1 - q) * 14, { size: 128, color: RED, weight: '700', spacing: '6px' });
    ctx.restore();
  });
  A(win(t, 7.0, 14.6, .5, .4), () => text('Nixon suspends the gold window', 960, 340, { size: 32, color: DIM, spacing: '1px' }));
  A(win(t, 9.4, 14.6, .5, .4), () => {
    text('FIAT MONEY', 960, 800, { size: 68, color: GOLD, weight: '700', spacing: '5px' });
    A(win(t, 10.4, 14.6, .5, .4), () => text('Latin: “let it be done”', 960, 866, { size: 32, color: DIM }));
  });
}

    if (i === 0) {

        if (q) dot2(q.x, q.y, 5, TEAL);
      }
    } else if (i === 1) {
      draw(UNIT.cyl, mMul(mT(x, y, 0), mS(.028, .52, .028)), { color: TEAL, amb: .15, lit: .5, edgeW: 2 });
      draw(UNIT.box, mMul(mT(x, y + .52, 0), mS(.72, .028, .05)), { color: TEAL, amb: .15, lit: .5 });
      for (const s of [-1, 1]) {
        draw(UNIT.cyl, mMul(mT(x + s * .32, y + .40, 0), mS(.002, .12, .002)), { color: TEAL, edgeW: 1.6, amb: .3, lit: .3 });
        draw(UNIT.cyl, mMul(mT(x + s * .32, y + .36, 0), mS(.13, .035, .13)), { color: TEAL, amb: .15, lit: .5, edgeW: 1.9 });
      }
    } else if (i === 2) {
      draw(UNIT.box, mMul(mT(x, y + .02, 0), mS(.66, .035, .50)), { color: '#3a434e', amb: .16, lit: .4 });
      for (let k = 0; k < 7; k++) {
        const u0 = k / 7, u1 = u0 + .45 / 7;
        const f = u => V(x - .28 + u * .58, y + .05, -.20 + Math.sin(u * 3.2) * .18);
        line3d(f(u0), f(u1), TEAL, 3.4);
      }
    } else {
      note3d(mMul(mT(x, y + .16, 0), mMul(mRY(rad(-8)), mS(1.15, 1.15, 1.15))), { denom: '5' });
    }
  });
  flush();
  xs.forEach((x, i) => A(win(t, .3 + i * .7, 11.6, .45, .4), () =>
    groundLabel(x, 0, labels[i], { size: 28, color: i === 3 ? GOLD : DIM })));
  A(win(t, 5.2, 11.6, .5, .4), () => text('none of these exist in nature', 960, 806, { size: 38, spacing: '1px' }));
  A(win(t, 6.6, 11.6, .5, .4), () => text('all of them exist because we agree they do', 960, 872, { size: 38, color: GOLD, spacing: '1px' }));
}

/* --- 9. What holds it up (95 – 106.5) ----------------------------------- */
function sceneSupport(t) {
  const ang = rad(-20) + t * .055;
  beginScene(V(Math.sin(ang) * 7.9, lerp(1.6, 2.5, ease(clamp(t / 10, 0, 1))), Math.cos(ang) * 7.9), V(0, 2.25, 0), 44);
  groundGrid();
  const BASE = 2.02, PT = 2.10, PB = 3.05, DECK = 3.12;
  /* the crowd, arms up, holding the whole structure */
  for (let i = 0; i < 9; i++) {
    if (win(t, 4.8 + i * .09, 11.0, .35, .4) <= 0) continue;
    const x = -3.2 + i * .8, ph = t * 1.7 + i * 1.3;
    shadow(x, .1, .22, .45);
    figure3d({
      pos: V(x, 0, .1), yaw: 8 + n11(i, 3, 0) * 16, s: 1.0, lo: true,
      color: i % 3 === 1 ? TEAL : INK,
      armL: [172 + Math.sin(ph) * 3, 0, 176, 0], armR: [172 - Math.sin(ph) * 3, 0, 176, 0],
      face: 'none'
    });
  }
  /* Built bottom-up, and each pillar arrives as the narration names it. */
  if (win(t, .2, 11.0, .5, .4) > 0)
    draw(UNIT.box, mMul(mT(0, BASE, 0), mS(7.2, .14, 1.5)), { color: TEAL, amb: .13, lit: .40 });
  const pillars = [[-2.2, 'TAXES', 'are owed in it'], [0, 'LAW', 'makes it settle debts'], [2.2, 'SUPPLY', 'is limited & managed']];
  const PIN = [.5, 4.3, 6.0];
  pillars.forEach(([x], i) => {
    if (win(t, PIN[i], 11.0, .45, .4) <= 0) return;
    const g = easeO((t - PIN[i]) / .7);
    draw(UNIT.cyl, mMul(mT(x, PT, 0), mS(.30, (PB - PT) * g, .30)), { color: GOLD, amb: .15, lit: .48 });
  });
  if (win(t, 1.0, 11.0, .5, .4) > 0)
    draw(UNIT.box, mMul(mT(0, DECK, 0), mS(6.0, .14, 1.4)), { color: INK, amb: .13, lit: .42 });
  if (win(t, .2, 11.0, .5, .4) > 0)
    note3d(mMul(mT(0, DECK + .38, 0), mMul(mRY(rad(-14)), mS(2.4, 2.4, 2.4))), { denom: '100' });
  flush();
  /* Pillar captions ride on chips below the base slab, clear of the crowd. */
  pillars.forEach(([x, l1, l2], i) => A(win(t, PIN[i], 11.0, .45, .4), () => {
    const p = at2d(V(x, BASE - .30, .95));
    if (!p) return;
    const w = Math.max(measure(l1, 30, '700', '2px'), measure(l2, 24)) + 44;
    ctx.fillStyle = 'rgba(10,13,17,.88)';
    ctx.beginPath(); ctx.roundRect(p.x - w/2, p.y - 34, w, 84, 9); ctx.fill();
    text(l1, p.x, p.y, { size: 30, color: GOLD, weight: '700', spacing: '2px' });
    text(l2, p.x, p.y + 34, { size: 24, color: DIM });
  }));
  A(win(t, 7.2, 11.0, .5, .4), () => text('CONFIDENCE', 960, 196, { size: 64, color: TEAL, weight: '700', spacing: '8px' }));
  A(win(t, 8.0, 11.0, .5, .4), () => text('everyone expecting everyone else to keep accepting it', 960, 252, { size: 30, color: DIM }));
}

/* --- 10. When belief breaks (106.5 – 115) ------------------------------- */
const commas = n => {
  const s = Math.round(n).toString();
  let out = '';
  for (let i = 0; i < s.length; i++) out += (i && (s.length - i) % 3 === 0 ? ',' : '') + s[i];
  return out;
};
function sceneBreak(t) {
  const push = easeO(clamp((t - .4) / 3.4, 0, 1));
  const x = lerp(-2.3, .1, push);
  beginScene(V(x * .5 + .4, 1.62, 4.2), V(x * .5 + .3, .95, 0), 42);
  groundGrid();
  const step = Math.sin(t * 5) * 22;
  shadow(x - 1.15, 0, .28);
  /* arms run straight down the handles — the pose a pusher actually holds */
  figure3d({
    pos: V(x - 1.15, 0, 0), yaw: 90, lean: 10,
    armR: [26, 90, 26, 90], armL: [26, 90, 26, 90],
    legR: [4 + step, 90, 2 + step * .4, 90], legL: [4 - step, 90, 2 - step * .4, 90],
    face: 'sad'
  });
  shadow(x + .2, 0, .5, .45);
  barrow3d(mT(x, 0, 0), 12);
  const bp = plinth(2.55, .1, .18, .34);
  draw(BREAD, mMul(mT(bp.x, bp.y + .12, bp.z), mRY(rad(-18))), { color: GOLD, amb: .19, lit: .38 });
  flush();
  A(win(t, 1.4, 8.0, .5, .4), () => groundLabel(2.55, .1, 'one loaf of bread', { size: 26 }));
  A(win(t, .6, 8.0, .5, .4), () => text('Germany, 1923', 1440, 226, { size: 44, color: RED, weight: '700', spacing: '1px' }));
  A(win(t, 1.6, 8.0, .5, .4), () => {
    const q = ease(clamp((t - 1.8) / 3.0, 0, 1));
    text('price of one loaf, in marks', 1440, 292, { size: 28, color: DIM });
    text(commas(250 * Math.pow(200e9 / 250, q)), 1440, 376, { size: 64, color: RED, weight: '700', spacing: '1px' });
    text(q < .98 ? 'January 1923' : 'November 1923', 1440, 424, { size: 26, color: DIM });
  });
  A(win(t, 5.4, 8.0, .5, .4), () =>
    text('Zimbabwe, 2008: at the peak, prices doubled about every day', 960, 892, { size: 32, color: GOLD, spacing: '1px' }));
}

/* --- 11. Close (115 – 120) ---------------------------------------------- */
function sceneClose(t) {
  const p = ease(clamp(t / 4.8, 0, 1));
  beginScene(V(Math.sin(t * .12) * .6, lerp(1.55, 2.05, p), lerp(3.6, 5.3, p)), V(0, 1.15, 0), 42);
  groundGrid();
  const shake = Math.sin(t * 3.4) * 4;
  shadow(-.42, 0, .28); shadow(.42, 0, .28);
  figure3d({ pos: V(-.42, 0, 0), yaw: 62, armR: [66 + shake, 88, 76 + shake, 88], face: 'happy' });
  figure3d({ pos: V(.42, 0, 0), yaw: -62, armR: [66 - shake, 88, 76 - shake, 88], face: 'happy' });
  const nc = V(0, 1.64, 0);
  note3d(mMul(mT(nc.x, nc.y, nc.z), mMul(mRY(Math.sin(t * .5) * .3), mS(1.35, 1.35, 1.35))), { denom: '1' });
  flush();
  const g = at2d(nc);
  if (g) {
    const pulse = .5 + Math.sin(t * 2.2) * .16;
    const grd = ctx.createRadialGradient(g.x, g.y, 8, g.x, g.y, 230);
    grd.addColorStop(0, `rgba(245,196,81,${.24 * pulse + .10})`);
    grd.addColorStop(1, 'rgba(245,196,81,0)');
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = grd; ctx.beginPath(); ctx.arc(g.x, g.y, 230, 0, TAU); ctx.fill();
    ctx.restore();
  }
  A(win(t, .8, 4.6, .6, .5), () => {
    text('AN AGREEMENT', 960, 250, { size: 82, color: GOLD, weight: '700', spacing: '6px' });
    A(win(t, 1.8, 4.6, .6, .5), () => text('renewed every day, by everyone', 960, 316, { size: 36, color: DIM, spacing: '2px' }));
  });
}

/* ==========================================================================
   TIMELINE
   ========================================================================== */
const SCENES = [
  [0, 7, sceneOpen], [7, 13, sceneTitle], [13, 25, scenePaper], [25, 40, sceneBarter],
  [40, 53, sceneCommodity], [53, 68, sceneCut], [68, 83, sceneLedger], [83, 95, sceneSocial],
  [95, 106.5, sceneSupport], [106.5, 115, sceneBreak], [115, 120, sceneClose]
];

/* --------------------------------------------------------- chrome overlays */
function chapterLabel(t) {
  for (const [a, b, n, title] of CHAPTERS) {
    A(win(t, a + .5, b - .5, .35, .35) * .95, () => {
      stroke2(GOLD, 3); rlineSeed(96, 92, 96, 132, 1, 91);
      text(String(n), 118, 112, { size: 22, color: GOLD, align: 'left', weight: '700' });
      text(title.toUpperCase(), 146, 112, { size: 22, color: DIM, align: 'left', spacing: '3px' });
    });
  }
}
function captionBar(t) {
  for (const [a, b, str] of CAPTIONS) {
    const al = win(t, a, b, .28, .28);
    if (al <= .004) continue;
    A(al, () => {
      const size = 40, lines = wrap(str, 1400, size);
      const boxH = lines.length * size * 1.28 + 34;
      const boxW = Math.min(1520, Math.max(...lines.map(l => measure(l, size))) + 90);
      const y = 1080 - 44 - boxH;
      ctx.fillStyle = 'rgba(8,10,13,.82)';
      ctx.beginPath(); ctx.roundRect(960 - boxW/2, y, boxW, boxH, 10); ctx.fill();
      lines.forEach((l, i) => text(l, 960, y + 34 + i * size * 1.28, { size, color: '#f5f1e6' }));
    });
  }
}
function progressBar(t) {
  ctx.fillStyle = 'rgba(255,255,255,.09)'; ctx.fillRect(0, H - 6, W, 6);
  ctx.fillStyle = GOLD; ctx.fillRect(0, H - 6, W * clamp(t / DUR, 0, 1), 6);
}

/* ------------------------------------------------------------- main render */
let SCALE = 1;
function render(t) {
  t = clamp(t, 0, DUR);
  BOIL = Math.floor(t * 8);
  SEEDN = 0;
  ctx.setTransform(SCALE, 0, 0, SCALE, 0, 0);
  ctx.globalAlpha = 1;
  backdrop();
  for (const [a, b, fn] of SCENES) {
    if (t < a - .6 || t > b + .6) continue;
    const fade = clamp(Math.min(t - (a - .6), (b + .6) - t) / .6, 0, 1);
    ctx.save(); ctx.globalAlpha = fade; fn(t - a); ctx.restore();
  }
  ctx.globalAlpha = 1;
  chapterLabel(t);
  captionBar(t);
  progressBar(t);
}

/* --------------------------------------------------------------- playback */
let playing = false, cur = 0, last = 0;
const btnPlay = document.getElementById('play');
const scrub = document.getElementById('scrub');
const timeEl = document.getElementById('time');
const fmt = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
function frame(now) {
  if (playing) {
    cur += (now - last) / 1000; last = now;
    if (cur >= DUR) { cur = DUR; playing = false; btnPlay.textContent = 'Play'; }
    render(cur); scrub.value = cur; timeEl.textContent = `${fmt(cur)} / 2:00`;
  }
  requestAnimationFrame(frame);
}
btnPlay.onclick = () => {
  if (cur >= DUR) cur = 0;
  playing = !playing; last = performance.now();
  btnPlay.textContent = playing ? 'Pause' : 'Play';
};
document.getElementById('restart').onclick = () => { cur = 0; render(0); scrub.value = 0; timeEl.textContent = '0:00 / 2:00'; };
cv.onclick = () => btnPlay.onclick();
scrub.oninput = () => { cur = parseFloat(scrub.value); render(cur); timeEl.textContent = `${fmt(cur)} / 2:00`; };
window.addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); btnPlay.onclick(); }
  if (e.code === 'ArrowRight') { cur = clamp(cur + 5, 0, DUR); render(cur); scrub.value = cur; }
  if (e.code === 'ArrowLeft') { cur = clamp(cur - 5, 0, DUR); render(cur); scrub.value = cur; }
});

/* ------------------------------------------- headless capture entry points */
window.CAPTIONS = CAPTIONS;
window.DURATION = DUR;
window.renderAt = t => { render(t); return true; };
window.setScale = s => { SCALE = s; cv.width = W * s; cv.height = H * s; render(cur); };
window.frameData = (t, mime, q) => { render(t); return cv.toDataURL(mime, q); };
if (location.search.includes('capture')) document.body.classList.add('capture');

render(0);
requestAnimationFrame(frame);
</script>
